m n\u00e0o sau \u0111\u00e2y kh\u00f4ng ph\u1ea3i l\u00e0 \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n?", "a": "C\u00f3 b\u1ea3n ch\u1ea5t qu\u1ed1c t\u1ebf v\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c", "e": null}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m n\u1ed5i b\u1eadt nh\u1ea5t c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH l\u00e0 g\u00ec?", "a": "T\u1ed3n t\u1ea1i m\u1ed9t n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n trong m\u1ed9t h\u1ec7 th\u1ed1ng kinh t\u1ebf qu\u1ed1c d\u00e2n th\u1ed1ng nh\u1ea5t", "e": {"p": 106, "t": "a) Tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, t\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1\u00ec l\u1eadp. \u0110\u1ec1 c\u1eadp t\u1edbi \u0111\u1eb7c tr\u01b0ng n\u00e0y, V.I.", "a": 1}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m n\u1ed5i b\u1eadt nh\u1ea5t c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH l\u00e0", "a": "T\u1ed3n t\u1ea1i nh\u1eefng y\u1ebfu t\u1ed1 c\u1ee7a x\u00e3 h\u1ed9i c\u0169 b\u00ean c\u1ea1nh nh\u1eefng nh\u00e2n t\u1ed1 m\u1edbi c\u1ee7a CNXH trong m\u1ed1i quan h\u1ec7 v\u1eeba th\u1ed1ng nh\u1ea5t v\u1eeba \u0111\u1ea5u tranh v\u1edbi nhau tr\u00ean t\u1ea5t c\u1ea3 l\u0129nh v\u1ef1c", "e": null}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m s\u1ef1 ch\u00eanh l\u1ec7ch v\u1ec1 d\u00e2n s\u1ed1 gi\u1eefa c\u00e1c t\u1ed9c ng\u01b0\u1eddi c\u1ee7a d\u00e2n t\u1ed9c Vi\u1ec7t Nam \u0111\u01b0\u1ee3c th\u1ec3 hi\u1ec7n \u1edf ti\u00eau ch\u00ed", "a": "S\u1ed1 l\u01b0\u1ee3ng c\u01b0 d\u00e2n", "e": null}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n ch\u00ednh tr\u1ecb, l\u00e0 vi\u1ec7c thi\u1ebft l\u1eadp, t\u0103ng c\u01b0\u1eddng chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n m\u00e0 th\u1ef1c ch\u1ea5t c\u1ee7a n\u00f3 l\u00e0", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n n\u1eafm v\u00e0 s\u1eed d\u1ee5ng quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc tr\u1ea5n \u00e1p giai c\u1ea5p t\u01b0 s\u1ea3n, ti\u1ebfn h\u00e0nh x\u00e2y d\u1ef1ng m\u1ed9t x\u00e3 h\u1ed9i kh\u00f4ng giai c\u1ea5p", "e": {"p": 107, "t": "b) Tr\u00ean l\u0129nh v\u1ef1c ch\u00ednh tr\u1ecb Th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n ch\u00ednh tr\u1ecb, l\u00e0 vi\u1ec7c thi\u1ebft l\u1eadp, t\u0103ng c\u01b0\u1eddng chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n m\u00e0 th\u1ef1c ch\u1ea5t c\u1ee7a n\u00f3 l\u00e0 vi\u1ec7c giai c\u1ea5p c\u00f4ng nh\u00e2n n\u1eafm v\u00e0 s\u1eed d\u1ee5ng quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc tr\u1ea5n \u00e1p giai c\u1ea5p t\u01b0 s\u1ea3n, ti\u1ebfn h\u00e0nh x\u00e2y d\u1ef1ng m\u1ed9t x\u00e3 h\u1ed9i kh\u00f4ng giai c\u1ea5p.", "a": 1}}, {"q": "\u0110\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n c\u1ee7a CNXH l\u00e0", "a": "\u0110\u00e2y l\u00e0 giai \u0111o\u1ea1n trung b\u00ecnh, ch\u01b0a tho\u00e1t thai t\u1eeb x\u00e3 h\u1ed9i c\u0169 v\u00ec v\u1eady c\u00f2n nhi\u1ec1u t\u00e0n d\u01b0 c\u1ee7a x\u00e3 h\u1ed9i tr\u00ean r\u1ea5t nhi\u1ec1u l\u0129nh v\u1ef1c", "e": null}, {"q": "\u0110\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n nh\u1ea5t c\u1ee7a d\u00e2n t\u1ed9c, qu\u1ed1c gia l\u00e0 \u0111\u1eb7c tr\u01b0ng n\u00e0o?", "a": "C\u00f3 chung ph\u01b0\u01a1ng th\u1ee9c sinh ho\u1ea1t", "e": {"p": 196, "t": "Th\u1ee9 hai, c\u00f3 chung m\u1ed9t ph\u01b0\u01a1ng th\u1ee9c sinh ho\u1ea1t kinh t\u1ebf. \u0110\u00e2y l\u00e0 \u0111\u1eb7c tr\u01b0ng quan tr\u1ecdng nh\u1ea5t c\u1ee7a d\u00e2n t\u1ed9c, l\u00e0 c\u01a1 s\u1edf \u0111\u1ec3 g\u1eafn k\u1ebft c\u00e1c b\u1ed9 ph\u1eadn, c\u00e1c th\u00e0nh vi\u00ean trong d\u00e2n t\u1ed9c, t\u1ea1o", "a": 1}}, {"q": "\u0110\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n ph\u00e2n bi\u1ec7t ng\u01b0\u1eddi c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i v\u1edbi ng\u01b0\u1eddi th\u1ee3 th\u1ee7 c\u00f4ng?", "a": "Ph\u01b0\u01a1ng th\u1ee9c lao \u0111\u1ed9ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": null}, {"q": "\u0110\u1eb7c tr\u01b0ng c\u1ee7a CNXH x\u00e9t v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, m\u1ee5c ti\u00eau cao nh\u1ea5t c\u1ee7a CNXH", "a": "Gi\u1ea3i ph\u00f3ng con ng\u01b0\u1eddi tr\u00ean c\u01a1 s\u1edf \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i ph\u00e1t tri\u1ec3n, m\u00e0 x\u00e9t \u0111\u1ebfn c\u00f9ng l\u00e0 tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n cao c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t", "e": {"p": 95, "t": "gi\u1ea3i ph\u00f3ng con ng\u01b0\u1eddi tr\u00ean c\u01a1 s\u1edf \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i ph\u00e1t tri\u1ec3n, m\u00e0 x\u00e9t \u0111\u1ebfn c\u00f9ng l\u00e0 tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n cao c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t. Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i c\u00f3 n\u1ec1n kinh t\u1ebf ph\u00e1t tri\u1ec3n cao, v\u1ed1i l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i, quan h\u1ec7 s\u1ea3n xu\u1ea5t d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u0169u v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c, qu\u1ea3n l\u00fd c\u00f3 hi\u1ec7u qu\u1ea3, n\u0103ng su\u1ea5t lao \u0111\u1ed9ng cao v\u00e0 ph\u00e2n ph\u1ed1i ch\u1ee7 y\u1ebfu\u2026", "a": 1}}, {"q": "\u0110\u1eb7c tr\u01b0ng c\u1ee7a d\u00e2n t\u1ed9c, qu\u1ed1c gia l\u00e0?", "a": "C\u00f3 chung ph\u01b0\u01a1ng th\u1ee9c sinh ho\u1ea1t kinh t\u1ebf, c\u00f3 l\u00e3nh th\u1ed5 chung, c\u00f3 s\u1ef1 qu\u1ea3n l\u00fd c\u1ee7a m\u1ed9t Nh\u00e0 n\u01b0\u1edbc, c\u00f3 ng\u00f4n ng\u1eef chung, c\u00f3 n\u00e9t t\u00e2m l\u00fd bi\u1ec3u hi\u1ec7n qua n\u1ec1n v\u0103n h\u00f3a d\u00e2n t\u1ed9c", "e": null}, {"q": "\u0110\u1eb7c tr\u01b0ng n\u00e0o sau \u0111\u00e2y kh\u00f4ng ph\u1ea3i l\u00e0 \u0111\u1eb7c tr\u01b0ng c\u1ee7a d\u00e2n t\u1ed9c- qu\u1ed1c gia?", "a": "C\u00f3 chung m\u1ee9c s\u1ed1ng`", "e": null}, {"q": "\u0110\u1eb7c tr\u01b0ng n\u00e0o sau \u0111\u00e2y kh\u00f4ng ph\u1ea3i l\u00e0 \u0111\u1eb7c tr\u01b0ng c\u1ee7a d\u00e2n t\u1ed9c- t\u1ed9c ng\u01b0\u1eddi?", "a": "C\u00f3 chung l\u00e3nh th\u1ed5", "e": null}, {"q": "\u0110\u1eb7c tr\u01b0ng n\u00e0o th\u1ec3 hi\u1ec7n thu\u1ed9c t\u1ec9nh b\u1ea3n ch\u1ea5t c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i?", "a": "Do nh\u00e2n d\u00e2n lao \u0111\u1ed9ng l\u00e0m ch\u1ee7", "e": {"p": 97, "t": "\u0110\u00e2y l\u00e0 \u0111\u1eb7c tr\u01b0ng th\u1ec3 hi\u1ec7n thu\u1ed9c t\u00ednh b\u1ea3n ch\u1ea5t c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, x\u00e3 h\u1ed9i v\u00ec con ng\u01b0\u1eddi v\u00e0 do con ng\u01b0\u1eddi; nh\u00e2n d\u00e2n m\u00e0 n\u00f2ng c\u1ed1t l\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng l\u00e0 ch\u1ee7 th\u1ec3 c\u1ee7a x\u00e3 h\u1ed9i th\u1ef1c hi\u1ec7n quy\u1ec1n l\u00e0m ch\u1ee7 ng\u00e0y c\u00e0ng r\u1ed9ng r\u00e3i v\u00e0 \u0111\u1ea7y \u0111\u1ee7 trong qu\u00e1 tr\u00ecnh c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i c\u0169, x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i m\u1edbi.", "a": 1}}, {"q": "\u0110\u1eb7c tr\u01b0ng n\u1ed5i b\u1eadt trong quan h\u1ec7 gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c \u1edf n\u01b0\u1edbc ta l\u00e0", "a": "L\u00e0 s\u1ef1 c\u1ed1 k\u1ebft d\u00e2n t\u1ed9c, h\u00f2a h\u1ee3p d\u00e2n t\u1ed9c trong m\u1ed9t c\u1ed9ng \u0111\u1ed3ng th\u1ed1ng nh\u1ea5t", "e": null}, {"q": "\u0110\u1eb7c tr\u01b0ng v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0?", "a": "C\u00f3 n\u1ec1n kinh t\u1ebf ph\u00e1t tri\u1ec3n cao d\u1ef1a tr\u00ean l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i v\u00e0 ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu", "e": {"p": 94, "t": "- Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i c\u00f3 n\u1ec1n kinh t\u1ebf ph\u00e1t tri\u1ec3n cao d\u1ef1a tr\u00ean l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i v\u00e0 ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu. \u0110\u00e2y l\u00e0 \u0111\u1eb7c tr\u01b0ng v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n k\u1ec9nh t\u1ebf c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "\u0110\u1ea1i h\u1ed9i IX c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam x\u00e1c \u0111\u1ecbnh, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam l\u00e0 b\u1ecf qua nh\u1eefng y\u1ebfu t\u1ed1 n\u00e0o?", "a": "B\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a", "e": {"p": 110, "t": "Th\u1ee9 hai, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, t\u1ee9c l\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a. Xem \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam:", "a": 1}}, {"q": "\u0110\u1ea1i h\u1ed9i XIII c\u1ee7a \u0110\u1ea3ng \u0111\u00e3 x\u00e1c \u0111\u1ecbnh m\u1ee5c ti\u00eau ph\u00e1t tri\u1ec3n theo \u0111\u1ecbnh h\u01b0\u1edbng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u0111\u1ebfn n\u0103m 2045 l\u00e0", "a": "Vi\u1ec7t Nam tr\u1edf th\u00e0nh n\u01b0\u1edbc ph\u00e1t tri\u1ec3n, thu nh\u1eadp cao", "e": {"p": 117, "t": "\u0110\u1ea1i h\u1ed9i XIII c\u1ee7a \u0110\u1ea3ng \u0111\u00e3 x\u00e1c \u0111\u1ecbnh m\u1ee5c ti\u00eau \u0111\u1ebfn gi\u1eefa th\u1ebf k\u1ef7 XXI, n\u01b0\u1edbc ta tr\u1edf th\u00e0nh n\u01b0\u1edbc ph\u00e1t tri\u1ec3n theo \u0111\u1ecbnh h\u01b0\u1edbng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a v\u1edbi c\u00e1c m\u1ee5c ti\u00eau c\u1ee5 th\u1ec3: - \u0110\u1ebfn n\u0103m 2025, k \u1ef7 ni\u1ec7m 50 n\u0103m gi\u1ea3i ph\u00f3ng ho\u00e0n to\u00e0n mi\u1ec1n Nam, th\u1ed1ng nh\u1ea5t \u0111\u1ea5t n\u01b0\u1edbc:", "a": 1}}, {"q": "\u0110\u1ea1i h\u1ed9i XIII c\u1ee7a \u0110\u1ea3ng \u0111\u00e3 x\u00e1c \u0111\u1ecbnh m\u1ee5c ti\u00eau ph\u00e1t tri\u1ec3n theo \u0111\u1ecbnh h\u01b0\u1edbng XHCN \u0111\u1ebfn n\u0103m 2025 l\u00e0", "a": "Vi\u1ec7t Nam l\u00e0 n\u01b0\u1edbc \u0111ang ph\u00e1t tri\u1ec3n, c\u00f3 c\u00f4ng nghi\u1ec7p theo h\u01b0\u1edbng hi\u1ec7n \u0111\u1ea1i, v\u01b0\u1ee3t qua m\u1ee9c thu nh\u1eadp trung b\u00ecnh th\u1ea5p", "e": {"p": 117, "t": "- \u0110\u1ebfn n\u0103m 2025, k \u1ef7 ni\u1ec7m 50 n\u0103m gi\u1ea3i ph\u00f3ng ho\u00e0n to\u00e0n mi\u1ec1n Nam, th\u1ed1ng nh\u1ea5t \u0111\u1ea5t n\u01b0\u1edbc: L\u00e0 n\u01b0\u1edbc \u0111ang ph\u00e1t tri\u1ec3n, c\u00f3 c\u00f4ng nghi\u1ec7p theo h\u01b0\u1edbng hi\u1ec7n \u0111\u1ea1i, v\u01b0\u1ee3t qua m\u1ee9c thu nh\u1eadp trung b\u00ecnh th\u1ea5p.", "a": 1}}, {"q": "\u0110\u1ea3ng c\u1ed9ng s\u1ea3n l\u00e0 \u0111\u1ea1i bi\u1ec3u trung th\u00e0nh cho l\u1ee3i \u00edch c\u1ee7a?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n, d\u00e2n t\u1ed9c v\u00e0 x\u00e3 h\u1ed9i", "e": {"p": 63, "t": "Giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 c\u01a1 s\u1edf x\u00e3 h\u1ed9i v\u00e0 ngu\u1ed3n b\u1ed5 sung l\u1ef1c l\u01b0\u1ee3ng quan tr\u1ecdng nh\u1ea5t c\u1ee7a \u0110\u1ea3ng, l\u00e0m cho \u0110\u1ea3ng mang b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, tr\u1edf th\u00e0nh \u0111\u1ed9i ti\u00ean phong, b\u1ed9 tham m\u01b0u chi\u1ebfn \u0111\u1ea5u c\u1ee7a giai c\u1ea5p. \u0110\u1ea3ng C\u1ed9ng s\u1ea3n \u0111\u1ea1i bi\u1ec3u trung th\u00e0nh cho l\u1ee3i \u00edch c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, c\u1ee7a d\u00e2n t\u1ed9c v\u00e0 x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "\u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a s\u1ef1 k\u1ebft h\u1ee3p c\u1ee7a", "a": "Ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n v\u00e0 phong tr\u00e0o y\u00eau n\u01b0\u1edbc \u1edf Vi\u1ec7t Nam.", "e": {"p": 63, "t": "\u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam ra \u0111\u1eddi l\u00e0 k\u1ebft qu\u1ea3 c\u1ee7a s\u1ef1 k\u1ebft h\u1ee3p gi\u1eefa ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n v\u00e0 phong tr\u00e0o y\u00eau n\u01b0\u1edbc c\u1ee7a d\u00e2n t\u1ed9c.", "a": 1}}, {"q": "\u0110\u1ea3ng ta \u0111\u00e3 \u0111\u01b0a ra m\u00f4 h\u00ecnh ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i Vi\u1ec7t Nam v\u1edbi 6 \u0111\u1eb7c tr\u01b0ng t\u1ea1i \u0111\u1ea1i h\u1ed9i n\u00e0o?", "a": "\u0110\u1ea1i h\u1ed9i VII (1991)", "e": {"p": 112, "t": "\u0110\u1ebfn \u0110\u1ea1i h\u1ed9i VII, nh\u1eadn th\u1ee9c c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam v\u1ec1 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 con \u0111\u01b0\u1eddng \u0111i l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u0111\u00e3 s\u00e1ng t\u1ecf h\u01a1n, kh\u00f4ng ch\u1ec9 d\u1eebng \u1edf nh\u1eadn th\u1ee9c \u0111\u1ecbnh h\u01b0\u1edbng, \u0111\u1ecbnh t\u00ednh m\u00e0 t\u1eebng b\u01b0\u1edbc \u0111\u1ea1t t\u1edbi tr\u00ecnh \u0111\u1ed9 \u0111\u1ecbnh h\u00ecnh, \u0111\u1ecbnh l\u01b0\u1ee3ng.", "a": 1}}, {"q": "\u0110\u00e1p \u00e1n n\u00e0o KH\u00d4NG ph\u1ea3i l\u00e0 ph\u01b0\u01a1ng ph\u00e1p nghi\u00ean c\u1ee9u c\u1ee7a CNXH khoa h\u1ecdc?", "a": "Ph\u01b0\u01a1ng ph\u00e1p nghi\u00ean c\u1ee9u \u0111\u1ecbnh l\u01b0\u1ee3ng", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 c\u01a1 s\u1edf kh\u00e1ch quan c\u1ee7a vi\u1ec7c x\u00e2y d\u1ef1ng kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n chi\u1ebfm s\u1ed1 l\u01b0\u1ee3ng \u0111\u00f4ng \u0111\u1ea3o trong d\u00e2n c\u01b0", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 c\u01a1 s\u1edf kh\u00e1ch quan c\u1ee7a vi\u1ec7c x\u00e2y d\u1ef1ng kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN?", "a": "C\u1ea7n t\u1eadp h\u1ee3p l\u1ef1c l\u01b0\u1ee3ng \u0111\u1ec3 x\u00e2y d\u1ef1ng CNXH v\u00ec l\u1ee3i \u00edch c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u1eadn, giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c.", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 \u0111\u1eb7c tr\u01b0ng c\u1ee7a n\u1ec1n v\u0103n h\u00f3a XHCN?", "a": "L\u00e0 n\u1ec1n v\u0103n h\u00f3a ph\u00e1t tri\u1ec3n cao nh\u1ea5t", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 \u0111\u1eb7c tr\u01b0ng c\u1ee7a nh\u00e0 n\u01b0\u1edbc XHCN", "a": "T\u1ed5 ch\u1ee9c v\u00e0 ho\u1ea1t \u0111\u1ed9ng theo nguy\u00ean t\u1eafc tam quy\u1ec1n ph\u00e2n l\u1eadp", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 nguy\u00ean nh\u00e2n d\u1eabn \u0111\u1ebfn s\u1ef1 kh\u1ee7ng ho\u1ea3ng v\u00e0 s\u1ee5p \u0111\u1ed5 c\u1ee7a m\u00f4 h\u00ecnh CNXH X\u00f4 Vi\u1ebft", "a": "S\u1ef1 kh\u1ee7ng ho\u1ea3ng c\u1ee7a CNTB", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 nguy\u00ean nh\u00e2n d\u1eabn \u0111\u1ebfn s\u1ef1 t\u1ed3n t\u1ea1i c\u1ee7a t\u00f4n gi\u00e1o trong CNXH?", "a": "S\u1ef1 kh\u1ee7ng ho\u1ea3ng c\u1ee7a CNTB", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 nguy\u00ean t\u1eafc c\u01a1 b\u1ea3n c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c-L\u00eanin trong vi\u1ec7c gi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1 t\u00f4n gi\u00e1o?", "a": "Ph\u00e2n bi\u1ec7t gi\u1eefa nh\u1eefng ng\u01b0\u1eddi theo t\u00f4n gi\u00e1o v\u00e0 nh\u1eefng ng\u01b0\u1eddi kh\u00f4ng theo t\u00f4n gi\u00e1o", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 nguy\u00ean t\u1eafc c\u01a1 b\u1ea3n trong x\u00e2y d\u1ef1ng kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN l\u00e0-->", "a": "Ph\u1ea3i \u0111o\u00e0n k\u1ebft gi\u1eefa c\u00f4ng nh\u00e2n v\u1edbi n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN-->", "a": "X\u00e2y d\u1ef1ng con ng\u01b0\u1eddi m\u1edbi XHCN", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung c\u01a1 b\u1ea3n trong vi\u1ec7c x\u00e2y d\u1ef1ng n\u1ec1n v\u0103n h\u00f3a XHCN?", "a": "X\u00e2y d\u1ef1ng n\u1ec1n d\u00e2n ch\u1ee7 XHCN", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung c\u1ee7a quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft", "a": "Quy\u1ec1n t\u1ef1 do \u0111\u1ecbnh \u0111o\u1ea1t c\u1ee7a d\u00e2n t\u1ed9c", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH trong l\u0129nh v\u1ef1c ch\u00ednh tr\u1ecb", "a": "Kh\u1eafc ph\u1ee5c nh\u1eefng t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i do x\u00e3 h\u1ed9i c\u1ee7 \u0111\u1ec3 l\u1ea1i", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH trong l\u0129nh v\u1ef1c kinh t\u1ebf", "a": "X\u00e2y d\u1ef1ng n\u1ec1n d\u00e2n ch\u1ee7 XHCN", "e": {"p": 182, "t": "ch\u00ednh tr\u1ecb \u0111\u00e3 chuy\u1ec3n tr\u1ecdng t\u00e2m sang ch\u00ednh tr\u1ecb trong l\u0129nh v\u1ef1c kinh t\u1ebf, \u0111\u1ea5u tranh giai c\u1ea5p mang nh\u1eefng n\u1ed9i dung v\u00e0 h\u00ecnh th\u1ee9c m\u1edbi.", "a": 1}}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH trong l\u0129nh v\u1ef1c t\u01b0 t\u01b0\u1edfng- v\u0103n h\u00f3a", "a": "X\u00e2y d\u1ef1ng \u0110\u1ea3ng C\u1ed9ng s\u1ea3n v\u1eefng m\u1ea1nh", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH trong l\u0129nh v\u1ef1c x\u00e3 h\u1ed9i", "a": "\u0110\u1ea5u tranh ch\u1ed1ng l\u1ea1i c\u00e1c th\u1ebf l\u1ef1c th\u00f9 \u0111\u1ecbch ch\u1ed1ng ph\u00e1 s\u1ef1 nghi\u1ec7p x\u00e2y d\u1ef1ng CNXH", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung kinh t\u1ebf c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN", "a": "X\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng ch\u00ednh s\u00e1ch an sinh x\u00e3 h\u1ed9i", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung tr\u00ean l\u0129nh v\u1ef1c ch\u00ednh tr\u1ecb c\u1ee7a c\u00e1ch m\u1ea1ng XHCN", "a": "C\u1ea3i thi\u1ec7n \u0111i\u1ec1u ki\u1ec7n s\u1ed1ng, \u0111i\u1ec1u ki\u1ec7n l\u00e0m vi\u1ec7c c\u1ee7a ng\u01b0\u1eddi lao \u0111\u1ed9ng", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf c\u1ee7a c\u00e1ch m\u1ea1ng XHCN", "a": "X\u00e2y d\u1ef1ng nh\u00e0 n\u01b0\u1edbc XHCN", "e": null}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 n\u1ed9i dung v\u0103n h\u00f3a, x\u00e3 h\u1ed9i c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN-->", "a": "X\u00e2y d\u1ef1ng n\u1ec1n qu\u1ed1c ph\u00f2ng to\u00e0n d\u00e2n", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "\u0110\u00e2u kh\u00f4ng ph\u1ea3i l\u00e0 t\u00ednh t\u1ea5t y\u1ebfu c\u1ee7a vi\u1ec7c x\u00e2y d\u1ef1ng nh\u00e0 n\u01b0\u1edbc XHCN?", "a": "Th\u1ec3 hi\u1ec7n s\u1ee9c m\u1ea1nh c\u1ee7a nh\u00e0 n\u01b0\u1edbc XHCN", "e": null}, {"q": "\u0110\u00e2u l\u00e0 \u0111\u1eb7c tr\u01b0ng n\u1ed5i b\u1eadt c\u1ee7a Nh\u00e0 n\u01b0\u1edbc XHCN?", "a": "Nh\u00e0 n\u01b0\u1edbc XHCN l\u00e0 m\u1ed9t ki\u1ec3u Nh\u00e0 n\u01b0\u1edbc \u0111\u1eb7c bi\u1ec7t. Sau khi nh\u1eefng c\u01a1 s\u1edf kinh t\u1ebf x\u00e3 h\u1ed9i cho s\u1ef1 t\u1ed3n t\u1ea1i c\u1ee7a Nh\u00e0 n\u01b0\u1edbc m\u1ea5t \u0111i th\u00ec nh\u00e0 n\u01b0\u1edbc c\u0169ng kh\u00f4ng c\u00f2n, Nh\u00e0 n\u01b0\u1edbc t\u1ef1 ti\u00eau vong.", "e": null}, {"q": "\u0110\u00e2u l\u00e0 nh\u00e2n t\u1ed1 quy\u1ebft \u0111\u1ecbnh s\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c?", "a": "S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t", "e": {"p": 195, "t": "S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ch\u00ednh l\u00e0 nguy\u00ean nh\u00e2n quy\u1ebft \u0111\u1ecbnh s\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c. \u1edf ph\u01b0\u01a1ng T\u00e2y, d\u00e2n t\u1ed9c xu\u1ea5t hi\u1ec7n khi ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u01b0\u1ee3c x\u00e1c l\u1eadp thay th\u1ebf ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t phong ki\u1ebfn, \u1edf ph\u01b0\u01a1ng \u0110\u00f4ng, d\u00e2n t\u1ed9c \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh tr\u00ean c\u01a1 s\u1edf m\u1ed9t n\u1ec1n v\u0103n h\u00f3a, m\u1ed9t t\u00e2m l\u00fd d\u00e2n t\u1ed9c \u0111\u00e3 ph\u00e1t tri\u1ec3n t\u01b0\u01a1ng \u0111\u1ed1\u0129 ch\u00edn mu\u1ed3i v\u00e0 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng kinh t\u1ebf\u2026", "a": 1}}, {"q": "\u0110\u00e2u l\u00e0 ti\u1ec1n \u0111\u1ec1 kinh t\u1ebf - x\u00e3 h\u1ed9i d\u1eabn t\u1edbi s\u1ef1 s\u1ee5p \u0111\u1ed5 kh\u00f4ng tr\u00e1nh kh\u1ecfi c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n?", "a": "S\u1ef1 ph\u00e1t tri\u1ec3n v\u1ec1 l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u00e0 s\u1ef1 tr\u01b0\u1edfng th\u00e0nh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 90, "t": "Ch\u00ednh s\u1ef1 ph\u00e1t tri\u1ec3n v\u1ec1 l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u00e0 s\u1ef1 tr\u01b0\u1edfng th\u00e0nh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 ti\u1ec1n \u0111\u1ec1 kinh t\u1ebf - x\u00e3 h\u1ed9i d\u1eabn t\u1ed1i s\u1ef1 s\u1ee5p \u0111\u1ed5 kh\u00f4ng tr\u00e1nh kh\u1ecfi c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n. \u1ea6ngghen cho r\u1eb1ng, giai 1.", "a": 1}}, {"q": "\u0110\u00e2u l\u00e0 s\u1ef1 gi\u1ed1ng nhau gi\u1eefa t\u00f4n gi\u00e1o v\u00e0 t\u00edn ng\u01b0\u1ee1ng?", "a": "\u0110\u1ec1u c\u00f3 ni\u1ec1m tin v\u00e0o \u0111\u1ea5ng si\u00eau nhi\u00ean", "e": null}, {"q": "\u0110\u1ec3 \u0111\u00e0n \u00e1p cu\u1ed9c \u0111\u1ea5u tranh c\u1ee7a giai c\u1ea5p n\u00f4 l\u1ec7, m\u1ed9t c\u01a1 quan quy\u1ec1n l\u1ef1c \u0111\u1eb7c bi\u1ec7t \u0111\u01b0\u1ee3c giai c\u1ea5p ch\u1ee7 n\u00f4 thi\u1ebft l\u1eadp ra, \u0111\u00f3 l\u00e0", "a": "Gia \u0111\u00ecnh", "e": null}, {"q": "\u0110\u1ec3 gi\u1ea3i quy\u1ebft t\u1ed1t m\u1ed1i quan h\u1ec7 d\u00e2n t\u1ed9c v\u00e0 t\u00f4n gi\u00e1o, \u0110\u1ea3ng C\u1ed9ng S\u1ea3n Vi\u1ec7t Nam c\u1ea7n ph\u1ea3i l\u00e0m g\u00ec? Ch\u1ecdn \u0111\u00e1p \u00e1n KH\u00d4NG \u0111\u00fang", "a": "Ch\u1ee7 \u0111\u1ed9ng ph\u00f2ng ng\u1eeba, \u0111\u1ea5u tranh v\u1edbi m\u1ecdi ho\u1ea1t \u0111\u1ed9ng t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o.", "e": {"p": 232, "t": "\u0110\u1ed3ng th\u00f2i ch\u1ee7 \u0111\u1ed9ng ph\u00f2ng ng\u1eeba, ki\u00ean quy\u1ebft \u0111\u1ea5u tranh v\u1edbi nh\u1eefng h\u00e0nh vi l\u1ee3i d\u1ee5ng t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o \u0111\u1ec3 chia r\u1ebd, ph\u00e1 ho\u1ea1i kh\u1ed1i \u0111\u1ea1i \u0111o\u00e0n k\u1ebft d\u00e2n t\u1ed9c ho\u1eb7c nh\u1eefng ho\u1ea1t \u0111\u1ed9ng t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o tr\u00e1i quy \u0111\u1ecbnh c\u1ee7a ph\u00e1p lu\u1eadt\u201d1. Tr\u00ean c\u01a1 s\u1edf nh\u1eadn di\u1ec7n r\u00f5 c\u00e1c \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a quan h\u1ec7 d\u00e2n t\u1ed9c v\u00e0 t\u00f4n gi\u00e1o \u1edf n\u01b0\u1edbc ta hi\u1ec7n nay, qu\u00e1 tr\u00ecnh gi\u1ea3i quy\u1ebft m\u1ed1i quan h\u1ec7 n\u00e0y c\u1ea7n qu\u00e1n tri\u1ec7t m\u1ed9t s\u1ed1 quan \u0111i\u1ec3m\u2026", "a": 1}}, {"q": "\u0110\u1ec3 ph\u00e1t huy ngu\u1ed3n l\u1ef1c con ng\u01b0\u1eddi \u1edf Vi\u1ec7t Nam hi\u1ec7n nay c\u1ea7n ph\u1ea3i th\u1ef1c hi\u1ec7n nh\u1eefng ph\u01b0\u01a1ng h\u01b0\u1edbng n\u00e0o?", "a": "C\u1ea3 a, b v\u00e0 c: \u0110\u1ea9y m\u1ea1nh s\u1ef1 nghi\u1ec7p c\u00f4ng nghi\u1ec7p ho\u00e1, hi\u1ec7n \u0111\u1ea1i ho\u00e1, ph\u00e1t tri\u1ec3n n\u1ec1n kinh t\u1ebf \u0111\u1ea5t n\u01b0\u1edbc/ X\u00e2y d\u1ef1ng v\u00e0 t\u1eebng b\u01b0\u1edbc ho\u00e0n ch\u1ec9nh m\u1ed9t h\u1ec7 th\u1ed1ng ch\u00ednh s\u00e1ch x\u00e3 h\u1ed9i ph\u00f9 h\u1ee3p/ T\u1eebng b\u01b0\u1edbc x\u00e2y d\u1ef1ng v\u00e0 kh\u00f4ng ng\u1eebng ho\u00e0n thi\u1ec7n c\u01a1 ch\u1ebf qu\u1ea3n l\u00fd c\u1ee7a ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "e": null}, {"q": "\u0110\u1ec3 ph\u00e1t huy vai tr\u00f2, tr\u00e1ch nhi\u1ec7m c\u1ee7a ng\u01b0\u1eddi ph\u1ee5 n\u1eef trong x\u00e2y d\u1ef1ng gia \u0111\u00ecnh v\u0103n minh h\u1ea1nh ph\u00fac v\u00e0 b\u1ea3o v\u1ec7 m\u00f4i tr\u01b0\u1eddng s\u1ed1ng c\u1ee7a to\u00e0n x\u00e3 h\u1ed9i, Trung \u01b0\u01a1ng H\u1ed9i Li\u00ean hi\u1ec7p Ph\u1ee5 n\u1eef Vi\u1ec7t Nam \u0111\u00e3 ph\u00e1t \u0111\u1ed9ng Cu\u1ed9c v\u1eadn \u0111\u1ed9ng \"X\u00e2y d\u1ef1ng gia \u0111\u00ecnh 5 kh\u00f4ng, 3 s\u1ea1ch\" v\u00e0o n\u0103m 2010, trong \u0111\u00f3 \"5 kh\u00f4ng\" g\u1ed3m nh\u1eefng ti\u00eau ch\u00ed n\u00e0o?", "a": "Kh\u00f4ng \u0111\u00f3i ngh\u00e8o; kh\u00f4ng vi ph\u1ea1m ph\u00e1p lu\u1eadt, t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i; kh\u00f4ng c\u00f3 b\u1ea1o l\u1ef1c gia \u0111\u00ecnh; kh\u00f4ng sinh con th\u1ee9 3 tr\u1edf l\u00ean; kh\u00f4ng c\u00f3 tr\u1ebb em suy dinh d\u01b0\u1ee1ng", "e": null}, {"q": "\u0110\u1ec3 ph\u00e1t tri\u1ec3n giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ec1 s\u1ed1 l\u01b0\u1ee3ng v\u00e0 ch\u1ea5t l\u01b0\u1ee3ng, theo ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin ph\u1ea3i \u0111\u1eb7c bi\u1ec7t ch\u00fa \u00fd \u0111\u1ebfn bi\u1ec7n ph\u00e1p c\u01a1 b\u1ea3n n\u00e0o?", "a": "Ph\u00e1t tri\u1ec3n c\u00f4ng nghi\u1ec7p v\u00e0 s\u1ef1 tr\u01b0\u1edfng th\u00e0nh c\u1ee7a \u0110\u1ea3ng C\u1ed9ng S\u1ea3n", "e": {"p": 62, "t": "\u0110\u1ec3 ph\u00e1t tri\u1ec3n giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ec1 s\u1ed1 l\u01b0\u1ee3ng v\u00e0 ch\u1ea5t l\u01b0\u1ee3ng, theo ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin ph\u1ea3i \u0111\u1eb7c bi\u1ec7t ch\u00fa \u00fd \u0111\u1ebfn hai bi\u1ec7n ph\u00e1p c\u01a1 b\u1ea3n: 1) Ph\u00e1t tri\u1ec3n c\u00f4ng nghi\u1ec7p - \u201cti\u1ec1n \u0111\u1ec1 th\u1ef1c ti\u1ec5n tuy\u1ec7t \u0111\u1ed1i c\u1ea7n thi\u1ebft\u201d;", "a": 1}}, {"q": "\u0110\u1ec3 th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a m\u00ecnh, giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t nam hi\u1ec7n nay c\u00f3 li\u00ean minh v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n kh\u00f4ng?", "a": "C\u00f3 li\u00ean minh trong l\u0129nh v\u1ef1c kinh t\u1ebf", "e": null}, {"q": "\u0110\u1ec3 x\u00e2y d\u1ef1ng m\u1ed9t x\u00e3 h\u1ed9i th\u1eadt s\u1ef1 b\u00ecnh \u0111\u1eb3ng, con ng\u01b0\u1eddi \u0111\u01b0\u1ee3c gi\u1ea3i ph\u00f3ng, giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 ch\u1ee7 tr\u01b0\u01a1ng n\u00e0o?", "a": "T\u1ea5t c\u1ea3 c\u00e1c \u0111\u00e1p \u00e1n \u0111\u1ec1u \u0111\u00fang: B\u1ea3o v\u1ec7 ch\u1ebf \u0111\u1ed9 h\u00f4n nh\u00e2n m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng/ Gi\u1ea3i ph\u00f3ng ph\u1ee5 n\u1eef Th\u1ef1c hi\u1ec7n s\u1ef1 b\u00ecnh \u0111\u1eb3ng trong gia \u0111\u00ecnh", "e": {"p": 244, "t": "Trong qu\u00e1 tr\u00ecnh x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, \u0111\u1ec3 x\u00e2y d\u1ef1ng m\u1ed9t x\u00e3 h\u1ed9i th \u1eadt s\u1ef1 b\u00ecnh \u0111\u1eb3ng, con ng\u01b0\u1eddi \u0111\u01b0\u1ee3c gi\u1ea3i ph\u00f3ng, giai c\u1ea5p c\u00f4ng nh\u00e2n ch\u1ee7 tr\u01b0\u01a1ng b\u1ea3o v\u1ec7 ch\u1ebf \u0111\u1ed9 h\u00f4n nh\u00e2n m\u1ed9t v\u1ee2, m\u1ed9t ch\u1ed3ng, th\u1ef1c hi\u1ec7n s\u1ef1 b\u00ecnh \u0111\u1eb3ng trong gia \u0111\u00ecnh, gi\u1ea3i ph\u00f3ng ph\u1ee5 n\u1eef.", "a": 1}}, {"q": "\u0110i\u1ec3m ch\u1ee7 y\u1ebfu trong h\u1ecdc thuy\u1ebft M\u00e1c l\u00e0 \u1edf ch\u1ed7 n\u00f3 l\u00e0m s\u00e1ng r\u00f5 vai tr\u00f2 l\u1ecbch s\u1eed th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p v\u00f4 s\u1ea3n l\u00e0 ng\u01b0\u1eddi x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a\u201d l\u00e0 nh\u1eadn \u0111\u1ecbnh c\u1ee7a ai?", "a": "V. I. L\u00eanin", "e": null}, {"q": "\u0110i\u1ec3m chung c\u1ee7a c\u00e1c nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0", "a": "\u0110\u1eb7t d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng S\u1ea3n.", "e": {"p": 133, "t": "\u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n b\u1eb1ng nh\u00e0 n\u01b0\u1ed5c ph\u00e1p quy\u1ec1n x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, \u0111\u1eb7t d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n.", "a": 1}}, {"q": "\u0110i\u1ec3m kh\u00e1c bi\u1ec7t v\u1ec1 ch\u1ea5t \u1edf s\u1ef1 th\u1ed1ng tr\u1ecb ch\u00ednh tr\u1ecb c\u1ee7a giai c\u1ea5p v\u00f4 s\u1ea3n so v\u1edbi s\u1ef1 th\u1ed1ng tr\u1ecb ch\u00ednh tr\u1ecb c\u1ee7a c\u00e1c giai c\u1ea5p b\u00f3c l\u1ed9t tr\u01b0\u1edbc \u0111\u00e2y l\u00e0?", "a": "S\u1ef1 th\u1ed1ng tr\u1ecb ch\u00ednh tr\u1ecb c\u1ee7a giai c\u1ea5p v\u00f4 s\u1ea3n l\u00e0 s\u1ef1 th\u1ed1ng tr\u1ecb c\u1ee7a \u0111a s\u1ed1 \u0111\u1ed1i v\u1edbi thi\u1ec3u s\u1ed1 giai c\u1ea5p b\u00f3c l\u1ed9t nh\u1eb1m gi\u1ea3i ph\u00f3ng giai c\u1ea5p m\u00ecnh v\u00e0 gi\u1ea3i ph\u00f3ng t\u1ea5t c\u1ea3 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c trong x\u00e3 h\u1ed9i", "e": {"p": 142, "t": "C\u00f2n s\u1ef1 th\u1ed1ng tr\u1ecb v\u1ec1 ch\u00ednh tr\u1ecb c\u1ee7a giai c\u1ea5p v\u00f4 s\u1ea3n l\u00e0 s\u1ef1 th\u1ed1ng tr\u1ecb c\u1ee7a \u0111a s\u1ed1 \u0111\u1ed1i v\u1edbi thi\u1ec3u s\u1ed1 giai c\u1ea5p b\u00f3c l\u1ed9t nh\u1eb1m gi\u1ea3i ph\u00f3ng giai c\u1ea5p m\u00ecnh v\u00e0 gi\u1ea3i ph\u00f3ng t\u1ea5t c\u1ea3 c\u00e1c t\u1ea7ng l\u00f3p nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c trong x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "\u0110i\u1ec1n t\u1eeb c\u00f2n thi\u1ebfu v\u00e0o c\u00e2u sau: T\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o l\u00e0 nhu c\u1ea7u \u2026 c\u1ee7a m\u1ed9t b\u1ed9 ph\u1eadn nh\u00e2n d\u00e2n, \u0111ang v\u00e0 s\u1ebd t\u1ed3n t\u1ea1i c\u00f9ng d\u00e2n t\u1ed9c trong qu\u00e1 tr\u00ecnh x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta", "a": "Tinh th\u1ea7n", "e": {"p": 224, "t": "b) Ch\u00ednh s\u00e1ch c\u1ee7a \u0110\u1ea3ng, Nh\u00e0 n\u01b0\u1edbc Vi\u1ec7t Nam \u0111\u1ed1i v\u1edbi t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o hi\u1ec7n nay - T\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o l\u00e0 nhu c\u1ea7u tinh th\u1ea7n c\u1ee7a m\u1ed9t b\u1ed9 ph\u1eadn nh\u00e2n d\u00e2n, \u0111ang v\u00e0 s\u1ebd t\u1ed3n t\u1ea1i c\u00f9ng d\u00e2n t\u1ed9c trong qu\u00e1 tr\u00ecnh x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta.", "a": 1}}, {"q": "\u0110i\u1ec1n t\u1eeb c\u00f2n thi\u1ebfu v\u00e0o ch\u1ed7 tr\u1ed1ng: \u201cN\u01b0\u1edbc ta l\u00e0 n\u01b0\u1edbc d\u00e2n ch\u1ee7, ngh\u0129a l\u00e0 n\u01b0\u1edbc nh\u00e0 do nh\u00e2n d\u00e2n l\u00e0m ch\u1ee7. Nh\u00e2n d\u00e2n c\u00f3 quy\u1ec1n l\u1ee3i l\u00e0m ch\u1ee7, th\u00ec ph\u1ea3i c\u00f3 \u2026 l\u00e0m tr\u00f2n b\u1ed5n ph\u1eadn c\u00f4ng d\u00e2n\u201d (H\u1ed3 Ch\u00ed Minh)", "a": "Ngh\u0129a v\u1ee5.", "e": null}, {"q": "\u0110i\u1ec1n t\u1eeb c\u00f2n thi\u1ebfu v\u00e0o ch\u1ed7 tr\u1ed1ng: Quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft l\u00e0 quy\u1ec1n l\u00e0m ch\u1ee7 c\u1ee7a m\u1ed7i d\u00e2n t\u1ed9c \u0111\u1ed1i v\u1edbi v\u1eadn m\u1ec7nh d\u00e2n t\u1ed9c m\u00ecnh, quy\u1ec1n t\u1ef1 quy\u1ebft \u0111\u1ecbnh ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb \u2013 x\u00e3 h\u1ed9i v\u00e0... ph\u00e1t tri\u1ec3n c\u1ee7a d\u00e2n t\u1ed9c m\u00ecnh.", "a": "Con \u0111\u01b0\u1eddng", "e": {"p": 203, "t": "\u0110\u00f3 l\u00e0 quy\u1ec1n c\u1ee7a c\u00e1c d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft \u0111\u1ecbnh l\u1ea5y v\u1eadn m\u1ec7nh c\u1ee7a d\u00e2n t\u1ed9c m\u00ecnh, quy\u1ec1n t\u1ef1 l\u1ef1a ch\u1ecdn ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb v\u00e0 con \u0111\u01b0\u1eddng ph\u00e1t tri\u1ec3n c\u1ee7a d\u00e2n t\u1ed9c m\u00ecnh.", "a": 1}}, {"q": "\u0110i\u1ec1n t\u1eeb th\u00edch h\u1ee3p v\u00e0o ch\u1ed7 tr\u1ed1ng: C\u00e1c d\u00e2n t\u1ed9c \u0111\u1ec1u c\u00f3 [.....] v\u00e0 quy\u1ec1n l\u1ee3i ngang nhau tr\u00ean t\u1ea5t c\u1ea3 c\u00e1c l\u0129nh v\u1ef1c c\u1ee7a \u0111\u1eddi s\u1ed1ng x\u00e3 h\u1ed9i, kh\u00f4ng m\u1ed9t d\u00e2n t\u1ed9c n\u00e0o \u0111\u01b0\u1ee3c gi\u1eef [.......], \u0111\u1eb7c l\u1ee3i v\u1ec1 kinh t\u1ebf, ch\u00ednh tr\u1ecb, v\u0103n h\u00f3a.", "a": "Ngh\u0129a v\u1ee5/ \u0111\u1eb7c quy\u1ec1n", "e": {"p": 203, "t": "C\u00e1c d\u00e2n t\u1ed9c \u0111\u1ec1u c\u00f3 ngh\u0129a v\u1ee5 v\u00e0 quy\u1ec1n l\u1ee3i ngang nhau tr\u00ean t\u1ea5t c\u1ea3 c\u00e1c l\u0129nh v\u1ef1c c\u1ee7a \u0111\u1eddi s\u1ed1ng x\u00e3 h\u1ed9i, kh\u00f4ng d\u00e2n t\u1ed9c n\u00e0o \u0111\u01b0\u1ee3c gi\u1eef \u0111\u1eb7c quy\u1ec1n, \u0111\u1eb7c l\u1ee3i v\u1ec1 kinh t\u1ebf, ch\u00ednh tr\u1ecb, v\u0103n h\u00f3a.", "a": 1}}, {"q": "\u0110i\u1ec1n t\u1eeb th\u00edch h\u1ee3p v\u00e0o ch\u1ed7 tr\u1ed1ng: H\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n th\u00f4ng qua c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a xu\u1ea5t ph\u00e1t t\u1eeb hai ti\u1ec1n \u0111\u1ec1 v\u1eadt ch\u1ea5t quan tr\u1ecdng nh\u1ea5t l\u00e0\u2026v\u00e0\u2026?", "a": "S\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u00e0 s\u1ef1 tr\u01b0\u1edfng th\u00e0nh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 87, "t": "S\u1ef1 thay th\u1ebf n\u00e0y \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n th\u00f4ng qua c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a xu\u1ea5t ph\u00e1t t\u1eeb hai ti\u1ec1n \u0111\u1ec1 v\u1eadt ch\u1ea5t quan tr\u1ecdng nh\u1ea5t l\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u00e0 s\u1ef1 tr\u01b0\u1edfng th\u00e0nh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n. H\u1ecdc thuy\u1ebft h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin \u0111\u00e3 cung c\u1ea5p nh\u1eefng ti\u00eau chu\u1ea9n th\u1ef1c s\u1ef1 duy v\u1eadt, khoa h\u1ecdc cho s\u1ef1 ph\u00e2n k\u1ef3 l\u1ecbch s\u1eed, trong \u0111\u00f3 c\u00f3 s\u1ef1 ph\u00e2n k\u1ef3 h\u00ecnh th\u00e1i\u2026", "a": 1}}, {"q": "\u0110i\u1ec1n t\u1eeb v\u00e0o \u00f4 tr\u1ed1ng: \u201cL\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t h\u00e0ng \u0111\u1ea7u c\u1ee7a nh\u00e2n lo\u1ea1i l\u00e0\u2026l\u00e0 ng\u01b0\u1eddi lao \u0111\u1ed9ng\u201d (V. I.L\u00eanin)", "a": ".C\u00f4ng nh\u00e2n", "e": null}, {"q": "\u0110i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng cho \u0111o\u1ea1n v\u0103n sau \u0111\u00e2y: \"[...] l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a s\u1ef1 k\u1ebft h\u1ee3p ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n trong cu\u1ed9c \u0111\u1ea5u tranh th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n\u201d", "a": "\u0110\u1ea3ng C\u1ed9ng s\u1ea3n.", "e": {"p": 63, "t": "\u0111\u1ec3 cu\u1ed9c c\u00e1ch m\u1ea1ng th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111i t\u1edbi th\u1eafng l\u1ee3i, ph\u1ea3i c\u00f3 s\u1ef1 li\u00ean minh giai c\u1ea5p gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u1ea5c do giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua \u0111\u1ed9i ti\u00ean phong c\u1ee7a n\u00f3 l\u00e0 1. \u0110\u1ea3ng C\u1ed9ng s\u1ea3n l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a s\u1ef1 k\u1ebft h\u1ee3p gi\u1eefa ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n.", "a": 1}}, {"q": "\u0110i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng nh\u1eadn \u0111\u1ecbnh c\u1ee7a L\u00eanin: \"Nguy\u00ean t\u1eafc cao nh\u1ea5t c\u1ee7a [....] l\u00e0 duy tr\u00ec kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p v\u00f4 s\u1ea3n v\u00e0 n\u00f4ng d\u00e2n \u0111\u1ec3 giai c\u1ea5p v\u00f4 s\u1ea3n c\u00f3 th\u1ec3 gi\u1eef \u0111\u01b0\u1ee3c vai tr\u00f2 l\u00e3nh \u0111\u1ea1o v\u00e0 ch\u00ednh quy\u1ec1n nh\u00e0 n\u01b0\u1edbc\"", "a": "Chuy\u00ean ch\u00ednh.", "e": {"p": 173, "t": "Nguy\u00ean t\u1eafc cao nh\u1ea5t c\u1ee7a chuy\u00ean ch\u00ednh l\u00e0 duy tr\u00ec kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p v\u00f4 s\u1ea3n v\u00e0 n\u00f4ng d\u00e2n \u0111\u1ec3 giai c\u1ea5p v\u00f4 s\u1ea3n c\u00f3 th\u1ec3 gi\u1eef \u0111\u01b0\u1ee3c vai tr\u00f2 l\u00e3nh \u0111\u1ea1o v\u00e0 ch\u00ednh quy\u1ec1n nh\u00e0 n\u01b0\u1edbc\u201d1. Tr\u00ean th\u1ef1c t\u1ebf, trong b\u01b0\u1edbc \u0111\u1ea7u c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, V.I.", "a": 1}}, {"q": "\u0110i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: \u201cCh\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin coi t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o l\u00e0 \u2026.. ph\u1ea3n \u00e1nh m\u1ed9t c\u00e1ch hoang \u0111\u01b0\u1eddng, h\u01b0 \u1ea3o hi\u1ec7n th\u1ef1c kh\u00e1ch quan. Th\u00f4ng qua s\u1ef1 ph\u1ea3n \u00e1nh \u0111\u00f3, c\u00e1c l\u1ef1c l\u01b0\u1ee3ng t\u1ef1 nhi\u00ean tr\u1edf th\u00e0nh si\u00eau t\u1ef1 nhi\u00ean, th\u1ea7n b\u00ed\u201d", "a": "M\u1ed9t h\u00ecnh th\u00e1i \u00fd th\u1ee9c", "e": {"p": 213, "t": "Ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin cho r\u1eb1ng, t\u00f4n gi\u00e1o l\u00e0 m\u1ed9t h\u00ecnh th\u00e1i \u00fd th\u1ee9c x\u00e3 h\u1ed9i ph\u1ea3n \u00e1nh h\u01b0 \u1ea3o hi\u1ec7n th\u1ef1c kh\u00e1ch quan. Th\u00f4ng qua s\u1ef1 ph\u1ea3n \u00e1nh \u0111\u00f3, c\u00e1c l\u1ef1c l\u01b0\u1ee3ng t\u1ef1 nhi\u00ean v\u00e0 x\u00e3 h\u1ed9i tr\u1edf th\u00e0nh si\u00eau nhi\u00ean, th\u1ea7n b\u00ed.", "a": 1}}, {"q": "\u0110i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: Ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin cho r\u1eb1ng, d\u00e2n ch\u1ee7 l\u00e0 s\u1ea3n ph\u1ea9m v\u00e0 l\u00e0 th\u00e0nh qu\u1ea3 c\u1ee7a qu\u00e1 tr\u00ecnh [...] cho nh\u1eefng gi\u00e1 tr\u1ecb ti\u1ebfn b\u1ed9 c\u1ee7a nh\u00e2n lo\u1ea1i", "a": "\u0110\u1ea5u tranh giai c\u1ea5p.", "e": {"p": 125, "t": "T\u1eeb vi\u1ec7c nghi\u00ean c\u1ee9u c\u00e1c ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 trong l\u1ecbch s\u1eed v\u00e0 th\u1ef1c ti\u1ec5n l\u00e3nh \u0111\u1ea1o c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, c\u00e1c nh\u00e0 s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin cho r\u1eb1ng, d\u00e2n ch\u1ee7 l\u00e0 s\u1ea3n ph\u1ea9m v\u00e0 l\u00e0 th\u00e0nh qu\u1ea3 c\u1ee7a qu\u00e1 tr\u00ecnh \u0111\u1ea5u tranh giai c\u1ea5p cho nh\u1eefng gi\u00e1 tr\u1ecb ti\u1ebfn b\u1ed9 c\u1ee7a nh\u00e2n lo\u1ea1i, l\u00e0 m\u1ed9t h\u00ecnh th\u1ee9c t\u1ed5 ch\u1ee9c nh\u00e0 n\u01b0\u1edbc c\u1ee7a giai c\u1ea5p c\u1ea7m quy\u1ec1n, l\u00e0 m\u1ed9t trong nh\u1eefng nguy\u00ean t\u1eafc ho\u1ea1t \u0111\u1ed9ng c\u1ee7a c\u00e1c t\u1ed5 ch\u1ee9c\u2026", "a": 1}}, {"q": "\u0110i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: Kh\u00e1i ni\u1ec7m d\u00e2n t\u1ed9c \u201cd\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi c\u00f3 li\u00ean h\u1ec7 ch\u1eb7t ch\u1ebd v\u00e0 b\u1ec1n v\u1eefng, \u2026.., xu\u1ea5t hi\u1ec7n sau b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c, k\u1ebf th\u1eeba v\u00e0 ph\u00e1t tri\u1ec3n cao h\u01a1n nh\u1eefng nh\u00e2n t\u1ed1 t\u1ed9c ng\u01b0\u1eddi \u1edf b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c v\u00e0 th\u1ec3 hi\u1ec7n th\u00e0nh \u00fd th\u1ee9c t\u1ef1 gi\u00e1c t\u1ed9c ng\u01b0\u1eddi c\u1ee7a d\u00e2n c\u01b0 c\u1ed9ng \u0111\u1ed3ng \u0111\u00f3.\u201d", "a": "C\u00f3 chung sinh ho\u1ea1t kinh t\u1ebf, c\u00f3 ng\u00f4n ng\u1eef ri\u00eang, v\u0103n h\u00f3a c\u00f3 nh\u1eefng \u0111\u1eb7c th\u00f9.", "e": {"p": 198, "t": "Theo ngh\u0129a h\u1eb9p, d\u00e2n t\u1ed9c (Ethnie) l\u00e0 kh\u00e1i ni\u1ec7m d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng t\u1ed9c ng\u01b0\u1eddi \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh trong l\u1ecbch s\u1eed, c\u00f3 m\u1ed1\u0129 li\u00ean h\u1ec7 ch\u1eb7t ch\u1ebd v\u00e0 b\u1ec1n v\u1eefng, c\u00f3 chung \u00fd th\u1ee9c t\u1ef1 gi\u00e1c t\u1ed9c ng\u01b0\u1eddi, ng\u00f4n ng\u1eef v\u00e0 v\u0103n h\u00f3a. C\u1ed9ng \u0111\u1ed3ng n\u00e0y xu\u1ea5t hi\u1ec7n sau b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c, k\u1ebf th\u1eeba v\u00e0 ph\u00e1t tri\u1ec3n cao h\u01a1n", "a": 1}}, {"q": "\u0110i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: Kh\u00e1i ni\u1ec7m d\u00e2n t\u1ed9c \u201cd\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi \u1ed5n \u0111\u1ecbnh l\u00e0m th\u00e0nh nh\u00e2n d\u00e2n m\u1ed9t n\u01b0\u1edbc, [.......], c\u00f3 n\u1ec1n kinh t\u1ebf th\u1ed1ng nh\u1ea5t, c\u00f3 ng\u00f4n ng\u1eef chung v\u00e0 c\u00f3 \u00fd th\u1ee9c v\u1ec1 s\u1ef1 th\u1ed1ng nh\u1ea5t c\u1ee7a m\u00ecnh, g\u1eafn b\u00f3 v\u1edbi nhau b\u1edfi quy\u1ec1n l\u1ee3i ch\u00ednh tr\u1ecb, kinh t\u1ebf, truy\u1ec1n th\u1ed1ng v\u0103n h\u00f3a v\u00e0 truy\u1ec1n th\u1ed1ng \u0111\u1ea5u tranh chung trong su\u1ed1t qu\u00e1 tr\u00ecnh l\u1ecbch s\u1eed l\u00e2u d\u00e0i\u201d.", "a": "C\u00f3 l\u00e3nh th\u1ed5 qu\u1ed1c gia", "e": {"p": 195, "t": "Theo ngh\u0129a r\u1ed9ng, d\u00e2n t\u1ed9c (Nation) l\u00e0 kh\u00e1i ni\u1ec7m d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1edfi \u1ed5n \u0111\u1ecbnh l\u00e0m th\u00e0nh nh\u00e2n d\u00e2n m\u1ed9t n\u01b0\u1edbc, c\u00f3 l\u00e3nh th\u1ed5 ri\u00eang, n\u1ec1n kinh t\u00ea' th\u00f4ng nh\u1ea5t, c\u00f3 ng\u00f4n ng\u1eef chung v\u00e0 c\u00f3 \u00fd th\u1ee9c v\u1ec1 s\u1ef1 th\u00f4ng nh\u1ea5t c\u1ee7a m\u00ecnh, g\u1eafn b\u00f3 v\u1edbi nhau b\u1edfi quy\u1ec1n l\u1ee3i ch\u00ednh tr\u1ecb, kinh t\u1ebf, truy\u1ec1n th\u1ed1hg v\u0103n h\u00f3a v\u00e0 truy\u1ec1n th\u00f4ng \u0111\u1ea5u tranh chung trong su\u00f4't qu\u00e1 tr\u00ecnh l\u1ecbch s\u1eed l\u00e2u d\u00e0i d\u1ef1ng n\u01b0\u1edbc v\u00e0 gi\u1eef\u2026", "a": 1}}, {"q": "\u0110i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i ph\u1ee9c t\u1ea1p, \u0111a d\u1ea1ng, l\u00e0m xu\u1ea5t hi\u1ec7n c\u00e1c [......] m\u1edbi", "a": "Giai c\u1ea5p.", "e": {"p": 169, "t": "Hai l\u00e0, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i ph\u1ee9c t\u1ea1p, \u0111a d\u1ea1ng, l\u00e0m xu\u1ea5t hi\u1ec7n c\u00e1c t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i m\u1edbi.", "a": 1}}, {"q": "\u0110i\u1ec1n v\u00e0o \u00f4 tr\u1ed1ng t\u1eeb c\u00f2n thi\u1ebfu: \u201cQuy\u1ec1n kh\u00f4ng bao gi\u1edd c\u00f3 th\u1ec3 \u1edf m\u1ed9t m\u1ee9c \u0111\u1ed9 cao h\u01a1n ch\u1ebf \u0111\u1ed9 \u2026 v\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n v\u0103n ho\u00e1 c\u1ee7a x\u00e3 h\u1ed9i do ch\u1ebf \u0111\u1ed9 \u2026 \u0111\u00f3 quy\u1ebft \u0111\u1ecbnh\u201d (M\u00e1c: Ph\u00ea ph\u00e1n C\u01b0\u01a1ng l\u0129nh G\u00f4ta)", "a": "Kinh t\u1ebf.", "e": null}, {"q": "\u0110i\u1ec1u g\u00ec khi\u1ebfn cho giai c\u1ea5p c\u00f4ng nh\u00e2n tr\u1edf th\u00e0nh giai c\u1ea5p \u0111\u1ed1i kh\u00e1ng v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n?", "a": "Kh\u00f4ng s\u1edf h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i", "e": {"p": 53, "t": "\u0110\u1ed1\u00ec di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n, c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0 t\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng. Ch\u00ednh \u0111i\u1ec1u n\u00e0y khi\u1ebfn cho giai c\u1ea5p c\u00f4ng nh\u00e2n tr\u1edf th\u00e0nh giai c\u1ea5p \u0111\u1ed1i kh\u00e1ng v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n.", "a": 1}}, {"q": "\u0110i\u1ec1u ki\u1ec7n kh\u00e1ch quan quy \u0111\u1ecbnh s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0", "a": "C\u1ea3 A, B: \u0110\u1ecba v\u1ecb kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 \u0111\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i, \u0110\u1ea3ng C\u1ed9ng s\u1ea3n l\u00e3nh \u0111\u1ea1o.", "e": {"p": 59, "t": "\u0110i\u1ec1u ki\u1ec7n kh\u00e1ch quan quy \u0111\u1ecbnh s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n bao g\u1ed3m: Th\u1ee9 nh\u1ea5t, do \u0111\u1ecba v\u1ecb kinh t\u1ebf c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n.", "a": 1}}, {"q": "\u0110i\u1ec1u ki\u1ec7n n\u00e0o quy\u1ebft \u0111\u1ecbnh giai c\u1ea5p c\u00f4ng nh\u00e2n chi\u1ebfn th\u1eafng trong cu\u1ed9c \u0111\u1ea5u tranh ch\u1ed1ng l\u1ea1i giai c\u1ea5p t\u01b0 s\u1ea3n?", "a": "Gi\u00e1c ng\u1ed9 l\u00fd lu\u1eadn khoa h\u1ecdc, c\u00e1ch m\u1ea1ng; c\u00f3 ch\u00ednh \u0110\u1ea3ng l\u00e3nh \u0111\u1ea1o", "e": null}, {"q": "\u0110i\u1ec1u ki\u1ec7n kh\u00e1ch quan quy \u0111\u1ecbnh s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0", "a": "? \u0110\u1ecba v\u1ecb kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 \u0111\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "e": {"p": 59, "t": "\u0110i\u1ec1u ki\u1ec7n kh\u00e1ch quan quy \u0111\u1ecbnh s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n bao g\u1ed3m: Th\u1ee9 nh\u1ea5t, do \u0111\u1ecba v\u1ecb kinh t\u1ebf c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n.", "a": 1}}, {"q": "\u0110\u1ed1i di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n, c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0?", "a": "T\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng", "e": {"p": 53, "t": "\u0110\u1ed1\u00ec di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n, c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0 t\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng.", "a": 1}}, {"q": "\u0110\u1ed1i t\u01b0\u1ee3ng nghi\u00ean c\u1ee9u c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc", "a": "L\u00e0 nh\u1eefng quy lu\u1eadt v\u00e0 t\u00ednh quy lu\u1eadt ch\u00ednh tr\u1ecb \u2013 x\u00e3 h\u1ed9i c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t sinh, h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a.", "e": {"p": 41, "t": "nh\u1eefng quy lu\u1eadt, t\u00ednh quy lu\u1eadt ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t sinh, h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a m\u00e0 giai \u0111o\u1ea1n th\u1ea5p l\u00e0 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i; nh\u1eefng nguy\u00ean t\u1ea5c c\u01a1 b\u1ea3n, nh\u1eefng \u0111i\u1ec1u ki\u1ec7n, nh\u1eefng con \u0111\u01b0\u1eddng v\u00e0 h\u00ecnh th\u1ee9c, ph\u01b0\u01a1ng ph\u00e1p \u0111\u1ea5u tranh c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1eb1 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng nh\u1eb1m hi\u1ec7n th\u1ef1c h\u00f3a s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1eeb ch\u1ee7\u2026", "a": 1}}, {"q": "\u0110\u1ed1i t\u01b0\u1ee3ng nghi\u00ean c\u1ee9u c\u1ee7a CNXH khoa h\u1ecdc l\u00e0 g\u00ec?", "a": "L\u00e0 nh\u1eefng quy lu\u1eadt v\u00e0 t\u00ednh quy lu\u1eadt ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t sinh, h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a", "e": {"p": 41, "t": "nh\u1eefng quy lu\u1eadt, t\u00ednh quy lu\u1eadt ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t sinh, h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a m\u00e0 giai \u0111o\u1ea1n th\u1ea5p l\u00e0 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i; nh\u1eefng nguy\u00ean t\u1ea5c c\u01a1 b\u1ea3n, nh\u1eefng \u0111i\u1ec1u ki\u1ec7n, nh\u1eefng con \u0111\u01b0\u1eddng v\u00e0 h\u00ecnh th\u1ee9c, ph\u01b0\u01a1ng ph\u00e1p \u0111\u1ea5u tranh c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1eb1 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng nh\u1eb1m hi\u1ec7n th\u1ef1c h\u00f3a s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1eeb ch\u1ee7\u2026", "a": 1}}, {"q": "\u0110\u1ed1i t\u01b0\u1ee3ng nghi\u00ean c\u1ee9u c\u1ee7a CNXH khoa h\u1ecdc l\u00e0 g\u00ec?", "a": "C\u1ea3 2 \u0111\u00e1p \u00e1n \u0111\u1ec1u \u0111\u00fang: Nh\u1eefng nguy\u00ean t\u1eafc c\u01a1 b\u1ea3n, nh\u1eefng \u0111i\u1ec1u ki\u1ec7n, nh\u1eefng con \u0111\u01b0\u1eddng v\u00e0 h\u00ecnh th\u1ee9c, ph\u01b0\u01a1ng ph\u00e1p \u0111\u1ea5u tranh c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng nh\u1eb1m hi\u1ec7n th\u1ef1c h\u00f3a s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1eeb CNTB l\u00ean CNXH v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n/ Nh\u1eefng quy lu\u1eadt ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t sinh, h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a m\u00e0 giai \u0111o\u1ea1n th\u1ea5p l\u00e0 CNXH", "e": {"p": 41, "t": "nh\u1eefng nguy\u00ean t\u1ea5c c\u01a1 b\u1ea3n, nh\u1eefng \u0111i\u1ec1u ki\u1ec7n, nh\u1eefng con \u0111\u01b0\u1eddng v\u00e0 h\u00ecnh th\u1ee9c, ph\u01b0\u01a1ng ph\u00e1p \u0111\u1ea5u tranh c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1eb1 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng nh\u1eb1m hi\u1ec7n th\u1ef1c h\u00f3a s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n.", "a": 1}}, {"q": "\u201cGiai c\u1ea5p c\u00f4ng nh\u00e2n la\u0300 nh\u01b0\u0303ng ng\u01b0\u01a1\u0300i lao \u0111\u00f4\u0323ng kh\u00f4ng co\u0301 s\u1edf h\u1eefu t\u01b0 li\u00ea\u0323u sa\u0309n xu\u00e2\u0301t ch\u1ee7 y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i, pha\u0309i ba\u0301n s\u01b0\u0301c lao \u0111\u00f4\u0323ng cho nh\u00e0 t\u01b0 b\u1ea3n v\u00e0 bi\u0323 ch\u1ee7 t\u01b0 ba\u0309n bo\u0301c l\u00f4\u0323t gia\u0301 tri\u0323 th\u0103\u0323ng d\u01b0\u201d. \u0110\u00e2y l\u00e0 n\u1ed9i dung thu\u1ed9c ph\u01b0\u01a1ng di\u1ec7n n\u00e0o trong hai ph\u01b0\u01a1ng di\u1ec7n x\u00e1c \u0111\u1ecbnh giai c\u1ea5p c\u00f4ng nh\u00e2n?", "a": "Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "e": {"p": 53, "t": "H\u1ecd ph\u1ea3i b\u00e1n s\u1ee9c lao \u0111\u1ed9ng cho nh\u00e0 t\u01b0 b\u1ea3n v\u00e0 b\u1ecb ch\u1ee7 t\u01b0 b\u1ea3n b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0. \u0110\u1ed1\u00ec di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n, c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0 t\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng.", "a": 1}}, {"q": "\u201cGiai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi tr\u1ef1c ti\u1ebfp ho\u1eb7c gi\u00e1n ti\u1ebfp v\u1eadn h\u00e0nh c\u00e1c c\u00f4ng c\u1ee5 s\u1ea3n xu\u1ea5t c\u00f3 t\u00ednh ch\u1ea5t c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i v\u00e0 x\u00e3 h\u1ed9i h\u00f3a cao\u201d. \u0110\u00e2y l\u00e0 n\u1ed9i dung thu\u1ed9c ph\u01b0\u01a1ng di\u1ec7n n\u00e0o trong hai ph\u01b0\u01a1ng di\u1ec7n x\u00e1c \u0111\u1ecbnh giai c\u1ea5p c\u00f4ng nh\u00e2n?", "a": "Kinh t\u1ebf - x\u00e3 h\u1ed9i", "e": {"p": 52, "t": "L\u00e0 s\u1ea3n ph\u1ea9m v\u00e0 l\u00e0 ch\u1ee7 th\u1ec3 c\u1ee7a n\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng tr\u1ef1c ti\u1ebfp hay gi\u00e1n ti\u1ebfp v\u1eadn h\u00e0nh c\u00e1c c\u00f4ng c\u1ee5 s\u1ea3n xu\u1ea5t c\u00f3 t\u00ednh ch\u1ea5t c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i v\u00e0 x\u00e3 h\u1ed9i h\u00f3a cao. H\u1ecd lao \u0111\u1ed9ng b\u1eb1ng ph\u01b0\u01a1ng th\u1ee9c c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i v\u1edbi nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m n\u1ed5i b\u1eadt:"}}, {"q": "Gia \u0111\u00ecnh l\u00e0 m\u1ed9t h\u00ecnh th\u1ee9c c\u1ed9ng \u0111\u1ed3ng \u0111\u1eb7c bi\u1ec7t, \u1edf \u0111\u00f3 con ng\u01b0\u1eddi chung s\u1ed1ng v\u1edbi nhau b\u1edfi hai m\u1ed1i quan h\u1ec7 c\u01a1 b\u1ea3n l\u00e0", "a": ":Quan h\u1ec7 h\u00f4n nh\u00e2n v\u00e0 quan h\u1ec7 huy\u1ebft th\u1ed1ng", "e": {"p": 239, "t": "C\u01a1 s\u1edf h\u00ecnh th\u00e0nh gia \u0111\u00ecnh l\u00e0 hai m\u1ed1i quan h\u1ec7 c\u01a1 b\u1ea3n, quan h\u1ec7 h\u00f4n nh\u00e2n (v\u1ee3 v\u00e0 ch\u1ed3ng) v\u00e0 quan h\u1ec7 huy\u1ebft th\u1ed1ng (cha m\u1eb9 v\u00e0 con c\u00e1i...). Nh\u1eefng m\u1ed1i quan h\u1ec7 n\u00e0y t\u1ed3n t\u1ea1i trong s\u1ef1 g\u1eafn b\u00f3, li\u00ean k\u1ebft, r\u00e0ng bu\u1ed9c v\u00e0 ph\u1ee5 thu\u1ed9c l\u1eabn nhau, b\u1edfi ngh\u0129a v\u1ee5, quy\u1ec1n l\u1ee3i v\u00e0 tr\u00e1ch nhi\u1ec7m c\u1ee7a m\u1ed7i ng\u01b0\u1eddi, \u0111\u01b0\u1ee3c quy \u0111\u1ecbnh b\u1eb1ng ph\u00e1p l\u00fd ho\u1eb7c \u0111\u1ea1o l\u00fd.", "a": 1}}, {"q": "Gia \u0111\u00ecnh ph\u1ea3i th\u1ef1c hi\u1ec7n ch\u1ee9c n\u0103ng n\u00e0o \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o ngu\u1ed3n sinh s\u1ed1ng, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u v\u1eadt ch\u1ea5t, tinh th\u1ea7n c\u1ee7a c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh?", "a": "Ch\u1ee9c n\u0103ng kinh t\u1ebf, t\u1ed5 ch\u1ee9c ti\u00eau d\u00f9ng", "e": {"p": 247, "t": "Th\u1ef1c hi\u1ec7n ch\u1ee9c n\u0103ng n\u00e0y, gia \u0111\u00ecnh \u0111\u1ea3m b\u1ea3o ngu\u1ed3n sinh s\u1ed1ng, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u v\u1eadt ch\u1ea5t, t\u1ec9nh th\u1ea7n c\u1ee7a c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh. Hi\u1ec7u qu\u1ea3 ho\u1ea1t \u0111\u1ed9ng kinh t\u1ebf c\u1ee7a gia \u0111\u00ecnh quy\u1ebft \u0111\u1ecbnh hi\u1ec7u qu\u1ea3 \u0111\u00f2i s\u1ed1ng v\u1eadt ch\u1ea5t v\u00e0", "a": 1}}, {"q": "Gia \u0111\u00ecnh Vi\u1ec7t Nam hi\u1ec7n nay c\u00f3 s\u1ef1 bi\u1ebfn \u0111\u1ed5i v\u1ec1 quy m\u00f4 nh\u01b0 th\u1ebf n\u00e0o?", "a": "C\u00f3 xu h\u01b0\u1edbng thu nh\u1ecf l\u1ea1i", "e": {"p": 257, "t": "Quy m\u00f4 gia \u0111\u00ecnh ng\u00e0y nay t\u1ed3n t\u1ea1i xu h\u01b0\u1edbng thu nh\u1ecf h\u01a1n so v\u1edbi tr\u01b0\u1edbc kia, s\u1ed1 th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh tr\u1ed3 n\u00ean \u00edt \u0111i. N\u1ebfu nh\u01b0 gia \u0111\u00ecnh truy\u1ec1n th\u00f4ng x\u01b0a c\u00f3 th\u1ec3 t\u1ed3n t\u1ea1i \u0111\u1ebfn ba, b\u1ed1n th\u1ebf h\u1ec7 c\u00f9ng chung s\u1ed1ng d\u01b0\u1edbi m\u1ed9t m\u00e1i nh\u00e0 th\u00ec hi\u1ec7n nay, quy m\u00f4 gia \u0111\u00ecnh hi\u1ec7n \u0111\u1ea1i \u0111\u00e3 ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c thu nh\u1ecf l\u1ea1i."}}, {"q": "Giai c\u1ea5p c\u00f3 s\u1ee9 m\u1ec7nh x\u00f3a b\u1ecf CNTB, x\u00e2y d\u1ef1ng CNXH v\u00e0 CNCS l\u00e0", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 56, "t": "Theo ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin, s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed t\u1ed5ng qu\u00e1t c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 th\u00f4ng qua ch\u00ednh \u0111\u1ea3ng ti\u1ec1n phong, giai c\u1ea5p c\u00f4 \u00f4ng nh\u00e2n qu\u1ed1c t\u1ebf.", "a": 1}}, {"q": "Giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 t\u1eadp \u0111o\u00e0n ng\u01b0\u1eddi lao \u0111\u1ed9ng s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 s\u1ea3n xu\u1ea5t c\u00f3 t\u00ednh", "a": "C\u00f4ng nghi\u1ec7p", "e": {"p": 52, "t": "L\u00e0 s\u1ea3n ph\u1ea9m v\u00e0 l\u00e0 ch\u1ee7 th\u1ec3 c\u1ee7a n\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng tr\u1ef1c ti\u1ebfp hay gi\u00e1n ti\u1ebfp v\u1eadn h\u00e0nh c\u00e1c c\u00f4ng c\u1ee5 s\u1ea3n xu\u1ea5t c\u00f3 t\u00ednh ch\u1ea5t c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i v\u00e0 x\u00e3 h\u1ed9i h\u00f3a cao. H\u1ecd lao \u0111\u1ed9ng b\u1eb1ng ph\u01b0\u01a1ng th\u1ee9c c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i v\u1edbi nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m n\u1ed5i b\u1eadt:", "a": 1}}, {"q": "Giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua con \u0111\u01b0\u1eddng n\u00e0o \u0111\u1ec3 gi\u1ea3i ph\u00f3ng m\u00ecnh v\u00e0 gi\u1ea3i ph\u00f3ng nh\u00e2n d\u00e2n lao \u0111\u1ed9ng?", "a": "B\u00e3i c\u00f4ng", "e": null}, {"q": "Giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua con \u0111\u01b0\u1eddng n\u00e0o \u0111\u1ec3 gi\u1ea3i ph\u00f3ng m\u00ecnh v\u00e0 gi\u1ea3i ph\u00f3ng nh\u00e2n d\u00e2n lao \u0111\u1ed9ng?", "a": "C\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "e": null}, {"q": "Giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam c\u00f3 m\u1ea5y \u0111\u1eb7c \u0111i\u1ec3m ch\u1ee7 y\u1ebfu?", "a": "3", "e": {"p": 84, "t": "Ph\u00e2n t\u00edch \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam v\u00e0 n\u1ed9i dung s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam hi\u1ec7n nay? Ph\u01b0\u01a1ng h\u01b0\u1edbng v\u00e0 gi\u1ea3i ph\u00e1p ch\u1ee7 y\u1ebfu \u0111\u1ec3 x\u00e2y d\u1ef1ng giai c\u1ea5p c\u 1o ra nh\u1eefng ng\u01b0\u1eddi kh\u00e1c, sinh s\u00f4i n\u1ea9y n\u1edf - \u0111\u00f3 l\u00e0 quan h\u1ec7 gi\u1eefa ch\u1ed3ng v\u00e0 v\u1ee3, cha m\u1eb9 v\u00e0 con c\u00e1i, \u0111\u00f3 l\u00e0 gia \u0111\u00ecnh\u201d1.", "a": 1}}, {"q": "\u201cH\u00e3y d\u00f9ng c\u1ea3 hai tay m\u00e0 l\u1ea5y nh\u1eefng c\u00e1i t\u1ed1t c\u1ee7a n\u01b0\u1edbc ngo\u00e0i: Ch\u00ednh quy\u1ec1n X\u00f4 vi\u1ebft + tr\u1eadt t\u1ef1 \u1edf \u0111\u01b0\u1eddng s\u1eaft Ph\u1ed5 + [.........] + ng\u00e0nh gi\u00e1o d\u1ee5c qu\u1ed1c d\u00e2n M\u1ef9\u201d (L\u00eanin)", "a": "K\u1ef9 thu\u1eadt v\u00e0 c\u00e1ch th\u1ee9c t\u1ed5 ch\u1ee9c c\u00e1c T\u01a1 r\u1edbt \u1edf M\u1ef9", "e": {"p": 96, "t": "Ch\u00ednh quy\u1ec1n X\u00f4vi\u1ebft + tr\u1eadt t\u1ef1 \u1edf \u0111\u01b0\u1eddng s\u1eaft Ph\u1ed5 + k\u1ef9 thu\u1eadt v\u00e0 c\u00e1ch t\u1ed5 ch\u1ee9c c\u00e1c t\u01a1 - r\u1ed5t \u1edf M\u1ef9 + ng\u00e0nh gi\u00e1o d\u1ee5c qu\u1ed1c d\u00e2n M\u1ef9 etc. etc.", "a": 1}}, {"q": "H\u1ea1n ch\u1ebf c\u01a1 b\u1ea3n c\u1ee7a c\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng XHCN kh\u00f4ng t\u01b0\u1edfng l\u00e0", "a": "Kh\u00f4ng th\u1ec3 ph\u00e1t hi\u1ec7n ra l\u1ef1c l\u01b0\u1ee3ng x\u00e3 h\u1ed9i ti\u00ean phong th\u1ef1c hi\u1ec7n c\u00e1ch m\u1ea1ng XH", "e": {"p": 15, "t": "kh\u00f4ng ph\u00e1t hi\u1ec7n ra l\u1ef1c l\u01b0\u1ee3ng x\u00e3 h\u1ed9i ti\u00ean phong c\u00f3 th\u1ec3 th\u1ef1c hi\u1ec7n cu\u1ed9c chuy\u1ec3n bi\u1ebfn c\u00e1ch m\u1ea1ng t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n l\u00e0 giai c\u1ea5p c\u00f4ng nh\u00e2n;", "a": 1}}, {"q": "H\u1ea1nh ph\u00fac c\u1ee7a gia \u0111\u00ecnh l\u00e0 c\u01a1 s\u1edf \u0111\u1ec3 x\u00e2y d\u1ef1ng h\u1ea1nh ph\u00fac c\u1ee7a x\u00e3 h\u1ed9i, gia \u0111\u00ecnh t\u1ed3n t\u1ea1i, th\u00ec qu\u1ed1c gia, d\u00e2n t\u1ed9c, th\u1ebf gi\u1edbi m\u1edbi t\u1ed3n t\u1ea1i. Nh\u1eadn \u0111\u1ecbnh tr\u00ean l\u00e0", "a": "\u0110\u00fang", "e": null}, {"q": "H\u00e3y \u0111i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng cho \u0111o\u1ea1n v\u0103n sau \u0111\u00e2y: \u201c[........] l\u00e0 h\u1ec7 th\u1ed1ng c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i t\u1ed3n t\u1ea1i kh\u00e1ch quan v\u00e0 m\u1ed1i quan h\u1ec7 gi\u1eefa ch\u00fang v\u1ec1 s\u1edf h\u1eefu, v\u1ec1 qu\u1ea3n l\u00fd, v\u1ec1 \u0111\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i trong m\u1ed9t h\u1ec7 th\u1ed1ng s\u1ea3n xu\u1ea5t nh\u1ea5t \u0111\u1ecbnh\u201d", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p", "e": {"p": 165, "t": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p l\u00e0 h\u1ec7 th\u1ed1ng c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i t\u1ed3n t\u1ea1i kh\u00e1ch quan trong m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i nh\u1ea5t \u0111\u1ecbnh, th\u00f4ng qua nh\u0169ng m\u00f4\u00ec quan h\u1ec7 v\u1ec1 s\u1ecf h\u0169u t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, v\u1ec1 t\u1ed5 ch\u1ee9c qu\u1ea3n l\u00fd qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t, v\u1ec1 \u0111\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i...", "a": 1}}, {"q": "H\u00e3y x\u00e1c \u0111\u1ecbnh h\u00ecnh th\u1ee9c gia \u0111\u00ecnh sau: t\u1ed3n t\u1ea1i trong x\u00e3 h\u1ed9i nguy\u00ean th\u1ee7y, \u0111\u00f3 l\u00e0 \u201c\u2026 t\u00ecnh tr\u1ea1ng trong \u0111\u00f3 nh\u1eefng ng\u01b0\u1eddi ch\u1ed3ng s\u1ed1ng theo ch\u1ebf \u0111\u1ed9 nhi\u1ec1u v\u1ee3, v\u00e0 v\u1ee3 c\u1ee7a h\u1ecd c\u0169ng s\u1ed1ng theo ch\u1ebf \u0111\u1ed9 nhi\u1ec1u ch\u1ed3ng, v\u00e0 v\u00ec v\u1eady, con c\u00e1i chung \u0111\u1ec1u coi l\u00e0 chung c\u1ee7a c\u1ea3 hai b\u00ean\u201d", "a": "Gia \u0111\u00ecnh t\u1eadp th\u1ec3", "e": null}, {"q": "H\u1ec7 th\u1ed1ng ch\u00ednh tr\u1ecb \u1edf Vi\u1ec7t Nam hi\u1ec7n nay ra \u0111\u1eddi t\u1eeb khi n\u00e0o?", "a": "1945", "e": {"p": 148, "t": "Ch\u00ednh v\u00ec v\u1eady, trong h\u1ec7 th\u1ed1ng ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, \u0110\u1ea3ng ta xem Nh\u00e0 n\u01b0\u1edbc l\u00e0 \u201ctr\u1ee5 c\u1ed9t\u201d, \u201cm\u1ed9t c\u00f4ng c\u1ee5 ch\u1ee7 y\u1ebfu, v\u1eefng m\u1ea1nh\u201d c\u1ee7a nh\u00e2n d\u00e2n trong s\u1ef1 nghi\u1ec7p x\u00e2y d\u1ef1ng v\u00e0 b\u1ea3o v\u1ec7 T\u1ed5 qu\u1ed1c Vi\u1ec7t Nam x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a. III- D\u00c2N CH\u1ee6 X\u00c3 H\u1ed8I CH\u1ee6 NGH\u0128A V\u00c0 NH\u00c0 N\u01af\u1edaC PH\u00c1P QUY\u1ec0N X\u00c3 H\u1ed8I CH\u1ee6 NGH\u0128A \u1edf VI\u1ec6T NAM 1.", "a": 1}}, {"q": "H\u1ec7 th\u1ed1ng XHCN th\u1ebf gi\u1edbi ra \u0111\u1eddi t\u1eeb", "a": "Sau Chi\u1ebfn tranh th\u1ebf gi\u1edbi th\u1ee9 hai 1945", "e": {"p": 30, "t": "Chi\u1ebfn tranh th\u1ebf gi\u1ed1i th\u1ee9 hai (1939 - 1945) do c\u00e1c th\u1ebf l\u1ef1c \u0111\u00ea qu\u1ed1c ph\u1ea3n \u0111\u1ed9ng c\u1ef1c \u0111oan g\u00e2y ra \u0111\u00e3 \u0111\u1ec3 l\u1ea1i h\u1eadu qu\u1ea3 c\u1ef1c k\u1ef3 kh\u1ee7ng khi\u1ebfp cho nh\u00e2n lo\u1ea1i.", "a": 1}}, {"q": "Hi\u1ec7n nay, d\u00e2n s\u1ed1 Vi\u1ec7t Nam \u0111ang chuy\u1ec3n sang giai \u0111o\u1ea1n gi\u00e0 h\u00f3a, \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o l\u1ee3i \u00edch c\u1ee7a gia \u0111\u00ecnh v\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n b\u1ec1n v\u1eefng c\u1ee7a x\u00e3 h\u1ed9i, th\u00f4ng \u0111i\u1ec7p m\u1edbi trong k\u1ebf ho\u1ea1ch gia \u0111\u00ecnh", "a": "M\u1ed7i c\u1eb7p v\u1ee3 ch\u1ed3ng ch\u1ec9 n\u00ean c\u00f3 t\u1eeb 1 \u0111\u1ebfn 2 con", "e": {"p": 259, "t": "\u0110\u1ec3 \u0111\u1ea3m b\u1ea3o l\u1ee3i \u00edch c\u1ee7a gia \u0111\u00ecnh v\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n b\u1ec1n v\u1eefng c\u1ee7a x\u00e3 h\u1ed9i, th\u00f4ng \u0111i\u1ec7p m\u1edbi trong k\u1ebf ho\u1ea1ch h\u00f3a gia \u0111\u00ecnh l\u00e0 m\u1ed7i c\u1eb7p v\u1ee3 ch\u1ed3ng n\u00ean sinh \u0111\u1ee7 hai con.", "a": 1}}, {"q": "H\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a b\u1eaft \u0111\u1ea7u v\u00e0 k\u1ebft th\u00fac khi n\u00e0o?", "a": "B\u1eaft \u0111\u1ea7u t\u1eeb th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 cho \u0111\u1ebfn khi x\u00e2y d\u1ef1ng xong giai \u0111o\u1ea1n cao c\u1ee7a x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n.", "e": null}, {"q": "H\u00ecnh th\u1ee9c \u0111\u1ea5u tranh \u0111\u1ea7u ti\u00ean c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n khi ch\u01b0a gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n l\u00e0?", "a": "\u0110\u1ea5u tranh kinh t\u1ebf", "e": null}, {"q": "H\u00ecnh th\u1ee9c gia \u0111\u00ecnh n\u00e0o \u0111ang tr\u1edf n\u00ean r\u1ea5t ph\u1ed5 bi\u1ebfn \u1edf c\u00e1c \u0111\u00f4 th\u1ecb v\u00e0 c\u1ea3 \u1edf n\u00f4ng th\u00f4n \u2013 thay th\u1ebf cho ki\u1ec3u gia \u0111\u00ecnh truy\u1ec1n th\u1ed1ng t\u1eebng gi\u1eef vai tr\u00f2 ch\u1ee7 \u0111\u1ea1o tr\u01b0\u1edbc \u0111\u00e2y?", "a": "Gia \u0111\u00ecnh h\u1ea1t nh\u00e2n", "e": {"p": 257, "t": "Gia \u0111\u00ecnh \u0111\u01a1n (c\u00f2n g\u1ecdi l\u00e0 gia \u0111\u00ecnh h\u1ea1t nh\u00e2n) \u0111ang tr\u1edf n\u00ean r\u1ea5t ph\u1ed5 bi\u1ebfn \u1edf c\u00e1c \u0111\u00f4 th\u1ecb v\u00e0 c\u1ea3 \u1ecf n\u00f4ng th\u00f4n - thay th\u1ebf cho ki\u1ec3u gia \u0111\u00ecnh truy\u1ec1n th\u1ed1ng t\u1eebng gi\u0169 vai tr\u00f2 ch\u1ee7 \u0111\u1ea1o tr\u01b0\u1edbc \u0111\u00e2y. Quy m\u00f4 gia \u0111\u00ecnh ng\u00e0y nay t\u1ed3n t\u1ea1i xu h\u01b0\u1edbng thu nh\u1ecf h\u01a1n so v\u1edbi tr\u01b0\u1edbc kia, s\u1ed1 th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh tr\u1ed3 n\u00ean \u00edt \u0111i."}}, {"q": "H\u1ecdc thuy\u1ebft c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c- L\u00eanin \u0111\u00e3 l\u00e0m s\u00e1ng t\u1ecf vai tr\u00f2 l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 19, "t": "- H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Tr\u00ean c\u01a1 s\u1edf hai ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i l\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 h\u1ecdc thu g\u1eafn\u201d v\u00e0 \u201cb\u1ecf qua\u201d vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a.", "a": "K", "e": {"p": 110, "t": "Th\u1ee9 hai, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, t\u1ee9c l\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a. Xem \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam:", "a": 1}}, {"q": "Kh\u00e1i ni\u1ec7m \u201cChuy\u00ean ch\u00ednh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n\u201d \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng l\u1ea7n \u0111\u1ea7u ti\u00ean trong t\u00e1c ph\u1ea9m n\u00e0o?", "a": "Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng S\u1ea3n", "e": null}, {"q": "Kh\u00e1i ni\u1ec7m \u201cH\u1ec7 th\u1ed1ng ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a\u201d do t\u1ed5 ch\u1ee9c n\u00e0o sau \u0111\u00e2y n\u00eau ra?", "a": "\u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam.", "e": null}, {"q": "Kh\u00e1i ni\u1ec7m n\u00e0o sau \u0111\u00e2y \u0111\u01b0\u1ee3c d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi \u1ed5n \u0111\u1ecbnh \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh trong l\u1ecbch s\u1eed c\u00f3 l\u00e3nh th\u1ed5 chung, c\u00f3 n\u1ec1n kinh t\u1ebf th\u1ed1ng nh\u1ea5t, c\u00f3 qu\u1ed1c ng\u1eef chung v\u00e0 c\u00f3 truy\u1ec1n th\u1ed1ng v\u0103n h\u00f3a, \u0111\u1ea5u tranh chung trong qu\u00e1 tr\u00ecnh d\u1ef1ng n\u01b0\u1edbc gi\u1eef n\u01b0\u1edbc?", "a": "D\u00e2n t\u1ed9c", "e": {"p": 195, "t": "Theo ngh\u0129a r\u1ed9ng, d\u00e2n t\u1ed9c (Nation) l\u00e0 kh\u00e1i ni\u1ec7m d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng ng\u01b0
