1ee7a x\u00e3 h\u1ed9i t\u01b0 b\u1ea3n, x\u00e3 h\u1ed9i c\u1ee7a b\u1ecdn \u0111\u1ecba ch\u1ee7 v\u00e0 x\u00e3 h\u1ed9i c\u1ee7a b\u1ecdn quan li\u00eau\u201d- C\u00e2u n\u00f3i n\u00e0y c\u1ee7a ai?", "a": "V.I.L\u00eanin", "e": null}, {"q": "V.I.L\u00ea nin chia h\u00ecnh th\u00e1i kinh t\u1ebf-xh CSCN th\u00e0nh m\u1ea5y giai \u0111o\u1ea1n?", "a": "Ba giai \u0111o\u1ea1n: Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH, CNXH v\u00e0 giai \u0111o\u1ea1n cao c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf-XH CSCN", "e": {"p": 87, "t": "\u0102ngghen cho r\u1eb1ng, h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a ph\u00e1t tri\u1ec3n t\u1eeb th\u1ea5p l\u00ean cao qua hai giai \u0111o\u1ea1n, giai \u0111o\u1ea1n th\u1ea5p v\u00e0 giai \u0111o\u1ea1n cao; gi\u1eefa x\u00e3 h\u1ed9i t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u00e0 x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a l\u00e0 th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n.", "a": 1}}, {"q": "V.I.L\u00ea nin cho r\u1eb1ng: t\u1eeb CNTB, nh\u00e2n lo\u1ea1i ch\u1ec9 c\u00f3 th\u1ec3 ti\u1ebfn th\u1eb3ng l\u00ean CNXH\u2026. (1)... v\u00e0 ch\u1ebf \u0111\u1ed9 ph\u1ea5n ph\u1ed1i\u2026(2)... c\u1ee7a m\u1ed7i ng\u01b0\u1eddi\u201d", "a": "(1) T\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t (2) Lao \u0111\u1ed9ng", "e": {"p": 95, "t": "\u201cT\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, nh\u00e2n lo\u1ea1i ch\u1ec9 c\u00f3 th\u1ec3 ti\u1ebfn th\u1eb3ng l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, ngh\u0129a l\u00e0 l\u00ean ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 c\u00e1c t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t v\u00e0 ch\u1ebf \u0111\u1ed9 ph\u00e2n ph\u1ed1i s\u1ea3n ph\u1ea9m theo lao \u0111\u1ed9ng c\u1ee7a m\u1ed7i ng\u01b0\u1eddi\u201d1. Tuy nhi\u00ean, trong giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a, ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, theo Ph.", "a": 1}}, {"q": "V.I.L\u00ea nin cho r\u1eb1ng, giai c\u1ea5p v\u00f4 s\u1ea3n sau khi gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n\u2026. m\u00e0 \u0111i\u1ec1u quan tr\u1ecdng h\u01a1n c\u1ea3", "a": "Ch\u00ednh quy\u1ec1n m\u1edbi t\u1ea1o ra \u0111\u01b0\u1ee3c n\u0103ng su\u1ea5t s\u1ea3n xu\u1ea5t cao h\u01a1n ch\u1ebf \u0111\u1ed9 XH c\u0169, nh\u1edd \u0111\u00f3 mang l\u1ea1i cu\u1ed9c s\u1ed1ng t\u1ed1t \u0111\u1eb9p h\u01a1n cho \u0111\u1ea1i \u0111a s\u1ed1 c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng", "e": {"p": 145, "t": "V.L L\u00eanin cho r\u1eb1ng, giai c\u1ea5p v\u00f4 s\u1ea3n sau khi gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n, x\u00e1c l\u1eadp \u0111\u1ecba v\u1ecb th\u1ed1ng tr\u1ecb cho \u0111\u1ea1i \u0111a s\u1ed1 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng, th\u00ec v\u1ea5n \u0111\u1ec1 quan tr\u1ecdng kh\u00f4ng ch\u1ec9 l\u00e0 tr\u1ea5n \u00e1p l\u1ea1i s\u1ef1 ph\u1ea3n kh\u00e1ng c\u1ee7a giai c\u1ea5p b\u00f3c l\u1ed9t, m\u00e0 \u0111i\u1ec1u quan tr\u1ecdng h\u01a1n c\u1ea3 l\u00e0 ch\u00ednh quy\u1ec1n m\u1ed1i t\u1ea1o ra \u0111\u01b0\u1ee3c n\u0103ng su\u1ea5t s\u1ea3n xu\u1ea5t cao h\u01a1n ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i c\u0169, nh\u1edd \u0111\u00f3 mang l\u1ea1i cu\u1ed9c s\u1ed1ng t\u1ed1t \u0111\u1eb9p h\u01a1n cho \u0111\u1ea1i \u0111a s\u1ed1 c\u1ea5c giai c\u1ea5p,\u2026", "a": 1}}, {"q": "V.I.L\u00ea nin \u0111\u00e3 vi\u1ebft\u201d.... c\u00f3 th\u1ec3 th\u1eafng l\u1ee3i \u1edf m\u1ed9t s\u1ed1 n\u01b0\u1edbc\u2026. tr4ong s\u1ee3i d\u00e2y chuy\u1ec1n TBCN\u201d", "a": "CMVS", "e": {"p": 26, "t": "C\u00e1ch m\u1ea1ng v\u00f4 s\u1ea3n c\u00f3 th\u1ec3 n\u1ed5 ra v\u00e0 th\u1eafng l\u1ee3i \u1edf m\u1ed9t s\u1ed1 n\u01b0\u1edbc, th\u1eadm ch\u00ed \u1edf m\u1ed9t n\u01b0\u1edbc ri\u00eang l\u1ebb, n\u01a1i ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n ch\u01b0a ph\u1ea3i l\u00e0 ph\u00e1t tri\u1ec3n nh\u1ea5t, nh\u01b0ng l\u00e0 kh\u00e2u y\u1ebfu nh\u1ea5t trong s\u1ee3i d\u00e2y chuy\u1ec1n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a;", "a": 1}}, {"q": "V\u1ec1 nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a Nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a Vi\u1ec7t Nam, ph\u1ea1m tr\u00f9 n\u00e0o \u0111\u01b0\u1ee3c \u0111\u1eb7t \u1edf v\u1ecb tr\u00ed t\u1ed1i th\u01b0\u1ee3ng \u0111\u1ec3 \u0111i\u1ec1u ch\u1ec9nh c\u00e1c quan h\u1ec7 x\u00e3 h\u1ed9i trong t\u1ea5t c\u1ea3 c\u00e1c ho\u1ea1t \u0111\u1ed9ng c\u1ee7a x\u00e3 h\u1ed9i?", "a": "Ph\u00e1p lu\u1eadt", "e": {"p": 157, "t": "\u0111\u1ed9ng c\u1ee7a x\u00e3 h\u1ed9i, ph\u00e1p lu\u1eadt \u0111\u01b0\u1ee3c \u0111\u1eb7t \u1edf v\u1ecb tr\u00ed t\u1ed1i th\u01b0\u1ee3ng \u0111\u1ec3 \u0111i\u1ec1u ch\u1ec9nh c\u00e1c quan h\u1ec7 x\u00e3 h\u1ed9i. Th\u1ee9 ba, quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc l\u00e0 th\u00f4ng nh\u1ea5t, c\u00f3 s\u1ef1 ph\u00e2n c\u00f4ng r\u00f5 r\u00e0ng, c\u00f3 c\u01a1 ch\u1ebf ph\u1ed1i h\u1ee3p nh\u1ecbp nh\u00e0ng v\u00e0 ki\u1ec3m so\u00e1t gi\u1eefa c\u00e1c c\u01a1 quan:", "a": 1}}, {"q": "V\u1ec1 ph\u01b0\u01a1ng di\u1ec7n ch\u00ednh tr\u1ecb, \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0", "a": "\u0110\u1ea5u tranh giai c\u1ea5p di\u1ec5n ra trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi \u2013 giai c\u1ea5p c\u00f4ng nh\u00e2n c\u1ea7m quy\u1ec1n, v\u1edbi n\u1ed9i dung m\u1edbi \u2013 x\u00e2y d\u1ef1ng to\u00e0n di\u1ec7n x\u00e3 h\u1ed9i m\u1edbi, tr\u1ecdng t\u00e2m l\u00e0 x\u00e2y d\u1ef1ng nh\u00e0 n\u01b0\u1edbc c\u00f3 t\u00ednh kinh t\u1ebf v\u00e0 trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi \u2013 c\u01a1 b\u1ea3n l\u00e0 h\u00f2a b\u00ecnh t\u1ed5 ch\u1ee9c x\u00e2y d\u1ef1ng", "e": {"p": 107, "t": "Cu\u1ed9c \u0111\u1ea5u tranh di\u1ec5n ra trong \u0111i\u1ec1u ki\u1ec7n m\u1ed1i - giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u00e3 tr\u1edf th\u00e0nh giai c\u1ea5p c\u1ea7m quy\u1ec1n, v\u1ed1i n\u1ed9i dung m\u1edbi - x\u00e2y d\u1ef1ng to\u00e0n di\u1ec7n x\u00e3 h\u1ed9i m\u1edbi, tr\u1ecdng t\u00e2m l\u00e0 x\u00e2y d\u1ef1ng nh\u00e0 n\u01b0\u1edbc c\u00f3 t\u00ednh kinh t\u1ebf, v\u00e0 h\u00ecnh th\u1ee9c m\u1ed1i - c\u01a1 b\u1ea3n l\u00e0 h\u00f2a b\u00ecnh t\u1ed5 ch\u00fac x\u00e2y d\u1ef1ng.", "a": 1}}, {"q": "V\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0", "a": "T\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n", "e": {"p": 106, "t": "a) Tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, t\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1\u00ec l\u1eadp. \u0110\u1ec1 c\u1eadp t\u1edbi \u0111\u1eb7c tr\u01b0ng n\u00e0y, V.I.", "a": 1}}, {"q": "V\u00ec sao d\u00e2n ch\u1ee7 XHCN l\u1ea1i l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 ho\u00e0n thi\u1ec7n nh\u1ea5t?", "a": "V\u00ec n\u00f3 mang b\u1ea3n ch\u1ea5t c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n do \u0110\u1ea3ng C\u1ed9ng s\u1ea3n l\u00e3nh \u0111\u1ea1o nh\u1eb1m ph\u00e1t huy quy\u1ec1n l\u00e0m ch\u1ee7 c\u1ee7a nh\u00e2n d\u00e2n lao \u0111\u1ed9ng tr\u00ean m\u1ecdi l\u0129nh v\u1ef1c c\u1ee7a \u0111\u1eddi s\u1ed1ng x\u00e3 h\u1ed9i", "e": null}, {"q": "V\u00ec sao giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed l\u00e0 x\u00f3a b\u1ecf CNTB, x\u00e2y d\u1ef1ng CNXH v\u00e0 CNCS", "a": "Do \u0111\u1ecba v\u1ecb kinh t\u1ebf- x\u00e3 h\u1ed9i", "e": {"p": 20, "t": "- Giai c\u1ea5p c\u00f4ng nh\u00e2n, do c\u00f3 \u0111\u1ecba v\u1ecb kinh t\u1ebf - x\u00e3 h\u1ed9i \u0111\u1ea1i di\u1ec7n cho l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn, c\u00f3 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed", "a": 1}}, {"q": "V\u00ec sao giai c\u1ea5p n\u00f4ng d\u00e2n kh\u00f4ng ph\u1ea3i l\u00e0 l\u1ef1c l\u01b0\u1ee3ng l\u00e3nh \u0111\u1ea1o c\u00e1ch m\u1ea1ng XHCN?", "a": "H\u1ecd kh\u00f4ng \u0111\u1ea1i di\u1ec7n cho ph\u01b0\u01a1ng th\u1ee9c SX ti\u1ebfn ti\u1ebfn", "e": null}, {"q": "Vi\u1ec7c th\u1ef1c hi\u1ec7n quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft trong c\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c c\u1ee7a L\u00eanin ph\u1ea3i \u0111\u1ee9ng v\u1eefng tr\u00ean l\u1eadp tr\u01b0\u1eddng c\u1ee7a giai c\u1ea5p n\u00e0o?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 204, "t": "Tuy nhi\u00ean, vi\u1ec7c th\u1ef1c hi\u1ec7n quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft ph\u1ea3i xu\u1ea5t ph\u00e1t t\u1eeb th\u1ef1c ti\u1ec5n - c\u1ee5 th\u1ec3 v\u00e0 ph\u1ea3i \u0111\u1ee9ng v\u1eefng tr\u00ean l\u1eadp tr\u01b0\u1eddng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, \u0111\u1ea3m b\u1ea3o s\u1ef1 th\u1ed1ng nh\u1ea5t gi\u1eefa l\u1ee3i \u00edch d\u00e2n t\u1ed9c v\u00e0 l\u1ee3i \u00edch c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n.", "a": 1}}, {"q": "Vi\u1ec7t Nam c\u00f3 bao nhi\u00eau t\u00f4n gi\u00e1o \u0111\u01b0\u1ee3c c\u00f4ng nh\u1eadn t\u01b0 c\u00e1ch ph\u00e1p nh\u00e2n? Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang?", "a": "16", "e": {"p": 222, "t": "N\u01b0\u1edbc ta hi\u1ec7n nay c\u00f3 43 t\u1ed5 ch\u1ee9c thu\u1ed9c 16 t\u00f4n gi\u00e1o \u0111\u00e3 \u0111\u01b0\u1ee3c c\u00f4ng nh\u1eadn v\u00e0 c\u1ea5p \u0111\u0103ng k\u00fd ho\u1ea1t \u0111\u1ed9ng v\u1edbi kho\u1ea3ng 57.000 ch\u1ee9c s\u1eafc, 157.000 ch\u1ee9c vi\u1ec7c v\u00e0 h\u01a1n 29.000 c\u01a1 s\u1edf th\u00f2 t\u1ef1 1. C\u00e1c t\u1ed5 ch\u1ee9c t\u00f4n gi\u00e1o c\u00f3 nhi\u1ec1u h\u00ecnh th\u1ee9c t\u1ed3n t\u1ea1i kh\u00e1c nhau.", "a": 1}}, {"q": "V\u00f4 s\u1ea3n t\u1ea5t c\u1ea3 c\u00e1c n\u01b0\u1edbc v\u00e0 c\u00e1c d\u00e2n t\u1ed9c b\u1ecb \u00e1p b\u1ee9c, \u0111o\u00e0n k\u1ebft l\u1ea1i\u201d l\u00e0 c\u1ee7a ai?", "a": "V. I L\u00eanin", "e": {"p": 30, "t": "Ng\u01b0\u1eddi k\u00eau g\u1ecdi \u201cV\u00f4 s\u1ea3n t\u1ea5 t c\u1ea3 c\u00e1c n\u01b0\u1edbc v\u00e0 c\u00e1c d\u00e2n t\u1ed9c b\u1ecb \u00e1p b\u1ee9c, \u0111o\u00e0n k\u1ebft l\u1ea1i!\u201d1... C\u00f9ng v\u1edbi nh\u1eefng c\u1ed1ng hi\u1ebfn h\u1ebft s\u1ee9c to l\u1edbn v\u1ec1 l\u00fd lu\u1eadn v\u00e0 ch\u1ec9 \u0111\u1ea1o th\u1ef1c ti\u1ec5n c\u00e1ch m\u1ea1ng, V.I.", "a": 1}}, {"q": "V\u1edbi 2 ph\u00e1t ki\u1ebfn n\u00e0y C.M\u00e1c v\u00e0 Ph.\u0102ngghen \u0111\u00e3 \u0111\u01b0a CNXH t\u1eeb kh\u00f4ng t\u01b0\u1edfng tr\u1edf th\u00e0nh khoa h\u1ecdc?", "a": "H\u1ecdc thuy\u1ebft v\u1ec1 Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed - H\u1ecdc thuy\u1ebft gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0", "e": {"p": 18, "t": "\u0102ngghen l\u00e0 s\u1ef1 kh\u1eb3ng \u0111\u1ecbnh v\u1ec1 m\u1eb7t tri\u1ebft h\u1ecdc s\u1ef1 s\u1ee5p \u0111\u1ed5 c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 s\u1ef1 th\u1eafng l\u1ee3i c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u0111\u1ec1u t\u1ea5t y\u1ebfu nh\u01b0 nhau. - H\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0 T\u1eeb vi\u1ec7c ph\u00e1t hi\u1ec7n ra ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed, c.", "a": 1}}, {"q": "V\u1edbi C. M\u00e1c t\u1eeb cu\u1ed1i n\u0103m 1843 \u0111\u1ebfn 4/1944 th\u00f4ng qua t\u00e1c ph\u1ea9m \u201c g\u00f3p ph\u1ea7n ph\u00ea ph\u00e1n tri\u1ebft h\u1ecdc Ph\u00e1p Quy\u1ec1n c\u1ee7a Heeghen-L\u1eddi n\u00f3i \u0111\u1ea7u (1844)\u201d \u0111\u00e3 th\u1ec3 hi\u1ec7n r\u00f5 s\u1ef1 chuy\u1ec3n bi\u1ebfn?", "a": "T\u1eeb th\u1ebf gi\u1edbi quan duy t\u00e2m sang th\u1ebf gi\u1edbi quan duy v\u1eadt. T\u1eeb l\u1eadp tr\u01b0\u1eddng d\u00e2n ch\u1ee7 c\u00e1ch m\u1ea1ng sang l\u1eadp tr\u01b0\u1eddng CSCN", "e": {"p": 17, "t": "M\u00e1c, t\u1eeb cu\u1ed1i n\u0103m 1843 \u0111\u1ebfn th\u00e1ng Gi\u00eang n\u0103m 1844, th\u00f4ng qua t\u00e1c ph\u1ea9m G\u00f3p ph\u1ea7n ph\u00ea ph\u00e1n tri\u1ebft h\u1ecdc ph\u00e1p quy\u1ec1n c\u1ee7a H\u00eaghen - L\u1eddi n\u00f3i \u0111\u1ea7u (1844), \u00f4ng \u0111\u00e3 chuy\u1ec3n t\u1eeb th\u1ebf gi\u00f3i quan duy t\u00e2m sang th\u1ebf gi\u1edbi quan duy v\u1eadt, t\u1eeb l\u1eadp tr\u01b0\u1eddng d\u00e2n ch\u1ee7 c\u00e1ch m\u1ea1ng sang l\u1eadp tr\u01b0\u1eddng c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a.", "a": 1}}, {"q": "V\u1edbi ch\u1ee9c n\u0103ng ch\u00ednh tr\u1ecb, gia \u0111\u00ecnh", "a": "L\u00e0 c\u1ea7u n\u1ed1i c\u1ee7a m\u1ed1i quan h\u1ec7 gi\u1eefa nh\u00e0 n\u01b0\u1edbc v\u1edbi c\u00f4ng d\u00e2n", "e": {"p": 249, "t": "Gia \u0111\u00ecnh l\u00e0 c\u1ea7u n\u00f4i c\u1ee7a m\u1ed1i quan h\u1ec7 gi\u0169a nh\u00e0 n\u01b0\u1edbc v\u1ed1i c\u00f4ng d\u00e2n. II- C\u01a1 S\u1ede X\u00c2Y D\u1ee4NG GIA \u0110\u00ccNH TRONG TH\u1edcI K\u1ef2 QU\u00c1 \u0110\u1ed8 L\u00caN CH\u1ee6 NGH\u0128A X\u00c3 H\u1ed8I 1.", "a": 1}}, {"q": "V\u1edbi ch\u1ee9c n\u0103ng kinh t\u1ebf, gia \u0111\u00ecnh ph\u00e2n bi\u1ec7t v\u1edbi c\u00e1c \u0111\u01a1n v\u1ecb kinh t\u1ebf kh\u00e1c \u1edf \u0111i\u1ec3m n\u00e0o?", "a": "Tham gia v\u00e0o qu\u00e1 tr\u00ecnh t\u00e1i s\u1ea3n xu\u1ea5t ra s\u1ee9c lao \u0111\u1ed9ng", "e": {"p": 247, "t": "Tuy nhi\u00ean, \u0111\u1eb7c th\u00f9 c\u1ee7a gia \u0111\u00ecnh m\u00e0 c\u00e1c \u0111\u01a1n v\u1ecb kinh t\u1ebf kh\u00e1c kh\u00f4ng c\u00f3 \u0111\u01b0\u1ee3c l\u00e0 \u1ecf ch\u1ed7, gia \u0111\u00ecnh l\u00e0 \u0111\u01a1n v\u1ecb duy nh\u1ea5t tham gia v\u00e0o qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra s\u1ee9c lao \u0111\u1ed9ng cho x\u00e3 h\u1ed9i. Gia \u0111\u00ecnh kh\u00f4ng ch\u1ec9 tham gia tr\u1ef1c ti\u1ebfp v\u00e0o s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t v\u00e0 s\u1ee9c lao \u0111\u1ed9ng, m\u00e0 c\u00f2n l\u00e0 m\u1ed9t \u0111\u01a1n v\u1ecb ti\u00eau d\u00f9ng trong x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "V\u1edbi ch\u1ee9c n\u0103ng n\u00e0o, gia \u0111\u00ecnh g\u00f3p ph\u1ea7n to l\u1edbn v\u00e0o vi\u1ec7c \u0111\u00e0o t\u1ea1o th\u1ebf h\u1ec7 tr\u1ebb, th\u1ebf h\u1ec7 t\u01b0\u01a1ng lai c\u1ee7a x\u00e3 h\u1ed9i, cung c\u1ea5p v\u00e0 n\u00e2ng cao ch\u1ea5t l\u01b0\u1ee3ng ngu\u1ed3n lao \u0111\u1ed9ng \u0111\u1ec3 duy tr\u00ec s\u1ef1 tr\u01b0\u1eddng t\u1ed3n c\u1ee7a x\u00e3 h\u1ed9i, \u0111\u1ed3ng th\u1eddi m\u1ed7i c\u00e1 nh\u00e2n t\u1eebng b\u01b0\u1edbc \u0111\u01b0\u1ee3c x\u00e3 h\u1ed9i h\u00f3a?", "a": "Ch\u1ee9c n\u0103ng nu\u00f4i d\u01b0\u1ee1ng, gi\u00e1o d\u1ee5c", "e": {"p": 246, "t": "V\u1edbi ch\u1ee9c n\u0103ng n\u00e0y, gia \u0111\u00ecnh g\u00f3p ph\u1ea7n to l\u1edbn v\u00e0o vi\u1ec7c \u0111\u00e0o t\u1ea1o th\u1ebf h\u1ec7 tr\u1ebb, th\u1ebf h\u1ec7 t\u01b0\u01a1ng lai c\u1ee7a x\u00e3 h\u1ed9i, cung c\u1ea5p v\u00e0 n\u00e2ng cao ch\u1ea5t l\u01b0\u1ee3ng ngu\u1ed3n lao \u0111\u1ed9ng \u0111\u1ec3 duy tr\u00ec s\u1ef1 tr\u01b0\u1eddng t\u1ed3n c\u1ee7a x\u00e3 h\u1ed9i, \u0111\u1ed3ng th\u1eddi m\u1ed7i c\u00e1 nh\u00e2n t\u1eebng b\u01b0\u1edbc \u0111\u01b0\u1ee3c x\u00e3 h\u1ed9i h\u00f3a."}}, {"q": "V\u1edbi d\u1ef1 b\u00e1o khoa h\u1ecdc cu\u1ea3 ch\u1ee7 ngh\u0129a M\u00e1c-Leenin, khi \u0111\u1ebfn m\u1ed9t giai \u0111o\u1ea1n m\u00e0 x\u00e3 h\u1ed9i kh\u00f4ng c\u00f2n giai c\u1ea5p, kh\u00f4ng c\u00f2n \u0111\u1ea5u tranh giai c\u1ea5p th\u00ec", "a": "Nh\u00e0 n\u01b0\u1edbc t\u1ef1 ti\u00eau vong", "e": null}, {"q": "V\u1edbi Ph. \u0102ngghen t\u1eeb n\u0103m 1843, t\u00e1c ph\u1ea9m \u201cT\u00ecnh c\u1ea3nh n\u01b0\u1edbc Anh\u201d: \u201cL\u01b0\u1ee3c kh\u1ea3o khoa Kinh t\u1ebf-Ch\u00ednh tr\u1ecb\u201d \u0111\u00e3 th\u1ec3 hi\u1ec7n r\u00f5 s\u1ef1 chuy\u1ec3n bi\u1ebfn?", "a": "T\u1eeb th\u1ebf gi\u1edbi quan duy t\u00e2m sang th\u1ebf gi\u1edbi quan duy v\u1eadt. T\u1eeb l\u1eadp tr\u01b0\u1eddng d\u00e2n ch\u1ee7 c\u00e1ch m\u1ea1ng sang l\u1eadp tr\u01b0\u1eddng CSCN", "e": {"p": 17, "t": "L\u01b0\u1ee3c kh\u1ea3o khoa kinh t\u1ebf - ch\u00ednh tr\u1ecb, \u00f4ng \u0111\u00e3 chuy\u1ec3n t\u1eeb th\u1ebf gi\u1edbi quan duy t\u00e2m sang th\u1ebf gi\u00f3i quan duy v\u1eadt, t\u1eeb l\u1eadp tr\u01b0\u1eddng d\u00e2n ch\u1ee7 c\u00e1ch m\u1ea1ng sang l\u1eadp tr\u01b0\u1eddng c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a. Ch\u1ec9 trong m\u1ed9t th\u1eddi gian ng\u1eafn (1843 - 1848), v\u1eeba ho\u1ea1t \u0111\u1ed9ng th\u1ef1c ti\u1ec5n, v\u1eeba nghi\u00ean c\u1ee9u khoa h\u1ecdc, c.", "a": 1}}, {"q": "V\u1edbi ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i n\u00e0o, C.M\u00e1c v\u00e0 Ph. \u0102ngghen \u0111\u00e3 lu\u1eadn gi\u1ea3i khoa h\u1ecdc v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n?", "a": "Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 H\u1ecdc thuy\u1ebft gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0", "e": {"p": 19, "t": "- H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Tr\u00ean c\u01a1 s\u1edf hai ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i l\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 h\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0, c. \u0102ngghen \u0111\u00e3 c\u00f3 ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i th\u1ee9 ba - ph\u00e1t hi\u1ec7n ra s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p c\u00f3 s\u1ee9 m\u1ec7nh th\u1ee7 ti\u00eau ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng\u2026"}}, {"q": "V\u1edbi t\u01b0 c\u00e1ch l\u00e0 1 h\u00ecnh th\u00e1i nh\u00e0 n\u01b0\u1edbc, 1 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb th\u00ec trong l\u1ecbch s\u1eed nh\u00e2n lo\u1ea1i, cho \u0111\u1ebfn nay c\u00f3 bao nhi\u00eau n\u1ec1n ( ch\u1ebf \u0111\u1ed9) d\u00e2n ch\u1ee7?", "a": "3", "e": {"p": 131, "t": "Nh\u01b0 v\u1eady, v\u1edbi t\u01b0 c\u00e1ch l\u00e0 m\u1ed9t h\u00ecnh th\u00e1i nh\u00e0 n\u01b0\u1edbc, m\u1ed9t ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb trong l\u1ecbch s\u1eed nh\u00e2n lo\u1ea1i, cho \u0111\u1ebfn nay c\u00f3 ba n\u1ec1n (ch\u1ebf \u0111\u1ed9) d\u00e2n ch\u1ee7: N\u1ec1n d\u00e2n ch\u1ee7 ch\u1ee7 n\u00f4, g\u1eafn v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7;", "a": 1}}, {"q": "\u201cX\u00e2y d\u1ef1ng kh\u1ed1i li\u00ean minh \u0111\u1ec3 c\u00e1c l\u1ef1c l\u01b0\u1ee3ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng c\u00f9ng nhau x\u00e2y m\u1ed9t n\u1ec1n v\u0103n h\u00f3a ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c, \u0111\u1ed3ng th\u1eddi ti\u1ebfp thu nh\u1eefng tinh hoa, gi\u00e1 tr\u1ecb v\u0103n h\u00f3a c\u1ee7a nh\u00e2n lo\u1ea1i v\u00e0 th\u1eddi \u0111\u1ea1i\u201d l\u00e0 n\u1ed9i dung n\u00e0o c\u1ee7a li\u00ean minh giai c\u1ea5p, t\u1ea7ng l\u1edbp trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i?", "a": "N\u1ed9i dung v\u0103n h\u00f3a \u2013 x\u00e3 h\u1ed9i", "e": {"p": 185, "t": "T\u1ed5 ch\u1ee9c li\u00ean minh \u0111\u1ec3 c\u00e1c l\u1ef1c l\u01b0\u1ee3ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng c\u00f9ng nhau x\u00e2y d\u1ef1ng n\u1ec1n v\u0103n h\u00f3a Vi\u1ec7t Nam ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c, \u0111\u1ed3ng th\u1eddi ti\u1ebfp thu nh\u1eefng tinh hoa, gi\u00e1 tr\u1ecb v\u0103n h\u00f3a c\u1ee7a nh\u00e2n lo\u1ea1i v\u00e0 th\u1eddi \u0111\u1ea1i. \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam:"}}, {"q": "X\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a m\u00e0 nh\u00e2n d\u00e2n ta x\u00e2y d\u1ef1ng c\u00f3 m\u1ea5y \u0111\u1eb7c tr\u01b0ng?", "a": "8", "e": {"p": 113, "t": "(b\u1ed5 sung, ph\u00e1t tri\u1ec3n n\u0103m 201\u00cf) \u0111\u00e3 ph\u00e1t tri\u1ec3n m\u00f4 h\u00ecnh ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i Vi\u1ec7t Nam v\u1edbi t\u00e1m \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n1, trong \u0111\u00f3 c\u00f3 \u0111\u1eb7c tr\u01b0ng v\u1ec1 m\u1ee5c ti\u00eau, b\u1ea3n ch\u1ea5t, n\u1ed9i dung c\u1ee7a x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a m\u00e0 nh\u00e2n d\u00e2n ta x\u00e2y d\u1ef1ng, \u0111\u00f3 l\u00e0: - D\u00e2n gi\u00e0u, n\u01b0\u1edbc m\u1ea1nh, d\u00e2n ch\u1ee7, c\u00f4ng b\u1eb1ng, v\u0103n minh.", "a": 1}}, {"q": "X\u00e3 h\u1ed9i c\u00f3 giai c\u1ea5p, x\u00e9t v\u1ec1 m\u1eb7t k\u1ebft c\u1ea5u th\u00ec", "a": "Bao gi\u1edd c\u0169ng c\u00f3 nh\u1eefng giai c\u1ea5p c\u01a1 c\u1ea3n v\u00e0 giai c\u1ea5p kh\u00f4ng c\u01a1 b\u1ea3n", "e": null}, {"q": "X\u00e2y d\u1ef1ng \u0111\u1ea3ng trong s\u1ea1ch, v\u1eefng m\u1ea1nh, n\u00e2ng cao n\u0103ng l\u1ef1c l\u00e3nh \u0111\u1ea1o, t\u0103ng c\u01b0\u1eddng b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 t\u00ednh ti\u00ean phong, s\u1ee9c chi\u1ebfn \u0111\u1ea5u, ph\u00e1t huy truy\u1ec1n th\u1ed1ng \u0111o\u00e0n k\u1ebft, th\u1ed1ng nh\u1ea5t c\u1ee7a \u0110\u1ea3ng\u201d. \u0110\u01b0\u1ee3c ghi \u1edf V\u0103n ki\u1ec7n n\u00e0o \u0110\u1ea1i h\u1ed9i n\u00e0o c\u1ee7a \u0110\u1ea3ng?", "a": "\u0110\u1ea1i h\u1ed9i XII", "e": {"p": 185, "t": "\u201cX\u00e2y d\u1ef1ng \u0110\u1ea3ng trong s\u1ea1ch, v\u1eefng m\u1ea1nh, n\u00e2ng cao n\u0103ng l\u1ef1c l\u00e3nh \u0111\u1ea1o, t\u0103ng c\u01b0\u1eddng b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 t\u00ednh ti\u00ean phong, s\u1ee9c chi\u1ebfn \u0111\u1ea5u, ph\u00e1t huy truy\u1ec1n th\u1ed1ng \u0111o\u00e0n k\u1ebft, th\u1ed1ng nh\u1ea5t c\u1ee7a \u0110\u1ea3ng...\u201d2.", "a": 1}}, {"q": "X\u00e2y d\u1ef1ng kh\u1ed1i li\u00ean minh \u0111\u1ec3 c\u00e1c l\u1ef1c l\u01b0\u1ee3ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng\u2026. t\u1ea7ng l\u1edbp trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH", "a": "N\u1ed9i dung v\u0103n h\u00f3a", "e": {"p": 185, "t": "T\u1ed5 ch\u1ee9c li\u00ean minh \u0111\u1ec3 c\u00e1c l\u1ef1c l\u01b0\u1ee3ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng c\u00f9ng nhau x\u00e2y d\u1ef1ng n\u1ec1n v\u0103n h\u00f3a Vi\u1ec7t Nam ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c, \u0111\u1ed3ng th\u1eddi ti\u1ebfp thu nh\u1eefng tinh hoa, gi\u00e1 tr\u1ecb v\u0103n h\u00f3a c\u1ee7a nh\u00e2n lo\u1ea1i v\u00e0 th\u1eddi \u0111\u1ea1i. \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam:", "a": 1}}, {"q": "X\u00e2y d\u1ef1ng nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n XHCN c\u1ee7a d\u00e2n, do d\u00e2n, v\u00ec d\u00e2n \u1edf n\u01b0\u1edbc ta hi\u1ec7n nay c\u1ea7n", "a": "C\u1ea3 A,B,C: T\u0103ng c\u01b0\u1eddng s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng, D\u00e2n ch\u1ee7 h\u00f3a t\u1ed5 ch\u1ee9c v\u00e0 ho\u1ea1t \u0111\u1ed9ng c\u1ee7a b\u1ed9 m\u00e1y nh\u00e0 n\u01b0\u1edbc, x\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng ph\u00e1p lu\u1eadt ho\u00e0n ch\u1ec9nh", "e": null}, {"q": "X\u00e9t trong quan h\u1ec7 s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0", "a": "Giai c\u1ea5p kh\u00f4ng c\u00f3 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, \u0111i l\u00e0m thu\u00ea cho nh\u00e0 t\u01b0 b\u1ea3n, b\u1ecb nh\u00e0 t\u01b0 b\u1ea3n b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0", "e": {"p": 53, "t": "\u0102ngghen ch\u1ec9 r\u00f5, \u0111\u00f3 l\u00e0 giai c\u1ea5p c\u1ee7a nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng kh\u00f4ng c\u00f3 s\u1ecf h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i. H\u1ecd ph\u1ea3i b\u00e1n s\u1ee9c lao \u0111\u1ed9ng cho nh\u00e0 t\u01b0 b\u1ea3n v\u00e0 b\u1ecb ch\u1ee7 t\u01b0 b\u1ea3n b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0.", "a": 1}}, {"q": "X\u00e9t trong quan h\u1ec7 s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u0111\u1ecba v\u1ecb c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh", "a": "\u0111\u1ea1i di\u1ec7n cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn.B. Kh\u00f4ng s\u1edf h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i", "e": null}, {"q": "X\u00e9t v\u1ec1 b\u1ea3n ch\u1ea5t ch\u00ednh tr\u1ecb, \u0111\u00e2u l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 v\u1eeba c\u00f3 b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, v\u1eeba c\u00f3 t\u00ednh nh\u00e2n d\u00e2n r\u1ed9ng r\u00e3i, t\u00ednh d\u00e2n t\u1ed9c s\u00e2u s\u1eafc?", "a": "D\u00e2n ch\u1ee7 XHCN", "e": {"p": 137, "t": "X\u00e9t v\u1ec1 b\u1ea3n ch\u1ea5t ch\u00ednh tr\u1ecb, d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a v\u1eeba c\u00f3 b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, v\u1eeba c\u00f3 t\u00ednh nh\u00e2n d\u00e2n r\u1ed9ng r\u00e3i, t\u00ednh d\u00e2n t\u1ed9c s\u00e2u s\u1eafc. Do v\u1eady, n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a kh\u00e1c v\u1ec1 ch\u1ea5t so v\u00f3i n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n \u1edf b\u1ea3n ch\u1ea5t giai c\u1ea5p (giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 giai c\u1ea5p t\u01b0 s\u1ea3n);", "a": 1}}, {"q": "X\u00e9t v\u1ec1 ch\u00ednh trijb, t\u00ednh \u01b0u vi\u1ec7t v\u1ec1 m\u1eb7t b\u1ea3n ch\u1ea5t c\u1ee7a nh\u00e0 n\u01b0\u1edbc XHCN \u0111\u01b0\u1ee3c th\u1ec3 hi\u1ec7n nh\u01b0 th\u1ebf n\u00e0o?", "a": "Nh\u00e0 n\u01b0\u1edbc XHCN mang b\u1ea3n ch\u1ea5t c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p c\u00f3 l\u1ee3i \u00edch ph\u00f9 h\u1ee3p v\u1edbi l\u1ee3i \u00edch chung c\u1ee7a qu\u1ea7n ch\u00fang nh\u00e2n d\u00e2n lao \u0111\u1ed9ng", "e": {"p": 142, "t": "v \u1ec1 ch\u00ednh tr\u1ecb, nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a mang b\u1ea3n ch\u1ea5t c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p c\u00f3 l\u1ee3i \u00edch ph\u00f9 h\u1ee3p v\u1edbi l\u1ee3i \u00edch chung c\u1ee7a qu\u1ea7n ch\u00fang nh\u00e2n d\u00e2n lao \u0111\u1ed9ng. Trong x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, giai c\u1ea5p v\u00f4 s\u1ea3n l\u00e0 l\u1ef1c l\u01b0\u1ee3ng gi\u1eef \u0111\u1ecba v\u1ecb th\u1ed1ng tr\u1ecb v\u1ec1 ch\u00ednh tr\u1ecb.", "a": 1}}, {"q": "X\u00e9t v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n t\u1ed5 ch\u1ee9c qu\u1ea3n l\u00fd x\u00e3 h\u1ed9i (theo quan \u0111i\u1ec3m c\u1ee7a CN M\u00e1c Leenin th\u00ec d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0)", "a": "Nguy\u00ean t\u1eafc d\u00e2n ch\u1ee7", "e": {"p": 126, "t": "Th\u1ee9 ba, tr\u00ean ph\u01b0\u01a1ng di\u1ec7n t\u1ed5 ch\u1ee9c v\u00e0 qu\u1ea3n l\u00fd x\u00e3 h\u1ed9i, d\u00e2n ch\u1ee7 l\u00e0 m\u1ed9t nguy\u00ean t\u1eafc - nguy\u00ean t\u1eafc d\u00e2n ch\u1ee7. Nguy\u00ean t\u1eafc n\u00e0y k\u1ebft h\u1ee3p v\u1edbi nguy\u00ean t\u1eafc t\u1eadp trung \u0111\u1ec3 h\u00ecnh th\u00e0nh nguy\u00ean t\u1eafc t\u1eadp trung d\u00e2n ch\u1ee7 trong t\u1ed5 ch\u1ee9c v\u00e0 qu\u1ea3n l\u00fd x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "X\u00e9t v\u1ec1 c\u01a1 c\u1ea5u s\u1edf h\u1eefu v\u00e0 th\u00e0nh ph\u1ea7n kinh t\u1ebf, \u1edf Vi\u1ec7t Nam, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0", "a": "N\u1ec1n kinh t\u1ebf trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 c\u00f2n nhi\u1ec1u h\u00ecnh th\u1ee9c s\u1edf h\u1eefu, nhi\u1ec1u th\u00e0nh ph\u1ea7n kinh t\u1ebf, trong \u0111\u00f3, s\u1edf h\u1eefu v\u00e0 th\u00e0nh ph\u1ea7n kinh t\u1ebf t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a kh\u00f4ng chi\u1ebfm vai tr\u00f2 ch\u1ee7 \u0111\u1ea1o", "e": null}, {"q": "X\u00e9t v\u1ec1 h\u00ecnh th\u1ee9c ph\u00e2n ph\u1ed1i, \u1edf Vi\u1ec7t Nam, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0", "a": "C\u00f3 nhi\u1ec1u h\u00ecnh th\u1ee9c ph\u00e2n ph\u1ed1i nh\u01b0ng ph\u00e2n ph\u1ed1i theo lao \u0111\u1ed9ng l\u00e0 ch\u1ee7 \u0111\u1ea1o", "e": {"p": 110, "t": "Th\u1ee9 hai, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, t\u1ee9c l\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a. Xem \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam:", "a": 1}}, {"q": "X\u00e9t v\u1ec1 ph\u01b0\u01a1ng th\u1ee9c lao \u0111\u1ed9ng, ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t, giai c\u1ea5p c\u00f4ng nh\u00e2n mang thu\u1ed9c t\u00ednh c\u01a1 b\u1ea3n n\u00e0o?", "a": "L\u00e0 giai c\u1ea5p tr\u1ef1c ti\u1ebfp v\u1eadn h\u00e0nh m\u00e1y m\u00f3c c\u00f3 t\u00ednh ch\u1ea5t c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i", "e": {"p": 52, "t": "L\u00e0 s\u1ea3n ph\u1ea9m v\u00e0 l\u00e0 ch\u1ee7 th\u1ec3 c\u1ee7a n\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng tr\u1ef1c ti\u1ebfp hay gi\u00e1n ti\u1ebfp v\u1eadn h\u00e0nh c\u00e1c c\u00f4ng c\u1ee5 s\u1ea3n xu\u1ea5t c\u00f3 t\u00ednh ch\u1ea5t c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i v\u00e0 x\u00e3 h\u1ed9i h\u00f3a cao. H\u1ecd lao \u0111\u1ed9ng b\u1eb1ng ph\u01b0\u01a1ng th\u1ee9c c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i v\u1edbi nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m n\u1ed5i b\u1eadt:", "a": 1}}, {"q": "X\u00e9t v\u1ec1 quan h\u1ec7 b\u00f3c l\u1ed9t, \u1edf Vi\u1ec7t Nam, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0", "a": "V\u1eabn c\u00f2n quan h\u1ec7 b\u00f3c l\u1ed9t v\u00e0 b\u1ecb b\u00f3c l\u1ed9t, song quan h\u1ec7 b\u00f3c l\u1ed9t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a kh\u00f4ng gi\u1eef vai tr\u00f2 th\u1ed1ng tr\u1ecb", "e": {"p": 110, "t": "Th\u1ee9 hai, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, t\u1ee9c l\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a. Xem \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam:", "a": 1}}, {"q": "Xu h\u01b0\u1edbng c\u00e1c d\u00e2n t\u1ed9c x\u00edch l\u1ea1i xu\u1ea5t hi\u1ec7n trong giai \u0111o\u1ea1n n\u00e0o?", "a": "ch\u1ee7 ngh\u0129a \u0111\u1ebf qu\u1ed1c", "e": {"p": 201, "t": "do s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t, c\u1ee7a khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7, c\u1ee7a giao l\u01b0u kinh t\u1ebf v\u00e0 v\u0103n h\u00f3a trong x\u00e3 h\u1ed9i t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u00e3 l\u00e0m xu\u1ea5t hi\u1ec7n nhu c\u1ea7u x\u00f3a b\u1ecf h\u00e0ng r\u00e0o ng\u0103n c\u00e1ch gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c, th\u00fac \u0111\u1ea9y c\u00e1c d\u00e2n t\u1ed9c x\u00edch l\u1ea1i g\u1ea7n nhau.", "a": 1}}, {"q": "Xu h\u01b0\u1edbng ph\u00e1t tri\u1ec3n c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p \u1edf Vi\u1ec7t Nam trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 mang t\u00ednh \u0111a d\u1ea1ng v\u00e0 th\u1ed1ng nh\u1ea5t ch\u1ee7 y\u1ebfu do y\u1ebfu t\u1ed1 n\u00e0o quy\u1ebft \u0111\u1ecbnh?", "a": "Do n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n", "e": null}, {"q": "Xu h\u01b0\u1edbng t\u1ea5t y\u1ebfu v\u00e0 l\u00e0 bi\u1ec7n ch\u1ee9ng c\u1ee7a s\u1ef1 v\u1eadn \u0111\u1ed9ng, ph\u00e1t tri\u1ec3n c\u01a1 x\u00e3 h\u1ed9i-giai c\u1ea5p trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH l\u00e0", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i-giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i trong m\u1ed1i quan h\u1ec7 v\u1eeba \u0111\u1ea5u tranh, v\u1eeba li\u00ean minh d\u1eabn \u0111\u1ebfn s\u1ef1 x\u00edch l\u1ea1i g\u1ea7n nhau gi\u1eefa c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp c\u01a1 b\u1ea3n trong x\u00e3 h\u1ed9i.", "e": null}, {"q": "Xu th\u1ebf chung c\u1ee7a c\u00e1c qu\u1ed1c gia- d\u00e2n t\u1ed9c trong th\u1ebf gi\u1edbi ng\u00e0y nay l\u00e0 g\u00ec", "a": "H\u00f2a b\u00ecnh, h\u1ee3p t\u00e1c, ph\u00e1t tri\u1ec3n", "e": null}, {"q": "Y\u1ebfu t\u1ed1 n\u00e0o l\u00e0 c\u01a1 s\u1edf \u0111\u1ec3 g\u1eafn k\u1ebft c\u00e1c b\u1ed9 ph\u1eadn, c\u00e1c th\u00e0nh vi\u00ean c\u1ee7a d\u00e2n t\u1ed9c, t\u1eeb \u0111\u00f3 t\u1ea1o n\u00ean n\u1ec1n t\u1ea3ng cho s\u1ef1 v\u1eefng ch\u1eafc c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c?", "a": "C\u00f3 chung m\u1ed9t ph\u01b0\u01a1ng th\u1ee9c sinh ho\u1ea1t kinh t\u1ebf", "e": {"p": 196, "t": "Th\u1ee9 hai, c\u00f3 chung m\u1ed9t ph\u01b0\u01a1ng th\u1ee9c sinh ho\u1ea1t kinh t\u1ebf. \u0110\u00e2y l\u00e0 \u0111\u1eb7c tr\u01b0ng quan tr\u1ecdng nh\u1ea5t c\u1ee7a d\u00e2n t\u1ed9c, l\u00e0 c\u01a1 s\u1edf \u0111\u1ec3 g\u1eafn k\u1ebft c\u00e1c b\u1ed9 ph\u1eadn, c\u00e1c th\u00e0nh vi\u00ean trong d\u00e2n t\u1ed9c, t\u1ea1o"}}, {"q": "Y\u1ebfu t\u1ed1 n\u00e0o quy\u1ebft \u0111\u1ecbnh s\u1ef1 li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c?", "a": "Do c\u00f3 nh\u1eefng l\u1ee3i \u00edch c\u01a1 b\u1ea3n th\u1ed1ng nh\u1ea5t v\u1edbi nhau", "e": null}, {"q": "Y\u1ebfu t\u1ed1 n\u00e0o sau \u0111\u00e2y l\u00e0 c\u01a1 s\u1edf \u0111\u1ec3 li\u00ean k\u1ebft c\u00e1c b\u1ed9 ph\u1eadn, c\u00e1c th\u00e0nh vi\u00ean c\u1ee7a d\u00e2n t\u1ed9c. N\u00f3 t\u1ea1o n\u00ean n\u1ec1n t\u1ea3ng cho s\u1ef1 v\u1eefng ch\u1eafc c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c.", "a": "C\u00f3 chung sinh ho\u1ea1t v\u1ec1 kinh t\u1ebf.", "e": null}, {"q": "Y\u1ebfu t\u1ed1 n\u00e0o th\u1ec3 hi\u1ec7n ch\u1ee7 quy\u1ec1n c\u1ee7a m\u1ed9t d\u00e2n t\u1ed9c trong t\u01b0\u01a1ng quan v\u1edbi c\u00e1c qu\u1ed1c gia \u2013 d\u00e2n t\u1ed9c kh\u00e1c, l\u00e0 y\u1ebfu t\u1ed1 thi\u00eang li\u00eang nh\u1ea5t \u0111\u1ed1i v\u1edbi qu\u1ed1c gia v\u00e0 t\u1eebng th\u00e0nh vi\u00ean d\u00e2n t\u1ed9c, kh\u00f4ng c\u00f3 y\u1ebfu t\u1ed1 n\u00e0y th\u00ec kh\u00f4ng c\u00f3 kh\u00e1i ni\u1ec7m t\u1ed5 qu\u1ed1c, qu\u1ed1c gia?", "a": "L\u00e3nh th\u1ed5", "e": {"p": 196, "t": "\u0110\u1ed1i v\u1edbi qu\u1ed1c gia v\u00e0 t\u1eebng th\u00e0nh vi\u00ean d\u00e2n t\u1ed9c, y\u1ebfu t\u1ed1 l\u00e3nh th\u1ed5 l\u00e0 thi\u00eang li\u00eang nh\u1ea5t. Kh\u00f4ng c\u00f3 l\u00e3nh th\u1ed5 th\u00ec kh\u00f4ng c\u00f3 kh\u00e1i ni\u1ec7m t\u1ed5 qu\u1ed1c, qu\u1ed1c gia."}}, {"q": "Y\u1ebfu t\u1ed1 quy\u1ebft \u0111\u1ecbnh GCND kh\u00f4ng th\u1ec3 \u0111\u1ea3m nh\u1eadn s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed th\u1ef1c hi\u1ec7n vi\u1ec7c chuy\u1ec3n bi\u1ebfn t\u1eeb XHTBCN l\u00ean XHCN?", "a": "H\u1ecd kh\u00f4ng \u0111\u1ea1i di\u1ec7n cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u1ebfn b\u1ed9", "e": null}, {"q": "\u00dd n\u00e0o kh\u00f4ng \u0111\u00fang v\u1ec1 n\u1ed9i dung kinh t\u1ebf li\u00ean minh gi\u1eefa ggiai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a?", "a": "X\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng ch\u00ednh s\u00e1ch an sinh x\u00e3 h\u1ed9i", "e": null}]}, {"id": "cnxh2", "name": "CNXH khoa h\u1ecdc \u2013 B\u1ed9 2", "mcq": [{"q": "Theo ngh\u0129a r\u1ed9ng, ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0:", "o": ["Ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, lu\u1eadn gi\u1ea3i t\u1eeb c\u00e1c gi\u00e1c \u0111\u1ed9 tri\u1ebft h\u1ecdc v\u00e0 kinh t\u1ebf h\u1ecdc ch\u00ednh tr\u1ecb v\u1ec1 s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1ea5t y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n", "Ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, lu\u1eadn gi\u1ea3i t\u1eeb c\u00e1c gi\u00e1c \u0111\u1ed9 kinh t\u1ebf h\u1ecdc ch\u00ednh tr\u1ecb v\u00e0 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u1ec1 s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1ea5t y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi t\u1eeb ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00ean ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n", "Ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, lu\u1eadn gi\u1ea3i t\u1eeb c\u00e1c gi\u00e1c \u0111\u1ed9 tri\u1ebft h\u1ecdc v\u00e0 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u1ec1 s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1ea5t y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i", "Ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, lu\u1eadn gi\u1ea3i t\u1eeb c\u00e1c gi\u00e1c \u0111\u1ed9 tri\u1ebft h\u1ecdc, kinh t\u1ebf h\u1ecdc ch\u00ednh tr\u1ecb v\u00e0 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u1ec1 s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1ea5t y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n"], "a": 3, "s": "Ch\u01b0\u01a1ng 1", "e": {"p": 11, "t": "M\u00e1c - L\u00eanin, lu\u1eadn gi\u1ea3i t\u1eeb c\u00e1c gi\u00e1c \u0111\u1ed9 tri\u1ebft h\u1ecdc, kinh t\u1ebf h\u1ecdc ch\u00ednh tr\u1ecb v\u00e0 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u1ec1 s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1ea5t y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n. L\u00eanin \u0111\u00e3 \u0111\u00e1nh gi\u00e1 kh\u00e1i qu\u00e1t b\u1ed9 T\u01b0 b\u1ea3n: \u201ct\u00e1c ph\u1ea9m ch\u1ee7 y\u1ebfu v\u00e0 c\u01a1 b\u1ea3n \u1ea5y tr\u00ecnh b\u00e0y ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc..."}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang v\u1ec1 nh\u1eefng ti\u1ec1n \u0111\u1ec1 khoa h\u1ecdc t\u1ef1 nhi\u00ean v\u00e0o cu\u1ed1i th\u1ebf k\u1ef7 XVIII, \u0111\u1ea7u th\u1ebf k\u1ef7 XIX - l\u00e0 c\u01a1 s\u1edf ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn cho c\u00e1c nh\u00e0 s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc nghi\u00ean c\u1ee9u nh\u1eefng v\u1ea5n \u0111\u1ec1 l\u00fd lu\u1eadn ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i \u0111\u01b0\u01a1ng th\u1eddi:", "o": ["\u0110\u1ecbnh lu\u1eadt Bernoulli, Thuy\u1ebft v\u1ea1n v\u1eadt h\u1ea5p d\u1eabn c\u1ee7a Newton v\u00e0 Thuy\u1ebft nh\u1eadt t\u00e2m c\u1ee7a Copernicus.", "H\u1ecdc thuy\u1ebft ti\u1ebfn h\u00f3a c\u1ee7a Darwin, \u0110\u1ecbnh lu\u1eadt b\u1ea3o to\u00e0n v\u00e0 chuy\u1ec3n h\u00f3a n\u0103ng l\u01b0\u1ee3ng c\u1ee7a Mayer v\u00e0 H\u1ecdc thuy\u1ebft t\u1ebf b\u00e0o c\u1ee7a Schleiden & Schwam", "Thuy\u1ebft di truy\u1ec1n c\u1ee7a Mendel, \u0110\u1ecbnh \u0111\u1ec1 Euclide v\u00e0 H\u1ecdc thuy\u1ebft ti\u1ebfn h\u00f3a c\u1ee7a Darwin", "Thuy\u1ebft v\u1ea1n v\u1eadt h\u1ea5p d\u1eabn c\u1ee7a Newton, \u0110\u1ecbnh lu\u1eadt b\u1ea3o to\u00e0n chuy\u1ec3n h\u00f3a n\u0103ng l\u01b0\u1ee3ng c\u1ee7a Mayer v\u00e0 \u0110\u1ecbnh lu\u1eadt Bernoulli."], "a": 1, "s": "Ch\u01b0\u01a1ng 1", "e": {"p": 14, "t": "Nh\u1eefng ph\u00e1t minh n\u00e0y l\u00e0 ti\u1ec1n \u0111\u1ec1 khoa h\u1ecdc cho s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a duy v\u1eadt bi\u1ec7n ch\u1ee9ng v\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed, c\u01a1 s\u1edf ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn cho c\u00e1c nh\u00e0 s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc nghi\u00ean c\u1ee9u nh\u0169ng v\u1ea5n \u0111\u1ec1 l\u00fd lu\u1eadn ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i \u0111\u01b0\u01a1ng th\u1eddi.", "a": 1}}, {"q": "Ba \u0111\u1ea1i bi\u1ec3u c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng ph\u00ea ph\u00e1n \u2013 ti\u1ec1n \u0111\u1ec1 t\u01b0 t\u01b0\u1edfng l\u00fd lu\u1eadn c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc l\u00e0:", "o": ["Saint Simon (1760 - 1825), Charles Fourier (1772 - 1837) v\u00e0 Robert Owen (1771 - 1858)", "Hegel (1770 \u2013 1831), Feuerbach (1804-1872) v\u00e0 Kant (1724-1804)", "Adam Smith (1723 \u2013 1790), David Ricardo (1772-1823) v\u00e0 William Petty (1623- 1687)", "Thomas More (1478- 1535), Tommaso Campanella (1568 -1639), Gerade Wilstanley (1609 \u2013 1652)"], "a": 0, "s": "Ch\u01b0\u01a1ng 1", "e": {"p": 14, "t": "ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng ph\u00ea ph\u00e1n m\u00e0 \u0111\u1ea1i bi\u1ec3u l\u00e0 Xanh Xim\u00f4ng (1760 - 1825), s. Phuri\u00ea (1772 - 1837) v\u00e0 R.", "a": 1}}, {"q": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc ra \u0111\u1eddi t\u1eeb \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i n\u00e0o?", "o": ["S\u1ef1 ra \u0111\u1eddi ch\u00ednh \u0110\u1ea3ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "S\u1ef1 ph\u00e1t tri\u1ec3n l\u1edbn m\u1ea1nh c\u1ee7a ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n v\u00e0 s\u1ef1 l\u1edbn m\u1ea1nh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "S\u1ef1 \u1ee7ng h\u1ed9 c\u1ee7a t\u1ea7ng l\u1edbp n\u00f4ng d\u00e2n v\u00e0 \u0111\u1ed9i ng\u0169 tr\u00ed th\u1ee9c \u0111\u1ed1i v\u1edbi giai c\u1ea5p c\u00f4ng nh\u00e2n", "Giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u00e3 th\u1ef1c s\u1ef1 gi\u00e1c ng\u1ed9 v\u1ec1 s\u1ee9 m\u1ec7nh c\u1ee7a giai c\u1ea5p m\u00ecnh"], "a": 1, "s": "Ch\u01b0\u01a1ng 1", "e": {"p": 13, "t": "\u0110i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i \u1ea5y kh\u00f4ng ch\u1ec9 \u0111\u1eb7t ra y\u00eau c\u1ea7u \u0111\u1ed1i v\u00f3i c\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n m\u00e0 c\u00f2n l\u00e0 m\u1ea3nh \u0111\u1ea5t hi\u1ec7n th\u1ef1c cho s\u1ef1 ra \u0111\u1eddi m\u1ed9t l\u00fd lu\u1eadn m\u1ed1i, ti\u1ebfn b\u1ed9 - ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc. b) Ti\u00ean \u0111\u1ec1 khoa h\u1ecdc t\u1ef1 nhi\u00ean v\u00e0 t\u01b0 t\u01b0\u1edfng l\u00fd lu\u1eadn - Ti\u1ec1n \u0111\u1ec3 khoa h\u1ecdc t\u1ef1 nhi\u00ean Cu\u1ed1i th\u1ebf k\u1ef7 XVIII, \u0111\u1ea7u th\u1ebf k\u1ef7 XIX, nh\u00e2n lo\u1ea1i \u0111\u00e3 \u0111\u1ea1t nhi\u1ec1u th\u00e0nh t\u1ef1u to l\u1ed5n tr\u00ean l\u0129nh v\u1ef1c khoa h\u1ecdc t\u1ef1\u2026", "a": 1}}, {"q": "V\u1edbi ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i n\u00e0o, C.M\u00e1c v\u00e0 Ph. \u0102ngghen \u0111\u00e3 lu\u1eadn gi\u1ea3i khoa h\u1ecdc v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n?", "o": ["T\u00ednh hai m\u1eb7t c\u1ee7a lao \u0111\u1ed9ng v\u00e0 Thuy\u1ebft v\u1ea1n v\u1eadt h\u1ea5p d\u1eabn", "Thuy\u1ebft ti\u1ebfn h\u00f3a c\u00e1c lo\u00e0i v\u00e0 Thuy\u1ebft v\u1ea1n v\u1eadt h\u1ea5p d\u1eabn", "Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 H\u1ecdc thuy\u1ebft gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0", "Ph\u00e9p bi\u1ec7n ch\u1ee9ng v\u00e0 Thuy\u1ebft di truy\u1ec1n"], "a": 2, "s": "Ch\u01b0\u01a1ng 1", "e": {"p": 19, "t": "tr\u00e1nh kh\u1ecfi c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 s\u1ef1 ra \u0111\u00f2i t\u1ea5t y\u1ebfu c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. - H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th \u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Tr\u00ean c\u01a1 s\u1edf hai ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i l\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 h\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0, c. \u0102ngghen \u0111\u00e3 c\u00f3 ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i th\u1ee9 ba - ph\u00e1t hi\u1ec7n ra s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p c\u00f3 s\u1ee9 m\u1ec7nh th\u1ee7 ti\u00eau ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3\u2026"}}, {"q": "Ti\u1ec1n \u0111\u1ec1 kinh t\u1ebf cho s\u1ef1 h\u00ecnh th\u00e0nh t\u01b0 t\u01b0\u1edfng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0:", "o": ["S\u1ef1 xu\u1ea5t hi\u1ec7n ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu", "S\u1ef1 xu\u1ea5t hi\u1ec7n nh\u00e0 n\u01b0\u1edbc", "S\u1ef1 xu\u1ea5t hi\u1ec7n giai c\u1ea5p th\u1ed1ng tr\u1ecb", "S\u1ef1 xu\u1ea5t hi\u1ec7n t\u00ecnh tr\u1ea1ng ng\u01b0\u1eddi b\u00f3c l\u1ed9t ng\u01b0\u1eddi"], "a": 0, "s": "Ch\u01b0\u01a1ng 1", "e": null}, {"q": "T\u01b0 t\u01b0\u1edfng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a b\u1eaft \u0111\u1ea7u xu\u1ea5t hi\u1ec7n \u1edf h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i n\u00e0o?", "o": ["T\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a", "C\u00f4ng x\u00e3 nguy\u00ean th\u1ee7y", "Phong ki\u1ebfn", "Chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7"], "a": 3, "s": "Ch\u01b0\u01a1ng 1", "e": {"p": 103, "t": "l\u1ecbch s\u1eed x\u00e3 h\u1ed9i \u0111\u00e3 tr\u1ea3i qua 5 h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i: C\u1ed9ng s\u1ea3n nguy\u00ean th\u1ee7y, chi\u1ebfm h\u1eefu n\u1ed3 l\u1ec7, phong ki\u1ebfn, t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u00e0 c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a. So v\u1edbi c\u00e1c h\u00ecnh th\u00e1i kinh t\u00ea - x\u00e3 h\u1ed9i \u0111\u00e3 xu\u1ea5t hi\u1ec7n trong l\u1ecbch s\u1eed, h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a c\u00f3 s\u1ef1 kh\u00e1c bi\u1ec7t v\u1ec1 ch\u1ea5t, trong \u0111\u00f3 kh\u00f4ng c\u00f3 giai c\u1ea5p \u0111\u1ed1i kh\u00e1ng, con ng\u01b0\u00f2i t\u1eebng b\u01b0\u1edbc tr\u1edf th\u00e0nh ng\u01b0\u1eddi t\u1ef1 do..."}}, {"q": "C\u00f4ng lao c\u1ee7a L\u00eanin trong vi\u1ec7c v\u1eadn d\u1ee5ng v\u00e0 ph\u00e1t tri\u1ec3n ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi l\u00e0:", "o": ["\u0110\u1ec1 xu\u1ea5t t\u01b0 t\u01b0\u1edfng v\u1ec1 \u0111\u1eadp tan b\u1ed9 m\u00e1y nh\u00e0 n\u01b0\u1edbc t\u01b0 s\u1ea3n, thi\u1ebft l\u1eadp chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n", "Ph\u00e1t tri\u1ec3n ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng th\u00e0nh ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc", "X\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i hi\u1ec7n th\u1ef1c", "Th\u1eeba nh\u1eadn C\u00f4ng x\u00e3 Pari l\u00e0 m\u1ed9t h\u00ecnh th\u00e1i nh\u00e0 n\u01b0\u1edbc c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n"], "a": 2, "s": "Ch\u01b0\u01a1ng 1", "e": {"p": 24, "t": "L\u00eanin v\u1eadn d\u1ee5ng v\u00e0 ph\u00e1t tri\u1ec3n ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi V.I. L\u00eanin (1870 - 1924) l\u00e0 ng\u01b0\u1eddi \u0111\u00e3 k\u1ebf t\u1ee5c xu\u1ea5t s\u1eafc s\u1ef1 nghi\u1ec7p c\u00e1ch m\u1ea1ng v\u00e0 khoa h\u1ecdc c\u1ee7a c.", "a": 1}}, {"q": "\u0110\u1ed1i t\u01b0\u1ee3ng nghi\u00ean c\u1ee9u c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc l\u00e0:", "o": ["L\u00e0 nh\u1eefng quy lu\u1eadt h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a c\u00e1c h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i", "L\u00e0 nh\u1eefng quy lu\u1eadt v\u00e0 t\u00ednh quy lu\u1eadt ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t sinh, h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n h f3 \u0111\u1ed3ng minh t\u1ef1 nhi\u00ean l\u00e0 giai c\u1ea5p n\u00f4ng d\u00e2n"], "a": 1, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 60, "t": "L\u00e0 con \u0111\u1ebb c\u1ee7a n\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 nh\u1eefng ph\u1ea9m ch\u1ea5t c\u1ee7a m\u1ed9t giai c\u1ea5p ti\u00ean ti\u1ebfn, giai c\u1ea5p c\u00e1ch m\u1ea1ng nh\u01b0: t\u00ednh t\u1ed5 ch\u1ee9c v\u00e0 k\u1ef7 lu\u1eadt, t\u1ef1 gi\u00e1c v\u00e0 \u0111o\u00e0n k\u1ebft trong cu\u1ed9c \u0111\u1ea5u tranh t\u1ef1 gi\u1ea3i ph\u00f3ng m\u00ecnh v\u00e0 gi\u1ea3i ph\u00f3ng x\u00e3 h\u1ed9i. Nh\u1eefng ph\u1ea9m ch\u1ea5t \u1ea5y c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh t\u1eeb ch\u00ednh nh\u1eefng \u0111i\u1ec1u ki\u1ec7n kh\u00e1ch quan, \u0111\u01b0\u1ee3c quy \u0111\u1ecbnh t\u1eeb \u0111\u1ecba v\u1ecb kinh t\u1ebf v\u00e0 \u0111\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i c\u1ee7a n\u00f3 trong n\u1ec1n s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1\u2026"}}, {"q": "Nh\u00e2n t\u1ed1 ch\u1ee7 quan ti\u00ean quy\u1ebft \u0111\u1ec3 giai c\u1ea5p c\u00f4ng nh\u00e2n th\u1ef1c hi\u1ec7n th\u00e0nh c\u00f4ng s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed l\u00e0:", "o": ["\u0110\u1ea3ng C\u1ed9ng s\u1ea3n l\u00e3nh \u0111\u1ea1o", "\u0110\u1ecba v\u1ecb kinh t\u1ebf - x\u00e3 h\u1ed9i quy \u0111\u1ecbnh", "\u0110\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i quy \u0111\u1ecbnh", "Giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 \u0111\u1ed3ng minh t\u1ef1 nhi\u00ean l\u00e0 giai c\u1ea5p n\u00f4ng d\u00e2n"], "a": 0, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 62, "t": "- \u0110\u1ea3ng C\u1ed9ng s\u1ea3n l\u00e0 nh\u00e2n t\u1ed1 ch\u1ee7 quan quan tr\u1ecdng nh\u1ea5t \u0111\u1ec3 giai c\u1ea5p c\u00f4ng nh\u00e2n th\u1ef1c hi\u1ec7n th\u1eafng l\u1ee3i s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a m\u00ecnh. \u0110\u1ea3ng C\u1ed9ng s\u1ea3n - \u0111\u1ed9i ti\u00ean phong c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n ra \u0111\u1eddi v\u00e0 \u0111\u1ea3m nh\u1eadn vai tr\u00f2 l\u00e3nh \u0111\u1ea1o cu\u1ed9c c\u00e1ch m\u1ea1ng", "a": 1}}, {"q": "M\u00f4 t\u1ea3 qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, C. M\u00e1c v\u00e0 Ph. \u0102ngghen ch\u1ec9 r\u00f5: \u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i [\u2026.]\u201d", "o": ["Ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c", "Thu\u00ea t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t c\u1ee7a giai c\u1ea5p t\u01b0 s\u1ea3n", "Thu\u00ea \u0111\u1ea5t \u0111ai c\u1ee7a \u0111\u1ecba ch\u1ee7", "\u0110\u00f3ng g\u00f3p t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t"], "a": 0, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 52, "t": "\u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d1. \u0102ngghen, c\u00f4ng nh\u00e2n c\u00f4ng nghi\u1ec7p c\u00f4ng x\u01b0\u1ecfng l\u00e0 b\u1ed9 ph\u1eadn ti\u00eau bi\u1ec3u cho giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i.", "a": 1}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang \u0111i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: \u201cGiai c\u1ea5p c\u00f4ng nh\u00e2n la\u0300 m\u00f4\u0323t t\u00e2\u0323p \u0111oa\u0300n xa\u0303 h\u00f4\u0323i \u00f4\u0309n \u0111i\u0323nh, hi\u0300nh tha\u0300nh va\u0300 pha\u0301t tri\u00ea\u0309n cu\u0300ng v\u01a1\u0301i qua\u0301 tri\u0300nh cu\u0309a n\u00ea\u0300n c\u00f4ng nghi\u00ea\u0323p hi\u00ea\u0323n \u0111a\u0323i, v\u01a1\u0301i nhi\u0323p \u0111\u00f4\u0323 pha\u0301t tri\u00ea\u0309n cu\u0309a l\u01b0\u0323c l\u01b0\u01a1\u0323ng sa\u0309n xu\u00e2\u0301t co\u0301 ti\u0301nh ch\u00e2\u0301t [\u2026\u2026..] nga\u0300y ca\u0300ng cao\u201d", "o": ["B\u1ea7n c\u00f9ng h\u00f3a, chuy\u00ean m\u00f4n h\u00f3a", "T\u01b0 nh\u00e2n h\u00f3a, tr\u00ed th\u1ee9c h\u00f3a", "Qu\u1ed1c h\u1eefu h\u00f3a, tri th\u1ee9c h\u00f3a", "Xa\u0303 h\u00f4\u0323i ho\u0301a, tr\u00ed tu\u1ec7 h\u00f3a"], "a": 3, "s": "Ch\u01b0\u01a1ng 2", "e": null}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang \u0111i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: \u201cT\u1ea5t c\u1ea3 c\u00e1c giai c\u1ea5p kh\u00e1c \u0111\u1ec1u suy t\u00e0n v\u00e0 ti\u00eau vong c\u00f9ng v\u1edbi s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, c\u00f2n giai c\u1ea5p v\u00f4 s\u1ea3n l\u1ea1i l\u00e0 [.........] c\u1ee7a b\u1ea3n th\u00e2n n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p\u201d (C.M\u00e1c & Ph.\u0102ngghen, 1848):", "o": ["Ch\u1ee7 th\u1ec3", "S\u1ea3n ph\u1ea9m", "L\u1ef1c l\u01b0\u1ee3ng", "S\u1ef1 ph\u00e1t tri\u1ec3n"], "a": 1, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 52, "t": "\u0102ngghen, c\u00f4ng nh\u00e2n c\u00f4ng nghi\u1ec7p c\u00f4ng x\u01b0\u1ecfng l\u00e0 b\u1ed9 ph\u1eadn ti\u00eau bi\u1ec3u cho giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i. Trong t\u00e1c ph\u1ea9m Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n, c\u00e1c \u00f4ng nh\u1ea5n m\u1ea1nh: \u201cc\u00e1c giai c\u1ea5p kh\u00e1c \u0111\u1ec1u suy t\u00e0n v\u00e0 ti\u00eau vong c\u00f9ng v\u1edbi s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, c\u00f2n giai c\u1ea5p v\u00f4 s\u1ea3n l\u1ea1i l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a b\u1ea3n th\u00e2n n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p\u201d2 v\u00e0 \u201cc\u00f4ng nh\u00e2n c\u0169ng l\u00e0 m\u1ed9t ph\u00e1t minh c\u1ee7a th\u1eddi \u0111\u1ea1i m\u1ed1i, gi\u1ed1ng nh\u01b0 m\u00e1y m\u00f3c v\u1eady..."}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m n\u00e0o sau \u0111\u00e2y kh\u00f4ng ph\u1ea3i l\u00e0 \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n?", "o": ["C\u00f3 l\u1ee3i \u00edch c\u01a1 b\u1ea3n \u0111\u1ed1i l\u1eadp tr\u1ef1c ti\u1ebfp v\u1edbi l\u1ee3i \u00edch c\u01a1 b\u1ea3n c\u1ee7a giai c\u1ea5p t\u01b0 s\u1ea3n", "C\u00f3 b\u1ea3n ch\u1ea5t qu\u1ed1c t\u1ebf v\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c", "C\u00f3 ph\u01b0\u01a1ng th\u1ee9c lao \u0111\u1ed9ng mang t\u00ednh s\u00e1ng t\u1ea1o c\u00e1 nh\u00e2n", "C\u00f3 h\u1ec7 t\u01b0 t\u01b0\u1edfng l\u00e0 ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin"], "a": 2, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 55, "t": "l\u00e0m s\u00e1ng t\u1ecf nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m quan tr\u1ecdng c\u1ee7a n\u00f3 v\u1ed1i t\u01b0 c\u00e1ch l\u00e0 m\u1ed9t giai c\u1ea5p c\u00e1ch m\u1ea1ng c\u00f3 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed th \u1ebf gi\u1edbi. C\u00f3 th\u1ec3 kh\u00e1i qu\u00e1t nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m ch\u1ee7 y\u1ebfu c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n bao g\u1ed3m: - \u0110\u1eb7c \u0111i\u1ec3m n\u1ed5i b\u1eadt c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 lao \u0111\u1ed9ng b\u1eb1ng ph\u01b0\u01a1ng th\u1ee9c c\u00f4ng nghi\u1ec7p v\u1edbi \u0111\u1eb7c tr\u01b0ng c\u00f4ng c\u1ee5 lao \u0111\u1ed9ng l\u00e0 m\u00e1y m\u00f3c, t\u1ea1o ra n\u0103ng su\u1ea5t lao \u0111\u1ed9ng cao, qu\u00e1 tr\u00ecnh lao \u0111\u1ed9ng mang t\u00ednh ch\u1ea5t x\u00e3 h\u1ed9i h\u00f3a."}}, {"q": "\u0110\u1ed1i di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n, c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0:", "o": ["T\u1ef1 do ph\u00e2n ph\u1ed1i s\u1ea3n ph\u1ea9m l\u00e0m ra", "T\u1ef1 do s\u1eed d\u1ee5ng m\u00e1y m\u00f3c thi\u1ebft b\u1ecb", "T\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng", "T\u1ef1 do ph\u00e2n b\u1ed5 l\u1ee3i \u00edch kinh t\u1ebf"], "a": 2, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 53, "t": "\u0102ngghen ch\u1ec9 r\u00f5, \u0111\u00f3 l\u00e0 giai c\u1ea5p c\u1ee7a nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng kh\u00f4ng c\u00f3 s\u1ecf h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i. H\u1ecd ph\u1ea3i b\u00e1n s\u1ee9c lao \u0111\u1ed9ng cho nh\u00e0 t\u01b0 b\u1ea3n v\u00e0 b\u1ecb ch\u1ee7 t\u01b0 b\u1ea3n b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0. \u0110\u1ed1\u00ec di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n, c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0 t\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng."}}, {"q": "D\u1ef1a v\u00e0o y\u1ebfu t\u1ed1 n\u00e0o m\u00e0 giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng; tinh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p?", "o": ["T\u1ef1 do ph\u00e2n ph\u1ed1i s\u1ea3n ph\u1ea9m l\u00e0m ra", "B\u1ea3n th\u00e2n h\u1ecd t\u1ef1 c\u00f3", "T\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng", "N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn"], "a": 3, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 55, "t": "- Giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a b\u1ea3n th\u00e2n n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, l\u00e0 ch\u1ee7 th\u1ec3 c\u1ee7a qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u1eadt ch\u1ea5t hi\u1ec7n \u0111\u1ea1i. Do \u0111\u00f3, giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 \u0111\u1ea1i bi\u1ec3u cho l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn, cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn, quy\u1ebft \u0111\u1ecbnh s\u1ef1 t\u1ed3n t\u1ea1i v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a x\u00e3 h\u1ed9i hi\u1ec7n \u0111\u1ea1i. - N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn \u0111\u00e3 r\u00e8n luy\u1ec7n cho giai c\u1ea5p c\u00f4ng nh\u00e2n nh\u1eefng ph\u1ea9m ch\u1ea5t \u0111\u1eb7c bi\u1ec7t v\u1ec1 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7\u2026"}}, {"q": "\u201cS\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t ng\u00e0y c\u00e0ng nhi\u1ec1u, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u ng\u00e0y c\u00e0ng t\u0103ng c\u1ee7a con ng\u01b0\u1eddi v\u00e0 x\u00e3 h\u1ed9i, t\u1eeb \u0111\u00f3 t\u1ea1o ti\u1ec1n \u0111\u1ec1 v\u1eadt ch\u1ea5t \u2013 k\u1ef9 thu\u1eadt cho s\u1ef1 ra \u0111\u1eddi c\u1ee7a x\u00e3 h\u1ed9i m\u1edbi\u201d \u2013 l\u00e0 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n thu\u1ed9c n\u1ed9i dung:", "o": ["Kinh t\u1ebf", "Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "Qu\u1ed1c ph\u00f2ng an ninh", "V\u0103n h\u00f3a, t\u01b0 t\u01b0\u1edfng"], "a": 0, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 56, "t": "- N\u1ed9i dung kinh t\u1ebf: L\u00e0 nh\u00e2n t\u1ed1 h\u00e0ng \u0111\u1ea7u c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t x\u00e3 h\u1ed9i h\u00f3a cao, giai c\u1ea5p c\u00f4ng nh\u00e2n c\u0169ng l\u00e0 \u0111\u1ea1i bi\u1ec3u cho quan h\u1ec7 s\u1ea3n xu\u1ea5t m\u1edbi, s\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t ng\u00e0y c\u00e0ng nhi\u1ec1u \u0111\u00e1p \u1ee9ng nhu c\u1ea7u ng\u00e0y c\u00e0ng t\u0103ng c\u1ee7a con ng\u01b0\u1eddi v\u00e0 x\u00e3 h\u1ed9i. B\u1eb1ng c\u00e1ch \u0111\u00f3, giai c\u1ea5p c\u00f4ng nh\u00e2n t\u1ea1o ti\u1ec1n \u0111\u1ec1 v\u1eadt ch\u1ea5t - k\u1ef9 thu\u1eadt cho s\u1ef1 ra \u0111\u1eddi c\u1ee7a x\u00e3 h\u1ed9i m\u1edbi."}}, {"q": "Giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua con \u0111\u01b0\u1eddng n\u00e0o \u0111\u1ec3 gi\u1ea3i ph\u00f3ng m\u00ecnh v\u00e0 gi\u1ea3i ph\u00f3ng nh\u00e2n d\u00e2n lao \u0111\u1ed9ng?", "o": ["B\u00e3i c\u00f4ng", "\u0110\u1ea5u tranh ngh\u1ecb vi\u1ec7n", "Bi\u1ec3u t\u00ecnh", "C\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a"], "a": 3, "s": "Ch\u01b0\u01a1ng 2", "e": null}, {"q": "\u201cTh\u1ef1c hi\u1ec7n d\u00e2n ch\u1ee7, c\u00f4ng b\u1eb1ng, b\u00ecnh \u0111\u1eb3ng v\u00e0 ti\u1ebfn b\u1ed9 x\u00e3 h\u1ed9i theo l\u00fd t\u01b0\u1edfng v\u00e0 m\u1ee5c ti\u00eau c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i\u201d - l\u00e0 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n thu\u1ed9c n\u1ed9i dung:", "o": ["V\u0103n h\u00f3a, t\u01b0 t\u01b0\u1edfng", "Kinh t\u1ebf", "Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "Qu\u1ed1c ph\u00f2ng, an ninh"], "a": 2, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 58, "t": "Giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng s\u1eed d\u1ee5ng nh\u00e0 n\u01b0\u1edbc c\u1ee7a m\u00ecnh, do m\u00ecnh l\u00e0m ch\u1ee7 nh\u01b0 m\u1ed9t c\u00f4ng c\u1ee5 c\u00f3 hi\u1ec7u l\u1ef1c \u0111\u1ec3 c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i c\u0169 v\u00e0 t\u1ed5 ch\u1ee9c x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i m\u1ed1i, ph\u00e1t tri\u1ec3n kinh t\u1ebf v\u00e0 v\u0103n h\u00f3a, x\u00e2y d\u1ef1ng n\u1ec1n ch\u00ednh tr\u1ecb d\u00e2n ch\u1ee7 - ph\u00e1p quy\u1ec1n, qu\u1ea3n l\u00fd kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 t\u1ed5 ch\u1ee9c \u0111\u1eddi s\u1ed1ng x\u00e3 h\u1ed9i ph\u1ee5c v\u1ee5 quy\u1ec1n v\u00e0 l\u1ee3i \u00edch c\u1ee7a nh\u00e2n d\u00e2n lao \u0111\u1ed9ng, th\u1ef1c hi\u1ec7n d\u00e2n ch\u1ee7, c\u00f4ng b\u1eb1ng, b\u00ecnh \u0111\u1eb3ng v\u00e0 ti\u1ebfn b\u1ed9 x\u00e3 h\u1ed9i, theo l\u00fd t\u01b0\u1edfng v\u00e0 m\u1ee5c ti\u00eau c\u1ee7a c\u2026"}}, {"q": "T\u1eadp trung x\u00e2y d\u1ef1ng h\u1ec7 gi\u00e1 tr\u1ecb m\u1edbi: lao \u0111\u1ed9ng, c\u00f4ng b\u1eb1ng, d\u00e2n ch\u1ee7, b\u00ecnh \u0111\u1eb3ng v\u00e0 t\u1ef1 do - l\u00e0 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n thu\u1ed9c n\u1ed9i dung:", "o": ["Qu\u1ed1c ph\u00f2ng, an ninh", "Kinh t\u1ebf", "Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "V\u0103n h\u00f3a u1ecd kh\u00f4ng c\u00f3 ch\u00ednh \u0111\u1ea3ng ri\u00eang \u0111\u1ed9c l\u1eadp"], "a": 1, "s": "Ch\u01b0\u01a1ng 2", "e": null}, {"q": "Trong ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, giai c\u1ea5p duy nh\u1ea5t kh\u00f4ng c\u00f3 l\u1ee3i \u00edch ri\u00eang v\u1edbi ngh\u0129a t\u01b0 h\u1eefu l\u00e0:", "o": ["\u0110\u1ecba ch\u1ee7", "V\u00f4 s\u1ea3n", "T\u01b0 s\u1ea3n", "Ti\u1ec3u t\u01b0 s\u1ea3n"], "a": 1, "s": "Ch\u01b0\u01a1ng 2", "e": {"p": 56, "t": "Ch\u1ec9 c\u00f3 giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 giai c\u1ea5p duy nh\u1ea5t kh\u00f4ng c\u00f3 l\u1ee3i \u00edch ri\u00eang v\u1edbi 1. To\u00e0n t\u1eadp, S\u0111d, t.", "a": 1}}, {"q": "H\u00ecnh th\u1ee9c \u0111\u1ea5u tranh \u0111\u1ea7u ti\u00ean c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n khi ch\u01b0a gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n l\u00e0:", "o": ["\u0110\u1ea5u tranh v\u0169 trang", "\u0110\u1ea5u tranh kinh t\u1ebf", "\u0110\u1ea5u tranh ch\u00ednh tr\u1ecb", "\u0110\u1ea5u tranh t\u01b0 t\u01b0\u1edfng"], "a": 1, "s": "Ch\u01b0\u01a1ng 2", "e": null}, {"q": "Ph\u00e2n ph\u1ed1i theo lao \u0111\u1ed9ng l\u00e0 h\u00ecnh th\u1ee9c ph\u00e2n ph\u1ed1i c\u01a1 b\u1ea3n c\u1ee7a x\u00e3 h\u1ed9i n\u00e0o?", "o": ["X\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a", "X\u00e3 h\u1ed9i t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a", "X\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "X\u00e3 h\u1ed9i chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7"], "a": 2, "s": "Ch\u01b0\u01a1ng 3", "e": {"p": 111, "t": "th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 c\u00f2n nhi\u1ec1u h\u00ecnh th\u1ee9c ph\u00e2n ph\u1ed1i, ngo\u00e0i ph\u00e2n ph\u00f4i theo lao \u0111\u1ed9ng v\u1eabn l\u00e0 ch\u1ee7 \u0111\u1ea1o c\u00f2n ph\u00e2n ph\u1ed1i theo m\u1ee9c \u0111\u1ed9 \u0111\u00f3ng g\u00f3p v\u00e0 qu\u1ef9 ph\u00fac l\u1ee3i x\u00e3 h\u1ed9i; th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 v\u1eabn c\u00f2n quan h\u1ec7 b\u00f3c l\u1ed9t v\u00e0 b\u1ecb b\u00f3c l\u1ed9t, song quan h\u1ec7 b\u00f3c l\ 1eeb ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a l\u00ean ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "Gi\u00e1n ti\u1ebfp, b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a ti\u1ebfn l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i", "Gi\u00e1n ti\u1ebfp, b\u1ecf qua ch\u1ebf \u0111\u1ed9 phong ki\u1ebfn ti\u1ebfn l\u00ean ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "Tr\u1ef1c ti\u1ebfp, t\u1eeb ch\u1ebf \u0111\u1ed9 phong ki\u1ebfn ti\u1ebfn l\u00ean ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a."], "a": 1, "s": "Ch\u01b0\u01a1ng 3", "e": {"p": 108, "t": "\u0110\u1eb7c \u0111i\u1ec3m qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam l\u00e0 b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a Vi\u1ec7t Nam ti\u1ebfn l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i trong \u0111i\u1ec1u ki\u1ec7n v\u1eeba thu\u1eadn l\u1ee3i v\u1eeba kh\u00f3 kh\u0103n \u0111an xen, v\u1edbi nh\u1eefng \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n:", "a": 1}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang \u0111i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: \u201ccu\u1ed9c c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p v\u00f4 s\u1ea3n \u0111ang c\u00f3 t\u1ea5t c\u1ea3 nh\u1eefng tri\u1ec7u ch\u1ee9ng l\u00e0 s\u1eafp n\u1ed5 ra, s\u1ebd ch\u1ec9 c\u00f3 th\u1ec3 c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i hi\u1ec7n nay m\u1ed9t c\u00e1ch d\u1ea7n d\u1ea7n, v\u00e0 ch\u1ec9 khi n\u00e0o \u0111\u00e3 t\u1ea1o n\u00ean \u0111\u01b0\u1ee3c m\u1ed9t kh\u1ed1i l\u01b0\u1ee3ng [\u2026] c\u1ea7n thi\u1ebft cho vi\u1ec7c c\u1ea3i t\u1ea1o \u0111\u00f3 th\u00ec khi \u1ea5y m\u1edbi th\u1ee7 ti\u00eau \u0111\u01b0\u1ee3c ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu\u201d (C. M\u00e1c & Ph. \u0102ngghen: To\u00e0n t\u1eadp, Nxb. Ch\u00ednh tr\u1ecb qu\u1ed1c gia, H\u00e0 N\u1ed9i, 2002, t.4, tr.469)", "o": ["T\u01b0 li\u1ec7u ti\u00eau d\u00f9ng", "T\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t", "Gi\u00e1 t 1ec1u h\u00ecnh th\u1ee9c ph\u00e2n ph\u1ed1i, ngo\u00e0i ph\u00e2n ph\u00f4i theo lao \u0111\u1ed9ng v\u1eabn l\u00e0 ch\u1ee7 \u0111\u1ea1o c\u00f2n ph\u00e2n ph\u1ed1i theo m\u1ee9c \u0111\u1ed9 \u0111\u00f3ng g\u00f3p v\u00e0 qu\u1ef9 ph\u00fac l\u1ee3i x\u00e3 h\u1ed9i; th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 v\u1eabn c\u00f2n quan h\u1ec7 b\u00f3c l\u1ed9t v\u00e0 b\u1ecb b\u00f3c l\u1ed9t, song quan h\u1ec7 b\u00f3c l\u1ed9t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a kh\u00f4ng gi\u1eef vai tr\u00f2 th\u1ed1ng tr\u1ecb. Th\u1ee9 ba, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u00f2i h\u1ecfi ph\u1ea3i ti\u1ebfp thu, k\u1ebf th\u1eeba nh\u1eefng th\u00e0nh t\u1ef1u m\u00e0 nh\u00e2n lo\u1ea1i \u0111\u00e3 \u0111\u1ea1t \u0111\u01b0\u1ee3c d\u01b0\u1edbi ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3\u2026"}}, {"q": "V\u1ec1 ph\u01b0\u01a1ng di\u1ec7n ch\u00ednh tr\u1ecb, \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0:", "o": ["\u0110\u1ea5u tranh giai c\u1ea5p di\u1ec5n ra trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi \u2013 giai c\u1ea5p c\u00f4ng nh\u00e2n c\u1ea7m quy\u1ec1n, v\u1edbi n\u1ed9i dung m\u1edbi \u2013 x\u00e2y d\u1ef1ng to\u00e0n di\u1ec7n x\u00e3 h\u1ed9i m\u1edbi, tr\u1ecdng t\u00e2m l\u00e0 x\u00e2y d\u1ef1ng nh\u00e0 n\u01b0\u1edbc c\u00f3 t\u00ednh kinh t\u1ebf v\u00e0 trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi \u2013 c\u01a1 b\u1ea3n l\u00e0 h\u00f2a b\u00ecnh t\u1ed5 ch\u1ee9c x\u00e2y d\u1ef1ng", "T\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1i l\u1eadp", "C\u00f2n t\u1ed3n t\u1ea1i nhi\u1ec1u t\u01b0 t\u01b0\u1edfng kh\u00e1c nhau, ch\u1ee7 y\u1ebfu l\u00e0 t\u01b0 t\u01b0\u1edfng v\u00f4 s\u1ea3n v\u00e0 t\u01b0 t\u01b0\u1edfng t\u01b0 s\u1ea3n", "C\u00f2n t\u1ed3n t\u1ea1i nhi\u1ec1u giai c\u1ea5p, t\u1ea7ng l\u1edbp v\u00e0 s\u1ef1 kh\u00e1c bi\u1ec7t gi\u1eefa c\u00e1c giai c\u1ea5p t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i, c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp v\u1eeba h\u1ee3p t\u00e1c, v\u1eeba \u0111\u1ea5u tranh v\u1edbi nhau"], "a": 0, "s": "Ch\u01b0\u01a1ng 3", "e": {"p": 107, "t": "\u0110\u00e2y l\u00e0 s\u1ef1 th\u1ed1ng tr\u1ecb v\u1ec1 ch\u00ednh tr\u1ecb c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi ch\u00fac n\u0103ng th\u1ef1c hi\u1ec7n d\u00e2n ch\u1ee7 \u0111\u1ed1i v\u1ed1i nh\u00e2n d\u00e2n, t\u1ed5 ch\u1ee9c x\u00e2y d\u1ef1ng v\u00e0 b\u1ea3o v\u1ec7 ch\u1ebf \u0111\u1ed9 m\u1edbi, chuy\u00ean ch\u00ednh v\u1edbi nh\u1eefng ph\u1ea7n t\u1eed th\u00f9 \u0111\u1ecbch, ch\u1ed1ng l\u1ea1i nh\u00e2n d\u00e2n; l\u00e0 ti\u1ebfp t\u1ee5c cu\u1ed9c \u0111\u1ea5u tranh giai c\u1ea5p gi\u1eefa giai c\u1ea5p v\u00f4 s\u1ea3n \u0111\u00e3 chi\u1ebfn th\u1eafng nh\u01b0ng ch\u01b0a ph\u1ea3i \u0111\u00e3 to\u00e0n th\u1eafng v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n \u0111\u00e3 th\u1ea5t b\u1ea1i nh\u01b0ng ch\u01b0a ph\u1ea3i th\u1ea5t b\u1ea1i ho\u00e0n to\u00e0n. Cu\u1ed9c \u0111\u1ea5u tranh di\u1ec5n ra trong \u0111i\u1ec1u ki\u1ec7n m\u1ed1i - giai c\u1ea5p \u2026"}}, {"q": "V\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0:", "o": ["T\u1ed3n t\u1ea1i m\u1ed9t n\u1ec1n kinh t\u1ebf ch\u1ec9 c\u00f3 c\u00e1c th\u00e0nh ph\u1ea7n kinh t\u1ebf x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "T\u1ed3n t\u1ea1i m\u1ed9t ch\u1ebf \u0111\u1ed9 s\u1edf h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t d\u01b0\u1edbi hai h\u00ecnh th\u1ee9c: to\u00e0n d\u00e2n v\u00e0 t\u1eadp th\u1ec3", "N\u1ec1n kinh t\u1ebf ch\u1ec9 c\u00f3 hai th\u00e0nh ph\u1ea7n: kinh t\u1ebf nh\u00e0 n\u01b0\u1edbc v\u00e0 kinh t\u1ebf t\u1eadp th\u1ec3", "T\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n"], "a": 3, "s": "Ch\u01b0\u01a1ng 3", "e": {"p": 106, "t": "\u0110\u00f3 l\u00e0 th\u1eddi k\u1ef3 l\u00e2u d\u00e0i, gian kh\u1ed5 b\u1eaft \u0111\u1ea7u t\u1eeb khi giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n \u0111\u1ebfn khi x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. C\u00f3 th\u1ec3 kh\u00e1i qu\u00e1t nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m c\u01a1 b\u1ea3n c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i nh\u01b0 sau: a) Tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, t\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1\u00ec l\u1eadp."}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang \u0111i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: \u201cH\u00e3y d\u00f9ng c\u1ea3 hai tay m\u00e0 l\u1ea5y nh\u1eefng c\u00e1i t\u1ed1t c\u1ee7a n\u01b0\u1edbc ngo\u00e0i: Ch\u00ednh quy\u1ec1n X\u00f4 vi\u1ebft + tr\u1eadt t\u1ef1 \u1edf \u0111\u01b0\u1eddng s\u1eaft Ph\u1ed5 + [.........] + ng\u00e0nh gi\u00e1o d\u1ee5c qu\u1ed1c d\u00e2n M\u1ef9\u201d (L\u00eanin)", "o": ["V\u0103n h\u1ecdc ngh\u1ec7 thu\u1eadt c\u1ee7a \u00dd", "C\u00e1ch m\u1ea1ng c\u00f4ng nghi\u1ec7p \u1edf Anh", "Khoa h\u1ecdc k\u1ef9 thu\u1eadt c\u1ee7a \u0110\u1ee9c", "K\u1ef9 thu\u1eadt v\u00e0 c\u00e1ch th\u1ee9c t\u1ed5 ch\u1ee9c c\u00e1c T\u01a1 r\u1edbt \u1edf M\u1ef9"], "a": 3, "s": "Ch\u01b0\u01a1ng 3", "e": {"p": 96, "t": "L\u00eanin ch\u1ec9 r\u00f5, nh\u1eefng n\u01b0\u1edbc ch\u01b0a tr\u1ea3i qua ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n \u0111i l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i c\u1ea7n thi\u1ebft ph\u1ea3i h\u1ecdc h\u1ecfi kinh nghi\u1ec7m t\u1eeb c\u00e1c n\u01b0\u1ed1c ph\u00e1t tri\u1ec3n theo c\u00e1ch th\u1ee9c: \u201cD\u00f9ng c\u1ea3 hai tay m\u00e0 l\u1ea5y nh\u1eefng c\u00e1i t\u1ed1t c\u1ee7a n\u01b0\u1edbc ngo\u00e0i: Ch\u00ednh quy\u1ec1n X\u00f4vi\u1ebft + tr\u1eadt t\u1ef1 \u1edf \u0111\u01b0\u00f2ng s\u1eaft Ph\u1ed5 + k\u1ef9 thu\u1eadt v\u00e0 c\u00e1ch t\u1ed5 ch\u1ee9c c\u00e1c t\u01a1 - r\u1ed5t \u1edf M\u1ef9 + ng\u00e0nh gi\u00e1o d\u1ee5c qu\u1ed1c d\u00e2n M\u1ef9 etc."}}, {"q": "Trong cu\u1ed1n s\u00e1ch \u201cM\u1ed9t s\u1ed1 v\u1ea5n \u0111\u1ec1 l\u00fd lu\u1eadn v\u00e0 th\u1ef1c ti\u1ec5n v\u1ec1 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 con \u0111\u01b0\u1eddng \u0111i l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam\u201d, T\u1ed5ng B\u00ed th\u01b0 Nguy\u1ec5n Ph\u00fa Tr\u1ecdng kh\u1eb3ng \u0111\u1ecbnh: \u0111\u01b0\u1eddng l\u1ed1i c\u01a1 b\u1ea3n, xuy\u00ean su\u1ed1t c\u1ee7a c\u00e1ch m\u1ea1ng Vi\u1ec7t Nam v\u00e0 c\u0169ng l\u00e0 \u0111i\u1ec3m c\u1ed1t y\u1ebfu trong di s\u1ea3n t\u01b0 t\u01b0\u1edfng c\u1ee7a Ch\u1ee7 t\u1ecbch H\u1ed3 Ch\u00ed Minh l\u00e0:", "o": ["\u0110\u1ed9c l\u1eadp d\u00e2n t\u1ed9c g\u1eafn li\u1ec1n v\u1edbi ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i", "\u0110\u1ed9c l\u1eadp d\u00e2n t\u1ed9c g\u1eafn li\u1ec1n v\u1edbi h\u1ed9i nh\u1eadp kinh t\u1ebf qu\u1ed1c t\u1ebf", "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 gi\u1ea3i ph\u00f3ng giai c\u1ea5p v\u00f4 s\u1ea3n", "Ph\u00e1t tri\u1ec3n kinh t\u1ebf th\u1ecb tr\u01b0\u1eddng \u0111\u1ecbnh h\u01b0\u1edbng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a"], "a": 0, "s": "Ch\u01b0\u01a1ng 3", "e": null}, {"q": "Ba \u0111\u1ed9t ph\u00e1 chi\u1ebfn l\u01b0\u1ee3c \u0111\u01b0\u1ee3c Ngh\u1ecb quy\u1ebft \u0110\u1ea1i h\u1ed9i XIII n\u0103m 2021 c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam x\u00e1c \u0111\u1ecbnh l\u00e0:", "o": ["X\u00e2y d\u1ef1ng Nh\u00e0 n\u01b0\u1edbc ki\u1ebfn t\u1ea1o ph\u00e1t tri\u1ec3n; ph\u00e1t tri\u1ec3n kinh t\u1ebf s\u1ed1, x\u00e3 h\u1ed9i s\u1ed1; ph\u00e1t huy gi\u00e1 tr\u1ecb v\u0103n ho\u00e1, s\u1ee9c m\u1ea1nh con ng\u01b0\u1eddi Vi\u1ec7t Nam", "\u0110\u1ea9y m\u1ea1nh ph\u00f2ng ch\u1ed1ng tham nh\u0169ng; ph\u00e1t tri\u1ec3n kinh t\u1ebf tu\u1ea7n ho\u00e0n; x\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng k\u1ebft c\u1ea5u h\u1ea1 t\u1ea7ng \u0111\u1ed3ng b\u1ed9, hi\u1ec7n \u0111\u1ea1i", "Ho\u00e0n thi\u1ec7n \u0111\u1ed3ng b\u1ed9 th\u1ec3 ch\u1ebf ph\u00e1t tri\u1ec3n; ph\u00e1t tri\u1ec3n ngu\u1ed3n nh\u00e2n l\u1ef1c; x\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng k\u1ebft c\u1ea5u h\u1ea1 t\u1ea7ng \u0111\u1ed3ng b\u1ed9, hi\u1ec7n \u0111\u1ea1i", "X\u00e2y d\u1ef1ng Nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a; x\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng k\u1ebft c\u1ea5u h\u1ea1 t\u1ea7ng \u0111\u1ed3ng b\u1ed9, hi\u1ec7n \u0111\u1ea1i; ph\u00e1t huy gi\u00e1 tr\u1ecb v\u0103n ho\u00e1, s\u1ee9c m\u1ea1nh con ng\u01b0\u1eddi Vi\u1ec7t Nam"], "a": 2, "s": "Ch\u01b0\u01a1ng 3", "e": null}, {"q": "Theo c\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng Hy L\u1ea1p c\u1ed5 \u0111\u1ea1i, ph\u1ea1m tr\u00f9 d\u00e2n ch\u1ee7 - \u201cdemoskratos\u201d \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0:", "o": ["Nh\u00e2n d\u00e2n cai tr\u1ecb", "Quy\u1ec1n l\u1ef1c cho giai c\u1ea5p chi\u1ebfm s\u1ed1 \u0111\u00f4ng trong x\u00e3 h\u1ed9i", "Quy\u1ec1n t\u1ef1 do c\u1ee7a m\u1ed7i ng\u01b0\u1eddi", "Quy\u1ec1n l\u1ef1c cho giai c\u1ea5p c\u1ea7m quy\u1ec1n"], "a": 0, "s": "Ch\u01b0\u01a1ng 4", "e": {"p": 125, "t": "Thu\u1eadt ng\u1eef d\u00e2n ch\u1ee7 ra \u0111\u1eddi v\u00e0o kho\u1ea3ng th\u1ebf k\u1ef7 VII - VI tr\u01b0\u1edbc C\u00f4ng nguy\u00ean. C\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng Hy L\u1ea1p c\u1ed5 \u0111\u1ea1i \u0111\u00e3 d\u00f9ng c\u1ee5m t\u1eeb \u201cdemoskratos\u201d \u0111\u1ec3 n\u00f3i \u0111\u1ebfn d\u00e2n ch\u1ee7, trong \u0111\u00f3 \u201cdemos\u201d l\u00e0 nh\u00e2n d\u00e2n (danh t\u1eeb) v\u00e0 \u201ckratos\u201d l\u00e0 cai tr\u1ecb (\u0111\u1ed9ng t\u1eeb). Theo \u0111\u00f3, d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0 nh\u00e2n d\u00e2n cai tr\u1ecb, sau n\u00e0y \u0111\u01b0\u1ee3c c\u00e1c nh\u00e0 ch\u00ednh tr\u1ecb g\u1ecdi gi\u1ea3n l\u01b0\u1ee3c l\u00e0 quy\u1ec1n l\u1ef1c c\u1ee7a nh\u00e2n d\u00e2n, hay quy\u1ec1n l\u1ef1c thu\u1ed9c v\u1ec1 nh\u00e2n d\u00e2n."}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n quy\u1ec1n l\u1ef1c, d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0:", "o": ["Quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc thu\u1ed9c v\u1ec1 t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c Quy\u1ec1n", "Quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc thu\u1ed9c giai c\u1ea5p th\u1ed1ng tr\u1ecb", "Quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc thu\u1ed9c t\u1ea7ng l\u1edbp t\u0103ng l\u1eef", "Quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc thu\u1ed9c s\u1edf h\u1eefu c\u1ee7a nh\u00e2n d\u00e2n, c\u1ee7a x\u00e3 h\u1ed9i"], "a": 3, "s": "Ch\u01b0\u01a1ng 4", "e": {"p": 125, "t": "Th\u00fa nh\u1ea5t, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n quy\u1ec1n l\u1ef1c, d\u00e2n ch\u1ee7 l\u00e0 quy\u1ec1n l\u1ef1c thu\u1ed9c v\u1ec1 nh\u00e2n d\u00e2n, nh\u00e2n d\u00e2n l\u00e0 ch\u1ee7 nh\u00e2n c\u1ee7a nh\u00e0 n\u01b0\u1edbc. D\u00e2n ch\u1ee7 l\u00e0 quy\u1ec1n l\u1ee3i c\u1ee7a nh\u00e2n d\u00e2n - quy\u1ec1n d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u theo ngh\u0129a r\u1ed9ng. Quy\u1ec1n l\u1ee3i c\u0103n b\u1ea3n nh\u1ea5t c\u1ee7a nh\u00e2n d\u00e2n ch\u00ednh l\u00e0 quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1ed1c thu\u1ed9c s\u1edf h\u1eefu c\u1ee7a nh\u00e2n d\u00e2n, c\u1ee7a x\u00e3 h\u1ed9i;"}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0:", "o": ["Tuy\u1ec7t \u0111\u1ed1i nh\u1ea5t trong l\u1ecbch s\u1eed", "N\u1ec1n d\u00e2n ch\u1ee7 cho m\u1ecdi giai c\u1ea5p", "Ph\u00e1t tri\u1ec3n cao nh\u1ea5t so v\u1edbi c\u00e1c n\u1ec1n d\u00e2n ch\u1e
