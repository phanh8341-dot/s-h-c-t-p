1ec1u \u0111\u00fang(L\u00e0 m\u1ed9t khoa h\u1ecdc \u2013 Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc,L\u00e0 phong tr\u00e0o th\u1ef1c ti\u1ec5n,phong tr\u00e0o \u0111\u1ea5u tranh c\u1ee7a nh\u00e2n d\u00e2n lao \u0111\u1ed9ng ch\u1ed1ng c\u00e1c giai c\u1ea5p th\u1ed1ng tr\u1ecb,L\u00e0 tr\u00e0o l\u01b0u t\u01b0 t\u01b0\u1edfng, l\u00fd lu\u1eadn ph\u1ea3n \u00e1nh l\u00fd t\u01b0\u1edfng gi\u1ea3i ph\u00f3ng nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u1ecfi \u00e1p b\u1ee9c, b\u00f3c l\u1ed9t, b\u1ea5t c\u00f4ng)", "e": {"p": 86, "t": "2) L\u00e0 tr\u00e0o l\u01b0u t\u01b0 t\u01b0\u1edfng, l\u00fd lu\u1eadn ph\u1ea3n \u00e1nh l\u00fd t\u01b0\u1edfng gi\u1ea3i ph\u00f3ng nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u1ecfi \u00e1p b\u1ee9c, b\u00f3c l\u1ed9t, b\u1ea5t c\u00f4ng; 3) L\u00e0 m\u1ed9t khoa h\u1ecdc - ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc l\u00e0 khoa h\u1ecdc v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n;", "a": 1}}, {"q": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i t\u1ed1t \u0111\u1eb9p,\u2026 c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ee7a c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a", "a": "Giai \u0111o\u1ea1n \u0111\u1ea7u", "e": {"p": 86, "t": "4) L\u00e0 m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i t\u1ed1t \u0111\u1eb9p, giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a. Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a C\u00e1c nh\u00e0 s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc c.", "a": 1}}, {"q": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i nghi\u00ean c\u1ee9u v\u1ea5n \u0111\u1ec1 t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o d\u01b0\u1edbi g\u00f3c \u0111\u1ed9 n\u00e0o?", "a": "C\u1ea3 a, b v\u00e0 c(G\u00f3c \u0111\u1ed9 ch\u00ednh tr\u1ecb-x\u00e3 h\u1ed9i,H\u00ecnh th\u00e1i \u00fd th\u1ee9c x\u00e3 h\u1ed9i,T\u00e2m l\u00fd-x\u00e3 h\u1ed9i)", "e": null}, {"q": "Ch\u1ee7 tr\u01b0\u01a1ng th\u1ef1c hi\u1ec7n nh\u1ea5t qu\u00e1n ch\u00ednh s\u00e1ch \u0111\u1ea1i \u0111o\u00e0n k\u1ebft d\u00e2n t\u1ed9c c\u1ee7a \u0110\u1ea3ng v\u00e0 Nh\u00e0 n\u01b0\u1edbc ta \u0111\u01b0\u1ee3c th\u1ec3 hi\u1ec7n nh\u01b0 th\u1ebf n\u00e0o? L\u1ef1a ch\u1ecdn ph\u01b0\u01a1ng \u00e1n sai.", "a": "Khuy\u1ebfn kh\u00edch ho\u1ea1t \u0111\u1ed9ng t\u00f4n gi\u00e1o mang t\u00ednh t\u00e2m linh, m\u00ea t\u00edn d\u1ecb \u0111oan", "e": null}, {"q": "Ch\u1ee9c n\u0103ng n\u00e0o c\u1ee7a gia \u0111\u00ecnh \u0111\u1ea3m b\u1ea3o t\u00e1i s\u1ea3n xu\u1ea5t ngu\u1ed3n lao \u0111\u1ed9ng v\u00e0 s\u1ee9c lao \u0111\u1ed9ng cho x\u00e3 h\u1ed9i", "a": "Ch\u1ee9c n\u0103ng t\u00e1i s\u1ea3n xu\u1ea5t ra con ng\u01b0\u1eddi", "e": {"p": 244, "t": "Ch\u1ee9c n\u0103ng c\u01a1 b\u1ea3n c\u1ee7a gia \u0111\u00ecnh a) Ch\u1ee9c n\u0103ng t\u00e1i s\u1ea3n xu\u1ea5t ra con ng\u01b0\u1eddi \u0110\u00e2y l\u00e0 ch\u1ee9c n\u0103ng \u0111\u1eb7c th\u00f9 c\u1ee7a gia \u0111\u00ecnh, kh\u00f4ng m\u1ed9t c\u1ed9ng \u0111\u1ed3ng n\u00e0o c\u00f3 th\u1ec3 thay th\u1ebf. Ch\u1ee9c n\u0103ng n\u00e0y kh\u00f4ng ch\u1ec9 \u0111\u00e1p \u1ee9ng nhu c\u1ea7u t\u00e2m, sinh l\u00fd t\u1ef1 nhi\u00ean c\u1ee7a con ng\u01b0\u1eddi, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u duy tr\u00ec n\u00f2i gi\u1ed1ng c\u1ee7a gia \u0111\u00ecnh, d\u00f2ng h\u1ecd m\u00e0 c\u00f2n \u0111\u00e1p \u1ee9ng nhu c\u1ea7u v\u1ec1 s\u1ee9c lao \u0111\u1ed9ng v\u00e0 duy tr\u00ec s\u1ef1 tr\u01b0\u1eddng t\u1ed3n c\u1ee7a x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "Ch\u1ee9c n\u0103ng n\u00e0o sau \u0111\u00e2y c\u1ee7a gia \u0111\u00ecnh \u1ea3nh h\u01b0\u1edfng l\u00e2u d\u00e0i v\u00e0 to\u00e0n di\u1ec7n \u0111\u1ed1i v\u1edbi m\u1ed7i c\u00e1 nh\u00e2n trong cu\u1ed9c \u0111\u1eddi, t\u1eeb l\u00fac c\u00f2n b\u00e9 cho \u0111\u1ebfn khi tr\u01b0\u1edfng th\u00e0nh v\u00e0 tu\u1ed5i gi\u00e0?", "a": "Ch\u1ee9c n\u0103ng nu\u00f4i d\u01b0\u1ee1ng, gi\u00e1o d\u1ee5c.", "e": {"p": 245, "t": "Ch\u1ee9c n\u0103ng nu\u00f4i d\u01b0\u1ee1ng, gi\u00e1o d\u1ee5c c\u00f3 \u1ea3nh h\u01b0\u1edfng l\u00e2u d\u00e0i v\u00e0 to\u00e0n di\u1ec7n \u0111\u1ebfn cu\u1ed9c \u0111\u1eddi c\u1ee7a m\u1ed7i th\u00e0nh vi\u00ean, t\u1eeb l\u00fac l\u1ecdt"}}, {"q": "Ch\u1ee9c n\u0103ng n\u00e0o sau \u0111\u00e2y \u0111\u1ea3m b\u1ea3o t\u00e1i s\u1ea3n xu\u1ea5t ngu\u1ed3n lao \u0111\u1ed9ng v\u00e0 s\u1ee9c lao \u0111\u1ed9ng cho x\u00e3 h\u1ed9i", "a": "Ch\u1ee9c n\u0103ng t\u00e1i s\u1ea3n xu\u1ea5t ra con ng\u01b0\u1eddi.", "e": {"p": 244, "t": "Ch\u1ee9c n\u0103ng c\u01a1 b\u1ea3n c\u1ee7a gia \u0111\u00ecnh a) Ch\u1ee9c n\u0103ng t\u00e1i s\u1ea3n xu\u1ea5t ra con ng\u01b0\u1eddi \u0110\u00e2y l\u00e0 ch\u1ee9c n\u0103ng \u0111\u1eb7c th\u00f9 c\u1ee7a gia \u0111\u00ecnh, kh\u00f4ng m\u1ed9t c\u1ed9ng \u0111\u1ed3ng n\u00e0o c\u00f3 th\u1ec3 thay th\u1ebf. Ch\u1ee9c n\u0103ng n\u00e0y kh\u00f4ng ch\u1ec9 \u0111\u00e1p \u1ee9ng nhu c\u1ea7u t\u00e2m, sinh l\u00fd t\u1ef1 nhi\u00ean c\u1ee7a con ng\u01b0\u1eddi, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u duy tr\u00ec n\u00f2i gi\u1ed1ng c\u1ee7a gia \u0111\u00ecnh, d\u00f2ng h\u1ecd m\u00e0 c\u00f2n \u0111\u00e1p \u1ee9ng nhu c\u1ea7u v\u1ec1 s\u1ee9c lao \u0111\u1ed9ng v\u00e0 duy tr\u00ec s\u1ef1 tr\u01b0\u1eddng t\u1ed3n c\u1ee7a x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "Ch\u1ee9c n\u0103ng v\u00e0 nhi\u1ec7m v\u1ee5 c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc l\u00e0 g\u00ec?", "a": "L\u00e0 trang b\u1ecb nh\u1eefng tri th\u1ee9c khoa h\u1ecdc c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin \u0111\u00e3 ph\u00e1t hi\u1ec7n ra v\u00e0 lu\u1eadn gi\u1ea3i v\u1ec1 qu\u00e1 tr\u00ecnh t\u1ea5t y\u1ebfu l\u1ecbch s\u1eed d\u1eabn \u0111\u1ebfn h\u00ecnh th\u00e0nh, ph\u00e1t tri\u1ec3n h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n, gi\u1ea3i ph\u00f3ng x\u00e3 h\u1ed9i, gi\u1ea3i ph\u00f3ng con ng\u01b0\u1eddi-L\u00e0 gi\u00e1o d\u1ee5c, trang b\u1ecb l\u1eadp tr\u01b0\u1eddng t\u01b0 t\u01b0\u1edfng ch\u00ednh tr\u1ecb c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n cho \u0111\u1ea3ng c\u1ed9ng s\u1ea3n, giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng-L\u00e0 \u0111\u1ecbnh h\u01b0\u1edbng v\u1ec1 ch\u00ednh tr\u1ecb \u2013 x\u00e3 h\u1ed9i cho m\u1ecdi ho\u1ea1t \u0111\u1ed9ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n,c\u1ee7a \u0111\u1ea3ng c\u1ed9ng s\u1ea3n, c\u1ee7a nh\u00e0 n\u01b0\u1edbc v\u00e0 c\u1ee7a nh\u00e2n d\u00e2n lao \u0111\u1ed9ng tr\u00ean m\u1ecdi l\u0129nh v\u1ef1c.", "e": {"p": 45, "t": "\u00dd ngh\u0129a c\u1ee7a vi\u1ec7c nghi\u00ean c\u1ee9u ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc a) V\u1ec1 m\u1eb7t l\u00fd lu\u1eadn Nghi\u00ean c\u1ee9u, h\u1ecdc t\u1eadp v\u00e0 ph\u00e1t tri\u1ec3n ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc, v\u1ec1 m\u1eb7t l\u00fd lu\u1eadn, nh\u1eb1m trang b\u1ecb nh\u1eefng nh\u1eadn th\u1ee9c ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u00e0 ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn khoa h\u1ecdc v\u1ec1 qu\u00e1 tr\u00ecnh t\u1ea5t y\u1ebfu l\u1ecbch s\u1eed d\u1eabn \u0111\u1ebfn s\u1ef1 h\u00ecnh th\u00e0nh, ph\u00e1t tri\u1ec3n h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a, gi\u1ea3i ph\u00f3ng x\u00e3 h\u1ed9i, gi\u1ea3i ph\u00f3ng con ng\u01b0\u1eddi...", "a": 1}}, {"q": "C\u00f3 bao nhi\u00eau \u0111i\u1ec1u ki\u1ec7n x\u00e2y d\u1ef1ng gia \u0111\u00ecnh trong qu\u00e1 tr\u00ecnh x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i?", "a": "3, g\u1ed3m: \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i, ch\u00ednh tr\u1ecb v\u00e0 v\u0103n h\u00f3a - x\u00e3 h\u1ed9i.", "e": {"p": 252, "t": "S\u1ef1 ph\u00e1t tri\u1ec3n h\u1ec7 th\u1ed1ng gi\u00e1o d\u1ee5c, \u0111\u00e0o t\u1ea1o, khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7 g\u00f3p ph\u1ea7n n\u00e2ng cao tr\u00ecnh \u0111\u1ed9 d\u00e2n tr\u00ed, ki\u1ebfn th\u1ee9c khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7 c\u1ee7a x\u00e3 h\u1ed9i, \u0111\u1ed3ng th\u1eddi c\u0169ng cung c\u1ea5p cho c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh ki\u1ebfn th\u1ee9c, nh\u1eadn th\u1ee9c m\u1edbi, l\u00e0m n\u1ec1n t\u1ea3ng cho s\u1ef1 h\u00ecnh th\u00e0nh nh\u1eefng gi\u00e1 tr\u1ecb, chu\u1ea9n m\u1ef1c m\u1edbi, \u0111i\u1ec1u ch\u1ec9nh c\u00e1c m\u1ed1\u00ec quan h\u1ec7 gia \u0111\u00ecnh trong qu\u00e1 tr\u00ecnh x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "C\u00f3 bao nhi\u00eau m\u1ed1i quan h\u1ec7 c\u01a1 b\u1ea3n \u0111\u01b0\u1ee3c xem l\u00e0 c\u01a1 s\u1edf h\u00ecnh th\u00e0nh gia \u0111\u00ecnh? \u0110\u00f3 l\u00e0 nh\u1eefng m\u1ed1i quan h\u1ec7 n\u00e0o?", "a": "2, l\u00e0 quan h\u1ec7 h\u00f4n nh\u00e2n v\u00e0 quan h\u1ec7 huy\u1ebft th\u1ed1ng.", "e": {"p": 239, "t": "C\u01a1 s\u1edf h\u00ecnh th\u00e0nh gia \u0111\u00ecnh l\u00e0 hai m\u1ed1i quan h\u1ec7 c\u01a1 b\u1ea3n, quan h\u1ec7 h\u00f4n nh\u00e2n (v\u1ee3 v\u00e0 ch\u1ed3ng) v\u00e0 quan h\u1ec7 huy\u1ebft th\u1ed1ng (cha m\u1eb9 v\u00e0 con c\u00e1i...). Nh\u1eefng m\u1ed1i quan h\u1ec7 n\u00e0y t\u1ed3n t\u1ea1i trong s\u1ef1 g\u1eafn b\u00f3, li\u00ean k\u1ebft, r\u00e0ng bu\u1ed9c v\u00e0 ph\u1ee5 thu\u1ed9c l\u1eabn nhau, b\u1edfi ngh\u0129a v\u1ee5, quy\u1ec1n l\u1ee3i v\u00e0 tr\u00e1ch nhi\u1ec7m c\u1ee7a m\u1ed7i ng\u01b0\u1eddi, \u0111\u01b0\u1ee3c quy \u0111\u1ecbnh b\u1eb1ng ph\u00e1p l\u00fd ho\u1eb7c \u0111\u1ea1o l\u00fd.", "a": 1}}, {"q": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p gi\u1eef vai tr\u00f2 quan tr\u1ecdng h\u00e0ng \u0111\u1ea7u trong h\u1ec7 th\u1ed1ng x\u00e3 h\u1ed9i b\u1edfi l\u00fd do sau", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p li\u00ean quan \u0111\u1ebfn nh\u1eefng m\u1ed1i quan h\u1ec7 quan tr\u1ecdng m\u00e0 c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00e1c kh\u00f4ng c\u00f3 \u0111\u01b0\u1ee3c.", "e": {"p": 166, "t": "Song v\u1ecb tr\u00ed, vai tr\u00f2 c\u1ee7a c\u00e1c lo\u1ea1i c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00f4ng ngang nhau, trong \u0111\u00f3, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p c\u00f3 v\u1ecb tr\u00ed quan tr\u1ecdng h\u00e0ng \u0111\u1ea7u, chi ph\u1ed1i c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00e1c v\u00ec nh\u1eefng l\u00fd do c\u01a1 b\u1ea3n sau: - C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p li\u00ean quan \u0111\u1ebfn c\u00e1c \u0111\u1ea3ng ph\u00e1i ch\u00ednh tr\u1ecb v\u00e0 nh\u00e0 n\u01b0\u1edbc;", "a": 1}}, {"q": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p gi\u1eef v\u1ecb tr\u00ed quan tr\u1ecdng nh\u1ea5t trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i v\u00ec: (ch\u1ecdn 1 ph\u01b0\u01a1ng \u00e1n \u0111\u00fang nh\u1ea5t)", "a": "T\u1ea5t c\u1ea3 c\u00e1c \u0111\u00e1p \u00e1n \u0111\u1ec1u \u0111\u00fang", "e": null}, {"q": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i c\u1ee7a x\u00e3 h\u1ed9i TBCN \u0111\u01b0\u1ee3c \u0111\u1eb7c tr\u01b0ng b\u1edfi hai giai c\u1ea5p c\u01a1 b\u1ea3n \u0111\u1ed1i l\u1eadp nhau v\u1ec1 l\u1ee3i \u00edch l\u00e0 Giai", "a": "c\u1ea5p t\u01b0 s\u1ea3n v\u00e0 giai c\u1ea5p v\u00f4 s\u1ea3n", "e": {"p": 12, "t": "C\u00f9ng v\u1edbi qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n c\u1ee7a n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, s\u1ef1 ra \u0111\u1eddi hai giai c\u1ea5p c\u00f3 l\u1ee3i \u00edch c\u01a1 b\u1ea3n \u0111\u1ed1i l\u1eadp nhau: giai c\u1ea5p t\u01b0 s\u1ea3n v\u00e0 giai c\u1ea5p v\u00f4 s\u1ea3n (giai c\u1ea5p c\u00f4ng nh\u00e2n).", "a": 1}}, {"q": "C\u01a1 s\u1edf h\u00ecnh th\u00e0nh n\u00ean gia \u0111\u00ecnh l\u00e0 hai m\u1ed1i quan h\u1ec7 c\u01a1 b\u1ea3n n\u00e0o?", "a": "Quan h\u1ec7 h\u00f4n nh\u00e2n v\u00e0 quan h\u1ec7 huy\u1ebft th\u1ed1ng", "e": {"p": 239, "t": "C\u01a1 s\u1edf h\u00ecnh th\u00e0nh gia \u0111\u00ecnh l\u00e0 hai m\u1ed1i quan h\u1ec7 c\u01a1 b\u1ea3n, quan h\u1ec7 h\u00f4n nh\u00e2n (v\u1ee3 v\u00e0 ch\u1ed3ng) v\u00e0 quan h\u1ec7 huy\u1ebft th\u1ed1ng (cha m\u1eb9 v\u00e0 con c\u00e1i...). Nh\u1eefng m\u1ed1i quan h\u1ec7 n\u00e0y t\u1ed3n t\u1ea1i trong s\u1ef1 g\u1eafn b\u00f3, li\u00ean k\u1ebft, r\u00e0ng bu\u1ed9c v\u00e0 ph\u1ee5 thu\u1ed9c l\u1eabn nhau, b\u1edfi ngh\u0129a v\u1ee5, quy\u1ec1n l\u1ee3i v\u00e0 tr\u00e1ch nhi\u1ec7m c\u1ee7a m\u1ed7i ng\u01b0\u1eddi, \u0111\u01b0\u1ee3c quy \u0111\u1ecbnh b\u1eb1ng ph\u00e1p l\u00fd ho\u1eb7c \u0111\u1ea1o l\u00fd.", "a": 1}}, {"q": "C\u01a1 s\u1edf kinh t\u1ebf c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1?", "a": "T\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu", "e": {"p": 138, "t": "Kh\u00e1c v\u1edbi n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n, b\u1ea3n ch\u1ea5t kinh t\u1ebf c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 th\u1ef1c hi\u1ec7n ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu v\u00e0 th\u1ef1c hi\u1ec7n ch\u1ebf \u0111\u1ed9 ph\u00e2n ph\u1ed5i l\u1ee3i \u00edch theo k\u1ebft qu\u1ea3 lao \u0111\u1ed9ng l\u00e0 ch\u1ee7 y\u1ebfu. B\u1ea3n ch\u1ea5t t\u01b0 t\u01b0\u1edfng - v\u0103n h\u00f3a - x\u00e3 h\u1ed9i:", "a": 1}}, {"q": "C\u01a1 s\u1edf v\u1eadt ch\u1ea5t \u2013 k\u1ef9 thu\u1eadt c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00e0 g\u00ec?", "a": "N\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p c\u01a1 kh\u00ed", "e": {"p": 29, "t": "x\u00e2y d\u1ef1ng n\u1ec1n c\u00f4ng nghi\u1ec7p hi\u1ec7n \u0111\u1ea1i v\u00e0 \u0111i\u1ec7n kh\u00ed h\u00f3a l\u00e0 c\u01a1 s\u1edf v\u1eadt ch\u1ea5t - k\u1ef9 thu\u1eadt c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i; h\u1ecdc ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u1ec1 k\u1ef9 thu\u1eadt, kinh nghi\u1ec7m qu\u1ea3n l\u00fd kinh t\u1ebf, tr\u00ecnh \u0111\u1ed9 gi\u00e1o d\u1ee5c;", "a": 1}}, {"q": "Con ng\u01b0\u1eddi ph\u00e1t tri\u1ec3n v\u00e0 ho\u00e0n thi\u1ec7n m\u00ecnh ch\u1ee7 y\u1ebfu d\u1ef1a tr\u00ean y\u1ebfu t\u1ed1 n\u00e0o?", "a": "Lao \u0111\u1ed9ng s\u1ea3n xu\u1ea5t", "e": null}, {"q": "Con ng\u01b0\u1eddi x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a bao g\u1ed3m nh\u1eefng con ng\u01b0\u1eddi t\u1eeb x\u00e3 h\u1ed9i n\u00e0o?", "a": "T\u1eeb x\u00e3 h\u1ed9i c\u0169 \u0111\u1ec3 l\u1ea1i v\u00e0 sinh ra trong x\u00e3 h\u1ed9i m\u1edbi", "e": null}, {"q": "C\u00f4ng lao c\u1ee7a L\u00eanin trong vi\u1ec7c v\u1eadn d\u1ee5ng v\u00e0 ph\u00e1t tri\u1ec3n ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi l\u00e0", "a": "X\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i hi\u1ec7n th\u1ef1c", "e": {"p": 24, "t": "L\u00eanin v\u1eadn d\u1ee5ng v\u00e0 ph\u00e1t tri\u1ec3n ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi V.I. L\u00eanin (1870 - 1924) l\u00e0 ng\u01b0\u1eddi \u0111\u00e3 k\u1ebf t\u1ee5c xu\u1ea5t s\u1eafc s\u1ef1 nghi\u1ec7p c\u00e1ch m\u1ea1ng v\u00e0 khoa h\u1ecdc c\u1ee7a c.", "a": 1}}, {"q": "Cu\u1ed9c c\u00e1ch m\u1ea1ng v\u00f4 s\u1ea3n \u0111\u1ea7u ti\u00ean tr\u00ean th\u1ebf gi\u1edbi l\u00e0 cu\u1ed9c c\u00e1ch m\u1ea1ng n\u00e0o?", "a": "C\u00f4ng x\u00e3 Pari 1871", "e": null}, {"q": "C\u01b0\u01a1ng l\u0129nh x\u00e2y d\u1ef1ng \u0111\u1ea5t n\u01b0\u1edbc trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u0111\u01b0\u1ee3c \u0110\u1ea3ng ta n\u00eau ra \u1edf \u0110\u1ea1i h\u1ed9i n\u00e0o?", "a": "\u0110\u1ea1i h\u1ed9i VII", "e": {"p": 112, "t": "C\u01b0\u01a1ng l\u0129nh x\u00e2y d\u1ef1ng \u0111\u1ea5t n\u01b0\u1edbc trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i (1991), \u0111\u00e3 x\u00e1c \u0111\u1ecbnh m\u00f4 h\u00ecnh ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta v\u1edbi s\u00e1u \u0111\u1eb7c tr\u1ee9ng1:", "a": 1}}, {"q": "C.M\u00e1c v\u00e0 Ph.\u0102ngghen \u0111\u00e3 k\u1ebf th\u1eeba g\u00ec \u1edf V.Ph. H\u00eaghen v\u00e0 L. Phoi\u01a1 b\u1eafc \u0111\u1ec3 s\u1ea3ng l\u1eadp ch\u1ee7 ngh\u0129a duy v\u1eadt bi\u1ec7n ch\u1ee9ng?", "a": "Ph\u00e9p bi\u1ec7n ch\u1ee9ng c\u1ee7a V.Ph. H\u00eaghen v\u00e0 quan \u0111i\u1ec3m duy v\u1eadt c\u1ee7a L.Phoi\u01a1 b\u1eafc", "e": {"p": 18, "t": "\u0102ngghen -Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed Tr\u00ean c\u01a1 s\u1edf k\u1ebf th\u1eeba \u201cc\u00e1i h\u1ea1t nh\u00e2n h\u1ee3p l\u00fd\u201d c\u1ee7a ph\u00e9p bi\u1ec7n ch\u1ee9ng v\u00e0 ph\u00ea ph\u00e1n quan \u0111i\u1ec3m duy t\u00e2m, th\u1ea7n b\u00ed c\u1ee7a tri\u1ebft h\u1ecdc Ph. k\u1ebf th\u1eeba nh\u1eefng gi\u00e1 tr\u1ecb duy v\u1eadt v\u00e0 lo\u1ea1i b\u1ecf quan \u0111i\u1ec3m si\u00eau h\u00ecnh c\u1ee7a tri\u1ebft h\u1ecdc L.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n KH\u00d4NG \u0111\u00fang: Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0", "a": "L\u00e0 m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i t\u1ed1t \u0111\u1eb9p, giai \u0111o\u1ea1n sau c\u1ee7a h\u00ecnh th\u00e1i 2 3 kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a", "e": {"p": 86, "t": "4) L\u00e0 m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i t\u1ed1t \u0111\u1eb9p, giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a. Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a C\u00e1c nh\u00e0 s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc c.", "a": 1}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang \u0111i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: \u201c.....\u201d l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a s\u1ef1 k\u1ebft h\u1ee3p ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n trong cu\u1ed9c \u0111\u1ea5u tranh th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n\u201d.", "a": "\u0110\u1ea3ng c\u1ed9ng s\u1ea3n", "e": {"p": 63, "t": "\u0111\u1ec3 cu\u1ed9c c\u00e1ch m\u1ea1ng th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111i t\u1edbi th\u1eafng l\u1ee3i, ph\u1ea3i c\u00f3 s\u1ef1 li\u00ean minh giai c\u1ea5p gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u1ea5c do giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua \u0111\u1ed9i ti\u00ean phong c\u1ee7a n\u00f3 l\u00e0 1. \u0110\u1ea3ng C\u1ed9ng s\u1ea3n l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a s\u1ef1 k\u1ebft h\u1ee3p gi\u1eefa ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n.", "a": 1}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang nh\u1ea5t v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "a": "X\u00f3a b\u1ecf m\u1ecdi \u00e1p b\u1ee9c, b\u00f3c l\u1ed9t, b\u1ea5t c\u00f4ng trong ch\u1ebf \u0111\u1ed9 TBCN, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ebf \u0111\u1ed9 XHCN.", "e": null}, {"q": "C.M\u00e1c v\u00e0 Ph.\u0102ngghen vi\u1ebft: \"trong qu\u00e1 tr\u00ecnh th\u1ed1ng tr\u1ecb giai c\u1ea5p ch\u01b0a \u0111\u1ea7y m\u1ed9t th\u1ebf k\u1ef7, \u0111\u00e3 t\u1ea1o ra nh\u1eefng l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t nhi\u1ec1u h\u01a1n v\u00e0 \u0111\u1ed3 s\u1ed9 h\u01a1n l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t c\u1ee7a t\u1ea5t c\u1ea3 c\u00e1c th\u1ebf h\u1ec7 tr\u01b0\u1edbc g\u1ed9p l\u1ea1i\u201d. \u0110\u00f3 l\u00e0 nh\u1eadn x\u00e9t v\u1ec1 giai c\u1ea5p n\u00e0o?", "a": "Giai c\u1ea5p t\u01b0 s\u1ea3n", "e": {"p": 12, "t": "\u201cGiai c\u1ea5p t\u01b0 s\u1ea3n, trong qu\u00e1 tr\u00ecnh th\u1ed1ng tr\u1ecb giai c\u1ea5p ch\u01b0a \u0111\u1ea7y m\u1ed9t th\u1ebf k\u1ef7, \u0111\u00e3 t\u1ea1o ra nh\u1eefng l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t nhi\u1ec1u h\u01a1n v\u00e0 \u0111\u1ed3 s\u1ed9 h\u01a1n l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t c\u1ee7a t\u1ea5 t c\u1ea3 c\u00e1c th\u1ebf h\u1ec7 tr\u01b0\u1edbc kia g\u1ed9p l\u1ea1i\u201d1.", "a": 1}}, {"q": "C\u00e1c d\u00e2n t\u1ed9c trong t\u1eebng qu\u1ed1c gia, th\u1eadm ch\u00ed c\u00e1c d\u00e2n t\u1ed9c \u1edf nhi\u1ec1u qu\u1ed1c gia mu\u1ed1n li\u00ean hi\u1ec7p l\u1ea1i v\u1edbi nhau - l\u00e0 xu h\u01b0\u1edbng n\u1ed5i l\u00ean trong giai \u0111o\u1ea1n n\u00e0o?", "a": "Ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n \u0111\u00e3 ph\u00e1t tri\u1ec3n th\u00e0nh ch\u1ee7 ngh\u0129a \u0111\u1ebf qu\u1ed1c \u0111i b\u00f3c l\u1ed9t thu\u1ed9c \u0111\u1ecba", "e": {"p": 201, "t": "Xu h\u01b0\u1edbng th\u1ee9 hai, c\u1ea5c d\u00e2n t\u1ed9c trong t\u1eebng qu\u1ed1c gia, th\u1eadm ch\u00ed c\u00e1c d\u00e2n t\u1ed9c \u1edf nhi\u1ec1u qu\u1ed1c gia mu\u00f4n li\u00ean hi\u1ec7p l\u1ea1i v\u1edbi nhau. Xu h\u01b0\u1edbng n\u00e0y n\u1ed5i l\u00ean trong giai \u0111o\u1ea1n ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n \u0111\u00e3 ph\u00e1t tri\u1ec3n th\u00e0nh ch\u1ee7 ngh\u0129a \u0111\u1ebf qu\u1ed1c \u0111i b\u00f3c l\u1ed9t thu\u1ed9c \u0111\u1ecba;", "a": 1}}, {"q": "C\u00e1ch m\u1ea1ng v\u00f4 s\u1ea3n l\u00e0 cu\u1ed9c c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n, tr\u00ean th\u1ef1c t\u1ebf \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n b\u1eb1ng con \u0111\u01b0\u1eddng", "a": "B\u1ea1o l\u1ef1c c\u00e1ch m\u1ea1ng", "e": {"p": 91, "t": "C\u00e1ch m\u1ea1ng v\u00f4 s\u1ea3n l\u00e0 cu\u1ed9c c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n, tr\u00ean th\u1ef1c t\u1ebf \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n b\u1eb1ng con \u0111\u01b0\u1eddng b\u1ea1o l\u1ef1c c\u00e1ch m\u1ea1ng nh\u1eb1m l\u1eadt \u0111\u1ed5 ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, thi\u1ebft l\u1eadp nh\u00e0 n\u01b0\u1edbc chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n, th\u1ef1c hi\u1ec7n s\u1ef1 nghi\u1ec7p c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i c\u0169, x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i m\u1edbi, x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a v\u00e0 c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a.", "a": 1}}, {"q": "C\u00e1ch m\u1ea1ng v\u00f4 s\u1ea3n l\u00e0 cu\u1ed9c c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n, v\u1ec1 m\u1eb7t l\u00fd thuy\u1ebft c\u0169ng c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ti\u1ebfn h\u00e0nh b\u1eb1ng con \u0111\u01b0\u1eddng", "a": "H\u00f2a b\u00ecnh", "e": {"p": 91, "t": "C\u00e1ch m\u1ea1ng v\u00f4 s\u1ea3n l\u00e0 cu\u1ed9c c\u00e1ch m\u1ea1ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n, tr\u00ean th\u1ef1c t\u1ebf \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n b\u1eb1ng con \u0111\u01b0\u1eddng b\u1ea1o l\u1ef1c c\u00e1ch m\u1ea1ng nh\u1eb1m l\u1eadt \u0111\u1ed5 ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, thi\u1ebft l\u1eadp nh\u00e0 n\u01b0\u1edbc chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n, th\u1ef1c hi\u1ec7n s\u1ef1 nghi\u1ec7p c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i c\u0169, x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i m\u1edbi, x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a v\u00e0 c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a.", "a": 1}}, {"q": "C\u00e2u n\u00f3i: \"Ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 l\u00e0 m\u1ed9t h\u00ecnh th\u1ee9c nh\u00e0 n\u01b0\u1edbc, m\u1ed9t trong nh\u1eefng h\u00ecnh th\u00e1i c\u1ee7a nh\u00e0 n\u01b0\u1edbc. Cho n\u00ean c\u0169ng nh\u01b0 m\u1ecdi nh\u00e0 n\u01b0\u1edbc, ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 l\u00e0 vi\u1ec7c th\u00ec h\u00e0nh c\u00f3 t\u1ed5 ch\u1ee9c, c\u00f3 h\u1ec7 th\u1ed1ng s\u1ef1 c\u01b0\u1ee1ng b\u1ee9c \u0111\u1ed1i v\u1edbi ng\u01b0\u1eddi ta\" l\u00e0 c\u1ee7a", "a": "V..L\u00eanin", "e": null}, {"q": "Ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 XHCN \u0111\u01b0\u1ee3c thi\u1ebft l\u1eadp cho", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 \u0111a s\u1ed1 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng.", "e": {"p": 57, "t": "Thi\u1ebft l\u1eadp nh\u00e0 n\u01b0\u1edbc ki\u1ec3u m\u1edbi, mang b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, x\u00e2y d\u1ef1ng n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, th\u1ef1c hi\u1ec7n quy\u1ec1n l\u1ef1c c\u1ee7a nh\u00e2n d\u00e2n, quy\u1ec1n d\u00e2n ch\u1ee7 v\u00e0 l\u00e0m ch\u1ee7 x\u00e3 h\u1ed9i c\u1ee7a tuy\u1ec7t \u0111\u1ea1i \u0111a s\u1ed1 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng.", "a": 1}}, {"q": "Ch\u1ec9 ra m\u1ed9t lu\u1eadn \u0111i\u1ec3m \u0111\u00fang nh\u1ea5t trong c\u00e1c c\u00e2u sau \u0111\u00e2y", "a": "Li\u00ean minh c\u00f4ng n\u00f4ng l\u00e0 nguy\u00ean t\u1eafc cao nh\u1ea5t c\u1ee7a chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n", "e": {"p": 173, "t": "Nguy\u00ean t\u1eafc cao nh\u1ea5t c\u1ee7a chuy\u00ean ch\u00ednh l\u00e0 duy tr\u00ec kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p v\u00f4 s\u1ea3n v\u00e0 n\u00f4ng d\u00e2n \u0111\u1ec3 giai c\u1ea5p v\u00f4 s\u1ea3n c\u00f3 th\u1ec3 gi\u1eef \u0111\u01b0\u1ee3c vai tr\u00f2 l\u00e3nh \u0111\u1ea1o v\u00e0 ch\u00ednh quy\u1ec1n nh\u00e0 n\u01b0\u1edbc\u201d1.", "a": 1}}, {"q": "Ch\u00ednh s\u00e1ch t\u00f4n gi\u00e1o c\u01a1 b\u1ea3n c\u1ee7a \u0110\u1ea3ng ta hi\u1ec7n nay l\u00e0", "a": "\u0110\u1ea3m b\u1ea3o t\u1ef1 do t\u00edn ng\u01b0\u1ee1ng, m\u1ecdi t\u00f4n gi\u00e1o ho\u1ea1t \u0111\u1ed9ng theo khu\u00f4n kh\u1ed5 v\u00e0 b\u00ecnh \u0111\u1eb3ng tr\u01b0\u1edbc ph\u00e1p lu\u1eadt", "e": {"p": 225, "t": "C\u00e1c t\u00f4n gi\u00e1o ho\u1ea1t \u0111\u1ed9ng trong khu\u00f4n kh\u1ed5 ph\u00e1p lu\u1eadt, b\u00ecnh \u0111\u1eb3ng tr\u01b0\u1edbc ph\u00e1p lu\u1eadt. - \u0110\u1ea3ng, Nh\u00e0 n\u01b0\u1edbc th\u1ef1c hi\u1ec7n nh\u1ea5t qu\u00e1n ch\u00ednh s\u00e1ch \u0111\u1ea1i \u0111o\u00e0n k\u1ebft d\u00e2n t\u1ed9c.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang: C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i l\u00e0", "a": "nh\u1eefng c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi c\u00f9ng to\u00e0n b\u1ed9 nh\u1eefng m\u1ed1i quan h\u1ec7 x\u00e3 h\u1ed9i do s\u1ef1 t\u00e1c \u0111\u1ed9ng l\u1eabn nhau c\u1ee7a c\u00e1c c\u1ed9ng \u0111\u1ed3ng \u1ea5y t\u1ea1o n\u00ean", "e": {"p": 165, "t": "Kh\u00e1i ni\u1ec7m v\u00e0 v\u1ecb tr\u00ed c\u1ee7a c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i a) Kh\u00e1i ni\u1ec7m c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i v\u00e0 c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i l\u00e0 nh\u1eefng c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi c\u00f9ng to\u00e0n b\u1ed9 nh\u1eefng m\u1ed1i quan h\u1ec7 x\u00e3 h\u1ed9i do s\u1ef1 t\u00e1c \u0111\u1ed9ng l\u1eabn nhau c\u1ee7a c\u00e1c c\u1ed9ng \u0111\u1ed3ng \u1ea5y t\u1ea1o n\u00ean.", "a": 1}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang v\u1ec1 t\u00e1c gi\u1ea3 v\u00e0 t\u00e1c ph\u1ea9m thu\u1ed9c Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng", "a": "T\u00e1c ph\u1ea9m Tuy\u00ean ng\u00f4n c\u1ee7a nh\u1eefng ng\u01b0\u1eddi b\u00ecnh d\u00e2n c\u1ee7a Gracchus Babeuf", "e": {"p": 19, "t": "c) Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n \u0111\u00e1nh d\u1ea5u s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc \u0110\u01b0\u1ee3c s\u1ef1 \u1ee7y nhi\u1ec7m c\u1ee7a nh\u0169ng ng\u01b0\u1eddi c\u1ed9ng s\u1ea3n v\u00e0 c\u00f4ng nh\u00e2n qu\u1ed1c t\u1ebf, th\u00e1ng 2 n\u0103m 1848, t\u00e1c ph\u1ea9m Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n do c.", "a": 1}}, {"q": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc \u0111\u00e3 s\u1eed d\u1ee5ng ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn chung nh\u1ea5t n\u00e0o c\u1ee7a tri\u1ebft h\u1ecdc M\u00e1c \u2013 L\u00eanin \u0111\u1ec3 lu\u1eadn gi\u1ea3i \u0111\u00fang \u0111\u1eafn, khoa h\u1ecdc v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n?", "a": "Ch\u1ee7 ngh\u0129a duy v\u1eadt bi\u1ec7n ch\u1ee9ng v\u00e0 Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed", "e": {"p": 42, "t": "Ph\u01b0\u01a1ng ph\u00e1p nghi\u00ean c\u1ee9u c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc s\u1eed d\u1ee5ng ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn chung nh\u1ea5t l\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt bi\u1ec7n ch\u1ee9ng v\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed c\u1ee7a tri\u1ebft h\u1ecdc M\u00e1c - L\u00eanin. Ch\u1ec9 c\u00f3 d\u1ef1a tr\u00ean ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn khoa h\u1ecdc \u0111\u00f3, ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc m\u1edbi lu\u1eadn gi\u1ea3i \u0111\u00fang \u0111\u1eafn, khoa h\u1ecdc v\u1ec3 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, v\u1ec1 qu\u00e1 tr\u00ecnh ph\u00e1t sinh, h\u00ecnh\u2026", "a": 1}}, {"q": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i ra \u0111\u1eddi ra do m\u00e2u thu\u1eabn gi\u1eefa t\u00ednh ch\u1ea5t x\u00e3 h\u1ed9i h\u00f3a c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u1ed1i v\u1edbi t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t. M\u00e2u thu\u1eabn n\u00e0y bi\u1ec3u hi\u1ec7n v\u1ec1 m\u1eb7t x\u00e3 h\u1ed9i l\u00e0", "a": "M\u00e2u thu\u1eabn gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n l\u1ed7i th\u1eddi", "e": {"p": 90, "t": "b) \u0110i\u1ec1u ki\u1ec7n ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i M\u00e2u thu\u1eabn gi\u1eefa t\u00ednh ch\u1ea5t x\u00e3 h\u1ed9i h\u00f3a c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u1ed1\u00ec v\u1edbi t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t tr\u1edf th\u00e0nh m\u00e2u thu\u1eabn kinh t\u1ebf c\u01a1 b\u1ea3n c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, bi\u1ec3u hi\u1ec7n v\u1ec1 m\u1eb7t x\u00e3 h\u1ed9i l\u00e0 m\u00e2u thu\u1eabn gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n l\u1ed7i th\u1eddi.", "a": 1}}, {"q": "CNXH khoa h\u1ecdc c\u00f3 nhi\u1ec7m v\u1ee5 c\u01a1 b\u1ea3n l\u00e0", "a": "Lu\u1eadn ch\u1ee9ng m\u1ed9t c\u00e1ch khoa h\u1ecdc t\u00ednh t\u1ea5t y\u1ebfu v\u1ec1 m\u1eb7t l\u1ecbch s\u1eed s\u1ef1 thay th\u1ebf c\u1ee7a CNTB b\u1eb1ng CNXH v\u1edbi s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n.", "e": {"p": 40, "t": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc c\u00f3 nhi\u1ec7m v\u1ee5 c\u01a1 b\u1ea3n l\u00e0 lu\u1eadn ch\u1ee9ng m\u1ed9t c\u00e1ch khoa h\u1ecdc t\u00ednh t\u1ea5 t y\u1ebfu v\u1ec1 m \u1eb7t l\u1ecbch s\u1eed s\u1ef1 thay th\u1ebf c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n b\u1eb1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i g\u1eafn li\u1ec1n v\u1edbi s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, \u0111\u1ecba v\u1ecb, vai tr\u00f2 c\u1ee7a qu\u1ea7n ch\u00fang do giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e3nh \u0111\u1ea1o trong cu\u1ed9c \u0111\u1ea5u tranh c\u00e1ch m\u1ea1ng th\u1ef1c hi\u1ec7n s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3\u2026", "a": 1}}, {"q": "CNXH khoa h\u1ecdc \u0111\u00e3 l\u00e0m s\u00e1ng t\u1ecf vai tr\u00f2 l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p n\u00e0o?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n.", "e": null}, {"q": "CNXH khoa h\u1ecdc ra \u0111\u1eddi t\u1eeb \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf-x\u00e3 h\u1ed9i n\u00e0o?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u00e3 th\u1ef1c s\u1ef1 gi\u00e1c ng\u1ed9 v\u1ec1 s\u1ee9 m\u1ec7nh c\u1ee7a giai c\u1ea5p m\u00ecnh", "e": null}, {"q": "C\u00f3 bao nhi\u1ec1u \u0111i\u1ec1u ki\u1ec7n x\u00e2y d\u1ef1ng gia \u0111\u00ecnh trong qu\u00e1 tr\u00ecnh x\u00e2y d\u1ef1ng CNXH?", "a": "5, g\u1ed3m: \u0111i\u1ec1u ki\u1ec7n ph\u00e1p l\u00fd, kinh t\u1ebf, ch\u00ednh tr\u1ecb, v\u0103n h\u00f3a, x\u00e3 h\u1ed9i", "e": {"p": 252, "t": "S\u1ef1 ph\u00e1t tri\u1ec3n h\u1ec7 th\u1ed1ng gi\u00e1o d\u1ee5c, \u0111\u00e0o t\u1ea1o, khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7 g\u00f3p ph\u1ea7n n\u00e2ng cao tr\u00ecnh \u0111\u1ed9 d\u00e2n tr\u00ed, ki\u1ebfn th\u1ee9c khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7 c\u1ee7a x\u00e3 h\u1ed9i, \u0111\u1ed3ng th\u1eddi c\u0169ng cung c\u1ea5p cho c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh ki\u1ebfn th\u1ee9c, nh\u1eadn th\u1ee9c m\u1edbi, l\u00e0m n\u1ec1n t\u1ea3ng cho s\u1ef1 h\u00ecnh th\u00e0nh nh\u1eefng gi\u00e1 tr\u1ecb, chu\u1ea9n m\u1ef1c m\u1edbi, \u0111i\u1ec1u ch\u1ec9nh c\u00e1c m\u1ed1\u00ec quan h\u1ec7 gia \u0111\u00ecnh trong qu\u00e1 tr\u00ecnh x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p gi\u1eef vai tr\u00f2 quan tr\u1ecdng h\u00e0ng \u0111\u1ea7u trong h\u1ec7 th\u1ed1ng x\u00e3 h\u1ed9i b\u1edfi l\u00fd do sau", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p li\u00ean quan \u0111\u1ebfn nh\u1eefng m\u1ed1i quan h\u1ec7 quan tr\u1ecdng m\u00e0 c\u00e1c lo\u1ea1i h\u00ecnh", "e": {"p": 166, "t": "Song v\u1ecb tr\u00ed, vai tr\u00f2 c\u1ee7a c\u00e1c lo\u1ea1i c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00f4ng ngang nhau, trong \u0111\u00f3, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p c\u00f3 v\u1ecb tr\u00ed quan tr\u1ecdng h\u00e0ng \u0111\u1ea7u, chi ph\u1ed1i c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00e1c v\u00ec nh\u1eefng l\u00fd do c\u01a1 b\u1ea3n sau: - C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p li\u00ean quan \u0111\u1ebfn c\u00e1c \u0111\u1ea3ng ph\u00e1i ch\u00ednh tr\u1ecb v\u00e0 nh\u00e0 n\u01b0\u1edbc;", "a": 1}}, {"q": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p gi\u1eef v\u1ecb tr\u00ed quan tr\u1ecdng nh\u1ea5t trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i v\u00ec: (ch\u1ecdn 1 ph\u01b0\u01a1ng \u00e1n \u0111\u00fang nh\u1ea5t)", "a": "T\u1ea5t c\u1ea3 c\u00e1c \u0111\u00e1p \u00e1n \u0111\u1ec1u \u0111\u00fang: C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p li\u00ean quan tr\u1ef1c ti\u1ebfp t\u1edbi v\u1ea5n \u0111\u1ec1 s\u1edf h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, \u0111\u1ecba v\u1ecb x\u00e3 h\u1ed9i v\u00e0 quy\u1ec1n l\u1ee3i c\u1ee7a m\u1ed7i ng\u01b0\u1eddi/ C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p ph\u1ea3n \u00e1nh l\u1ee3i \u00edch c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp trong x\u00e3 h\u1ed9i/ M\u1ed7i x\u00e3 h\u1ed9i kh\u00e1c nhau l\u1ea1i c\u00f3 c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p kh\u00e1c nhau, khi c\u01a1 c\u1ea5u giai c\u1ea5p thay \u0111\u1ed5i th\u00ec x\u00e3 h\u1ed9i c\u0169ng thay \u0111\u1ed5i", "e": null}, {"q": "C\u00f4ng nh\u00e2n \u1edf n\u01b0\u1edbc n\u00e0o \u0111\u01b0\u1ee3c xem l\u00e0 \u0111\u1ee9a con \u0111\u1ea7u l\u00f2ng c\u1ee7a n\u1ec1n c\u00f4ng nghi\u1ec7p hi\u1ec7n \u0111\u1ea1i?", "a": "Anh c\u1ee7a x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n", "e": {"p": 52, "t": "C\u00f4ng nh\u00e2n Anh l\u00e0 \u0111\u1ee9a con \u0111\u1ea7u l\u00f2ng c\u1ee7a n\u1ec1n c\u00f4ng nghi\u1ec7p hi\u1ec7n \u0111\u1ea1i\u201d3. To\u00e0n t\u1eadp, S\u0111d, t.23, tr.605.", "a": 1}}, {"q": "C\u01b0\u01a1ng l\u0129nh x\u00e2y d\u1ef1ng \u0111\u1ea5t n\u01b0\u1edbc trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i (b\u1ed5 sung, ph\u00e1t tri\u1ec3n n\u0103m 2011) \u0111\u00e3 ph\u00e1t tri\u1ec3n m\u00f4 h\u00ecnh ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i Vi\u1ec7t Nam v\u1edbi m\u1ea5y \u0111\u1eb7c tr\u01b0ng?", "a": "8", "e": {"p": 113, "t": "(b\u1ed5 sung, ph\u00e1t tri\u1ec3n n\u0103m 201\u00cf) \u0111\u00e3 ph\u00e1t tri\u1ec3n m\u00f4 h\u00ecnh ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i Vi\u1ec7t Nam v\u1edbi t\u00e1m \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n1, trong \u0111\u00f3 c\u00f3 \u0111\u1eb7c tr\u01b0ng v\u1ec1 m\u1ee5c ti\u00eau, b\u1ea3n ch\u1ea5t, n\u1ed9i dung c\u1ee7a x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a m\u00e0 nh\u00e2n d\u00e2n ta x\u00e2y d\u1ef1ng, \u0111\u00f3 l\u00e0: - D\u00e2n gi\u00e0u, n\u01b0\u1edbc m\u1ea1nh, d\u00e2n ch\u1ee7, c\u00f4ng b\u1eb1ng, v\u0103n minh.", "a": 1}}, {"q": "D\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp l\u00e0", "a": "L\u00e0 h\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 \u0111\u1ea1i di\u1ec7n, nh\u00e2n d\u00e2n \u1ee7y quy\u1ec1n thay m\u1eb7t d\u00e2n th\u1ef1c hi\u1ec7n quy\u1ec1n l\u1ef1c c\u1ee7a nh\u00e2n d\u00e2n", "e": {"p": 152, "t": "H\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp l\u00e0 h\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 \u0111\u1ea1i di\u1ec7n, \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n do nh\u00e2n d\u00e2n \u201c\u1ee7y quy\u1ec1n\u201d, giao quy\u1ec1n l\u1ef1c c\u1ee7a m\u00ecnh cho t\u1ed5 ch\u1ee9c m\u00e0 nh\u00e2n d\u00e2n tr\u1ef1c ti\u1ebfp b\u1ea7u ra. Nh\u1eefng con ng\u01b0\u1eddi v\u00e0 t\u1ed5 ch\u1ee9c \u1ea5y \u0111\u1ea1i di\u1ec7n cho nh\u00e2n d\u00e2n, th\u1ef1c hi\u1ec7n quy\u1ec1n l\u00e0m ch\u1ee7 cho nh\u00e2n d\u00e2n.", "a": 1}}, {"q": "D\u00e2n ch\u1ee7 hi\u1ec3u theo ngh\u0129a g\u1ed1c l\u00e0-->", "a": "Quy\u1ec1n l\u1ef1c c\u1ee7a nh\u00e2n d\u00e2n", "e": {"p": 125, "t": "D\u00e2n ch\u1ee7 l\u00e0 quy\u1ec1n l\u1ee3i c\u1ee7a nh\u00e2n d\u00e2n - quy\u1ec1n d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u theo ngh\u0129a r\u1ed9ng. Quy\u1ec1n l\u1ee3i c\u0103n b\u1ea3n nh\u1ea5t c\u1ee7a nh\u00e2n d\u00e2n ch\u00ednh l\u00e0 quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc thu\u1ed9c s\u1edf h\u1eefu c\u1ee7a nh\u00e2n d\u00e2n, c\u1ee7a x\u00e3 h\u1ed9i;", "a": 1}}, {"q": "D\u00e2n ch\u1ee7 l\u00e0 g\u00ec?", "a": "Quy\u1ec1n l\u1ef1c thu\u1ed9c v\u1ec1 nh\u00e2n d\u00e2n", "e": {"p": 125, "t": "Th\u00fa nh\u1ea5t, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n quy\u1ec1n l\u1ef1c, d\u00e2n ch\u1ee7 l\u00e0 quy\u1ec1n l\u1ef1c thu\u1ed9c v\u1ec1 nh\u00e2n d\u00e2n, nh\u00e2n d\u00e2n l\u00e0 ch\u1ee7 nh\u00e2n c\u1ee7a nh\u00e0 n\u01b0\u1edbc. D\u00e2n ch\u1ee7 l\u00e0 quy\u1ec1n l\u1ee3i c\u1ee7a nh\u00e2n d\u00e2n - quy\u1ec1n d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u theo ngh\u0129a r\u1ed9ng.", "a": 1}}, {"q": "D\u00e2n ch\u1ee7 l\u00e0 m\u1ed9t ph\u1ea1m tr\u00f9 n\u00f3i v\u1ec1-->", "a": "M\u1ed9t ch\u1ebf \u0111\u1ed9 nh\u00e0 n\u01b0\u1edbc", "e": {"p": 126, "t": "D\u00e2n ch\u1ee7 v\u1edbi t\u01b0 c\u00e1ch m\u1ed9t h\u00ecnh th\u1ee9c t\u1ed5 ch\u1ee9c thi\u1ebft ch\u1ebf ch\u00ednh tr\u1ecb, m\u1ed9t h\u00ecnh th\u1ee9c hay h\u00ecnh th\u00e1i nh\u00e0 n\u01b0\u1edbc, n\u00f3 l\u00e0 m\u1ed9t ph\u1ea1m tr\u00f9 l\u1ecbch s\u1eed, ra \u0111\u1eddi v\u00e0 ph\u00e1t tri\u1ec3n g\u1eafn li\u1ec1n v\u1edbi nh\u00e0 n\u01b0\u1edbc v\u00e0 m\u1ea5t \u0111i khi nh\u00e0 n\u01b0\u1edbc ti\u00eau vong. Song, d\u00e2n ch\u1ee7 v\u1edbi t\u01b0 c\u00e1ch m\u1ed9t gi\u00e1 tr\u1ecb x\u00e3 h\u1ed9i, n\u00f3 l\u00e0 m\u1ed9t ph\u1ea1m tr\u00f9 v\u0129nh vi\u1ec5n, t\u1ed3n t\u1ea1i v\u00e0 ph\u00e1t tri\u1ec3n c\u00f9ng v\u1ed1i s\u1ef1 t\u1ed3n t\u1ea1i v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a con ng\u01b0\u1eddi, c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi.", "a": 1}}, {"q": "D\u00e2n ch\u1ee7 v\u00f4 s\u1ea3n l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 cho t\u1ea5t c\u1ea3 m\u1ecdi ng\u01b0\u1eddi?", "a": "Sai", "e": {"p": 134, "t": "b) B\u1ea3n ch\u1ea5t c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a Nh\u01b0 m\u1ecdi lo\u1ea1i h\u00ecnh d\u00e2n ch\u1ee7 kh\u00e1c, d\u00e2n ch\u1ee7 v\u00f4 s\u1ea3n, theo V.I. L\u00eanin, kh\u00f4ng ph\u1ea3i l\u00e0 ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 cho t\u1ea5t c\u1ea3 m\u1ecdi ng\u01b0\u1eddi; n\u00f3 ch\u1ec9 l\u00e0 d\u00e2n ch\u1ee7 \u0111\u1ed1i v\u1edbi qu\u1ea7n ch\u00fang lao \u0111\u1ed9ng v\u00e0 b\u1ecb b\u00f3c l\u1ed9t;", "a": 1}}, {"q": "D\u00e2n ch\u1ee7 v\u1edbi t\u01b0 c\u00e1ch l\u00e0 m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i, ra \u0111\u1eddi \u0111\u1ea7u ti\u00ean \u1edf h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i n\u00e0o?", "a": "Chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7", "e": {"p": 103, "t": "C\u1ed9ng s\u1ea3n nguy\u00ean th\u1ee7y, chi\u1ebfm h\u1eefu n\u1ed3 l\u1ec7, phong ki\u1ebfn, t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u00e0 c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a. So v\u1edbi c\u00e1c h\u00ecnh th\u00e1i kinh t\u00ea - x\u00e3 h\u1ed9i \u0111\u00e3 xu\u1ea5t hi\u1ec7n trong l\u1ecbch s\u1eed, h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a c\u00f3 s\u1ef1 kh\u00e1c bi\u1ec7t v\u1ec1 ch\u1ea5t, trong \u0111\u00f3 kh\u00f4ng c\u00f3 giai c\u1ea5p \u0111\u1ed1i kh\u00e1ng, con ng\u01b0\u1eddi t\u1eebng b\u01b0\u1edbc tr\u1edf th\u00e0nh ng\u01b0\u1eddi t\u1ef1 do..."}}, {"q": "D\u00e2n ch\u1ee7 v\u1edbi t\u01b0 c\u00e1ch l\u00e0 m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i, ra \u0111\u1eddi \u0111\u1ea7u ti\u00ean \u1edf th\u1eddi k\u1ef3 n\u00e0o?", "a": "Chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7", "e": null}, {"q": "D\u00e2n ch\u1ee7 XHCN \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n tr\u00ean nh\u1eefng l\u0129nh v\u1ef1c n\u00e0o?", "a": "Tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf, ch\u00ednh tr\u1ecb, v\u0103n h\u00f3a - x\u00e3 h\u1ed9i.", "e": {"p": 152, "t": "D\u00e2n ch\u1ee7 ph\u1ea3i \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n trong \u0111\u1eddi s\u1ed1ng th\u1ef1c ti\u1ec5n \u1edf t\u1ea5t c\u1ea3 c\u00e1c c\u1ea5p, m\u1ecdi l\u0129nh v\u1ef1c c\u1ee7a \u0111\u1eddi s\u1ed1ng x\u00e3 h\u1ed9i v\u1ec1 l\u0129nh v\u1ef1c kinh t\u1ebf, ch\u00ednh tr\u1ecb, v\u0103n h\u00f3a, x\u00e3 h\u1ed9i. B\u1ea3n ch\u1ea5t d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n th\u00f4ng qua c\u00e1c h\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp v\u00e0 d\u00e2n ch\u1ee7 tr\u1ef1c ti\u1ebfp.", "a": 1}}, {"q": "D\u00e2n t\u1ed9c \u2013 t\u1ed9c ng\u01b0\u1eddi \u1edf Vi\u1ec7t Nam c\u00f3 l\u00e3nh th\u1ed5 t\u1ed9c ng\u01b0\u1eddi ri\u00eang kh\u00f4ng? Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang nh\u1ea5t?", "a": "C\u00e1c d\u00e2n t\u1ed9c c\u01b0 tr\u00fa xen k\u1ebd, kh\u00f4ng c\u00f3 l\u00e3nh th\u1ed5 ri\u00eang", "e": {"p": 206, "t": "l\u00e0m cho b\u1ea3n \u0111\u1ed3 c\u01b0 tr\u00fa c\u1ee7a c\u00e1c d\u00e2n t\u1ed9c tr\u1edf n\u00ean ph\u00e2n t\u00e1n, xen k\u1ebd v\u00e0 l\u00e0m cho c\u00e1c d\u00e2n t\u1ed9c \u1edf Vi\u1ec7t Nam kh\u00f4ng c\u00f3 l\u00e3nh th\u1ed5 t\u1ed9c ng\u01b0\u1eddi ri\u00eang. V\u00ec v\u1eady, kh\u00f4ng c\u00f3 m\u1ed9t d\u00e2n t\u1ed9c n\u00e0o \u1edf Vi\u1ec7t Nam c\u01b0 tr\u00fa t\u1eadp trung v\u00e0 duy nh\u1ea5t tr\u00ean m\u1ed9t \u0111\u1ecba b\u00e0n.", "a": 1}}, {"q": "D\u00e2n t\u1ed9c hi\u1ec3u theo ngh\u0129a h\u1eb9p l\u00e0?", "a": "T\u1ed9c ng\u01b0\u1eddi", "e": {"p": 198, "t": "Theo ngh\u0129a h\u1eb9p, d\u00e2n t\u1ed9c (Ethnie) l\u00e0 kh\u00e1i ni\u1ec7m d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng t\u1ed9c ng\u01b0\u1eddi \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh trong l\u1ecbch s\u1eed, c\u00f3 m\u1ed1\u0129 li\u00ean h\u1ec7 ch\u1eb7t ch\u1ebd v\u00e0 b\u1ec1n v\u1eefng, c\u00f3 chung \u00fd th\u1ee9c t\u1ef1 gi\u00e1c t\u1ed9c ng\u01b0\u1eddi, ng\u00f4n ng\u1eef v\u00e0 v\u0103n h\u00f3a. C\u1ed9ng \u0111\u1ed3ng n\u00e0y xu\u1ea5t hi\u1ec7n sau b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c, k\u1ebf th\u1eeba v\u00e0 ph\u00e1t tri\u1ec3n cao h\u01a1n", "a": 1}}, {"q": "D\u00e2n t\u1ed9c \u1edf Ch\u00e2u \u00c1 h\u00ecnh th\u00e0nh khi n\u00e0o?", "a": "Khi c\u1ed9ng \u0111\u1ed3ng h\u1ee3p s\u1ee9c ch\u1ed1ng thi\u00ean tai v\u00e0 gi\u1eb7c ngo\u1ea1i x\u00e2m", "e": {"p": 207, "t": "\u0110\u1eb7c tr\u01b0ng n\u00e0y \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh do y\u00eau c\u1ea7u c\u1ee7a qu\u00e1 tr\u00ecnh c\u1ea3i bi\u1ebfn t\u1ef1 nhi\u00ean v\u00e0 nhu c\u1ea7u ph\u1ea3i h\u1ee3p s\u1ee9c, \u0111o\u00e0n k\u1ebft \u0111\u1ec3 c\u00f9ng \u0111\u1ea5u tranh ch\u1ed1ng ngo\u1ea1i x\u00e2m n\u00ean d\u00e2n t\u1ed9c Vi\u1ec7t Nam \u0111\u00e3 h\u00ecnh th\u00e0nh t\u1eeb r\u1ea5t s\u1edbm v\u00e0 t\u1ea1o ra s\u1ef1 g\u1eafn k\u1ebft ch\u1eb7t ch\u1ebd gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c.", "a": 1}}, {"q": "\u201cD\u1ef1a tr\u00ean c\u01a1 s\u1edf nh\u1eefng t\u01b0 li\u1ec7u th\u1ef1c ti\u1ec5n c\u1ee7a l\u1ecbch s\u1eed \u0111\u1ec3 r\u00fat ra nh\u1eefng nh\u1eadn \u0111\u1ecbnh, nh\u1eefng kh\u00e1i qu\u00e1t v\u1ec1 l\u00fd lu\u1eadn c\u00f3 k\u1ebft c\u1ea5u ch\u1eb7t ch\u1ebd, khoa h\u1ecdc\u201d l\u00e0 n\u1ed9i dung c\u1ee7a ph\u01b0\u01a1ng ph\u00e1p nghi\u00ean c\u1ee9u n\u00e0o trong m\u00f4n CNXHKH?", "a": "Ph\u01b0\u01a1ng ph\u00e1p k\u1ebft h\u1ee3p l\u1ecbch s\u1eed v\u00e0 logic", "e": {"p": 42, "t": "Ph\u1ea3i tr\u00ean c\u01a1 s\u1edf nh\u1eefng t\u01b0 li\u1ec7u th\u1ef1c ti\u1ec5n c\u1ee7a c\u00e1c s\u1ef1 th\u1eadt l\u1ecbch s\u1eed m\u00e0 ph\u00e2n t\u00edch \u0111\u1ec3 r\u00fat ra nh\u1eefng nh\u1eadn \u0111\u1ecbnh, nh\u1eefng kh\u00e1i qu\u00e1t v\u1ec1 l\u00fd lu\u1eadn c\u00f3 k\u1ebft c\u1ea5u ch\u1eb7t ch\u1ebd, khoa h\u1ecdc - t\u1ee9c l\u00e0 r\u00fat ra \u0111\u01b0\u1ee3c l\u00f4g\u00edc c\u1ee7a l\u1ecbch s\u1eed, kh\u00f4ng d\u1eebng l\u1ea1i \u1edf s\u1ef1 li\u1ec7t k\u00ea s\u1ef1 th\u1eadt l\u1ecbch s\u1eed.", "a": 1}}, {"q": "D\u1ef1a tr\u00ean s\u00e1ng ki\u1ebfn v\u0129 \u0111\u1ea1i n\u00e0o \u0111\u1ec3 K. Marx v\u00e0 F. Engels lu\u1eadn gi\u1ea3i m\u1ed9t c\u00e1ch khoa h\u1ecdc v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n?", "a": "Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 h\u1ecdc thuy\u1ebft gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0.", "e": {"p": 19, "t": "- H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Tr\u00ean c\u01a1 s\u1edf hai ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i l\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 h\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0, c. \u0102ngghen \u0111\u00e3 c\u00f3 ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i th\u1ee9 ba - ph\u00e1t hi\u1ec7n ra s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p c\u00f3 s\u1ee9 m\u1ec7nh th\u1ee7 ti\u00eau ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng\u2026", "a": 1}}, {"q": "D\u1ef1a v\u00e0o y\u1ebfu t\u1ed1 n\u00e0o m\u00e0 giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 t\u1ec9nh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng, t\u1ec9nh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p?", "a": "B\u1ea3n th\u00e2n h\u1ecd t\u1ef1 do", "e": {"p": 55, "t": "- N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn \u0111\u00e3 r\u00e8n luy\u1ec7n cho giai c\u1ea5p c\u00f4ng nh\u00e2n nh\u1eefng ph\u1ea9m ch\u1ea5t \u0111\u1eb7c bi\u1ec7t v\u1ec1 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng, tinh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p. \u0110\u00f3 l\u00e0 m\u1ed9t giai c\u1ea5p c\u00e1ch m\u1ea1ng v\u00e0 c\u00f3 tinh th\u1ea7n c\u00e1ch m\u1ea1ng tri\u1ec7t \u0111\u1ec3.", "a": 1}}, {"q": "D\u1ef1a v\u00e0o y\u1ebfu t\u1ed1 n\u00e0o m\u00e0 giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng; tinh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p?", "a": "N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn", "e": {"p": 55, "t": "- N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn \u0111\u00e3 r\u00e8n luy\u1ec7n cho giai c\u1ea5p c\u00f4ng nh\u00e2n nh\u1eefng ph\u1ea9m ch\u1ea5t \u0111\u1eb7c bi\u1ec7t v\u1ec1 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng, tinh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p. \u0110\u00f3 l\u00e0 m\u1ed9t giai c\u1ea5p c\u00e1ch m\u1ea1ng v\u00e0 c\u00f3 tinh th\u1ea7n c\u00e1ch m\u1ea1ng tri\u1ec7t \u0111\u1ec3."}}, {"q": "D\u01b0\u1edbi g\u00f3c \u0111\u1ed9 n\u00e0o d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c xem l\u00e0 m\u1ed9t th\u00e0nh t\u1ef1u v\u0103n ho\u00e1, m\u1ed9t qu\u00e1 tr\u00ecnh s\u00e1ng t\u1ea1o v\u0103n ho\u00e1, th\u1ec3 hi\u1ec7n kh\u00e1t v\u1ecdng t\u1ef1 do \u0111\u01b0\u1ee3c s\u00e1ng t\u1ea1o v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a con ng\u01b0\u1eddi?", "a": "B\u1ea3n ch\u1ea5t t\u01b0 t\u01b0\u1edfng - v\u0103n h\u00f3a - x\u00e3 h\u1ed9i", "e": {"p": 139, "t": "D\u01b0\u1edbi g\u00f3c \u0111\u1ed9 n\u00e0y, d\u00e2n ch\u1ee7 l\u00e0 m\u1ed9t th\u00e0nh t\u1ef1u v\u0103n h\u00f3a, m\u1ed9t qu\u00e1 tr\u00ecnh s\u00e1ng t\u1ea1o v\u0103n h\u00f3a, th\u1ec3 hi\u1ec7n kh\u00e1t v\u1ecdng t\u1ef1 do \u0111\u01b0\u1ee3c s\u00e1ng t\u1ea1o v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a con ng\u01b0\u1eddi.", "a": 1}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m ch\u1ee7 y\u1ebfu c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam \u1edf \u0111\u1ea7u th\u1ebf k\u1ef7 XX l\u00e0", "a": "S\u1ed1 l\u01b0\u1ee3ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam khi ra \u0111\u1eddi c\u00f2n \u00edt, nh\u1eefng \u0111\u1eb7c t\u00ednh c\u1ee7a c\u00f4ng nh\u00e2n v\u1edbi t\u01b0 c\u00e1ch l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a \u0111\u1ea1i c\u00f4ng nghi\u1ec7p ch\u01b0a th\u1eadt s\u1ef1 \u0111\u1ea7y \u0111\u1ee7", "e": {"p": 72, "t": "Tuy s\u1ed1 l\u01b0\u1ee3ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam khi ra \u0111\u1eddi c\u00f2n \u00edt, nh\u1eefng \u0111\u1eb7c t\u00ednh c\u1ee7a c\u00f4ng nh\u00e2n v\u1ed1i t\u01b0 c\u00e1ch l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a \u0111\u1ea1i c\u00f4ng nghi\u1ec7p ch\u01b0a th\u1eadt s\u1ef1 \u0111\u1ea7y \u0111\u1ee7, l\u1ea1i sinh tr\u01b0\u1ecfng trong m\u1ed9t x\u00e3 h\u1ed9i n\u00f4ng nghi\u1ec7p c\u00f2n mang nhi\u1ec1u t\u00e0n d\u01b0 c\u1ee7a t\u00e2m l\u00fd ti\u1ec3u n\u00f4ng nh\u01b0ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam s\u1edbm \u0111\u01b0\u1ee3c t\u00f4i luy\u1ec7n trong \u0111\u1ea5u tranh c\u00e1ch m\u1ea1ng ch\u1ed1ng th\u1ef1c d\u00e2n, \u0111\u1ebf qu\u1ed1c n\u00ean \u0111\u00e3 tr\u01b0\u1edfng th\u00e0nh nhanh ch\u00f3ng v\u1ec1\u2026", "a": 1}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 XHCN l\u00e0 g\u00ec?", "a": "D\u00e2n ch\u1ee7 v\u1edbi s\u1ed1 \u0111\u00f4ng nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng trong x\u00e3 h\u1ed9i", "e": null}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 XHCN l\u00e0?", "a": "L\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 cho m\u1ecdi giai c\u1ea5p", "e": {"p": 132, "t": "qu\u00e1 tr\u00ecnh l\u00e2u d\u00e0i, ph\u1ee9c t\u1ea1p v\u00e0 gi\u00e1 tr\u1ecb c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n ch\u01b0a ph\u1ea3i l\u00e0 ho\u00e0n thi\u1ec7n nh\u1ea5t, do \u0111\u00f3, t\u1ea5 t y\u1ebfu xu\u1ea5t hi\u1ec7n m\u1ed9t n\u1ec1n d\u00e2n ch\u1ee7 m\u1edbi, cao h\u01a1n n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n v\u00e0 \u0111\u00f3 ch\u00ednh l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 v\u00f4 s\u1ea3n hay c\u00f2n g\u1ecdi l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a.", "a": 1}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 XHCN?", "a": "Ph\u00e1t tri\u1ec3n cao nh\u1ea5t so v\u1edbi c\u00e1c n\u1ec1n d\u00e2n ch\u1ee7 kh\u00e1c trong l\u1ecbch s\u1eed.", "e": null}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i tr\u00ean l\u0129nh v\u1ef1c ch\u00ednh tr\u1ecb l\u00e0 g\u00ec?Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang", "a": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n ch\u00ednh tr\u1ecb l\u00e0 vi\u1ec7c thi\u1ebft l\u1eadp, t\u0103ng c\u01b0\u1eddng chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n m\u00e0 th\u1ef1c ch\u1ea5t c\u1ee7a n\u00f3 l\u00e0 vi\u1ec7c giai c\u1ea5p c\u00f4ng nh\u00e2n n\u1eafm v\u00e0 s\u1eed d\u1ee5ng quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc tr\u1ea5n \u00e1p giai c\u1ea5p t\u01b0 s\u1ea3n, ti\u1ebfn h\u00e0nh x\u00e2y d\u1ef1ng m\u1ed9t x\u00e3 h\u1ed9i kh\u00f4ng giai c\u1ea5p.", "e": {"p": 107, "t": "b) Tr\u00ean l\u0129nh v\u1ef1c ch\u00ednh tr\u1ecb Th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n ch\u00ednh tr\u1ecb, l\u00e0 vi\u1ec7c thi\u1ebft l\u1eadp, t\u0103ng c\u01b0\u1eddng chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n m\u00e0 th\u1ef1c ch\u1ea5t c\u1ee7a n\u00f3 l\u00e0 vi\u1ec7c giai c\u1ea5p c\u00f4ng nh\u00e2n n\u1eafm v\u00e0 s\u1eed d\u1ee5ng quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc tr\u1ea5n \u00e1p giai c\u1ea5p t\u01b0 s\u1ea3n, ti\u1ebfn h\u00e0nh x\u00e2y d\u1ef1ng m\u1ed9t x\u00e3 h\u1ed9i kh\u00f4ng giai c\u1ea5p.", "a": 1}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, x\u00e9t tr\u00ean ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf l\u00e0 th\u1eddi k\u1ef3 c\u00f2n t\u1ed3n t\u1ea1i", "a": "N\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1i l\u1eadp", "e": {"p": 106, "t": "a) Tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, t\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1\u00ec l\u1eadp. \u0110\u1ec1 c\u1eadp t\u1edbi \u0111\u1eb7c tr\u01b0ng n\u00e0y, V.I.", "a": 1}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, x\u00e9t tr\u00ean ph\u01b0\u01a1ng di\u1ec7n t\u01b0 t\u01b0\u1edfng - v\u0103n h\u00f3a l\u00e0 th\u1eddi k\u1ef3 c\u00f2n t\u1ed3n t\u1ea1i", "a": "Nhi\u1ec1u t\u01b0 t\u01b0\u1edfng kh\u00e1c nhau, ch\u1ee7 y\u1ebfu l\u00e0 t\u01b0 t\u01b0\u1edfng v\u00f4 s\u1ea3n v\u00e0 t\u01b0 t\u01b0\u1edfng t\u01b0 s\u1ea3n", "e": {"p": 108, "t": "c) Tr\u00ean l\u0129nh v\u1ef1c t\u01b0 t\u01b0\u1edfng - v\u0103n h\u00f3a Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i c\u00f2n t\u1ed3n t\u1ea1i nhi\u1ec1u t\u01b0 t\u01b0\u1edfng kh\u00e1c nhau, ch\u1ee7 y\u1ebfu l\u00e0 t\u01b0 t\u01b0\u1edfng v\u00f4 s\u1ea3n v\u00e0 t\u01b0 t\u01b0\u1ecfng t\u01b0 s\u1ea3n. Giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua \u0111\u1ed9i ti\u1ec1n phong c\u1ee7a m\u00ecnh l\u00e0 \u0110\u1ea3ng C\u1ed9ng s\u1ea3n t\u1eebng h\u01b0\u1edbc x\u00e2y d\u1ef1ng v\u0103n h\u00f3a v\u00f4 s\u1ea3n, n\u1ec1n v\u0103n h\u00f3a m\u1edbi x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, ti\u1ebfp thu gi\u00e1 tr\u1ecb v\u0103n h\u00f3a d\u00e2n t\u1ed9c v\u00e0 tinh hoa v\u0103n h\u00f3a nh\u00e2n lo\u1ea1i,\u2026", "a": 1}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, x\u00e9t tr\u00ean ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf l\u00e0 th\u1eddi k\u1ef3 c\u00f2n t\u1ed3n t\u1ea1i nhi\u1ec1u th\u00e0nh ph\u1ea7n kinh t\u1ebf. Vi\u1ec7t Nam hi\u1ec7n nay c\u00f2n t\u1ed3n t\u1ea1i nh\u1eefng th\u00e0nh ph\u1ea7n kinh t\u1ebf n\u00e0o?", "a": "Kinh t\u1ebf nh\u00e0 n\u01b0\u1edbc; kinh t\u1ebf t\u1eadp th\u1ec3, h\u1ee3p t\u00e1c x\u00e3; kinh t\u1ebf t\u01b0 nh\u00e2n v\u00e0 kinh t\u1ebf c\u00f3 v\u1ed1n \u0111\u1ea7u t\u01b0 n\u01b0\u1edbc ngo\u00e0i.", "e": null}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i tr\u00ean l\u0129nh v\u1ef1c x\u00e3 h\u1ed9i l\u00e0 g\u00ec?", "a": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n x\u00e3 h\u1ed9i l\u00e0 th\u1eddi k\u1ef3 \u0111\u1ea5u tranh giai c\u1ea5p ch\u1ed1ng \u00e1p b\u1ee9c, b\u1ea5t c\u00f4ng, x\u00f3a b\u1ecf t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i v\u00e0 nh\u1eefng t\u00e0n d\u01b0 c\u1ee7a x\u00e3 h\u1ed9i c\u0169 \u0111\u1ec3 l\u1ea1i, thi\u1ebft l\u1eadp c\u00f4ng b\u1eb1ng x\u00e3 h\u1ed9i tr\u00ean c\u01a1 s\u1edf th\u1ef1c hi\u1ec7n nguy\u00ean t\u1eafc ph\u00e2n ph\u1ed1i theo lao \u0111\u1ed9ng l\u00e0 ch\u1ee7 \u0111\u1ea1o", "e": {"p": 108, "t": "B\u1edfi v\u1eady, th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n x\u00e3 h\u1ed9i, l\u00e0 th\u1eddi k\u1ef3 \u0111\u1ea5u tranh giai c\u1ea5p ch\u00f4ng \u00e1p b\u1ee9c, b\u1ea5t c\u00f4ng, x\u00f3a b\u1ecf t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i v\u00e0
