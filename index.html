c quan h\u1ec7 x\u00e3 h\u1ed9i trong t\u1ea5t c\u1ea3 c\u00e1c ho\u1ea1t \u0111\u1ed9ng c\u1ee7a x\u00e3 h\u1ed9i?", "o": ["Phong t\u1ee5c, t\u1eadp qu\u00e1n", "Ph\u00e1p lu\u1eadt", "\u0110\u1ea1o \u0111\u1ee9c, t\u00ecnh c\u1ea3m", "M\u1ed1i quan h\u1ec7 th\u00e2n h\u1eefu"], "a": 1, "s": "Ch\u01b0\u01a1ng 4", "e": {"p": 157, "t": "\u0111\u1ed9ng c\u1ee7a x\u00e3 h\u1ed9i, ph\u00e1p lu\u1eadt \u0111\u01b0\u1ee3c \u0111\u1eb7t \u1edf v\u1ecb tr\u00ed t\u1ed1i th\u01b0\u1ee3ng \u0111\u1ec3 \u0111i\u1ec1u ch\u1ec9nh c\u00e1c quan h\u1ec7 x\u00e3 h\u1ed9i. Th\u1ee9 ba, quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc l\u00e0 th\u00f4ng nh\u1ea5t, c\u00f3 s\u1ef1 ph\u00e2n c\u00f4ng r\u00f5 r\u00e0ng, c\u00f3 c\u01a1 ch\u1ebf ph\u1ed1i h\u1ee3p nh\u1ecbp nh\u00e0ng v\u00e0 ki\u1ec3m so\u00e1t gi\u1eefa c\u00e1c c\u01a1 quan:", "a": 1}}, {"q": "B\u1ed9 m\u00e1y Nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c v\u00e0 ho\u1ea1t \u0111\u1ed9ng theo nguy\u00ean t\u1eafc:", "o": ["Ph\u00e1p ch\u1ebf t\u01b0 s\u1ea3n", "Tam quy\u1ec1n ph\u00e2n l\u1eadp", "D\u00e2n ch\u1ee7 \u0111a nguy\u00ean", "T\u1eadp trung d\u00e2n ch\u1ee7"], "a": 3, "s": "Ch\u01b0\u01a1ng 4", "e": {"p": 157, "t": "\u0111\u1ed3ng th\u00f2i t\u0103ng c\u01b0\u1eddng th\u1ef1c hi\u1ec7n s\u1ef1 nghi\u00eam minh c\u1ee7a ph\u00e1p lu\u1eadt. Th\u1ee9 s\u00e1u, t\u1ed5 ch\u1ee9c v\u00e0 ho\u1ea1t \u0111\u1ed9ng c\u1ee7a b\u1ed9 m\u00e1y nh\u00e0 n\u01b0\u1ed5c theo nguy\u00ean t\u1eafc t\u1eadp trung d\u00e2n ch\u1ee7, c\u00f3 s\u1ef1 ph\u00e2n c\u00f4ng, ph\u00e2n c\u1ea5p, ph\u1ed1i h\u1ee3p v\u00e0 ki\u1ec3m so\u00e1t l\u1eabn nhau, nh\u01b0ng b\u1ea3o \u0111\u1ea3m quy\u1ec1n l\u1ef1c l\u00e0 th\u1ed1ng nh\u1ea5t v\u00e0 s\u1ef1 ch\u1ec9 \u0111\u1ea1o th\u1ed1ng nh\u1ea5t c\u1ee7a Trung \u01b0\u01a1ng. Nh\u01b0 v\u1eady, nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a Nh\u00e0 n\u01b0\u1ed1c ph\u00e1p quy\u1ec1n x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a m\u00e0 Vi\u1ec7t Nam \u0111ang x\u00e2y d\u1ef1ng \u0111\u00e3 th\u1ec3 hi\u1ec7n \u0111\u01b0\u1ee3c c\u00e1c tinh th\u1ea7n c\u01a1 b\u1ea3n c\u1ee7a m\u1ed9t nh\u00e0 n\u01b0\u1edbc \u2026"}}, {"q": "Theo Ngh\u1ecb quy\u1ebft \u0110\u1ea1i h\u1ed9i \u0111\u1ea1i bi\u1ec3u to\u00e0n qu\u1ed1c l\u1ea7n th\u1ee9 XIII c\u1ee7a \u0110\u1ea3ng, \u0111\u1ec3 th\u1ef1c h\u00e0nh v\u00e0 ph\u00e1t huy r\u1ed9ng r\u00e3i quy\u1ec1n l\u00e0m ch\u1ee7 c\u1ee7a nh\u00e2n d\u00e2n v\u00e0 vai tr\u00f2 ch\u1ee7 th\u1ec3 c\u1ee7a nh\u00e2n d\u00e2n, c\u1ea7n th\u1ef1c hi\u1ec7n hi\u1ec7u qu\u1ea3 ph\u01b0\u01a1ng ch\u00e2m n\u00e0o?", "o": ["D\u00e2n bi\u1ebft, d\u00e2n b\u00e0n, d\u00e2n gi\u00e1m s\u00e1t, d\u00e2n th\u1ee5 h\u01b0\u1edfng", "D\u00e2n bi\u1ebft, d\u00e2n l\u00e0m, d\u00e2n ki\u1ec3m tra, d\u00e2n th\u1ee5 h\u01b0\u1edfng", "D\u00e2n bi\u1ebft, d\u00e2n b\u00e0n, d\u00e2n l\u00e0m, d\u00e2n ki\u1ec3m tra, d\u00e2n gi\u00e1m s\u00e1t, d\u00e2n th\u1ee5 h\u01b0\u1edfng", "D\u00e2n b\u00e0n, d\u00e2n l\u00e0m, d\u00e2n gi\u00e1m s\u00e1t, d\u00e2n th\u1ee5 h\u01b0\u1edfng"], "a": 2, "s": "Ch\u01b0\u01a1ng 4", "e": {"p": 157, "t": "Th\u1ee9 t\u01b0, Nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam ph\u1ea3i do \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam l\u00e3nh \u0111\u1ea1o, ph\u00f9 h\u1ee3p v\u1edbi \u0110i\u1ec1u 4 Hi\u1ebfn ph\u00e1p n\u0103m 2013. Ho\u1ea1t \u0111\u1ed9ng c\u1ee7a Nh\u00e0 n\u01b0\u1edbc \u0111\u01b0\u1ee3c gi\u00e1m s\u00e1t b\u1edfi nh\u00e2n d\u00e2n v\u1edbi ph\u01b0\u01a1ng ch\u00e2m: \u201cD\u00e2n bi\u1ebft, d\u00e2n b\u00e0n, d\u00e2n l\u00e0m, d\u00e2n ki\u1ec3m tra\u201d th\u00f4ng qua c\u00e1c t\u1ed5 ch\u1ee9c, c\u00e1c c\u00e1 nh\u00e2n \u0111\u01b0\u1ee3c nh\u00e2n d\u00e2n \u1ee7y nhi\u1ec7m."}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang v\u1ec1 ph\u01b0\u01a1ng th\u1ee9c th\u1ef1c hi\u1ec7n d\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp (d\u00e2n ch\u1ee7 \u0111\u1ea1i di\u1ec7n):", "o": ["Th\u1ef1c hi\u1ec7n quy\u1ec1n s\u00e1ng ki\u1ebfn l\u1eadp ph\u00e1p; d\u00e2n ch\u1ee7 \u1edf c\u01a1 s\u1edf", "B\u1ea7u c\u1eed; b\u00e3i mi\u1ec5n \u0111\u1ea1i bi\u1ec3u", "Tr\u01b0ng c\u1ea7u \u00fd d\u00e2n", "\u0110\u1ea1i bi\u1ec3u Qu\u1ed1c h\u1ed9i th\u1ef1c hi\u1ec7n quy\u1ec1n gi\u00e1m s\u00e1t c\u1ee7a m\u00ecnh \u0111\u1ed1i v\u1edbi ho\u1ea1t \u0111\u1ed9ng c\u1ee7a b\u1ed9 m\u00e1y nh\u00e0 n\u01b0\u1edbc th\u00f4ng qua c\u00e1c h\u00ecnh th\u1ee9c: xem x\u00e9t b\u00e1o c\u00e1o, ch\u1ea5t v\u1ea5n, gi\u00e1m s\u00e1t chuy\u00ean \u0111\u1ec1"], "a": 3, "s": "Ch\u01b0\u01a1ng 4", "e": null}, {"q": "C\u0103n c\u1ee9 v\u00e0o t\u00ednh ch\u1ea5t c\u1ee7a quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc, ch\u1ee9c n\u0103ng c\u1ee7a nh\u00e0 n\u01b0\u1edbc \u0111\u01b0\u1ee3c chia th\u00e0nh:", "o": ["Ch\u1ee9c n\u0103ng giai c\u1ea5p v\u00e0 ch\u1ee9c n\u0103ng x\u00e3 h\u1ed9i", "Ch\u1ee9c n\u0103ng \u0111\u1ed1i n\u1ed9i v\u00e0 \u0111\u1ed1i ngo\u1ea1i", "Ch\u1ee9c n\u0103ng ch\u00ednh tr\u1ecb, kinh t\u1ebf, v\u0103n h\u00f3a, x\u00e3 h\u1ed9i", "Ch\u1ee9c n\u0103ng giai c\u1ea5p v\u00e0 ch\u1ee9c n\u0103ng \u0111\u1ed1i ngo\u1ea1i"], "a": 0, "s": "Ch\u01b0\u01a1ng 4", "e": {"p": 144, "t": "C\u0103n c\u1ee9 v\u00e0o l\u0129nh v\u1ef1c t\u00e1c \u0111\u1ed9ng c\u1ee7a quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1ed1c, ch\u1ee9c n\u0103ng c\u1ee7a nh\u00e0 n\u01b0\u1ed1c \u0111\u01b0\u1ee3c chia th\u00e0nh ch\u1ee9c n\u0103ng ch\u00ednh tr\u1ecb, kinh t\u00ea' v\u0103n h\u00f3a, x\u00e3 h\u1ed9i,... C\u0103n c\u1ee9 v\u00e0o t\u00ednh ch\u1ea5t c\u1ee7a quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc, ch\u1ee9c n\u0103ng c\u1ee7a nh\u00e0 n\u01b0\u1edbc \u0111\u01b0\u1ee3c chia th\u00e0nh ch\u1ee9c n\u0103ng giai c\u1ea5p (tr\u1ea5n \u00e1p) v\u00e0 ch\u1ee9c n\u0103ng x\u00e3 h\u1ed9i (t\u1ed5 ch\u00fac v\u00e0 x\u00e2y d\u1ef1ng). Xu\u1ea5t ph\u00e1t t\u1eeb b\u1ea3n ch\u1ea5t c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\ 1ed9i \u2013 giai c\u1ea5p \u1edf th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, giai c\u1ea5p n\u00e0o l\u00e0 l\u1ef1c l\u01b0\u1ee3ng ti\u00eau bi\u1ec3u cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t m\u1edbi gi\u1eef vai tr\u00f2 ch\u1ee7 \u0111\u1ea1o, ti\u00ean phong trong qu\u00e1 tr\u00ecnh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u00f3a \u0111\u1ea5t n\u01b0\u1edbc?", "o": ["T\u01b0 s\u1ea3n", "N\u00f4ng d\u00e2n", "C\u00f4ng nh\u00e2n", "Tr\u00ed th\u1ee9c"], "a": 2, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 171, "t": "\u0110\u00e2y l\u00e0 m\u1ed9t qu\u00e1 tr\u00ecnh l\u00e2u d\u00e0i th\u00f4ng qua nh\u1eefng c\u1ea3i bi\u1ebfn c\u00e1ch m\u1ea1ng to\u00e0n di\u1ec7n c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. \u0110\u00f3 l\u00e0 xu h\u01b0\u1ed1ng t\u1ea5t y\u1ebfu v\u00e0 l\u00e0 bi\u1ec7n ch\u1ee9ng c\u1ee7a s\u1ef1 v\u1eadn \u0111\u1ed9ng, ph\u00e1t tri\u1ec3n c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. Trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p \u1ea5y, giai c\u1ea5p c\u00f4ng nh\u00e2n, l\u1ef1c l\u01b0\u1ee3ng ti\u00eau bi\u1ec3u cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t m\u1ed1i gi\u1eef vai tr\u00f2 ch\u1ee7 \u0111\u1ea1o, ti\u00ean phong trong qu\u00e1 tr\u00ecnh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u2026"}}, {"q": "\u201cX\u00e2y d\u1ef1ng kh\u1ed1i li\u00ean minh \u0111\u1ec3 c\u00e1c l\u1ef1c l\u01b0\u1ee3ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng c\u00f9ng nhau x\u00e2y m\u1ed9t n\u1ec1n v\u0103n h\u00f3a ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c, \u0111\u1ed3ng th\u1eddi ti\u1ebfp thu nh\u1eefng tinh hoa, gi\u00e1 tr\u1ecb v\u0103n h\u00f3a c\u1ee7a nh\u00e2n lo\u1ea1i v\u00e0 th\u1eddi \u0111\u1ea1i\u201d l\u00e0 n\u1ed9i dung n\u00e0o c\u1ee7a li\u00ean minh giai c\u1ea5p, t\u1ea7ng l\u1edbp trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i?", "o": ["N\u1ed9i dung ch\u00ednh tr\u1ecb", "N\u1ed9i dung v\u0103n h\u00f3a \u2013 x\u00e3 h\u1ed9i", "N\u1ed9i dung kinh t\u1ebf", "N\u1ed9i dung t\u01b0 t\u01b0\u1edfng"], "a": 1, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 185, "t": "\u0110\u1ed3ng th\u00f2i, ki\u00ean quy\u1ebft \u0111\u1ea5u tranh ch\u1ed1ng m\u1ecdi bi\u1ec3u hi\u1ec7n ti\u00eau c\u1ef1c v\u00e0 \u00e2m m\u01b0u \u201cdi\u1ec5n bi\u1ebfn h\u00f2a b\u00ecnh\u201d c\u1ee7a c\u00e1c th\u1ebf l\u1ef1c th\u00f9 \u0111\u1ecbch v\u00e0 ph\u1ea3n \u0111\u1ed9ng. - N\u1ed9i dung v\u0103n h\u00f3a - x\u00e3 h\u1ed9i c\u1ee7a li\u00ean minh: T\u1ed5 ch\u1ee9c li\u00ean minh \u0111\u1ec3 c\u00e1c l\u1ef1c l\u01b0\u1ee3ng d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng c\u00f9ng nhau x\u00e2y d\u1ef1ng n\u1ec1n v\u0103n h\u00f3a Vi\u1ec7t Nam ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c, \u0111\u1ed3ng th\u1eddi ti\u1ebfp thu nh\u1eefng tinh hoa, gi\u00e1 tr\u1ecb v\u0103n h\u00f3a c\u1ee7a nh\u00e2n lo\u1ea1i v\u00e0 th\u1eddi \u0111\u1ea1i."}}, {"q": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p g\u1ed3m c\u00f3 nh\u1eefng giai c\u1ea5p, t\u1ea7ng l\u1edbp c\u01a1 b\u1ea3n n\u00e0o?", "o": ["Giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n, giai c\u1ea5p \u0111\u1ecba ch\u1ee7 phong ki\u1ebfn, t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c", "Giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n, \u0111\u1ed9i ng\u0169 doanh nh\u00e2n, \u0111\u1ed9i ng\u0169 tr\u00ed th\u1ee9c", "Giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n, giai c\u1ea5p t\u01b0 s\u1ea3n, giai c\u1ea5p \u0111\u1ecba ch\u1ee7 phong ki\u1ebfn", "Giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n, giai c\u1ea5p t\u01b0 s\u1ea3n, t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c"], "a": 1, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 182, "t": "ch\u00ednh tr\u1ecb \u0111\u00e3 chuy\u1ec3n tr\u1ecdng t\u00e2m sang ch\u00ednh tr\u1ecb trong l\u0129nh v\u1ef1c kinh t\u1ebf, \u0111\u1ea5u tranh giai c\u1ea5p mang nh\u1eefng n\u1ed9i dung v\u00e0 h\u00ecnh th\u1ee9c m\u1edbi. N\u1ed9i dung n\u00e0y c\u1ea7n th\u1ef1c hi\u1ec7n nh\u1eb1m th\u1ecfa m\u00e3n c\u00e1c nhu c\u1ea7u, l\u1ee3i \u00edch kinh t\u00ea thi\u1ebft th\u00e2n c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n, \u0111\u1ed9i ng\u0169 tr\u00ed th\u1ee9c v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp kh\u00e1c trong x\u00e3 h\u1ed9i, nh\u1eb1m t\u1ea1o c\u01a1 s\u1ecf v\u1eadt ch\u1ea5t - k\u1ef9 thu\u1eadt c\u1ea7n thi\u1ebft cho ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. N\u1ed9i dung kinh t\u1ebf c\u1ee7a li\u00ean minh giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00f3i giai c\u1ea5\u2026"}}, {"q": "N\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh giai c\u1ea5p, t\u1ea7ng l\u1edbp trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam l\u00e0:", "o": ["Gi\u1eef v\u1eefng l\u1eadp tr\u01b0\u1eddng t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, gi\u1eef v\u1eefng vai tr\u00f2 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n", "\u0110\u1ea9y m\u1ea1nh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u00f3a \u0111\u1ea5t n\u01b0\u1edbc g\u1eafn v\u1edbi ph\u00e1t tri\u1ec3n kinh t\u1ebf tri th\u1ee9c, ph\u00e1t tri\u1ec3n b\u1ec1n v\u1eefng", "T\u0103ng tr\u01b0\u1edfng kinh t\u1ebf k\u1ebft h\u1ee3p v\u1edbi ph\u00e1t tri\u1ec3n v\u0103n h\u00f3a, ti\u1ebfn b\u1ed9, c\u00f4ng b\u1eb1ng x\u00e3 h\u1ed9i", "X\u00e2y m\u1ed9t n\u1ec1n v\u0103n h\u00f3a ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u0 1ee3p v\u1edbi m\u00ecnh \u0111\u1ec3 t\u1eadp trung th\u1ef1c hi\u1ec7n nh\u1eefng nhu c\u1ea7u v\u00e0 l\u1ee3i \u00edch ri\u00eang", "Giai c\u1ea5p \u1edf v\u1ecb tr\u00ed trung t\u00e2m ph\u1ea3i t\u00ecm c\u00e1ch li\u00ean minh v\u1edbi c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i kh\u00e1c c\u00f3 nh\u1eefng l\u1ee3i \u00edch ph\u00f9 h\u1ee3p v\u1edbi m\u00ecnh \u0111\u1ec3 t\u1eadp h\u1ee3p l\u1ef1c l\u01b0\u1ee3ng th\u1ef1c hi\u1ec7n nh\u1eefng nhu c\u1ea7u v\u00e0 l\u1ee3i \u00edch ri\u00eang c\u1ee7a giai c\u1ea5p \u0111\u00f3"], "a": 1, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 172, "t": "C\u00e1c \u00f4ng \u0111\u00e3 ch\u1ec9 ra r\u1eb1ng, nhi\u1ec1u cu\u1ed9c \u0111\u1ea5u tranh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n \u1edf nh\u1eefng n\u01b0\u1ed1c n\u00e0y th\u1ea5t b\u1ea1i ch\u1ee7 y\u1ebfu l\u00e0 do giai c\u1ea5p c\u00f4ng nh\u00e2n \u201c\u0111\u01a1n \u0111\u1ed9c\u201d v\u00ec \u0111\u00e3 kh\u00f4ng t\u1ed5 ch\u1ee9c li\u00ean minh v\u1edbi \u201cng\u01b0\u1eddi b\u1ea1n \u0111\u1ed3ng minh t\u1ef1 nhi\u00ean\u201d c\u1ee7a m\u00ecnh l\u00e0 giai c\u1ea5p n\u00f4ng d\u00e2n. Do v\u1eady, c\u00e1c cu\u1ed9c \u0111\u1ea5u tranh \u0111\u00f3 \u0111\u00e3 tr\u1edf th\u00e0nh m\u1ed9t \u201cb\u00e0i ai \u0111i\u1ebfu\u201d1. Nh\u01b0 v\u1eady, x\u00e9t d\u01b0\u1edbi g\u00f3c \u0111\u1ed9 ch\u00ednh tr\u1ecb, trong m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i nh\u1ea5t \u0111\u1ecbnh, ch\u00ednh cu\u1ed9c \u0111\u1ea5u tranh giai c\u1ea5p c\u1ee7a c\u00e1c giai c\u1ea5p c\u00f3 l\u1ee3i \u00edch \u0111\u1ed1i l\u2026"}}, {"q": "\u00dd n\u00e0o kh\u00f4ng \u0111\u00fang v\u1ec1 n\u1ed9i dung kinh t\u1ebf c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a?", "o": ["X\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng ch\u00ednh s\u00e1ch an sinh x\u00e3 h\u1ed9i", "\u1ee8ng d\u1ee5ng khoa h\u1ecdc k\u1ef9 thu\u1eadt v\u00e0o s\u1ea3n xu\u1ea5t n\u00f4ng nghi\u1ec7p", "X\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng ch\u00ednh s\u00e1ch ph\u00e1t tri\u1ec3n n\u00f4ng nghi\u1ec7p, n\u00f4ng d\u00e2n, n\u00f4ng th\u00f4n", "Th\u1ef1c hi\u1ec7n h\u1ee3p \u0111\u1ed3ng kinh t\u1ebf gi\u1eefa doanh nghi\u1ec7p nh\u00e0 n\u01b0\u1edbc v\u00e0 n\u00f4ng d\u00e2n"], "a": 0, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 187, "t": "Quan t\u00e2m th\u00edch \u0111\u00e1ng v\u00e0 ph\u00f9 h\u1ee3p v\u1ed1i m\u1ed7i giai c\u1ea5p, t\u1ea7ng l\u1edbp trong x\u00e3 h\u1ed9i, \u0111\u1eb7c bi\u1ec7t l\u00e0 v\u1edbi t\u1ea7ng l\u1edbp y\u1ebfu th\u1ebf c\u1ee7a x\u00e3 h\u1ed9i. T\u1ea1o ra c\u01a1 h\u1ed9i c\u00f4ng b\u1eb1ng cho m\u1ecdi th\u00e0nh ph\u1ea7n x\u00e3 h\u1ed9i \u0111\u1ec3 ti\u1ebfp c\u1eadn \u0111\u1ebfn s\u1ef1 ph\u00e1t tri\u1ec3n v\u1ec1 s\u1ecf h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, v\u1ec1 gi\u00e1o d\u1ee5c, y t\u1ebf, c\u00e1c ch\u00ednh s\u00e1ch an sinh x\u00e3 h\u1ed9i, V.V.. Hai l\u00e0, x\u00e2y d\u1ef1ng v\u00e0 th\u1ef1c hi\u1ec7n h\u1ec7 th\u1ed1ng ch\u00ednh s\u00e1ch x\u00e3 h\u1ed9i t\u1ed5ng th\u1ec3 nh\u1eb1m t\u1ea1o s\u1ef1 bi\u1ebfn \u0111\u1ed5i t\u00edch c\u1ef1c c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i, nh\u1ea5t l\u00e0 c\u00e1c ch\u00ednh s\u00e1ch li\u00ean quan \u0111\u1ebfn c\u2026"}}, {"q": "N\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a d\u1ef1a tr\u00ean nguy\u00ean t\u1eafc n\u00e0o?", "o": ["Gi\u1eef v\u1eefng l\u1eadp tr\u01b0\u1eddng ch\u00ednh tr\u1ecb - t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "Gi\u1eef v\u1eefng l\u1eadp tr\u01b0\u1eddng ch\u00ednh tr\u1ecb - t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p n\u00f4ng d\u00e2n", "Gi\u1eef v\u1eefng l\u1eadp tr\u01b0\u1eddng ch\u00ednh tr\u1ecb - t\u01b0 t\u01b0\u1edfng c\u1ee7a t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c", "K\u1ebft h\u1ee3p v\u1ec1 ch\u00ednh tr\u1ecb - t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c"], "a": 0, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 184, "t": "- N\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh: Kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 \u0111\u1ed9i ng\u0169 tr\u00ed th\u1ee9c c\u1ea7n th\u1ef1c hi\u1ec7n nh\u1eb1m t\u1ea1o c\u01a1 s\u1edf ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u1eefng ch\u1eafc cho kh\u1ed1i \u0111\u1ea1i \u0111o\u00e0n k\u1ebft to\u00e0n d\u00e2n, t\u1ea1o th\u00e0nh s\u1ee9c m\u1ea1nh t\u1ed5ng h\u1ee3p v\u01b0\u1ee3t qua m\u1ecdi kh\u00f3 kh\u0103n, th\u1eed th\u00e1ch v\u00e0 \u0111\u1eadp tan m\u1ecdi \u00e2m m\u01b0u ch\u1ed1ng ph\u00e1 s\u1ef1 nghi\u1ec7p x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, \u0111\u1ed3ng th\u1eddi b\u1ea3o v\u1ec7 v\u1eefng ch\u1eafc T\u1ed5 qu\u1ed1\u00edc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a. \u1edf n\u01b0\u1ed1c ta, n\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean \u2026"}}, {"q": "N\u1ed9i dung quan tr\u1ecdng nh\u1ea5t trong c\u00e1c n\u1ed9i dung li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c khi ti\u1ebfn h\u00e0nh x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0:", "o": ["N\u1ed9i dung t\u01b0 t\u01b0\u1edfng", "N\u1ed9i dung ch\u00ednh tr\u1ecb", "N\u1ed9i dung v\u0103n h\u00f3a- x\u00e3 h\u1ed9i", "N\u1ed9i dung kinh t\u1ebf"], "a": 3, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "Khi x\u00e3 h\u1ed9i c\u00f3 giai c\u1ea5p, x\u00e9t v\u1ec1 m\u1eb7t k\u1ebft c\u1ea5u th\u00ec:", "o": ["Ch\u1ec9 c\u00f3 c\u00e1c giai c\u1ea5p \u0111\u1ed1i kh\u00e1ng nhau", "Ch\u1ec9 c\u00f3 nh\u1eefng giai c\u1ea5p c\u01a1 b\u1ea3n", "C\u00f3 giai c\u1ea5p nh\u01b0ng kh\u00f4ng \u0111\u1ed1i kh\u00e1ng nhau", "C\u00f3 nh\u1eefng giai c\u1ea5p c\u01a1 b\u1ea3n v\u00e0 giai c\u1ea5p kh\u00f4ng c\u01a1 b\u1ea3n"], "a": 3, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 79, "t": "l\u0129nh v\u1ef1c t\u01b0 t\u01b0\u1edfng l\u00fd lu\u1eadn \u0111\u1ec3 b\u1ea3o v\u1ec7 s\u1ef1 trong s\u00e1ng c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u00e0 t\u01b0 t\u01b0\u1edfng H\u1ed3 Ch\u00ed Minh, \u0111\u00f3 l\u00e0 n\u1ec1n t\u1ea3ng t\u01b0 t\u01b0\u1edfng c\u1ee7a \u0110\u1ea3ng, ch\u1ed1ng l\u1ea1i nh\u1eefng quan \u0111i\u1ec3m sai tr\u00e1i, nh\u1eefng s\u1ef1 xuy\u00ean t\u1ea1c c\u1ee7a c\u00e1c th\u1ebf l\u1ef1c th\u00f9 \u0111\u1ecbch, ki\u00ean \u0111\u1ecbnh l\u00fd t\u01b0\u1ecfng, m\u1ee5c ti\u00eau v\u00e0 con \u0111\u01b0\u1eddng c\u00e1ch m\u1ea1ng \u0111\u1ed9c l\u1eadp d\u00e2n t\u1ed9c v\u00e0 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. Mu\u1ed1n th\u1ef1c hi\u1ec7n \u0111\u01b0\u1ee3c s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed n\u00e0y, giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam ph\u1ea3i th\u01b0\u1eddng xuy\u00ean gi\u00e1o d\u1ee5c cho c\u00e1c th\u1ebf h\u1ec7 c\u00f4ng nh\u00e2n v\u00e0 l\u2026"}}, {"q": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i g\u1eafn li\u1ec1n v\u00e0 b\u1ecb quy \u0111\u1ecbnh b\u1edfi:", "o": ["C\u01a1 c\u1ea5u v\u0103n h\u00f3a x\u00e3 h\u1ed9i", "C\u01a1 c\u1ea5u nh\u00e2n s\u1ef1", "C\u01a1 c\u1ea5u kinh t\u1ebf", "C\u01a1 c\u1ea5u ch\u00ednh tr\u1ecb"], "a": 2, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 167, "t": "M\u1eb7c d\u00f9 c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p gi\u1eef v\u1ecb tr\u00ed quan tr\u1ecdng, song kh\u00f4ng v\u00ec th\u1ebf m\u00e0 tuy\u1ec7t \u0111\u1ed1\u1ec9 h\u00f3a n\u00f3, xem nh\u1eb9 c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00e1c, t\u1eeb \u0111\u00f3 c\u00f3 th\u1ec3 d\u1eabn \u0111\u1ebfn t\u00f9y ti\u1ec7n, mu\u1ed1n x\u00f3a b\u1ecf nhanh ch\u00f3ng c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i m\u1ed9t c\u00e1ch gi\u1ea3n \u0111\u01a1n theo \u00fd mu\u1ed1n ch\u1ee7 quan. S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u00f3 t\u00ednh quy lu\u1eadt c\u1ee7a c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i giai c\u1ea5p trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i th\u01b0\u1eddng\u2026"}}, {"q": "Xu h\u01b0\u1edbng t\u1ea5t y\u1ebfu v\u00e0 l\u00e0 bi\u1ec7n ch\u1ee9ng c\u1ee7a s\u1ef1 v\u1eadn \u0111\u1ed9ng, ph\u00e1t tri\u1ec3n c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0:", "o": ["C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i trong m\u1ed1i quan h\u1ec7 li\u00ean minh d\u1eabn \u0111\u1ebfn s\u1ef1 x\u00edch l\u1ea1i g\u1ea7n nhau gi\u1eefa c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp c\u01a1 b\u1ea3n trong x\u00e3 h\u1ed9i", "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i trong m\u1ed1i quan h\u1ec7 \u0111\u1ea5u tranh d\u1eabn \u0111\u1ebfn s\u1ef1 t\u00e1ch bi\u1ec7t tuy\u1ec7t \u0111\u1ed1i gi\u1eefa c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp c\u01a1 b\u1ea3n trong x\u00e3 h\u1ed9i", "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i trong m\u1ed1i quan h\u1ec7 v\u1eeba \u0111\u1ea5u tranh, v\u1eeba li\u00ean minh d\u1eabn \u0111\u1ebfn s\u1ef1 x\u00edch l\u1ea1i g\u1ea7n nhau gi\u1eefa c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp c\u01a1 b\u1ea3n trong x\u00e3 h\u1ed9i", "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i trong m\u1ed1i quan h\u1ec7 \u0111\u1ea5u tranh d\u1eabn \u0111\u1ebfn s\u1ef1 chuy\u1ec3n h\u00f3a l\u1eabn gi\u1eefa c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp c\u01a1 b\u1ea3n trong x\u00e3 h\u1ed9i"], "a": 2, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 170, "t": "L\u00eanin) \u0111\u00e3 xu\u1ea5t hi\u1ec7n s\u1ef1 t\u1ed3n t\u1ea1i v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a c\u00e1c t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i m\u1edbi nh\u01b0: t\u1ea7ng l\u1edbp doanh nh\u00e2n, ti\u1ec3u ch\u1ee7, t\u1ea7ng l\u1edbp nh\u1eefng ng\u01b0\u1eddi gi\u00e0u c\u00f3 v\u00e0 trung l\u01b0u trong x\u00e3 h\u1ed9i... Ba l\u00e0, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i trong m\u1ed1\u00ec quan h\u1ec7 v\u1eeba \u0111\u1ea5u tranh, v\u1eeba li\u00ean minh, t\u1eebng b\u01b0\u1edbc x\u00f3a b\u1ecf b\u1ea5t b\u00ecnh \u0111\u1eb3ng x\u00e3 h\u1ed9i d\u1eabn \u0111\u1ebfn s\u1ef1 x\u00edch l\u1ea1i g\u1ea7n nhau."}}, {"q": "Trong c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, giai c\u1ea5p n\u00e0o \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh l\u00e0 \u201cng\u01b0\u1eddi b\u1ea1n \u0111\u1ed3ng minh t\u1ef1 nhi\u00ean\u201d c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n?", "o": ["T\u01b0 s\u1ea3n", "N\u00f4ng d\u00e2n", "Tr\u00ed th\u1ee9c", "Doanh nh\u00e2n"], "a": 1, "s": "Ch\u01b0\u01a1ng 5", "e": {"p": 172, "t": "II- LI\u00caN MINH GIAI C\u1ea4P, T\u1ea6NG L\u1edaP TRONG TH\u1edcI K\u1ef2 QU\u00c1 \u0110\u1ed8 L\u00caN CH\u1ee6 NGH\u0128A X\u00c3 H\u1ed8I Khi nghi\u00ean c\u1ee9u th\u1ef1c ti\u1ec5n c\u00e1c phong tr\u00e0o \u0111\u1ea5u tranh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n ch\u1ed1ng l\u1ea1i s\u1ef1 \u00e1p b\u1ee9c, b\u00f3c l\u1ed9t c\u1ee7a giai c\u1ea5p t\u01b0 s\u1ea3n \u1edf ch\u00e2u \u00c2u, nh\u1ea5t l\u00e0 \u1ecf n\u01b0\u1ed5c Anh v\u00e0 n\u01b0\u1edbc Ph\u00e1p t\u1eeb gi\u1eefa th\u1ebf k\u1ef7 XIX, c. \u00c0ngghen \u0111\u00e3 n\u00eau ra nhi\u1ec1u l\u00fd lu\u1eadn n\u1ec1n t\u1ea3ng \u0111\u1ecbnh h\u01b0\u1ed1ng cho cu\u1ed9c \u0111\u1ea5u tranh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111i \u0111\u1ebfn th\u1eafng l\u1ee3i, trong \u0111\u00f3 l\u00fd lu\u1eadn v\u1ec1 li\u00ean minh c\u00f4ng, n\u00f4ng v\u00e0 c\u00e1c t\u1ea7ng l\u1ed1\u2026"}}, {"q": "\u201cT\u1ed5 ch\u1ee9c c\u00e1c h\u00ecnh th\u1ee9c giao l\u01b0u, h\u1ee3p t\u00e1c, li\u00ean k\u1ebft kinh t\u1ebf gi\u1eefa c\u00e1c ng\u00e0nh kinh t\u1ebf; c\u00e1c th\u00e0nh ph\u1ea7n kinh t\u1ebf, c\u00e1c v\u00f9ng kinh t\u1ebf \u0111\u1ec3 ph\u00e1t tri\u1ec3n s\u1ea3n xu\u1ea5t kinh doanh, n\u00e2ng cao \u0111\u1eddi s\u1ed1ng cho c\u00f4ng nh\u00e2n, n\u00f4ng d\u00e2n, tr\u00ed th\u1ee9c v\u00e0 to\u00e0n x\u00e3 h\u1ed9i\u201d l\u00e0 n\u1ed9i dung li\u00ean minh giai c\u1ea5p, t\u1ea7ng l\u1edbp thu\u1ed9c l\u0129nh v\u1ef1c n\u00e0o?", "o": ["Ch\u00ednh tr\u1ecb", "Kinh t\u1ebf", "T\u01b0 t\u01b0\u1edfng", "V\u0103n h\u00f3a - x\u00e3 h\u1ed9i"], "a": 1, "s": "Ch\u01b0\u01a1ng 5", "e": null}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, nguy\u00ean nh\u00e2n quy\u1ebft \u0111\u1ecbnh s\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c l\u00e0:", "o": ["S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a th\u1eddi ti\u1ebft, kh\u00ed h\u1eadu", "S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t", "S\u1ef1 va ch\u1ea1m gi\u1eefa c\u00e1c n\u1ec1n v\u0103n minh", "S\u1ef1 bi\u1ebfn \u0111\u1ed5i di truy\u1ec1n c\u1ee7a con ng\u01b0\u1eddi"], "a": 1, "s": "Ch\u01b0\u01a1ng 6", "e": {"p": 195, "t": "Kh\u00e1i ni\u1ec7m, \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n c\u1ee7a d\u00e2n t\u1ed9c Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin, d\u00e2n t\u1ed9c l\u00e0 qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n l\u00e2u d\u00e0i c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi, tr\u1ea3i qua c\u00e1c h\u00ecnh th\u1ee9c c\u1ed9ng \u0111\u1ed3ng t\u1eeb th\u1ea5p \u0111\u1ebfn cao, bao g\u1ed3m: th\u1ecb t\u1ed9c, b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c, d\u00e2n t\u1ed9c. S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ch\u00ednh l\u00e0 nguy\u00ean nh\u00e2n quy\u1ebft \u0111\u1ecbnh s\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c."}}, {"q": "Y\u1ebfu t\u1ed1 n\u00e0o th\u1ec3 hi\u1ec7n ch\u1ee7 quy\u1ec1n c\u1ee7a m\u1ed9t d\u00e2n t\u1ed9c trong t\u01b0\u01a1ng quan v\u1edbi c\u00e1c qu\u1ed1c gia \u2013 d\u00e2n t\u1ed9c kh\u00e1c, l\u00e0 y\u1ebfu t\u1ed1 thi\u00eang li\u00eang nh\u1ea5t \u0111\u1ed1i v\u1edbi qu\u1ed1c gia v\u00e0 t\u1eebng th\u00e0nh vi\u00ean d\u00e2n t\u1ed9c, kh\u00f4ng c\u00f3 y\u1ebfu t\u1ed1 n\u00e0y th\u00ec kh\u00f4ng c\u00f3 kh\u00e1i ni\u1ec7m t\u1ed5 qu\u1ed1c, qu\u1ed1c gia?", "o": ["L\u00e3nh th\u1ed5", "N\u1ec1n kinh t\u1ebf", "V\u0103n h\u00f3a", "Th\u1ec3 ch\u1ebf ch\u00ednh tr\u1ecb"], "a": 0, "s": "Ch\u01b0\u01a1ng 6", "e": {"p": 196, "t": "\u0110\u1ed1i v\u1edbi qu\u1ed1c gia v\u00e0 t\u1eebng th\u00e0nh vi\u00ean d\u00e2n t\u1ed9c, y\u1ebfu t\u1ed1 l\u00e3nh th\u1ed5 l\u00e0 thi\u00eang li\u00eang nh\u1ea5t. Kh\u00f4ng c\u00f3 l\u00e3nh th\u1ed5 th\u00ec kh\u00f4ng c\u00f3 kh\u00e1i ni\u1ec7m t\u1ed5 qu\u1ed1c, qu\u1ed1c gia. B\u1ea3o v\u1ec7 ch\u1ee7 quy\u1ec1n qu\u1ed1c gia l\u00e0 ngh\u0129a v\u1ee5 v\u00e0 tr\u00e1ch nhi\u1ec7m cao nh\u1ea5t c\u1ee7a m\u1ed7i th\u00e0nh vi\u00ean d\u00e2n t\u1ed9c."}}, {"q": "D\u00e2n t\u1ed9c hi\u1ec3u theo ngh\u0129a h\u1eb9p l\u00e0:", "o": ["B\u1ed9 l\u1ea1c", "Qu\u1ed1c gia d\u00e2n t\u1ed9c", "T\u1ed9c ng\u01b0\u1eddi", "B\u1ed9 t\u1ed9c"], "a": 2, "s": "Ch\u01b0\u01a1ng 6", "e": {"p": 198, "t": "C\u00e1c \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n n\u00f3i tr\u00ean g\u1eafn b\u00f3 ch\u1eb7t ch\u1ebd v\u1edbi nhau trong m\u1ed9t ch\u00ecnh th\u1ec3, \u0111\u1ed3ng th\u1eddi m\u1ed7i \u0111\u1eb7c tr\u01b0ng c\u00f3 m\u1ed9t v\u1ecb tr\u00ed x\u00e1c \u0111\u1ecbnh. C\u00e1c \u0111\u1eb7c tr\u01b0ng \u1ea5y c\u00f3 quan h\u1ec7 nh\u00e2n qu\u1ea3, t\u00e1c \u0111\u1ed9ng qua l\u1ea1i, k\u1ebft h\u1ee3p v\u1edbi nhau m\u1ed9t c\u00e1ch ch\u1eb7t ch\u1ebd v\u00e0 \u0111\u1ed9c \u0111\u00e1o trong l\u1ecbch s\u1eed h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a d\u00e2n t\u1ed9c, t\u1ea1o n\u00ean t\u00ednh \u1ed5n \u0111\u1ecbnh, b\u1ec1n v\u1eefng c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c. Theo ngh\u0129a h\u1eb9p, d\u00e2n t\u1ed9c (Ethnie) l\u00e0 kh\u00e1i ni\u1ec7m d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng t\u1ed9c ng\u01b0\u1eddi \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh \u2026"}}, {"q": "Theo ngh\u0129a r\u1ed9ng, d\u00e2n t\u1ed9c l\u00e0:", "o": ["T\u1ed9c ng\u01b0\u1eddi", "Qu\u1ed1c gia", "Th\u1ecb t\u1ed9c", "B\u1ed9 t\u1ed9c"], "a": 1, "s": "Ch\u01b0\u01a1ng 6", "e": {"p": 195, "t": "D\u00e2n t\u1ed9c \u0111\u01b0\u1ee3c hi\u1ec3u theo hai ngh\u0129a r\u1ed9ng v\u00e0 ngh\u0129a h\u1eb9p: Theo ngh\u0129a r\u1ed9ng, d\u00e2n t\u1ed9c (Nation) l\u00e0 kh\u00e1i ni\u1ec7m d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1edfi \u1ed5n \u0111\u1ecbnh l\u00e0m th\u00e0nh nh\u00e2n d\u00e2n m\u1ed9t n\u01b0\u1edbc, c\u00f3 l\u00e3nh th\u1ed5 ri\u00eang, n\u1ec1n kinh t\u00ea' th\u00f4ng nh\u1ea5t, c\u00f3 ng\u00f4n ng\u1eef chung v\u00e0 c\u00f3 \u00fd th\u1ee9c v\u1ec1 s\u1ef1 th\u00f4ng nh\u1ea5t c\u1ee7a m\u00ecnh, g\u1eafn b\u00f3 v\u1edbi nhau b\u1edfi quy\u1ec1n l\u1ee3i ch\u00ednh tr\u1ecb, kinh t\u1ebf, truy\u1ec1n th\u1ed1hg v\u0103n h\u00f3a v\u00e0 truy\u1ec1n th\u00f4ng \u0111\u1ea5u tranh chung trong su\u00f4't qu\u00e1 tr\u00ecnh l\u1ecbch s\u1eed l\u00e2u d\u00e0i d\u1ef1ng n\u01b0\u1edbc v\u00e0 gi\u1eef n\u01b0\u2026"}}, {"q": "Nguy\u00ean nh\u00e2n n\u00e0o d\u1eabn \u0111\u1ebfn c\u00e1c c\u1ed9ng \u0111\u1ed3ng d\u00e2n c\u01b0 mu\u1ed1n t\u00e1ch ra \u0111\u1ec3 h\u00ecnh th\u00e0nh c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c \u0111\u1ed9c l\u1eadp?", "o": ["Do s\u1ef1 th\u1ee9c t\u1ec9nh, tr\u01b0\u1edfng th\u00e0nh v\u1ec1 \u00fd th\u1ee9c d\u00e2n t\u1ed9c, \u00fd th\u1ee9c v\u1ec1 quy\u1ec1n s\u1ed1ng c\u1ee7a m\u00ecnh .", "Do ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n \u0111\u00e3 ph\u00e1t tri\u1ec3n th\u00e0nh ch\u1ee7 ngh\u0129a \u0111\u1ebf qu\u1ed1c.", "Do c\u00e1c qu\u1ed1c gia b\u1ecb \u00e1p b\u1ee9c.", "Do c\u00e1c qu\u1ed1c gia mu\u1ed1n \u0111\u1ed9c l\u1eadp."], "a": 0, "s": "Ch\u01b0\u01a1ng 6", "e": {"p": 200, "t": "Xu h\u01b0\u1edbng th\u1ee9 nh\u1ea5t, c\u1ed9ng \u0111\u1ed3ng d\u00e2n c\u01b0 mu\u00f4n t\u00e1ch ra \u0111\u1ec3 h\u00ecnh th\u00e0nh c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c \u0111\u1ed9c l\u1eadp. Nguy\u00ean nh\u00e2n l\u00e0 do s\u1ef1 th\u1ee9c t\u1ec9nh, s\u1ef1 tr\u01b0\u1edfng th\u00e0nh v\u1ec1 \u00fd th\u1ee9c d\u00e2n t\u1ed9c, \u00fd", "a": 1}}, {"q": "N\u1ed9i dung ch\u1ee7 y\u1ebfu v\u00e0 gi\u1ea3i ph\u00e1p quan tr\u1ecdng \u0111\u1ec3 li\u00ean k\u1ebft c\u00e1c n\u1ed9i dung c\u1ee7a C\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c th\u00e0nh m\u1ed9t ch\u1ec9nh th\u1ec3 l\u00e0:", "o": ["Li\u00ean hi\u1ec7p c\u00f4ng nh\u00e2n t\u1ea5t c\u1ea3 c\u00e1c d\u00e2n t\u1ed9c", "C\u00e1c d\u00e2n t\u1ed9c c\u00f3 quy\u1ec1n b\u00ecnh \u0111\u1eb3ng", "C\u00e1c d\u00e2n t\u1ed9c c\u00f3 quy\u1ec1n t\u1ef1 quy\u1ebft", "C\u00e1c d\u00e2n t\u1ed9c c\u00f3 quy\u1ec1n l\u1ee3i ri\u00eang"], "a": 0, "s": "Ch\u01b0\u01a1ng 6", "e": {"p": 101, "t": "li\u00ean hi\u1ec7p c\u00f4ng nh\u00e2n t\u1ea5t c\u1ea3 c\u00e1c d\u00e2n t\u1ed9c l\u1ea1i: \u0111\u00f3 l\u00e0 c\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c m\u00e0 ch\u1ee7 ngh\u0129a M\u00e1c, kinh nghi\u1ec7m to\u00e0n th\u1ebf gi\u1edbi v\u00e0 kinh nghi\u1ec7m c\u1ee7a n\u01b0\u1ed1c Nga d\u1ea1y cho c\u00f4ng nh\u00e2n\u201d1. Gi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1 d\u00e2n t\u1ed9c theo C\u01b0\u01a1ng l\u0129nh c\u1ee7a V.I."}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, c\u01a1 s\u1edf \u0111\u1ec3 th\u1ef1c hi\u1ec7n quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft v\u00e0 x\u00e2y d\u1ef1ng m\u1ed1i quan h\u1ec7 h\u1eefu ngh\u1ecb, h\u1ee3p t\u00e1c gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c l\u00e0:", "o": ["C\u00e1c d\u00e2n t\u1ed9c c\u00f3 quy\u1ec1n t\u1ef1 l\u1ef1a ch\u1ecdn ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb v\u00e0 con \u0111\u01b0\u1eddng ph\u00e1t tri\u1ec3n c\u1ee7a d\u00e2n t\u1ed9c m\u00ecnh", "C\u00e1c d\u00e2n t\u1ed9c b\u1ecb \u00e1p b\u1ee9c li\u00ean k\u1ebft l\u1ea1i v\u1edbi nhau", "Li\u00ean hi\u1ec7p c\u00f4ng nh\u00e2n t\u1ea5t c\u1ea3 c\u00e1c d\u00e2n t\u1ed9c", "Quy\u1ec1n b\u00ecnh \u0111\u1eb3ng gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c"], "a": 3, "s": "Ch\u01b0\u01a1ng 6", "e": {"p": 203, "t": "\u0110\u1ec3 th\u1ef1c hi\u1ec7n \u0111\u01b0\u1ee3c quy\u1ec1n b\u00ecnh \u0111\u1eb3ng d\u00e2n t\u1ed9c, tr\u01b0\u1edbc h\u1ebft ph\u1ea3i th\u1ee7 ti\u00eau t\u00ecnh tr\u1ea1ng \u00e1p b\u1ee9c giai c\u1ea5p, tr\u00ean c\u01a1 s\u1ecf \u0111\u00f3 xo\u00e1 b\u1ecf t\u00ecnh tr\u1ea1ng \u00e1p b\u1ee9c d\u00e2n t\u1ed9c; ph\u1ea3i \u0111\u1ea5u tranh ch\u1ed1ng ch\u1ee7 ngh\u0129a ph\u00e2n bi\u1ec7t ch\u1ee7ng t\u1ed9c, ch\u1ee7 ngh\u0129a d\u00e2n t\u1ed9c c\u1ef1c \u0111oan. Quy\u1ec1n b\u00ecnh \u0111\u1eb3ng gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c l\u00e0 c\u01a1 s\u1edf \u0111\u1ec3 th\u1ef1c hi\u1ec7n quy\u1ec1n d\u00e2n t\u1ed9 ng kh\u00e1c (nh\u00e0 tr\u01b0\u00f2ng, c\u00e1c \u0111o\u00e0n th\u1ec3, ch\u00ednh quy\u1ec1n, v.v.) c\u0169ng th\u1ef1c hi\u1ec7n ch\u1ee9c n\u0103ng n\u00e0y, nh\u01b0ng kh\u00f4ng th\u1ec3 thay th\u1ebf ch\u1ee9c n\u0103ng gi\u00e1o d\u1ee5c c\u1ee7a gia \u0111\u00ecnh. V\u1edbi ch\u1ee9c n\u0103ng n\u00e0y, gia \u0111\u00ecnh g\u00f3p ph\u1ea7n to l\u1edbn v\u00e0o vi\u1ec7c \u0111\u00e0o t\u1ea1o th\u1ebf h\u1ec7 tr\u1ebb, \u2026"}}, {"q": "Trong khi th\u1ef1c hi\u1ec7n ch\u1ee9c n\u0103ng kinh t\u1ebf v\u00e0 t\u1ed5 ch\u1ee9c ti\u00eau d\u00f9ng, \u0111\u1eb7c th\u00f9 c\u1ee7a gia \u0111\u00ecnh m\u00e0 c\u00e1c \u0111\u01a1n v\u1ecb kinh t\u1ebf kh\u00e1c kh\u00f4ng c\u00f3 \u0111\u01b0\u1ee3c l\u00e0:", "o": ["Gia \u0111\u00ecnh l\u00e0 \u0111\u01a1n v\u1ecb duy nh\u1ea5t tham gia v\u00e0o qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t cho x\u00e3 h\u1ed9i", "Gia \u0111\u00ecnh l\u00e0 \u0111\u01a1n v\u1ecb duy nh\u1ea5t tham gia v\u00e0o qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra t\u01b0 li\u1ec7u ti\u00eau d\u00f9ng cho x\u00e3 h\u1ed9i", "Gia \u0111\u00ecnh l\u00e0 \u0111\u01a1n v\u1ecb duy nh\u1ea5t tham gia v\u00e0o qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra s\u1ee9c lao \u0111\u1ed9ng cho x\u00e3 h\u1ed9i", "Gia \u0111\u00ecnh l\u00e0 \u0111\u01a1n v\u1ecb duy nh\u1ea5t tham gia v\u00e0o qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i cho x\u00e3 h\u1ed9i"], "a": 2, "s": "Ch\u01b0\u01a1ng 7", "e": {"p": 247, "t": "Tuy nhi\u00ean, \u0111\u1eb7c th\u00f9 c\u1ee7a gia \u0111\u00ecnh m\u00e0 c\u00e1c \u0111\u01a1n v\u1ecb kinh t\u1ebf kh\u00e1c kh\u00f4ng c\u00f3 \u0111\u01b0\u1ee3c l\u00e0 \u1ecf ch\u1ed7, gia \u0111\u00ecnh l\u00e0 \u0111\u01a1n v\u1ecb duy nh\u1ea5t tham gia v\u00e0o qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra s\u1ee9c lao \u0111\u1ed9ng cho x\u00e3 h\u1ed9i. Gia \u0111\u00ecnh kh\u00f4ng ch\u1ec9 tham gia tr\u1ef1c ti\u1ebfp v\u00e0o s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t v\u00e0 s\u1ee9c lao \u0111\u1ed9ng, m\u00e0 c\u00f2n l\u00e0 m\u1ed9t \u0111\u01a1n v\u1ecb ti\u00eau d\u00f9ng trong x\u00e3 h\u1ed9i. Gia \u0111\u00ecnh th\u1ef1c hi\u1ec7n ch\u1ee9c n\u0103ng t\u1ed5 ch\u1ee9c ti\u00eau d\u00f9ng h\u00e0ng h\u00f3a \u0111\u1ec3 duy tr\u00ec \u0111\u00f2i s\u1ed1ng c\u1ee7a gia \u0111\u00ecnh v\u1ec1 la\u2026"}}, {"q": "V\u1edbi ch\u1ee9c n\u0103ng ch\u00ednh tr\u1ecb, gia \u0111\u00ecnh:", "o": ["L\u00e0 n\u01a1i l\u01b0u gi\u1eef truy\u1ec1n th\u1ed1ng v\u0103n h\u00f3a c\u1ee7a d\u00e2n t\u1ed9c c\u0169ng nh\u01b0 t\u1ed9c ng\u01b0\u1eddi", "L\u00e0 c\u1ea7u n\u1ed1i c\u1ee7a m\u1ed1i quan h\u1ec7 gi\u1eefa nh\u00e0 n\u01b0\u1edbc v\u1edbi c\u00f4ng d\u00e2n", "L\u00e0 n\u01a1i \u0111\u00e1p \u1ee9ng nhu c\u1ea7u t\u00e2m, sinh l\u00fd t\u1ef1 nhi\u00ean c\u1ee7a con ng\u01b0\u1eddi, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u duy tr\u00ec n\u00f2i gi\u1ed1ng", "C\u00f3 tr\u00e1ch nhi\u1ec7m nu\u00f4i d\u01b0\u1ee1ng, d\u1ea1y d\u1ed7 con c\u00e1i tr\u1edf th\u00e0nh ng\u01b0\u1eddi c\u00f3 \u00edch cho gia \u0111\u00ecnh, c\u1ed9ng \u0111\u1ed3ng v\u00e0 x\u00e3 h\u1ed9i"], "a": 1, "s": "Ch\u01b0\u01a1ng 7", "e": {"p": 249, "t": "Gia \u0111\u00ecnh kh\u00f4ng ch\u1ec9 l\u00e0 n\u01a1i l\u01b0u gi\u1eef m\u00e0 c\u00f2n l\u00e0 n\u01a1i s\u00e1ng t\u1ea1o v\u00e0 th\u1ee5 h\u01b0\u1ecfng nh\u1eefng gi\u00e1 tr\u1ecb v\u0103n h\u00f3a c\u1ee7a x\u00e3 h\u1ed9i. V\u1edbi ch\u1ee9c n\u0103ng ch\u00ednh tr\u1ecb, gia \u0111\u00ecnh l\u00e0 m\u1ed9t t\u1ed5 ch\u1ee9c ch\u00ednh tr\u1ecb c\u1ee7a x\u00e3 h\u1ed9i, l\u00e0 n\u01a1i t\u1ed5 ch\u1ee9c th\u1ef1c hi\u1ec7n ch\u00ednh s\u00e1ch, ph\u00e1p lu\u1eadt c\u1ee7a nh\u00e0 n\u01b0\u1edbc v\u00e0 quy ch\u1ebf (h\u01b0\u01a1ng \u01b0\u1edbc) c\u1ee7a l\u00e0ng, x\u00e3 v\u00e \u1eafn b\u00f3, li\u00ean k\u1ebft, r\u00e0ng bu\u1ed9c v\u00e0 ph\u1ee5 thu\u1ed9c l\u1eabn nhau, b\u1edfi ngh\u0129a v\u1ee5, quy\u1ec1n l\u1ee3i v\u00e0 tr\u00e1ch nhi\u1ec7m c\u1ee7a m\u1ed7i ng\u01b0\u1eddi, \u0111\u01b0\u1ee3c quy \u0111\u1ecbnh b\u1eb1ng ph\u00e1p l\u00fd ho\u1eb7c \u0111\u1ea1o l\u00fd. Quan h\u1ec7 h\u00f4n nh\u00e2n l\u00e0 c\u01a1 s\u1edf, n\u1ec1n t\u1ea3ng h\u00ecnh th\u00e0nh n\u00ean c\u00e1c m\u1ed1\u00ec quan h\u1ec7 kh\u00e1c trong gia \u0111\u00ecnh, l\u00e0 c\u01a1 s\u1edf ph\u00e1p l\u00fd cho s\u1ef1 t\u1ed3n\u2026"}}, {"q": "Quan h\u1ec7 n\u00e0o n\u1ea3y sinh t\u1eeb quan h\u1ec7 h\u00f4n nh\u00e2n v\u00e0 l\u00e0 m\u1ed1i quan h\u1ec7 t\u1ef1 nhi\u00ean, l\u00e0 y\u1ebfu t\u1ed1 m\u1ea1nh m\u1ebd nh\u1ea5t g\u1eafn k\u1ebft c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh v\u1edbi nhau?", "o": ["Nu\u00f4i d\u01b0\u1ee1ng", "H\u00f4n nh\u00e2n", "Huy\u1ebft th\u1ed1ng", "Ch\u00ednh tr\u1ecb"], "a": 2, "s": "Ch\u01b0\u01a1ng 7", "e": {"p": 239, "t": "Quan h\u1ec7 h\u00f4n nh\u00e2n l\u00e0 c\u01a1 s\u1edf, n\u1ec1n t\u1ea3ng h\u00ecnh th\u00e0nh n\u00ean c\u00e1c m\u1ed1\u00ec quan h\u1ec7 kh\u00e1c trong gia \u0111\u00ecnh, l\u00e0 c\u01a1 s\u1edf ph\u00e1p l\u00fd cho s\u1ef1 t\u1ed3n t\u1ea1i c\u1ee7a m\u1ed7i gia \u0111\u00ecnh. Quan h\u1ec7 huy\u1ebft th\u1ed1ng l\u00e0 quan h\u1ec7 gi\u1eefa nh\u1eefng ng\u01b0\u1eddi c\u00f9ng m\u1ed9t d\u00f2ng m\u00e1u, n\u1ea3y sinh t\u1eeb quan h\u1ec7 h\u00f4n nh\u00e2n. \u0110\u00e2y l\u00e0 m\u1ed1\u00ec quan h\u1ec7 t\u1ef1 nhi\u00ean, l\u00e0 y\u1ebfu t\u1ed1 m\u1ea1nh m\u1ebd nh\u1ea5t g\u1eafn k\u1ebft c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh v\u1edbi nhau."}}, {"q": "Ch\u1ecdn \u00fd kh\u00f4ng \u0111\u00fang v\u1ec1 \u0111i\u1ec1u ki\u1ec7n c\u1ee7a ch\u1ebf \u0111\u1ed9 h\u00f4n nh\u00e2n ti\u1ebfn b\u1ed9:", "o": ["H\u00f4n nh\u00e2n \u0111\u01b0\u1ee3c \u0111\u1ea3m b\u1ea3o v\u1ec1 ph\u00e1p l\u00fd", "H\u00f4n nh\u00e2n m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng, v\u1ee3 ch\u1ed3ng b\u00ecnh \u0111\u1eb3ng", "H\u00f4n nh\u00e2n t\u1ef1 nguy\u1ec7n", "H\u00f4n nh\u00e2n v\u00ec m\u1ee5c \u0111\u00edch v\u1ee5 l\u1ee3i"], "a": 3, "s": "Ch\u01b0\u01a1ng 7", "e": {"p": 254, "t": "\u00e1t \u0111i, th\u00ec ly h\u00f4n s\u1ebd l\u00e0 \u0111i\u1ec1u hay cho c\u1ea3 \u0111\u00f4i b\u00ean c\u0169ng nh\u01b0 cho x\u00e3 h\u1ed9i\u201d1. Tuy nhi\u00ean, h\u00f4n nh\u00e2n ti\u1ebfn b\u1ed9 kh\u00f4ng khuy\u1ebfn kh\u00edch vi\u1ec7c ly h\u00f4n, v\u00ec ly h\u00f4n \u0111\u1ec3 l\u1ea1i h\u1eadu qu\u1ea3 nh\u1ea5t \u0111\u1ecbnh cho x\u00e3 h\u1ed9i, cho c\u1ea3 v\u1ee3, ch\u1ed3ng v\u00e0 \u0111\u1eb7c bi\u1ec7t l\u00e0 con c\u00e1i. V\u00ec v\u1eady, c\u1ea7n ng\u0103n ch\u1eb7n nh\u1eefng tr\u01b0\u00f2ng h\u1ee3p n\u00f4ng n\u1ed5i khi ly h\u00f4n, ng\u0103n ch\u1eb7n hi\u1ec7n t\u01b0\u1ee3ng l\u1ee3i d\u1ee5ng quy\u1ec1n ly h\u00f4n v\u00e0 nh\u1eefng l\u00fd do \u00edch k\u1ef7 ho\u1eb7c v\u00ec m\u1ee5c \u0111\u00edch v\u1ee5 l\u1ee3i."}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, trong c\u00e1c x\u00e3 h\u1ed9i d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu, ch\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng th\u1ef1c ch\u1ea5t ch\u1ec9 \u0111\u1ed1i v\u1edbi ng\u01b0\u1eddi ph\u1ee5 n\u1eef, v\u00ec:", "o": ["Ch\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng sinh ra t\u1eeb s\u1ef1 t\u1eadp trung nhi\u1ec1u c\u1ee7a c\u1ea3i v\u00e0o tay m\u1ed9t ng\u01b0\u1eddi - ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng, v\u00e0 nguy\u1ec7n v\u1ecdng chuy\u1ec3n c\u1ee7a c\u1ea3i \u1ea5y l\u1ea1i cho con c\u00e1i c\u1ee7a ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng \u1ea5y", "Ch\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng sinh ra t\u1eeb s\u1ef1 t\u00ecnh y\u00eau ch\u00e2n ch\u00ednh v\u00e0 b\u00ecnh \u0111\u1eb3ng c\u1ee7a c\u1ea3 ng\u01b0\u1eddi nam v\u00e0 ng\u01b0\u1eddi n\u1eef", "Ch\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng sinh ra t\u1eeb s\u1ef1 \u0111\u1ea5u tranh c\u1ee7a ng\u01b0\u1eddi ph\u1ee5 n\u1eef", "Ch\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng sinh ra t\u1eeb phong t\u1ee5c, t\u1eadp qu\u00e1n"], "a": 0, "s": "Ch\u01b0\u01a1ng 7", "e": {"p": 254, "t": "H\u00f4n nh\u00e2n m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng \u0111\u00e3 xu\u1ea5t hi\u1ec7n t\u1eeb s\u1edbm trong l\u1ecbch s\u1eed x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi, khi c\u00f3 s\u1ef1 th\u1eafng l\u1ee3i c\u1ee7a ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu \u0111\u1ed1i v\u1edbi ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu nguy\u00ean th\u1ee7y. Tuy nhi\u00ean, trong c\u00e1c x\u00e3 h\u1ed9i tr\u01b0\u1edbc, h\u00f4n nh\u00e2n m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng th\u1ef1c ch\u1ea5t ch\u1ec9 \u0111\u1ed1\u00ec v\u1ed1i ng\u01b0\u1eddi ph\u1ee5 n\u1eef. \u201cCh\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng sinh ra t\u1eeb s\u1ef1 t\u1eadp trung nhi\u1ec1u c\u1ee7a c\u1ea3i v\u00e0o tay m\u1ed9t ng\u01b0\u00f2i, - v\u00e0o tay ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng - v\u00e0 t\u1eeb nguy\u1ec7n v\u1ecdng chuy\u1ec3n c\u1ee7a c\u1ea3i \u1ea5y l\u1ea1i cho con c\u00e1i c\u1ee7a ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng \u1ea5\u2026"}}, {"q": "\u0110\u1ec3 ph\u00e1t huy vai tr\u00f2, tr\u00e1ch nhi\u1ec7m c\u1ee7a ng\u01b0\u1eddi ph\u1ee5 n\u1eef trong x\u00e2y d\u1ef1ng gia \u0111\u00ecnh v\u0103n minh h\u1ea1nh ph\u00fac v\u00e0 b\u1ea3o v\u1ec7 m\u00f4i tr\u01b0\u1eddng s\u1ed1ng c\u1ee7a to\u00e0n x\u00e3 h\u1ed9i, Trung \u01b0\u01a1ng H\u1ed9i Li\u00ean hi\u1ec7p Ph\u1ee5 n\u1eef Vi\u1ec7t Nam \u0111\u00e3 ph\u00e1t \u0111\u1ed9ng Cu\u1ed9c v\u1eadn \u0111\u1ed9ng \"X\u00e2y d\u1ef1ng gia \u0111\u00ecnh 5 kh\u00f4ng, 3 s\u1ea1ch\" v\u00e0o n\u0103m 2010, trong \u0111\u00f3 \"5 kh\u00f4ng\" g\u1ed3m nh\u1eefng ti\u00eau ch\u00ed n\u00e0o?", "o": ["Kh\u00f4ng \u0111\u00f3i ngh\u00e8o; kh\u00f4ng vi ph\u1ea1m ph\u00e1p lu\u1eadt, t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i; kh\u00f4ng c\u00f3 b\u1ea1o l\u1ef1c gia \u0111\u00ecnh; kh\u00f4ng sinh con th\u1ee9 3 tr\u1edf l\u00ean; kh\u00f4ng c\u00f3 tr\u1ebb em trong \u0111\u1ed9 tu\u1ed5i \u0111\u1ebfn tru\u1eddng b\u1ecf h\u1ecdc", "Kh\u00f4ng \u0111\u00f3i ngh\u00e8o; kh\u00f4ng vi ph\u1ea1m ph\u00e1p lu\u1eadt; kh\u00f4ng t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i; kh\u00f4ng c\u00f3 b\u1ea1o l\u1ef1c gia \u0111\u00ecnh; kh\u00f4ng sinh con th\u1ee9 3 tr\u1edf l\u00ean", "Kh\u00f4ng \u0111\u00f3i ngh\u00e8o; kh\u00f4ng vi ph\u1ea1m ph\u00e1p lu\u1eadt, t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i; kh\u00f4ng c\u00f3 b\u1ea1o l\u1ef1c gia \u0111\u00ecnh; kh\u00f4ng sinh con th\u1ee9 3; kh\u00f4ng c\u00f3 tr\u1ebb suy dinh d\u01b0\u1ee1ng", "Kh\u00f4ng \u0111\u00f3i ngh\u00e8o; kh\u00f4ng vi ph\u1ea1m ph\u00e1p lu\u1eadt, t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i; kh\u00f4ng c\u00f3 b\u1ea1o l\u1ef1c gia \u0111\u00ecnh; kh\u00f4ng sinh con th\u1ee9 3 tr\u1edf l\u00ean; kh\u00f4ng c\u00f3 tr\u1ebb suy dinh d\u01b0\u1ee1ng v\u00e0 b\u1ecf h\u1ecdc"], "a": 0, "s": "Ch\u01b0\u01a1ng 7", "e": null}, {"q": "H\u00ecnh th\u1ee9c gia \u0111\u00ecnh n\u00e0o \u0111ang tr\u1edf n\u00ean r\u1ea5t ph\u1ed5 bi\u1ebfn \u1edf c\u00e1c \u0111\u00f4 th\u1ecb v\u00e0 c\u1ea3 \u1edf n\u00f4ng th\u00f4n \u2013 thay th\u1ebf cho ki\u1ec3u gia \u0111\u00ecnh truy\u1ec1n th\u1ed1ng t\u1eebng gi\u1eef vai tr\u00f2 ch\u1ee7 \u0111\u1ea1o tr\u01b0\u1edbc \u0111\u00e2y?", "o": ["Gia \u0111\u00ecnh \u0111\u01a1n th\u00e2n", "Gia \u0111\u00ecnh h\u1ea1t nh\u00e2n", "Gia \u0111\u00ecnh tam \u0111\u1ea1i \u0111\u1ed3ng \u0111\u01b0\u1eddng", "Gia \u0111\u00ecnh t\u1ee9 \u0111\u1ea1i \u0111\u1ed3ng \u0111\u01b0\u1eddng"], "a": 1, "s": "Ch\u01b0\u01a1ng 7", "e": {"p": 257, "t": "S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a gia \u0111\u00ecnh Vi\u1ec7t Nam trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i Gia \u0111\u00ecnh Vi\u1ec7t Nam ng\u00e0y nay c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c coi l\u00e0 \u201cgia \u0111\u00ecnh qu\u00e1 \u0111\u1ed9\u201d trong b\u01b0\u1ed1c chuy\u1ec3n bi\u1ebfn t\u1eeb x\u00e3 h\u1ed9i n\u00f4ng nghi\u1ec7p c\u1ed5 truy\u1ec1n sang x\u00e3 h\u1ed9i c\u00f4ng nghi\u1ec7p hi\u1ec7n \u0111\u1ea1i. Trong qu\u00e1 tr\u00ecnh n\u00e0y, s\u1ef1 gi\u1ea3i th\u1ec3 c\u1ee7a c\u1ea5u tr\u00fac gia \u0111\u00ecnh truy\u1ec1n th\u1ed1ng v\u00e0 s\u1ef1 h\u00ecnh th\u00e0nh h\u00ecnh th\u00e1i m\u1edbi l\u00e0 m\u1ed9t t\u1ea5t y\u1ebfu. Gia \u0111\u00ecnh \u0111\u01a1n (c\u00f2n g\u1ecdi l\u00e0 gia \u0111\u00ecnh h\u1ea1t nh\u00e2n) \u0111ang tr\u1edf n\u00ean r\u1ea5t ph\u1ed5 bi\u1ebfn \u1edf c\u00e1c \u0111\u00f4 th\u1ecb v\u00e0 \u2026"}}, {"q": "Hi\u1ec7n nay, d\u00e2n s\u1ed1 Vi\u1ec7t Nam \u0111ang chuy\u1ec3n sang giai \u0111o\u1ea1n gi\u00e0 h\u00f3a, \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o l\u1ee3i \u00edch c\u1ee7a gia \u0111\u00ecnh v\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n b\u1ec1n v\u1eefng c\u1ee7a x\u00e3 h\u1ed9i, th\u00f4ng \u0111i\u1ec7p m\u1edbi trong k\u1ebf ho\u1ea1ch gia \u0111\u00ecnh l\u00e0:", "o": ["Khuy\u1ebfn kh\u00edch vi\u1ec7c kh\u00f4ng sinh con", "M\u1ed7i c\u1eb7p v\u1ee3 ch\u1ed3ng ch\u1ec9 n\u00ean c\u00f3 t\u1eeb 1 \u0111\u1ebfn 2 con", "M\u1ed7i c\u1eb7p v\u1ee3 ch\u1ed3ng n\u00ean sinh \u0111\u1ee7 hai con", "Khuy\u1ebfn kh\u00edch vi\u1ec7c sinh con c\u00f3 l\u1ef1a ch\u1ecdn gi\u1edbi t\u00ednh"], "a": 2, "s": "Ch\u01b0\u01a1ng 7", "e": {"p": 259, "t": "qua cu\u1ed9c v\u1eadn \u0111\u1ed9ng sinh \u0111\u1ebb c\u00f3 k\u1ebf ho\u1ea1ch, khuy\u1ebfn kh\u00edch m\u1ed7i c\u1eb7p v\u1ee3 ch\u1ed3ng ch\u1ec9 n\u00ean c\u00f3 t\u1eeb 1 \u0111\u1ebfn 2 con. Sang th\u1eadp ni\u00ean \u0111\u1ea7u th\u1ebf k\u1ef7 XXI, d\u00e2n s\u1ed1 Vi\u1ec7t Nam \u0111ang chuy\u1ec3n sang giai \u0111o\u1ea1n gi\u00e0 h\u00f3a. \u0110\u1ec3 \u0111\u1ea3m b\u1ea3o l\u1ee3i \u00edch c\u1ee7a gia \u0111\u00ecnh v\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n b\u1ec1n v\u1eefng c\u1ee7a x\u00e3 h\u1ed9i, th\u00f4ng \u0111i\u1ec7p m\u1edbi trong k\u1ebf ho\u1ea1ch h\u00f3a gia \u0111\u00ecnh l\u00e0 m\u1ed7i c\u1eb7p v\u1ee3 ch\u1ed3ng n\u00ean sinh \u0111\u1ee7 hai con."}}, {"q": "Trong gia \u0111\u00ecnh Vi\u1ec7t Nam hi\u1ec7n nay, ng\u01b0\u1eddi ch\u1ee7 gia \u0111\u00ecnh \u0111\u01b0\u1ee3c quan ni\u1ec7m l\u00e0:", "o": ["Ph\u1ea3i l\u00e0 ng\u01b0\u1eddi n\u1eef v\u00e0 \u0111\u01b0\u1ee3c c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh coi tr\u1ecdng", "Ph\u1ea3i l\u00e0 ng\u01b0\u1eddi nam v\u00e0 \u0111\u01b0\u1ee3c c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh coi tr\u1ecdng", "Ng\u01b0\u1eddi c\u00f3 nh\u1eefng ph\u1ea9m ch\u1ea5t, n\u0103ng l\u1ef1c v\u00e0 \u0111\u00f3ng g\u00f3p v\u01b0\u1ee3t tr\u1ed9i, \u0111\u01b0\u1ee3c c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh coi tr\u1ecdng", "\u0110\u01b0\u1ee3c ph\u00e1p lu\u1eadt th\u1eeba nh\u1eadn"], "a": 2, "s": "Ch\u01b0\u01a1ng 7", "e": {"p": 264, "t": "Trong gia \u0111\u00ecnh Vi\u1ec7t Nam hi\u1ec7n nay, ngo\u00e0i m\u00f4 h\u00ecnh ng\u01b0\u00f2i \u0111\u00e0n \u00f4ng - ng\u01b0\u00f2\u00ec ch\u1ed3ng l\u00e0m ch\u1ee7 gia \u0111\u00ecnh ra th\u00ec c\u00f2n c\u00f3 \u00edt nh\u1ea5t hai m\u00f4 h\u00ecnh kh\u00e1c c\u00f9ng t\u1ed3n t\u1ea1i1. \u0110\u00f3 l\u00e0 m\u00f4 h\u00ecnh ng\u01b0\u1eddi ph\u1ee5 n\u1eef - ng\u01b0\u1eddi v\u1ee3 l\u00e0m ch\u1ee7 gia \u0111\u00ecnh v\u00e0 m\u00f4 h\u00ecnh c\u1ea3 hai v\u1ee3 ch\u1ed3ng c\u00f9ng l\u00e0m ch\u1ee7 gia \u0111\u00ecnh. Ng\u01b0\u1eddi ch\u1ee7 gia \u0111\u00ecnh \u0111\u01b0\u1ee3c quan ni\u1ec7m l\u00e0 ng\u01b0\u00f2i c\u00f3 nh\u1eefng ph\u1ea9m ch\u1ea5t, n\u0103ng l\u1ef1c v\u00e0 \u0111\u00f3ng g\u00f3p v\u01b0\u1ee3t tr\u1ed9i, \u0111\u01b0\u1ee3c c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh coi tr\u1ecdng."}}, {"q": "Gia \u0111\u00ecnh Vi\u1ec7t Nam hi\u1ec7n nay c\u00f3 s\u1ef1 bi\u1ebfn \u0111\u1ed5i v\u1ec1 quy m\u00f4 nh\u01b0 th\u1ebf n\u00e0o?", "o": ["C\u00f3 xu h\u01b0\u1edbng thu nh\u1ecf l\u1ea1i", "C\u00f3 xu h\u01b0\u1edbng t\u0103ng l\u00ean", "C\u00f3 xu h\u01b0\u1edbng \  ch\u1ee7ngh\u0129a c\u1ed9ng s\u1ea3n", "B\u1ed1n giai \u0111o\u1ea1n: Th\u1eddi k\u1ef3qu\u00e1 \u0111\u1ed9l\u00ean CNXH, ch\u1ee7ngh\u0129a x\u00e3 h\u1ed9i, ch\u1ee7ngh\u0129a x\u00e3 h\u1ed9i ph\u00e1t tri\u1ec3n cao v\u00e0 ch\u1ee7ngh\u0129a c\u1ed9ng s\u1ea3n"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 87, "t": "\u0102ngghen cho r\u1eb1ng, h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a ph\u00e1t tri\u1ec3n t\u1eeb th\u1ea5p l\u00ean cao qua hai giai \u0111o\u1ea1n, giai \u0111o\u1ea1n th\u1ea5p v\u00e0 giai \u0111o\u1ea1n cao;", "a": 1}}, {"q": "Ph\u1ea1m tr\u00f9 d\u00e2n ch\u1ee7xu\u1ea5t hi\u1ec7n khi n\u00e0o?", "o": ["Khi c\u00f3 nh\u00e0 n\u01b0\u1edbc v\u00f4 s\u1ea3n", "Khi c\u00f3 ch\u1ebf\u0111\u1ed9t\u01b0 h\u1eefu, giai c\u1ea5p v\u00e0 nh\u00e0 n\u01b0\u1edbc", "Ngay t\u1eebkhi c\u00f3 x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi", "Trong x\u00e3 h\u1ed9i c\u00f4ng x\u00e3 nguy\u00ean th\u1ee7y"], "a": 3, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 215, "t": "Th\u00fa hai, ngu\u1ed3n g\u1ed1c c\u1ee7a t\u00f4n gi\u00e1o. - Ngu\u1ed3n g\u1ed1c t\u1ef1 nhi\u00ean, kinh t\u1ebf - x\u00e3 h\u1ed9i: Trong x\u00e3 h\u1ed9i c\u00f4ng x\u00e3 nguy\u00ean th\u1ee7y, do l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t ch\u01b0a ph\u00e1t tri\u1ec3n, tr\u01b0\u1edbc thi\u00ean nhi\u00ean h\u00f9ng v\u0129 t\u00e1c \u0111\u1ed9ng v\u00e0 chi ph\u00f4i khi\u1ebfn cho con ng\u01b0\u1eddi c\u1ea3m th\u1ea5y y\u1ebfu \u0111u\u00f4i v\u00e0 b\u1ea5t l\u1ef1c, kh\u00f4ng gi\u1ea3i th\u00edch \u0111\u01b0\u1ee3c, n\u00ean con ng\u01b0\u00f2i \u0111\u00e3 g\u00e1n cho t\u1ef1 nhi\u00ean nh\u1eefng s\u1ee9c m\u1ea1nh, quy\u1ec1n l\u1ef1c th\u1ea7n b\u00ed."}}, {"q": "\u0110i\u1ec1n v\u00e0o ch\u1ed7tr\u1ed1ng: Kh\u00e1i ni\u1ec7m d\u00e2n t\u1ed9c \u201cd\u00f9ng \u0111\u1ec3ch\u1ec9m\u1ed9t c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi \u1ed5n \u0111\u1ecbnh l\u00e0m th\u00e0nh nh\u00e2n d\u00e2n m\u1ed9t n\u01b0\u1edbc, [......], c\u00f3 n\u1ec1n kinh t\u1ebfth\u1ed1ng nh\u1ea5t, c\u00f3 ng\u00f4n ng\u1eefchung v\u00e0 c\u00f3 \u00fd th\u1ee9c v\u1ec1s\u1ef1th\u1ed1ng nh\u1ea5t c\u1ee7a m\u00ecnh\u2026..", "o": ["C\u00f3 c\u00f9ng \u0111\u1eb7c \u0111i\u1ec3m sinh h\u1ecdc", "C\u00f3 l\u00e3nh th\u1ed5qu\u1ed1c gia", "C\u00f3 c\u00f9ng \u0111\u1eb7c \u0111i\u1ec3m sinh ho\u1ea1t", "C\u00f3 c\u00f9ng ngu\u1ed3n g\u1ed1c t\u1ed5ti\u00ean"], "a": 1, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 195, "t": "Theo ngh\u0129a r\u1ed9ng, d\u00e2n t\u1ed9c (Nation) l\u00e0 kh\u00e1i ni\u1ec7m d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1edfi \u1ed5n \u0111\u1ecbnh l\u00e0m th\u00e0nh nh\u00e2n d\u00e2n m\u1ed9t n\u01b0\u1edbc, c\u00f3 l\u00e3nh th\u1ed5 ri\u00eang, n\u1ec1n kinh t\u00ea' th\u00f4ng nh\u1ea5t, c\u00f3 ng\u00f4n ng\u1eef chung v\u00e0 c\u00f3 \u00fd th\u1ee9c v\u1ec1 s\u1ef1 th\u00f4ng nh\u1ea5t c\u1ee7a m\u00ecnh, g\u1eafn b\u00f3 v\u1edbi nhau b\u1edfi quy\u1ec1n l\u1ee3i ch\u00ednh tr\u1ecb, kinh t\u1ebf, truy\u1ec1n th\u1ed1hg v\u0103n h\u00f3a v\u00e0 truy\u1ec1n th\u00f4ng \u0111\u1ea5u tranh chung trong su\u00f4't qu\u00e1 tr\u00ecnh l\u1ecbch s\u1eed l\u00e2u d\u00e0i d\u1ef1ng n\u01b0\u1edbc v\u00e0 gi\u1eef\u2026", "a": 1}}, {"q": "Ai \u0111\u00e3 d\u1ef1b\u00e1o cho s\u1ef1xu\u1ea5t hi\u1ec7n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf- x\u00e3 h\u1ed9i CSCN \u1edfc\u00e1c n\u01b0\u1edbc t\u01b0 b\u1ea3n c\u00f3 tr\u00ecnh \u0111\u1ed9ph\u00e1t tri\u1ec3n trung b\u00ecnh v\u00e0 c\u00e1c n\u01b0\u1edbc thu\u1ed9c \u0111\u1ecba sau cu\u1ed9c c\u00e1ch m\u1ea1ng gi\u1ea3i ph\u00f3ng cho giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e3nh \u0111\u1ea1o.", "o": ["V.I.L\u00eanin", "Ph.\u0102ngghen", "C.M\u00e1c", "H\u1ed3Ch\u00ed Minh"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "Theo ngh\u0129a chung nh\u1ea5t, d\u00e2n ch\u1ee7l\u00e0 g\u00ec?", "o": ["L\u00e0 quy\u1ec1n l\u1ef1c c\u1ee7a nh\u00e2n d\u00e2n, thu\u1ed9c v\u1ec1nh\u00e2n d\u00e2n", "L\u00e0 quy\u1ec1n t\u1ef1do c\u1ee7a m\u1ed7i ng\u01b0\u1eddi", "Quy\u1ec1n l\u1ef1c c\u1ee7a giai c\u1ea5p c\u1ea7m quy\u1ec1n", "L\u00e0 quy\u1ec1n l\u1ef1c cho giai c\u1ea5p chi\u1ebfm s\u1ed1\u0111\u00f4ng trong x\u00e3 h\u1ed9i"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "Ch\u1ee9c n\u0103ng n\u00e0o sau \u0111\u00e2y \u0111\u1ea3m b\u1ea3o t\u00e1i s\u1ea3n xu\u1ea5t ngu\u1ed3n lao \u0111\u1ed9ng v\u00e0 s\u1ee9c lao \u0111\u1ed9ng cho x\u00e3 h\u1ed9i?", "o": ["Ch\u1ee9c n\u0103ng nu\u00f4i d\u01b0\u1ee1ng, gi\u00e1o d\u1ee5c", "Ch\u1ee9c n\u0103ng kinh t\u1ebf", "Ch\u1ee9c n\u0103ng t\u00e1i s\u1ea3n xu\u1ea5t ra con ng\u01b0\u1eddi", "Ch\u1ee9c n\u0103ng th\u1ecfa m\u00e3n c\u00e1c nhu c\u1ea7u t\u00e2m sinh l\u00fd, duy tr\u00ec t\u00ecnh c\u1ea3m"], "a": 2, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 244, "t": "Ch\u1ee9c n\u0103ng n\u00e0y kh\u00f4ng ch\u1ec9 \u0111\u00e1p \u1ee9ng nhu c\u1ea7u t\u00e2m, sinh l\u00fd t\u1ef1 nhi\u00ean c\u1ee7a con ng\u01b0\u1eddi, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u duy tr\u00ec n\u00f2i gi\u1ed1ng c\u1ee7a gia \u0111\u00ecnh, d\u00f2ng h\u1ecd m\u00e0 c\u00f2n \u0111\u00e1p \u1ee9ng nhu c\u1ea7u v\u1ec1 s\u1ee9c lao \u0111\u1ed9ng v\u00e0 duy tr\u00ec s\u1ef1 tr\u01b0\u1eddng t\u1ed3n c\u1ee7a x\u00e3 h\u1ed9i. Vi\u1ec7c th\u1ef1c hi\u1ec7n ch\u1ee9c n\u0103ng t\u00e1i s\u1ea3n xu\u1ea5t ra con ng\u01b0\u1eddi di\u1ec5n ra trong t\u1eebng gia \u0111\u00ecnh, nh\u01b0ng kh\u00f4ng ch\u1ec9 l\u00e0 vi\u1ec7c ri\u00eang c\u1ee7a gia \u0111\u00ecnh m\u00e0 l\u00e0 v\u1ea5n \u0111\u1ec1 x\u00e3 h\u1ed9i. B\u1edfi v\u00ec, th\u1ef1c hi\u1ec7n ch\u1ee9c n\u0103ng n\u00e0y quy\u1ebft \u0111\u1ecbnh \u0111\u1ebfn m\u1eadt \u0111\u1ed9 d\u00e2n c\u01b0 v\u00e0 ngu\u1ed3n l\u1ef1c lao\u2026"}}, {"q": "N\u1ec1n d\u00e2n ch\u1ee7XHCN d\u1ef1a tr\u00ean c\u01a1 s\u1edfkinh t\u1ebfn\u00e0o?", "o": ["Kinh t\u1ebfnhi\u1ec1u th\u00e0nh ph\u1ea7n", "Kinh t\u1ebfx\u00e3 h\u1ed9i ch\u1ee7ngh\u0129a", "T\u01b0 h\u1eefu v\u1ec1t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t", "C\u00f4ng h\u1eefu v\u1ec1t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t"], "a": 3, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 112, "t": "2) C\u00f3 m\u1ed9t n\u1ec1n kinh t\u1ebf ph\u00e1t tri\u1ec3n cao d\u1ef1a tr\u00ean l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i v\u00e0 ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 c\u00e1c t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu; 3) C\u00f3 n\u1ec1n v\u0103n h\u00f3a ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c;", "a": 1}}, {"q": "Qu\u00e1 \u0111\u1ed9l\u00ean ch\u1ee7ngh\u0129a x\u00e3 h\u1ed9i b\u1ecfqua ch\u1ebf\u0111\u1ed9t\u01b0 b\u1ea3n ch\u1ee7ngh\u0129a c\u1ea7n ph\u1ea3i k\u1ebf th\u1eeba y\u1ebfu t\u1ed1n\u00e0o c\u1ee7a ch\u1ee7ngh\u0129a t\u01b0 b\u1ea3n?", "o": ["Nh\u1eefng th\u00e0nh t\u1ef1u khoa h\u1ecdc - c\u00f4ng ngh\u1ec7", "Th\u1ecbtr\u01b0\u1eddng v\u1ed1n", "C\u1ea3 nh\u1eefng th\u00e0nh t\u1ef1u khoa h\u1ecdc - c\u00f4ng ngh\u1ec7, th\u1ecb tr\u01b0\u1eddng v\u1ed1n v\u00e0 khoa h\u1ecdc qu\u1ea3n l\u00fd", "Khoa h\u1ecdc qu\u1ea3n l\u00fd \u2026 bu\u00f4n b\u00e1n, h\u1ea1ch to\u00e1n kinh t\u1ebf, kinh doanh c\u1ee7a ch\u1ee7ngh\u0129a t\u01b0 b\u1ea3n"], "a": 2, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "Ch\u1ec9ra \u0111\u1eb7c \u0111i\u1ec3m kinh t\u1ebfc\u1ee7a th\u1eddi k\u1ef3qu\u00e1 \u0111\u1ed9t\u1eebCNTB l\u00ean CNXH?", "o": ["T\u1ed3n t\u1ea1i m\u1ed9t n\u1ec1n kinh t\u1ebfch\u1ec9c\u00f3 c\u00e1c th\u00e0nh ph\u1ea7n kinh t\u1ebfCNXH", "T\u1ed3n t\u1ea1i m\u1ed9t ch\u1ebf\u0111\u1ed9s\u1edfh\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t d\u01b0\u1edbi 2 h\u00ecnh th\u1ee9c to\u00e0n d\u00e2n v\u00e0 t\u1eadp th\u1ec3", "N\u1ec1n kinh t\u1ebfch\u1ec9c\u00f3 2 th\u00e0nh ph\u1ea7n: kinh t\u1ebfnh\u00e0 n\u01b0\u1edbc v\u00e0 kinh t\u1ebft\u1eadp th\u1ec3", "T\u1ed3n t\u1ea1i m\u1ed9t n\u1ec1n kinh t\u1ebfnhi\u1ec1u th\u00e0nh ph\u1ea7n"], "a": 3, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 106, "t": "\u0110\u00f3 l\u00e0 th\u1eddi k\u1ef3 l\u00e2u d\u00e0i, gian kh\u1ed5 b\u1eaft \u0111\u1ea7u t\u1eeb khi giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n \u0111\u1ebfn khi x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. C\u00f3 th\u1ec3 kh\u00e1i qu\u00e1t nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m c\u01a1 b\u1ea3n c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i nh\u01b0 sau: a) Tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, t\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1\u00ec l\u1eadp."}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m n\u1ed5i b\u1eadt nh\u1ea5t c\u1ee7a th\u1eddi k\u1ef3qu\u00e1 \u0111\u1ed9l\u00ean ch\u1ee7ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 g\u00ec?", "o": ["T\u1ed3n t\u1ea1i nh\u1eefng y\u1ebfu t\u1ed1c\u1ee7a x\u00e3 h\u1ed9i c\u0169 b\u00ean c\u1ea1nh nh\u1eefng nh\u00e2n t\u1ed1m\u1edbi c\u1ee7a ch\u1ee7ngh\u0129a x\u00e3 h\u1ed9i", "T\u1ed3n t\u1ea1i m\u1ed9t n\u1ec1n kinh t\u1ebfnhi\u1ec1u th\u00e0nh ph\u1ea7n trong c\u00f9ng m\u1ed9t h\u1ec7th\u1ed1ng kinh t\u1ebfqu\u1ed1c d\u00e2n th\u1ed1ng nh\u1ea5t", "K\u1ebft c\u1ea5u giai c\u1ea5p trong x\u00e3 h\u1ed9i \u0111a d\u1ea1ng v\u00e0 ph\u1ee9c t\u1ea1p", "T\u1ed3n t\u1ea1i nhi\u1ec1u y\u1ebfu t\u1ed1v\u0103n h\u00f3a v\u00e0 t\u01b0 t\u01b0\u1edfng kh\u00e1c nhau"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 170, "t": "B\u00ean c\u1ea1nh nh\u1eefng d\u1ea5u v\u1ebft c\u1ee7a x\u00e3 h\u1ed9i c\u0169, xu\u1ea5t hi\u1ec7n nh\u1eefng y\u1ebfu t\u00f4\u201d c\u1ee7a x\u00e3 h\u1ed9i m\u1edbi do giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 c\u00e \u1ea7u c\u1eed\u201d1. Quy\u1ec1n \u0111\u01b0\u1ee3c tham gia r\u1ed9ng r\u00e3i v\u00e0o c\u00f4ng vi\u1ec7c qu\u1ea3n l\u00fd nh\u00e0 n\u01b0\u1edbc ch\u00ednh l\u00e0 n\u1ed9i dung d\u00e2n ch\u1ee7 tr\u00ean l\u0129nh v\u1ef1c ch\u00ednh tr\u1ecb. X\u00e9t v\u1ec1 b\u1ea3n ch\u1ea5t ch\u00ednh tr\u1ecb, d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a v\u1eeba c\u00f3 b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, v\u1eeba c\u00f3 t\u00ednh nh\u00e2n d\u00e2n r\u1ed9ng r\u00e3i, t\u00ednh d\u00e2n t\u1ed9c s\u00e2u s\u1eafc."}}, {"q": "N\u1ed9i dung c\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c c\u1ee7a ch\u1ee7ngh\u0129a M\u00e1c - L\u00eanin g\u1ed3m:", "o": ["C\u00e1c d\u00e2n t\u1ed9c ho\u00e0n to\u00e0n b\u00ecnh \u0111\u1eb3ng\u2019", "C\u1ea3 ba n\u1ed9i dung: c\u00e1c d\u00e2n t\u1ed9c ho\u00e0n to\u00e0n b\u00ecnh \u0111\u1eb3ng, c\u00f3 quy\u1ec1n t\u1ef1 quy\u1ebft v\u00e0 \u0111o\u00e0n k\u1ebft giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00e1c d\u00e2n t\u1ed9c", "\u0110o\u00e0n k\u1ebft giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00e1c d\u00e2n t\u1ed9c trong cu\u1ed9c \u0111\u1ea5u tranh x\u00f3a b\u1ecf\u00e1p b\u1ee9c d\u00e2n t\u1ed9c v\u00e0 x\u00e2y d\u1ef1ng m\u1ed1i quan h\u1ec7m\u1edbi gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c.", "C\u00e1c d\u00e2n t\u1ed9c c\u00f3 quy\u1ec1n t\u1ef1quy\u1ebft"], "a": 1, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 204, "t": "V\u00ec v\u1eady, n\u1ed9i dung n\u00e0y v\u1eeba l\u00e0 n\u1ed9i dung ch\u1ee7 y\u1ebfu, v\u1eeba l\u00e0 gi\u1ea3i ph\u00e1p quan tr\u1ecdng \u0111\u1ec3 li\u00ean k\u1ebft c\u00e1c n\u1ed9i dung c\u1ee7a C\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c th\u00e0nh m\u1ed9t ch\u1ec9nh th\u1ec3. C\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin l\u00e0 c\u01a1 s\u1edf l\u00fd lu\u1eadn quan tr\u1ecdng \u0111\u1ec3 c\u00e1c \u0110\u1ea3ng C\u1ed9ng s\u1ea3n v\u1eadn d\u1ee5ng th\u1ef1c hi\u1ec7n ch\u00ednh s\u00e1ch d\u00e2n t\u1ed9c trong qu\u00e1 tr\u0
