dbi s\u1ed1 l\u01b0\u1ee3ng-L\u00e0 n\u00f3i t\u1edbi ch\u1ea5t l\u01b0\u1ee3ng)", "e": null}, {"q": "Khi so s\u00e1nh gi\u1eefa Kit\u00f4 gi\u00e1o, Kh\u1ed5ng gi\u00e1o, ch\u1ee7 ngh\u0129a T\u00f4n D\u1eadt Ti\u00ean v\u00e0 ch\u1ee7 ngh\u0129a M\u00e1c, H\u1ed3 Ch\u00ed Minh mu\u1ed1n \u0111\u1ec1 c\u1eadp \u0111\u1ebfn s\u1ef1 gi\u1ed1ng nhau gi\u1eefa t\u00f4n gi\u00e1o v\u1edbi c\u00e1c tr\u00e0o l\u01b0u t\u01b0 t\u01b0\u1edfng tr\u00ean v\u1ec1 \u0111i\u1ec3m n\u00e0o?", "a": "V\u00ea\u0300 m\u1ee5c \u0111\u00edch mu\u1ed1n gi\u1ea3i ph\u00f3ng cho con ng\u01b0\u1eddi", "e": null}, {"q": "Ki\u1ec3u nh\u00e0 n\u01b0\u1edbc n\u00e0o sau \u0111\u00e2y \u0111\u01b0\u1ee3c L\u00eanin g\u1ecdi l\u00e0 \u201cN\u1eeda nh\u00e0 n\u01b0\u1edbc\u201d?", "a": "Nh\u00e0 n\u01b0\u1edbc XHCN", "e": null}, {"q": "K. Marx v\u00e0 F. Engels coi s\u1ef1 chuy\u1ec3n bi\u1ec3n t\u1eeb h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i th\u1eafp l\u00ean h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i cao l\u00e0", "a": "M\u1ed9t qu\u00e1 tr\u00ecnh l\u1ecbch s\u1eed - t\u1ef1 nhi\u00ean.", "e": null}, {"q": "Kh\u00e1c bi\u1ec7t v\u1ec1 ch\u1ea5t gi\u1eefa s\u1ef1 th\u1ed1ng tr\u1ecb c\u1ee7a giai c\u1ea5p v\u00f4 s\u1ea3n v\u00e0 s\u1ef1 th\u1ed1ng tr\u1ecb c\u1ee7a c\u00e1c giai c\u1ea5p b\u00f3c l\u1ed9t tr\u01b0\u1edbc \u0111\u00e2y l\u00e0", "a": "S\u1ef1 th\u1ed1ng tr\u1ecb c\u1ee7a \u0111a s\u1ed1 \u0111\u1ed1i v\u1edbi thi\u1ec3u s\u1ed1 giai c\u1ea5p b\u00f3c l\u1ed9t nh\u1eb1m gi\u1ea3i ph\u00f3ng giai c\u1ea5p m\u00ecnh v\u00e0 gi\u1ea3i ph\u00f3ng t\u1ea5t c\u1ea3 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c trong x\u00e3 h\u1ed9i.", "e": {"p": 142, "t": "C\u00f2n s\u1ef1 th\u1ed1ng tr\u1ecb v\u1ec1 ch\u00ednh tr\u1ecb c\u1ee7a giai c\u1ea5p v\u00f4 s\u1ea3n l\u00e0 s\u1ef1 th\u1ed1ng tr\u1ecb c\u1ee7a \u0111a s\u1ed1 \u0111\u1ed1i v\u1edbi thi\u1ec3u s\u1ed1 giai c\u1ea5p b\u00f3c l\u1ed9t nh\u1eb1m gi\u1ea3i ph\u00f3ng giai c\u1ea5p m\u00ecnh v\u00e0 gi\u1ea3i ph\u00f3ng t\u1ea5t c\u1ea3 c\u00e1c t\u1ea7ng l\u00f3p nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c trong x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "Kh\u00e1i ni\u1ec7m giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u01b0\u1ee3c c\u00e1c nh\u00e0 kinh \u0111i\u1ec3n x\u00e1c \u0111\u1ecbnh tr\u00ean hai ph\u01b0\u01a1ng di\u1ec7n c\u01a1 b\u1ea3n l\u00e0", "a": "Kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i.", "e": {"p": 51, "t": "D\u00f9 di\u1ec5n \u0111\u1ea1t b\u1eb1ng nh\u1eefng thu\u1eadt ng\u1eef kh\u00e1c nhau, song giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u01b0\u1ee3c c\u00e1c nh\u00e0 kinh \u0111i\u1ec3n x\u00e1c \u0111\u1ecbnh theo hai ph\u01b0\u01a1ng di\u1ec7n c\u01a1 b\u1ea3n:", "a": 1}}, {"q": "Khi \u0111\u00e1nh gi\u00e1 v\u1ec1 ch\u1ee7 ngh\u0129a M\u00e1c, ai l\u00e0 ng\u01b0\u1eddi \u0111\u00e3 ch\u1ec9 r\u00f5: \u201cH\u1ecdc thuy\u1ebft c\u1ee7a M\u00e1c l\u00e0 h\u1ecdc thuy\u1ebft v\u1ea1n n\u0103ng v\u00ec n\u00f3 l\u00e0 h\u1ecdc thuy\u1ebft ch\u00ednh x\u00e1c\"?", "a": "V.I.L\u00eanin.", "e": {"p": 24, "t": "\u201cH\u1ecdc thuy\u1ebft c\u1ee7a M\u00e1c l\u00e0 h\u1ecdc thuy\u1ebft v\u1ea1n n\u0103ng v\u00ec n\u00f3 l\u00e0 m\u1ed9t h\u1ecdc thuy\u1ebft ch\u00ednh x\u00e1c\u201d2. L\u00eanin v\u1eadn d\u1ee5ng v\u00e0 ph\u00e1t tri\u1ec3n ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi V.I.", "a": 1}}, {"q": "Khi nghi\u00ean c\u1ee9u v\u1ec1 giai c\u1ea5p c\u00f4ng nh\u00e2n, K. Marx v\u00e0 F. Engels d\u00f9ng nhi\u1ec1u thu\u1eadt ng\u1eef kh\u00e1c nhau ch\u1ec9 v\u1ec1 giai c\u1ea5p n\u00e0y. Song c\u00f3 c\u00f9ng m\u1ed9t m\u1ee5c t\u00edch l\u00e0", "a": "C\u1ea3 A, B \u0111\u00fang: Bi\u1ec3u th\u1ecb quan ni\u1ec7m v\u1ec1 giai c\u1ea5p c\u00f4ng nh\u00e2n - con \u0111\u1ec1 c\u1ee7a n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a; Giai c\u1ea5p \u0111\u1ea1i bi\u1ec3u cho l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i.", "e": {"p": 51, "t": "\u0110\u00f3 l\u00e0 nh\u1eefng c\u1ee5m t\u1eeb \u0111\u1ed3ng ngh\u0129a \u0111\u1ec3 ch\u1ec9 giai c\u1ea5p c\u00f4ng nh\u00e2n - con \u0111\u1ebb c\u1ee7a n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, giai c\u1ea5p \u0111\u1ea1i bi\u1ec3u cho l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn, cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i. Ngo\u00e0i ra, c\u00e1c \u00f4ng c\u00f2n d\u00f9ng nh\u1eefng thu\u1eadt ng\u1eef c\u00f3 n\u1ed9i dung h\u1eb9p h\u01a1n \u0111\u1ec3 ch\u1ec9 c\u00e1c lo\u1ea1i c\u00f4ng nh\u00e2n trong c\u00e1c ng\u00e0nh s\u1ea3n xu\u1ea5t kh\u00e1c nhau, trong nh\u1eefng giai \u0111o\u1ea1n ph\u00e1t tri\u1ec3n kh\u00e1c nhau c\u1ee7a c\u00f4ng nghi\u1ec7p\u2026", "a": 1}}, {"q": "Khi n\u00f3i: \u201cQu\u00e1 \u0111\u1ed9 l\u00ean CNXH b\u1ecf qua TBCN\" l\u00e0 b\u1ecf qua y\u1ebfu t\u1ed1 n\u00e0o?", "a": "B\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a QHSX v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng TBCN.", "e": {"p": 110, "t": "Th\u1ee9 hai, qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, t\u1ee9c l\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a. Xem \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam:", "a": 1}}, {"q": "Khi x\u00e3 h\u1ed9i c\u00f3 giai c\u1ea5p, x\u00e9t v\u1ec1 m\u1eb7t k\u1ebft c\u1ea5u th\u00ec: C\u00f3 nh\u1eefng giai c\u1ea5p c\u01a1 b\u1ea3n v\u00e0 giai c\u1ea5p kh\u00f4ng c\u01a1 b\u1ea3n.", "a": "L", "e": null}, {"q": "L\u00eanin \u0111\u00e3 \u00e1p d\u1ee5ng l\u00fd lu\u1eadn ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u00e0o x\u00e2y d\u1ef1ng CNXH hi\u1ec7n th\u1ef1c \u1edf qu\u1ed1c gia n\u00e0o?", "a": "Nga", "e": null}, {"q": "L\u00eanin vi\u1ebft \u201cTr\u01b0\u1edbc s\u1ef1 li\u00ean m\u00ecnh c\u1ee7a c\u00e1c \u0111\u1ea1i bi\u1ec3u khoa h\u1ecdc, giai c\u1ea5p v\u00f4 s\u1ea3n v\u00e0 gi\u1edbi k\u1ef9 thu\u1eadt, kh\u00f4ng m\u1ed9t th\u1ec3 l\u1ef1c \u0111en t\u1ed1i n\u00e0o \u0111\u1ee9ng v\u1eefng \u0111\u01b0\u1ee3c\u201d, l\u00e0 mu\u1ed1n kh\u1eb3ng \u0111\u1ecbnh vai tr\u00f2 c\u1ee7a", "a": "\u0110\u1ed9i ng\u0169 tr\u00ed th\u1ee9c", "e": {"p": 174, "t": "\u201cTr\u01b0\u1edbc s\u1ef1 li\u00ean minh c\u1ee7a c\u00e1c \u0111\u1ea1i bi\u1ec3u khoa h\u1ecdc, giai c\u1ea5p v\u00f4 s\u1ea3n v\u00e0 gi\u1edbi k\u1ef9 thu\u1eadt, kh\u00f4ng m\u1ed9t th\u1ebf l\u1ef1c \u0111en t\u1ed1i n\u00e0o \u0111\u1ee9ng v\u1eefng \u0111\u01b0\u1ee3c\u201d2. X\u00e9t t\u1eeb g\u00f3c \u0111\u1ed9 kinh t\u1ebf, trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i - t\u1ee9c l\u00e0 c\u00e1ch m\u1ea1ng \u0111\u00e3 chuy\u1ec3n sang giai \u0111o\u1ea1n 1.", "a": 1}}, {"q": "Li\u00ean minh gi\u1eefa c\u00f4ng nh\u00e2n, n\u00f4ng d\u00e2n v\u00e0 tr\u00ed th\u1ee9c \u1edf Vi\u1ec7t Nam trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i c\u00f3 thu\u1eadn l\u1ee3i n\u00e0o?", "a": "C\u00f4ng nh\u00e2n v\u00e0 tr\u00ed th\u1ee9c \u0111a s\u1ed1 xu\u1ea5t th\u00e2n t\u1eeb n\u00f4ng d\u00e2n", "e": null}, {"q": "Li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c l\u00e0 do?", "a": "Do y\u00eau c\u1ea7u kh\u00e1ch quan c\u1ee7a c\u1ea3 c\u00f4ng nh\u00e2n, n\u00f4ng d\u00e2n v\u00e0 tr\u00ed th\u1ee9c.", "e": null}, {"q": "Li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c l\u00e0 do?", "a": "\u0110\u00f2i h\u1ecfi kh\u00e1ch quan c\u1ee7a c\u1ea3 c\u00f4ng nh\u00e2n, n\u00f4ng d\u00e2n v\u00e0 tr\u00ed th\u1ee9c", "e": null}, {"q": "L\u0129nh v\u1ef1c n\u00e0o sau \u0111\u00e2y kh\u00f4ng thu\u1ed9c \u0111\u1ed1i t\u01b0\u1ee3ng nghi\u00ean c\u1ee9u c\u1ee7a CNXH khoa h\u1ecdc?", "a": "Qu\u00e1 tr\u00ecnh h\u00ecnh th\u00e0nh \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam", "e": null}, {"q": "Lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i n\u00e0o c\u00f3 li\u00ean quan \u0111\u1ebfn c\u00e1c \u0111\u1ea3ng ph\u00e1i ch\u00ednh tr\u1ecb v\u00e0 nh\u00e0 n\u01b0\u1edbc; \u0111\u1ebfn quy\u1ec1n s\u1edf h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, qu\u1ea3n l\u00fd t\u1ed5 ch\u1ee9c lao \u0111\u1ed9ng, v\u1ea5n \u0111\u1ec1 ph\u00e2n ph\u1ed1i thu nh\u1eadp trong m\u1ed9t h\u1ec7 th\u1ed1ng s\u1ea3n xu\u1ea5t nh\u1ea5t \u0111\u1ecbnh?", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p", "e": {"p": 166, "t": "\u0111\u1ebfn quy\u1ec1n s\u1ed7 h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, qu\u1ea3n l\u00fd t\u1ed5 ch\u1ee9c lao \u0111\u1ed9ng, v\u1ea5n \u0111\u1ec1 ph\u00e2n ph\u1ed1i thu nh\u1eadp... trong m\u1ed9t h\u1ec7 th\u1ed1ng s\u1ea3n xu\u1ea5t nh\u1ea5t \u0111\u1ecbnh."}}, {"q": "Lu\u1eadn \u0111i\u1ec3m \u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d l\u00e0 c\u1ee7a ai?", "a": "M\u00e1c v\u00e0 Ph. \u0102ngghen", "e": {"p": 52, "t": "\u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d1. \u0102ngghen, c\u00f4ng nh\u00e2n c\u00f4ng nghi\u1ec7p c\u00f4ng x\u01b0\u1ecfng l\u00e0 b\u1ed9 ph\u1eadn ti\u00eau bi\u1ec3u cho giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i.", "a": 1}}, {"q": "Lu\u1eadn \u0111i\u1ec3m n\u00e0o sau \u0111\u00e2y KH\u00d4NG ph\u1ea3i l\u00e0 ph\u01b0\u01a1ng h\u01b0\u1edbng c\u01a1 b\u1ea3n ph\u1ea3n \u00e1nh con \u0111\u01b0\u1eddng qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta?", "a": "Kh\u00f4ng c\u00f3 \u0111\u00e1p \u00e1n \u0111\u00fang", "e": {"p": 113, "t": "b) Ph\u01b0\u01a1ng h\u01b0\u1edbng x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam hi\u1ec7n nay Tr\u00ean c\u01a1 s\u1edf b\u1ea3y ph\u01b0\u01a1ng h\u01b0\u1edbng c\u01a1 b\u1ea3n ph\u1ea3n \u00e1nh con \u0111\u01b0\u1eddng qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh trong C\u01b0\u01a1ng l\u0129nh x\u00e2y d\u1ef1ng \u0111\u1ea5t n\u01b0\u1edbc trong th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i (1991):", "a": 1}}, {"q": "Lu\u1eadn \u0111i\u1ec3m n\u00e0o sau \u0111\u00e2y KH\u00d4NG ph\u1ea3i l\u00e0 ph\u01b0\u01a1ng h\u01b0\u1edbng c\u01a1 b\u1ea3n ph\u1ea3n \u00e1nh con \u0111\u01b0\u1eddng qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta?", "a": "X\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i d\u00e2n ch\u1ee7, c\u00f4ng b\u1eb1ng, v\u0103n minh", "e": {"p": 113, "t": "b) Ph\u01b0\u01a1ng h\u01b0\u1edbng x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam hi\u1ec7n nay Tr\u00ean c\u01a1 s\u1edf b\u1ea3y ph\u01b0\u01a1ng h\u01b0\u1edbng c\u01a1 b\u1ea3n ph\u1ea3n \u00e1nh con \u0111\u01b0\u1eddng qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh trong C\u01b0\u01a1ng l\u0129nh x\u00e2y d\u1ef1ng \u0111\u1ea5t n\u01b0\u1edbc trong th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i (1991):", "a": 1}}, {"q": "Lu\u1eadn \u0111i\u1ec3m n\u00e0o sau \u0111\u00e2y l\u00e0 ph\u01b0\u01a1ng h\u01b0\u1edbng c\u01a1 b\u1ea3n ph\u1ea3n \u00e1nh con \u0111\u01b0\u1eddng qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta? Ch\u1ecdn c\u00e2u tr\u1ea3 l\u1eddi \u0110\u00daNG", "a": "T\u1ea5t c\u1ea3 c\u00e1c \u0111\u00e1p \u00e1n tr\u00ean", "e": {"p": 113, "t": "b) Ph\u01b0\u01a1ng h\u01b0\u1edbng x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam hi\u1ec7n nay Tr\u00ean c\u01a1 s\u1edf b\u1ea3y ph\u01b0\u01a1ng h\u01b0\u1edbng c\u01a1 b\u1ea3n ph\u1ea3n \u00e1nh con \u0111\u01b0\u1eddng qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh trong C\u01b0\u01a1ng l\u0129nh x\u00e2y d\u1ef1ng \u0111\u1ea5t n\u01b0\u1edbc trong th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i (1991):", "a": 1}}, {"q": "Lu\u1eadn \u0111i\u1ec3m n\u1ed5i ti\u1ebfng: \"T\u00f4n gi\u00e1o l\u00e0 ti\u1ebfng th\u1edf d\u00e0i c\u1ee7a ch\u00fang sinh b\u1ecb \u00e1p b\u1ee9c, l\u00e0 tr\u00e1i tim c\u1ee7a th\u1ebf gi\u1edbi kh\u00f4ng c\u00f3 tr\u00e1i tim, l\u00e0 tinh th\u1ea7n c\u1ee7a nh\u1eefng tr\u1eadt t\u1ef1 kh\u00f4ng c\u00f3 tinh th\u1ea7n. T\u00f4n gi\u00e1o l\u00e0 thu\u1ed1c phi\u1ec7n c\u1ee7a nh\u00e2n d\u00e2n\" l\u00e0 c\u1ee7a", "a": "C\u00e1c M\u00e1c", "e": null}, {"q": "Lu\u1eadn \u0111i\u1ec3m sau \u0111\u00e2y c\u1ee7a c\u00e1c nh\u00e0 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a khoa h\u1ecdc d\u1ef1 b\u00e1o v\u1ec1 x\u00e3 h\u1ed9i t\u01b0\u01a1ng lai \u2013 x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u01b0\u1ee3c vi\u1ebft trong t\u00e1c ph\u1ea9m n\u00e0o? \u201cThay cho x\u00e3 h\u1ed9i t\u01b0 b\u1ea3n c\u0169, v\u1edbi nh\u1eefng giai c\u1ea5p v\u00e0 \u0111\u1ed1i kh\u00e1ng c\u1ee7a giai c\u1ea5p n\u00f3, s\u1ebd xu\u1ea5t hi\u1ec7n m\u1ed9t li\u00ean h\u1ee3p, trong \u0111\u00f3 s\u1ef1 ph\u00e1t tri\u1ec3n t\u1ef1 do c\u1ee7a m\u1ed7i ng\u01b0\u1eddi l\u00e0 \u0111i\u1ec1u ki\u1ec7n ph\u00e1t tri\u1ec3n t\u1ef1 do c\u1ee7a t\u1ea5t c\u1ea3 m\u1ecdi ng\u01b0\u1eddi\u201d", "a": "Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng S\u1ea3n", "e": null}, {"q": "Lu\u1eadt h\u00f4n nh\u00e2n v\u00e0 gia \u0111\u00ecnh do Nh\u00e0 n\u01b0\u1edbc ban h\u00e0nh nh\u1eb1m \u0111i\u1ec1u ch\u1ec9nh c\u00e1c quan h\u1ec7 x\u00e3 h\u1ed9i ph\u00e1t sinh trong l\u0129nh v\u1ef1c h\u00f4n nh\u00e2n v\u00e0 gia \u0111\u00ecnh\u201d. Nh\u1eadn \u0111\u1ecbnh tr\u00ean l\u00e0", "a": "\u0110\u00fang M", "e": null}, {"q": "M\u00f4 h\u00ecnh CNXH m\u00e0 Trung Qu\u1ed1c hi\u1ec7n nay \u0111ang x\u00e2y d\u1ef1ng l\u00e0", "a": "M\u00f4 h\u00ecnh CNXH \u0111\u1eb7c s\u1eafc Trung Qu\u1ed1c Qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u1edf n\u01b0\u1edbc ta, \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0: B\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, nh\u01b0ng ti\u1ebfp thu, k\u1ebf th\u1eeba nh\u1eefng th\u00e0nh t\u1ef1u m\u00e0 nh\u00e2n lo\u1ea1i \u0111\u00e3 \u0111\u1ea1t \u0111\u01b0\u1ee3c d\u01b0\u1edbi ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a", "e": {"p": 110, "t": "Con \u0111\u01b0\u1eddng \u0111i l\u00ean c\u1ee7a n\u01b0\u1edbc ta l\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, t\u1ee9c l\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, nh\u01b0ng ti\u1ebfp thu, k\u1ebf th\u1eeba nh\u1eefng th\u00e0nh t\u1ef1u m\u00e0 nh\u00e2n lo\u1ea1i \u0111\u00e3 \u0111\u1ea1t \u0111\u01b0\u1ee3c d\u01b0\u1edbi ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u0111\u1eb7c bi\u1ec7t v\u1ec1 khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7, \u0111\u1ec3 ph\u00e1t tri\u1ec3n nhanh l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n\u2026", "a": 1}}, {"q": "M\u00f4 h\u00ecnh CNXH m\u00e0 V\u00ean\u00eaxu\u00eala hi\u1ec7n nay \u0111ang x\u00e2y d\u1ef1ng l\u00e0", "a": "M\u00f4 h\u00ecnh CNXH th\u1ebf k\u1ef7 XXI", "e": null}, {"q": "M\u00f4 t\u1ea3 qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, C. M\u00e1c v\u00e0 Ph. \u0102ngghen ch\u1ec9 r\u00f5: \u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i [\u2026.]\u201d", "a": "Ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c", "e": {"p": 52, "t": "\u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d1. \u0102ngghen, c\u00f4ng nh\u00e2n c\u00f4ng nghi\u1ec7p c\u00f4ng x\u01b0\u1ecfng l\u00e0 b\u1ed9 ph\u1eadn ti\u00eau bi\u1ec3u cho giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i.", "a": 1}}, {"q": "M\u1ed9t s\u1ed1 gi\u1ea3i ph\u00e1p x\u00e2y d\u1ef1ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam hi\u1ec7n nay l\u00e0?", "a": "T\u1ea5t c\u1ea3 c\u00e1c \u0111\u00e1p \u00e1n tr\u00ean \u0111\u1ec1u \u0111\u00fang", "e": {"p": 82, "t": "b) M\u1ed9t s\u00f4' gi\u1ea3i ph\u00e1p x\u00e2y d\u1ef1ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam hi\u1ec7n nay \u0110\u1ec3 th\u1ef1c hi\u1ec7n th\u1eafng l\u1ee3i m\u1ee5c ti\u00eau \u0111\u01b0a n\u01b0\u1edbc ta tr\u1edf th\u00e0nh m\u1ed9t n\u01b0\u1edbc c\u00f4ng nghi\u1ec7p theo h\u01b0\u1edbng hi\u1ec7n \u0111\u1ea1i, x\u00e2y d\u1ef1ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam trong th\u1eddi k\u1ef3 m\u1edbi c\u1ea7n th\u1ef1c hi\u1ec7n m\u1ed9t s\u1ed1 gi\u1ea3i ph\u00e1p ch\u1ee7 y\u1ebfu sau:", "a": 1}}, {"q": "M\u1ed9t s\u1ed1 thu\u1eadt ng\u1eef kh\u00e1c nhau \u0111\u01b0\u1ee3c C.M\u00e1c v\u00e0 Ph.\u0102ngghen s\u1eed d\u1ee5ng c\u00f3 ngh\u0129a t\u01b0\u01a1ng \u0111\u1ed3ng v\u1edbi kh\u00e1i ni\u1ec7m giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0?", "a": "C\u1ea3 3 \u0111\u1ec1u \u0111\u00fang", "e": {"p": 51, "t": "Kh\u00e1i ni\u1ec7m v\u00e0 \u0111\u1eb7c \u0111i\u1ec3m c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n a) Kh\u00e1i ni\u1ec7m giai c\u1ea5p c\u00f4ng nh\u00e2n c. \u00c1ngghen \u0111\u00e3 s\u1eed d\u1ee5ng nhi\u1ec1u thu\u1eadt ng\u1eef kh\u00e1c nhau \u0111\u1ec3 ch\u1ec9 giai c\u1ea5p c\u00f4ng nh\u00e2n nh\u01b0 giai c\u1ea5p v\u00f4 s\u1ea3n; giai c\u1ea5p v\u00f4 s\u1ea3n hi\u1ec7n \u0111\u1ea1i;", "a": 1}}, {"q": "M\u1ed9t trong nh\u1eefng vai tr\u00f2 c\u1ee7a gia \u0111\u00ecnh?", "a": "T\u1ea5t c\u1ea3 c\u00e1c c\u00e2u \u0111\u1ec1u \u0111\u00fang", "e": null}, {"q": "M\u1ed9t trong nh\u1eefng nhi\u1ec7m v\u1ee5 quan tr\u1ecdng c\u1ee7a Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc l\u00e0 g\u00ec?", "a": "Lu\u1eadn ch\u1ee9ng m\u1ed9t c t\u00ednh t\u1ea5t y\u1ebfu v\u1ec1 m\u1eb7t l\u1ecbch s\u1eed x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n", "e": null}, {"q": "M\u1ed9t trong nh\u1eefng y\u1ebfu t\u1ed1 th\u00fac \u0111\u1ea9y x\u00e2y d\u1ef1ng Nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n \u201cl\u00e0 \u0111\u1ea9y m\u1ea1nh ph\u00f2ng ch\u1ed1ng .......\u201d. \u0110i\u1ec1n t\u1eeb c\u00f2n thi\u1ebfu v\u00e0o ch\u1ed7 tr\u1ed1ng?", "a": "Tham nh\u0169ng", "e": null}, {"q": "M\u1ee5c ti\u00eau giai \u0111o\u1ea1n th\u1ee9 hai c\u1ee7a c\u00e1ch m\u1ea1ng XHCN l\u00e0", "a": "X\u00f3a b\u1ecf m\u1ecdi \u00e1p b\u1ee9c b\u00f3c l\u1ed9t trong x\u00e3 h\u1ed9i", "e": {"p": 93, "t": "\u00c1ngghen cho r\u1eb1ng, c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a ph\u1ea3i ti\u1ebfn h\u00e0nh tri\u1ec7t \u0111\u1ec3, tr\u01b0\u1edbc h\u1ebft l\u00e0 gi\u1ea3i ph\u00f3ng giai c\u1ea5p, x\u00f3a b\u1ecf t\u00ecnh tr\u1ea1ng giai c\u1ea5p n\u00e0y b\u00f3c l\u1ed9t, \u00e1p b\u1ee9c giai c\u1ea5p kia, v\u00e0 m\u1ed9t khi t\u00ecnh tr\u1ea1ng ng\u01b0\u1eddi \u00e1p b\u1ee9c, b\u00f3c l\u1ed9t ng\u01b0\u1eddi b\u1ecb x\u00f3a b\u1ecf th\u00ec \u201ct\u00ecnh tr\u1ea1ng d\u00e2n t\u1ed9c n\u00e0y b\u00f3c l\u1ed9t d\u00e2n t\u1ed9c kh\u00e1c c\u0169ng s\u1ebd b\u1ecb x\u00f3a b\u1ecf\u201d3.", "a": 1}}, {"q": "M\u1ee5c ti\u00eau giai \u0111o\u1ea1n th\u1ee9 nh\u1ea5t c\u1ee7a c\u00e1ch m\u1ea1ng XHCN l\u00e0", "a": "Gi\u00e0nh ch\u00ednh quy\u1ec1n v\u1ec1 tay giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng", "e": {"p": 27, "t": "L\u00eanin tr\u1ef1c ti\u1ebfp l\u00e3nh \u0111\u1ea1o \u0110\u1ea3ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Nga t\u1eadp h\u1ee3p l\u1ef1c l\u01b0\u1ee3ng \u0111\u1ea5u tranh ch\u1ed1ng ch\u1ebf \u0111\u1ed9 chuy\u00ean ch\u1ebf Nga ho\u00e0ng, ti\u1ebfn t\u1ed1i gi\u00e0nh ch\u00ednh quy\u1ec1n v\u1ec1 tay giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng Nga. b) Th\u1eddi k\u1ef3 t\u1eeb sau C\u00e1ch m\u1ea1ng Th\u00e1ng M\u01b0\u1eddi Nga (1917) \u0111\u1ebfn n\u0103m 1924 Ngay sau khi C\u00e1ch m\u1ea1ng Th\u00e1ng M\u01b0\u1eddi Nga th\u1eafng l\u1ee3i, V.I.", "a": 1}}, {"q": "M\u1ee5c ti\u00eau cao nh\u1ea5t c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 gi\u1ea3i ph\u00f3ng con ng\u01b0\u1eddi tr\u00ean c\u01a1 s\u1edf \u0111i\u1ec1u ki\u1ec7n", "a": "Kinh t\u1ebf - x\u00e3 h\u1ed9i ph\u00e1t tri\u1ec3n, m\u00e0 x\u00e9t \u0111\u1ebfn c\u00f9ng l\u00e0 tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n cao c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t", "e": {"p": 95, "t": "gi\u1ea3i ph\u00f3ng con ng\u01b0\u1eddi tr\u00ean c\u01a1 s\u1edf \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i ph\u00e1t tri\u1ec3n, m\u00e0 x\u00e9t \u0111\u1ebfn c\u00f9ng l\u00e0 tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n cao c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t. Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i c\u00f3 n\u1ec1n kinh t\u1ebf ph\u00e1t tri\u1ec3n cao, v\u1ed1i l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i, quan h\u1ec7 s\u1ea3n xu\u1ea5t d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u0169u v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c, qu\u1ea3n l\u00fd c\u00f3 hi\u1ec7u qu\u1ea3, n\u0103ng su\u1ea5t lao \u0111\u1ed9ng cao v\u00e0 ph\u00e2n ph\u1ed1i ch\u1ee7 y\u1ebfu\u2026", "a": 1}}, {"q": "Mu\u1ed1n x\u00e2y d\u1ef1ng CNXH, tr\u01b0\u1edbc h\u1ebft c\u1ea7n c\u00f3 nh\u1eefng con ng\u01b0\u1eddi XHCN\u201d \u0111\u01b0\u1ee3c B\u00e1c n\u00f3i \u1edf \u0111\u00e2u?", "a": "H\u1ed9i ngh\u1ecb b\u1ed3i d\u01b0\u1ee1ng l\u00e3nh \u0111\u1ea1o c\u00e1c c\u1ea5p to\u00e0n mi\u1ec1n B\u1eafc th\u00e1ng 3.1961.", "e": null}, {"q": "N\u1ec1n d\u00e2n ch\u1ee7 n\u00e0o xu\u1ea5t hi\u1ec7n \u0111\u1ea7u ti\u00ean trong l\u1ecbch s\u1eed nh\u00e2n lo\u1ea1i?", "a": "N\u1ec1n d\u00e2n ch\u1ee7 ch\u1ee7 n\u00f4", "e": {"p": 131, "t": "Nh\u01b0 v\u1eady, v\u1edbi t\u01b0 c\u00e1ch l\u00e0 m\u1ed9t h\u00ecnh th\u00e1i nh\u00e0 n\u01b0\u1edbc, m\u1ed9t ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb trong l\u1ecbch s\u1eed nh\u00e2n lo\u1ea1i, cho \u0111\u1ebfn nay c\u00f3 ba n\u1ec1n (ch\u1ebf \u0111\u1ed9) d\u00e2n ch\u1ee7: N\u1ec1n d\u00e2n ch\u1ee7 ch\u1ee7 n\u00f4, g\u1eafn v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7;", "a": 1}}, {"q": "N\u1ec1n d\u00e2n ch\u1ee7 v\u00f4 s\u1ea3n hay c\u00f2n g\u1ecdi l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a ch\u00ednh th\u1ee9c \u0111\u01b0\u1ee3c x\u00e1c l\u1eadp khi n\u00e0o?", "a": "C\u00e1ch m\u1ea1ng Th\u00e1ng M\u01b0\u1eddi Nga th\u00e0nh c\u00f4ng v\u1edbi s\u1ef1 ra \u0111\u1eddi c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u0111\u1ea7u ti\u00ean tr\u00ean th\u1ebf gi\u1edbi (1917)", "e": {"p": 132, "t": "D\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u0111\u00e3 \u0111\u01b0\u1ee3c ph\u00f4i thai t\u1eeb th\u1ef1c ti\u1ec5n \u0111\u1ea5u tranh giai c\u1ea5p \u1edf Ph\u00e1p v\u00e0 C\u00f4ng x\u00e3 Pari n\u0103m 1871, tuy nhi\u00ean ch\u1ec9 \u0111\u1ebfn kh\u1ec9 C\u00e1ch m\u1ea1ng Th\u00e1ng M\u01b0\u1eddi Nga th\u00e0nh c\u00f4ng v\u1edbi s\u1ef1 ra \u0111\u1eddi c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u0111\u1ea7u ti\u00ean tr\u00ean th\u1ebf gi\u1edbi (1917), n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a m\u1edbi ch\u00ednh th\u1ee9c \u0111\u01b0\u1ee3c x\u00e1c l\u1eadp.", "a": 1}}, {"q": "N\u1ec1n d\u00e2n ch\u1ee7 XHCN l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 cao h\u01a1n v\u1ec1 ch\u1ea5t so v\u1edbi n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n \u1edf \u0111i\u1ec3m n\u00e0o?", "a": "T\u1ea5t c\u1ea3 \u0111\u1ec1u \u0111\u00fang", "e": {"p": 133, "t": "T\u1eeb nh\u1eefng ph\u00e2n t\u00edch tr\u00ean \u0111\u00e2y, c\u00f3 th\u1ec3 hi\u1ec3u d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 cao h\u01a1n v\u1ec1 ch\u1ea5t so v\u1edbi n\u1ec1n d\u00e2n ch\u1ee7 c\u00f3 trong l\u1ecbch s\u1eed nh\u1eafn lo\u1ea1i, l\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 m\u00e0 \u1edf \u0111\u00f3, m\u1ecdi quy\u1ec1n l\u1ef1c thu\u1ed9c v\u1ec1 nh\u00e2n d\u00e2n, d\u00e2n l\u00e0 ch\u1ee7 v\u00e0 d\u00e2n l\u00e0m ch\u1ee7;", "a": 1}}, {"q": "N\u1ec1n d\u00e2n ch\u1ee7 XHCN d\u1ef1a tr\u00ean c\u01a1 s\u1edf kinh t\u1ebf n\u00e0o?", "a": "C\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t.", "e": {"p": 112, "t": "2) C\u00f3 m\u1ed9t n\u1ec1n kinh t\u1ebf ph\u00e1t tri\u1ec3n cao d\u1ef1a tr\u00ean l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i v\u00e0 ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 c\u00e1c t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu; 3) C\u00f3 n\u1ec1n v\u0103n h\u00f3a ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c;", "a": 1}}, {"q": "N\u1ec1n d\u00e2n ch\u1ee7 XHCN d\u1ef1a tr\u00ean h\u1ec7 t\u01b0 t\u01b0\u1edfng n\u00e0o?", "a": "H\u1ec7 t\u01b0 t\u01b0\u1edfng c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c-L\u00eanin.", "e": {"p": 138, "t": "N\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u1ea5y h\u1ec7 t\u01b0 t\u01b0\u1edfng M\u00e1c - L\u00eanin - h\u1ec7 t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, l\u00e0m ch\u1ee7 \u0111\u1ea1o \u0111\u1ed1i v\u1edbi m\u1ecdi h\u00ecnh th\u00e1i \u00fd th\u1ee9c x\u00e3 h\u1ed9i kh\u00e1c trong x\u00e3 h\u1ed9i m\u1ed1i.", "a": 1}}, {"q": "N\u1ec1n d\u00e2n ch\u1ee7 XHCN mang b\u1ea3n ch\u1ea5t c\u1ee7a giai c\u1ea5p n\u00e0o?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 qu\u1ea7n ch\u00fang nh\u00e2n d\u00e2n lao \u0111\u1ed9ng", "e": {"p": 57, "t": "Thi\u1ebft l\u1eadp nh\u00e0 n\u01b0\u1edbc ki\u1ec3u m\u1edbi, mang b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, x\u00e2y d\u1ef1ng n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, th\u1ef1c hi\u1ec7n quy\u1ec1n l\u1ef1c c\u1ee7a nh\u00e2n d\u00e2n, quy\u1ec1n d\u00e2n ch\u1ee7 v\u00e0 l\u00e0m ch\u1ee7 x\u00e3 h\u1ed9i c\u1ee7a tuy\u1ec7t \u0111\u1ea1i \u0111a s\u1ed1 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng.", "a": 1}}, {"q": "N\u1ec1n kinh t\u1ebf tri th\u1ee9c \u0111\u01b0\u1ee3c xem l\u00e0?", "a": "M\u1ed9t n\u1ea5c thang ph\u00e1t tri\u1ec3n c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t", "e": {"p": 114, "t": "3) Ph\u00f9 h\u1ee3p v\u1edbi s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t, thi\u1ebft l\u1eadp t\u1eebng b\u01b0\u1edbc quan h\u1ec7 s\u1ea3n xu\u1ea5t x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a t\u1eeb th\u1ea5p \u0111\u1ebfn cao v\u1edbi s\u1ef1 \u0111a d\u1ea1ng v\u1ec1 h\u00ecnh th\u1ee9c s\u1edf h\u1eefu. Ph\u00e1t tri\u1ec3n n\u1ec1n kinh t\u1ebf h\u00e0ng h\u00f3a nhi\u1ec1u th\u00e0nh ph\u1ea7n theo \u0111\u1ecbnh h\u01b0\u1edbng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, v\u1eadn h\u00e0nh theo c\u01a1 ch\u1ebf th\u1ecb tr\u01b0\u1eddng c\u00f3 s\u1ef1 qu\u1ea3n l\u00fd c\u1ee7a Nh\u00e0 n\u01b0\u1edbc.", "a": 1}}, {"q": "N\u1ec1n v\u0103n ho\u00e1 XHCN l\u00e0", "a": "S\u1ef1 ph\u00e1t tri\u1ec3n t\u1ef1 nhi\u00ean, h\u1ee3p quy lu\u1eadt khi ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t TBCN \u0111\u00e3 l\u1ed7i th\u1eddi v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t m\u1edbi XHCN \u0111\u00e3 h\u00ecnh th\u00e0nh", "e": null}, {"q": "Ng\u00e0y nay, \u1edf Vi\u1ec7t Nam c\u0169ng nh\u01b0 tr\u00ean th\u1ebf gi\u1edbi kh\u00f4ng th\u1eeba nh\u1eadn quan h\u1ec7 cha m\u1eb9 nu\u00f4i (ng\u01b0\u1eddi \u0111\u1ee1 \u0111\u1ea7u) v\u1edbi con nu\u00f4i (\u0111\u01b0\u1ee3c c\u00f4ng nh\u1eadn b\u1eb1ng th\u1ee7 t\u1ee5c ph\u00e1p l\u00fd) trong quan h\u1ec7 gia \u0111\u00ecnh. Nh\u1eadn \u0111\u1ecbnh tr\u00ean l\u00e0", "a": "Sai", "e": {"p": 239, "t": "Ng\u00e0y nay, \u1ed7 Vi\u1ec7t Nam c\u0169ng nh\u01b0 tr\u00ean th\u1ebf gi\u1edbi c\u00f2n th\u1eeba nh\u1eadn quan h\u1ec7 cha m\u1eb9 nu\u00f4i (ng\u01b0\u1eddi \u0111\u1ee1 \u0111\u1ea7u) v\u1edbi con nu\u00f4i (\u0111\u01b0\u1ee3c c\u00f4ng nh\u1eadn b\u1eb1ng th\u1ee7 t\u1ee5c ph\u00e1p l\u00fd) trong quan h\u1ec7 gia 1. To\u00e0n t\u1eadp, S\u0111d, t.3, tr.41.", "a": 1}}, {"q": "ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc", "a": "S\u1ef1 ra \u0111\u1eddi v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, S\u1ef1 tr\u01b0\u1edfng th\u00e0nh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f4ng nghi\u1ec7p, Nh\u1eefng th\u00e0nh t\u1ef1u khoa h\u1ecdc t\u1ef1 nhi\u00ean v\u00e0 t\u01b0 t\u01b0\u1edfng l\u00fd lu\u1eadn \u0111\u1ea7u th\u1ebf k\u1ec9 19", "e": null}, {"q": "Nghi\u00ean c\u1ee9u v\u1ec1 d\u00e2n t\u1ed9c v\u00e0 phong tr\u00e0o d\u00e2n t\u1ed9c trong CNTB, L\u00eanin \u0111\u00e3 ch\u1ec9 ra m\u1ea5y xu h\u01b0\u1edbng ph\u00e1t tri\u1ec3n c\u00f3 t\u00ednh kh\u00e1ch quan c\u1ee7a n\u00f3?", "a": "2", "e": null}, {"q": "Ng\u01b0\u1eddi m\u01a1 \u01b0\u1edbc x\u00e2y d\u1ef1ng th\u00e0nh ph\u1ed1 m\u1eb7t tr\u1eddi, m\u00e0 trong \u0111\u00f3 kh\u00f4ng c\u00f3 n\u1ea1n th\u1ea5t nghi\u1ec7p,kh\u00f4ng c\u00f3 k\u1ebb l\u01b0\u1eddi bi\u1ebfng, ai c\u0169ng lao \u0111\u1ed9ng.\u00d4ng l\u00e0 ai?", "a": "T\u00f4ma\u0111\u00f4 Campanella", "e": null}, {"q": "Ng\u01b0\u1eddi ta c\u00f3 th\u1ec3 nh\u1eadn bi\u1ebft \u0111i\u1ec1u g\u00ec qua sinh ho\u1ea1t v\u1eadt ch\u1ea5t, c\u0169ng nh\u01b0 sinh ho\u1ea1t tinh th\u1ea7n c\u1ee7a d\u00e2n t\u1ed9c \u1ea5y, \u0111\u1eb7c bi\u1ec7t l\u00e0 qua c\u00e1c phong t\u1ee5c t\u1eadp qu\u00e1n, t\u00edn ng\u01b0\u1ee1ng, \u0111\u1eddi s\u1ed1ng v\u0103n h\u00f3a?", "a": "T\u00e2m l\u00fd, t\u00ednh c\u00e1ch c\u1ee7a m\u1ed9t d\u00e2n t\u1ed9c.", "e": null}, {"q": "Ngu\u1ed3n g\u1ed1c h\u00ecnh th\u00e0nh n\u00ean t\u00f4n gi\u00e1o l\u00e0", "a": "T\u1ef1 nhi\u00ean, Kinh t\u1ebf - x\u00e3 h\u1ed9i; Nh\u1eadn th\u1ee9c; T\u00e2m l\u00fd", "e": null}, {"q": "Ngu\u1ed3n g\u1ed1c l\u00fd lu\u1eadn tr\u1ef1c ti\u1ebfp h\u00ecnh th\u00e0nh n\u00ean CNXH khoa h\u1ecdc l\u00e0", "a": "CNXH kh\u00f4ng t\u01b0\u1edfng \u1edf Ph\u00e1p, Anh", "e": null}, {"q": "Nguy\u00ean nh\u00e2n ch\u1ee7 y\u1ebfu c\u1ee7a nh\u1eefng h\u1ea1n ch\u1ebf c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng l\u00e0", "a": "Do nh\u1eefng \u0111i\u1ec1u ki\u1ec7n l\u1ecbch s\u1eed kh\u00e1ch quan quy \u0111\u1ecbnh.", "e": null}, {"q": "Nguy\u00ean nh\u00e2n c\u01a1 b\u1ea3n l\u00e0m cho giai c\u1ea5p n\u00f4ng d\u00e2n kh\u00f4ng th\u1ec3 \u0111\u1ea3m nh\u1eadn s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed chuy\u1ec3n bi\u1ebfn t\u1eeb x\u00e3 h\u1ed9i t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a l\u00ean x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a?", "a": "H\u1ecd kh\u00f4ng \u0111\u1ea1i di\u1ec7n cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u1ebfn b\u1ed9", "e": null}, {"q": "Nguy\u00ean nh\u00e2n n\u00e0o d\u1eabn \u0111\u1ebfn c\u00e1c c\u1ed9ng \u0111\u1ed3ng d\u00e2n c\u01b0 mu\u1ed1n t\u00e1ch ra \u0111\u1ec3 h\u00ecnh th\u00e0nh c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c \u0111\u1ed9c l\u1eadp?", "a": "Do s\u1ef1 th\u1ee9c t\u1ec9nh, tr\u01b0\u1edfng th\u00e0nh v\u1ec1 \u00fd th\u1ee9c d\u00e2n t\u1ed9c, \u00fd th\u1ee9c v\u1ec1 quy\u1ec1n s\u1ed1ng c\u1ee7a m\u00ecnh.", "e": {"p": 200, "t": "Xu h\u01b0\u1edbng th\u1ee9 nh\u1ea5t, c\u1ed9ng \u0111\u1ed3ng d\u00e2n c\u01b0 mu\u00f4n t\u00e1ch ra \u0111\u1ec3 h\u00ecnh th\u00e0nh c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c \u0111\u1ed9c l\u1eadp. Nguy\u00ean nh\u00e2n l\u00e0 do s\u1ef1 th\u1ee9c t\u1ec9nh, s\u1ef1 tr\u01b0\u1edfng th\u00e0nh v\u1ec1 \u00fd th\u1ee9c d\u00e2n t\u1ed9c, \u00fd", "a": 1}}, {"q": "Nguy\u00ean nh\u00e2n nh\u1eadn th\u1ee9c cho s\u1ef1 t\u1ed3n t\u1ea1i c\u1ee7a t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o l\u00e0?", "a": "S\u1ef1 tuy\u1ec7t \u0111\u1ed1i h\u00f3a, s\u1ef1 c\u01b0\u1eddng \u0111i\u1ec7u m\u1eb7t ch\u1ee7 th\u1ec3 c\u1ee7a nh\u1eadn th\u1ee9c con ng\u01b0\u1eddi, bi\u1ebfn c\u00e1i n\u1ed9i dung kh\u00e1ch quan th\u00e0nh c\u00e1i si\u00eau nhi\u00ean, th\u1ea7n th\u00e1nh", "e": {"p": 216, "t": "Th\u1ef1c ch\u1ea5t ngu\u1ed3n g\u1ed1c nh\u1eadn th\u1ee9c c\u1ee7a t\u00f4n gi\u00e1o ch\u00ednh l\u00e0 s\u1ef1 tuy\u1ec7t \u0111\u00f4i h\u00f3a, s\u1ef1 c\u01b0\u1eddng \u0111i\u1ec7u m\u1eb7t ch\u1ee7 th\u1ec3 c\u1ee7a nh\u1eadn th\u1ee9c con ng\u01b0\u1eddi, bi\u1ebfn c\u00e1i n\u1ed9i dung kh\u00e1ch quan th\u00e0nh c\u00e1i si\u00eau nhi\u00ean, th\u1ea7n th\u00e1nh. - Ngu\u1ed3n g\u1ed1c t\u00e2m l\u00fd:", "a": 1}}, {"q": "Nguy\u00ean nh\u00e2n n\u00e0o l\u00e0m cho b\u1ea3n \u0111\u1ed3 c\u01b0 tr\u00fa c\u1ee7a c\u00e1c d\u00e2n t\u1ed9c \u1edf Vi\u1ec7t Nam tr\u1edf n\u00ean ph\u00e2n t\u00e1n, xen k\u1ebd, c\u00e1c d\u00e2n t\u1ed9c \u1edf Vi\u1ec7t Nam kh\u00f4ng c\u00f3 l\u00e3nh th\u1ed5 t\u1ed9c ng\u01b0\u1eddi ri\u00eang?", "a": "Vi\u1ec7t Nam l\u00e0 n\u01a1i c\u00f3 c\u00e1c \u0111\u1ee3t chuy\u1ec3n c\u01b0 k\u00e9o d\u00e0i", "e": {"p": 206, "t": "l\u00e0m cho b\u1ea3n \u0111\u1ed3 c\u01b0 tr\u00fa c\u1ee7a c\u00e1c d\u00e2n t\u1ed9c tr\u1edf n\u00ean ph\u00e2n t\u00e1n, xen k\u1ebd v\u00e0 l\u00e0m cho c\u00e1c d\u00e2n t\u1ed9c \u1edf Vi\u1ec7t Nam kh\u00f4ng c\u00f3 l\u00e3nh th\u1ed5 t\u1ed9c ng\u01b0\u1eddi ri\u00eang. V\u00ec v\u1eady, kh\u00f4ng c\u00f3 m\u1ed9t d\u00e2n t\u1ed9c n\u00e0o \u1edf Vi\u1ec7t Nam c\u01b0 tr\u00fa t\u1eadp trung v\u00e0 duy nh\u1ea5t tr\u00ean m\u1ed9t \u0111\u1ecba b\u00e0n.", "a": 1}}, {"q": "Nguy\u00ean nh\u00e2n s\u00e2u xa c\u1ee7a c\u00e1ch m\u1ea1ng XHCN l\u00e0 do", "a": "\u2192 M\u00e2u thu\u1eabn gi\u1eefa LLSX v\u00e0 QHSX trong PTSX TBCN", "e": null}, {"q": "Nguy\u00ean nh\u00e2n s\u00e2u xa c\u1ee7a c\u00e1ch m\u1ea1ng XHCN l\u00e0?", "a": "M\u00e2u thu\u1eabn gi\u1eefa LLSX v\u00e0 QHSX", "e": {"p": 220, "t": "M\u1eb7t ch\u00ednh tr\u1ecb ph\u1ea3n \u00e1nh m\u1ed1i quan h\u1ec7 gi\u1eefa ti\u1ebfn b\u1ed9 v\u1ed1i ph\u1ea3n ti\u1ebfn b\u1ed9, ph\u1ea3n \u00e1nh m\u00e2u thu\u1eabn \u0111\u1ed1\u00ec kh\u00e1ng v\u1ec1 l\u1ee3i \u00edch kinh t\u1ebf, ch\u00ednh tr\u1ecb gi\u1eefa c\u00e1c giai c\u1ea5p, m\u00e2u thu\u1eabn gi\u1eefa nh\u1eefng th\u1ebf l\u1ef1c l\u1ee3i d\u1ee5ng t\u00f4n gi\u00e1o ch\u1ed1ng l\u1ea1i s\u1ef1 nghi\u1ec7p c\u00e1ch m\u1ea1ng v\u \u1ea1n ch\u1ebf v\u1ec1 th\u1ebf gi\u1edbi quan c\u1ee7a nh\u1eefng nh\u00e0 t\u01b0 t\u01b0\u1edfng/ S\u1ef1 h\u1ea1n ch\u1ebf v\u1ec1 t\u1ea7m nh\u00ecn c\u1ee7a nh\u1eefng nh\u00e0 t\u01b0 t\u01b0\u1edfng", "e": {"p": 15, "t": "Tuy nhi\u00ean, nh\u1eefng t\u01b0 t\u01b0\u1edfng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a kh\u00f4ng t\u01b0\u1edfng ph\u00ea ph\u00e1n c\u00f2n kh\u00f4ng \u00edt nh\u1eefng h\u1ea1n ch\u1ebf ho\u1eb7c do \u0111i\u1ec1u ki\u1ec7n l\u1ecbch s\u1eed, ho\u1eb7c do ch\u00ednh s\u1ef1 h\u1ea1n ch\u1ebf v\u1ec1 t\u1ea7m nh\u00ecn v\u00e0 th\u1ebf gi\u1edbi quan c\u1ee7a nh\u1eefng nh\u00e0 t\u01b0 t\u01b0\u1edfng, ch\u1eb3ng h\u1ea1n nh\u01b0: kh\u00f4ng ph\u00e1t hi\u1ec7n ra \u0111\u01b0\u1ee3c quy lu\u1eadt v\u1eadn \u0111\u1ed9ng v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi n\u00f3i chung;", "a": 1}}, {"q": "Nh\u1eefng y\u1ebfu t\u1ed1 t\u01b0 t\u01b0\u1edfng XHCN \u0111\u01b0\u1ee3c xu\u1ea5t hi\u1ec7n t\u1eeb khi", "a": "S\u1ef1 xu\u1ea5t hi\u1ec7n ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu, xu\u1ea5t hi\u1ec7n giai c\u1ea5p th\u1ed1ng tr\u1ecb v\u00e0 b\u00f3c l\u1ed9t.", "e": null}, {"q": "Ni\u1ec1m tin c\u1ee7a con ng\u01b0\u1eddi v\u00e0o c\u00e1c l\u1ef1c l\u01b0\u1ee3ng si\u00eau nhi\u00ean, th\u1ea7n th\u00e1nh \u0111\u1ebfn m\u1ee9c \u0111\u1ed9 m\u00ea mu\u1ed9i, cu\u1ed3ng t\u00edn, d\u1eabn \u0111\u1ebfn nh\u1eefng h\u00e0nh vi c\u1ef1c \u0111oan, sai l\u1ec7ch qu\u00e1 m\u1ee9c, tr\u00e1i v\u1edbi c\u00e1c gi\u00e1 tr\u1ecb v\u0103n h\u00f3a, \u0111\u1ea1o \u0111\u1ee9c, ph\u00e1p lu\u1eadt, g\u00e2y t\u1ed5n h\u1ea1i cho c\u00e1 nh\u00e2n, x\u00e3 h\u1ed9i v\u00e0 c\u1ed9ng \u0111\u1ed3ng \u2013 g\u1ecdi l\u00e0", "a": "M\u00ea t\u00edn d\u1ecb \u0111oan", "e": {"p": 215, "t": "M\u00ea t\u00edn d\u1ecb \u0111oan l\u00e0 ni\u1ec1m tin c\u1ee7a con ng\u01b0\u1eddi v\u00e0o c\u00e1c l\u1ef1c l\u01b0\u1ee3ng si\u00eau nhi\u00ean, th\u1ea7n th\u00e1nh \u0111\u1ebfn m\u1ee9c \u0111\u1ed9 m\u00ea mu\u1ed9i, cu\u1ed3ng t\u00edn, d\u1eabn \u0111\u1ebfn nh\u1eefng h\u00e0nh vi c\u1ef1c \u0111oan, sai l\u1ec7ch qu\u00e1 m\u1ee9c, tr\u00e1i v\u1ed1i c\u00e1c gi\u00e1 tr\u1ecb v\u0103n h\u00f3a, \u0111\u1ea1o \u0111\u1ee9c, ph\u00e1p lu\u1eadt, g\u00e2y t\u1ed5n h\u1ea1i cho c\u00e1 nh\u00e2n, x\u00e3 h\u1ed9i v\u00e0 c\u1ed9ng \u0111\u1ed3ng.", "a": 1}}, {"q": "N\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN d\u1ef1a tr\u00ean nguy\u00ean t\u1eafc n\u00e0o?", "a": "Tr\u00ean l\u1eadp tr\u01b0\u1eddng ch\u00ednh tr\u1ecb- t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": null}, {"q": "N\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a d\u1ef1a tr\u00ean nguy\u00ean t\u1eafc n\u00e0o?", "a": "Gi\u1eef v\u1eefng l\u1eadp tr\u01b0\u1eddng ch\u00ednh tr\u1ecb - t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 184, "t": "\u1edf n\u01b0\u1edbc ta, n\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh th\u1ec3 hi\u1ec7n \u1ecf vi\u1ec7c gi\u1eef v\u1eefng l\u1eadp tr\u01b0\u1eddng ch\u00ednh tr\u1ecb - t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, \u0111\u1ed3ng th\u1eddi gi\u1eef v\u1eefng vai tr\u00f2 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam \u0111\u1ed1i v\u1edbi kh\u00f4i li\u00ean minh v\u00e0 \u0111\u1ed1\u0129 v\u1edbi to\u00e0n x\u00e3 h\u1ed9i \u0111\u1ec3 x\u00e2y d\u1ef1ng v\u00e0 b\u1ea3o v\u1ec7 v\u1eefng ch\u1eafc ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb, gi\u1eef v\u1eefng \u0111\u1ed9c l\u1eadp d\u00e2n t\u1ed9c v\u00e0 \u0111\u1ecbnh h\u01b0\u1edbng \u0111i l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i."}}, {"q": "N\u1ed9i dung ch\u00ednh y\u1ebfu, n\u1ed5i b\u1eadt, th\u1ec3 hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam hi\u1ec7n nay v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i l\u00e0", "a": "Gi\u1eef v\u1eefng b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u1ee7a Nh\u00e0 n\u01b0\u1edbc, vai tr\u00f2 ti\u00ean phong, g\u01b0\u01a1ng m\u1eabu c\u1ee7a c\u00e1n b\u1ed9 v\u1edbi c\u00e1c \u0111\u1ea3ng vi\u00ean", "e": {"p": 78, "t": "b) N\u1ed9i dung ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i C\u00f9ng v\u1edbi nhi\u1ec7m v\u1ee5 gi\u1eef v\u1eefng v\u00e0 t\u0103ng c\u01b0\u1eddng s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng th\u00ec nhi\u1ec7m v\u1ee5 \u201cGi\u1eef v\u1eefng b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n c\u1ee7a \u0110\u1ea3ng, vai tr\u00f2 ti\u00ean phong, g\u01b0\u01a1ng m\u1eabu c\u1ee7a c\u00e1n b\u1ed9, \u0111\u1ea3ng vi\u00ean\u201d v\u00e0 \u201ct\u0103ng c\u01b0\u1eddng x\u00e2y d\u1ef1ng, ch\u1ec9nh \u0111\u1ed1n \u0110\u1ea3ng, ng\u0103n ch\u1eb7n, \u0111\u1ea9y l\u00f9i s\u1ef1 suy tho\u00e1i v\u1ec1 t\u01b0 t\u01b0\u1ecfng ch\u00ednh tr\u1ecb, \u0111\u1ea1o \u0111\u1ee9c, l\u1ed1i s\u1ed1ng, \u201ct\u1ef1 di\u1ec5n bi\u1ebfn\u201d, \u201ct\u1ef1 chuy\u1ec3n h\u00f3a\u201d trong n\u1ed9i b\u1ed9 l\u00e0 nh\u1eefng n\u1ed9i\u2026", "a": 1}}, {"q": "N\u1ed9i dung ch\u1ee7 y\u1ebfu v\u00e0 gi\u1ea3i ph\u00e1p quan tr\u1ecdng \u0111\u1ec3 li\u00ean k\u1ebft c\u00e1c n\u1ed9i dung c\u1ee7a C\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c th\u00e0nh m\u1ed9t ch\u1ec9nh th\u1ec3 l\u00e0?", "a": "Li\u00ean hi\u1ec7p c\u00f4ng nh\u00e2n t\u1ea5t c\u1ea3 c\u00e1c d\u00e2n t\u1ed9c", "e": {"p": 204, "t": "V\u00ec v\u1eady, n\u1ed9i dung n\u00e0y v\u1eeba l\u00e0 n\u1ed9i dung ch\u1ee7 y\u1ebfu, v\u1eeba l\u00e0 gi\u1ea3i ph\u00e1p quan tr\u1ecdng \u0111\u1ec3 li\u00ean k\u1ebft c\u00e1c n\u1ed9i dung c\u1ee7a C\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c th\u00e0nh m\u1ed9t ch\u1ec9nh th\u1ec3. C\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin l\u00e0 c\u01a1 s\u1edf l\u00fd lu\u1eadn quan tr\u1ecdng \u0111\u1ec3 c\u00e1c \u0110\u1ea3ng C\u1ed9ng s\u1ea3n v\u1eadn d\u1ee5ng th\u1ef1c hi\u1ec7n ch\u00ednh s\u00e1ch d\u00e2n t\u1ed9c trong qu\u00e1 tr\u00ecnh \u0111\u1ea5u tranh gi\u00e0nh \u0111\u1ed9c l\u1eadp d\u00e2n t\u1ed9c v\u00e0 x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "N\u1ed9i dung ch\u1ee7 y\u1ebfu v\u00e0 m\u1ee5c \u0111\u00edch cu\u1ed1i c\u00f9ng c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 g\u00ec?", "a": "C\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i c\u0169, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng x\u00e3 h\u1ed9i m\u1edbi", "e": {"p": 145, "t": "C\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i c\u0169, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng x\u00e3 h\u1ed9i m\u1edbi l\u00e0 n\u1ed9i dung ch\u1ee7 y\u1ebfu v\u00e0 m\u1ee5c \u0111\u00edch cu\u1ed1i c\u00f9ng c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a.", "a": 1}}, {"q": "N\u1ed9i dung c\u01a1 b\u1ea3n c\u1ee7a d\u00e2n ch\u1ee7 trong l\u0129nh v\u1ef1c kinh t\u1ebf \u1edf Vi\u1ec7t Nam l\u00e0 g\u00ec?", "a": "M\u1ecdi c\u00f4ng d\u00e2n \u0111\u1ec1u b\u00ecnh \u0111\u1eb3ng v\u00e0 t\u1ef1 do kinh doanh v\u00e0 th\u1ef1c hi\u1ec7n ngh\u0129a v\u1ee5 \u0111\u00f3ng thu\u1ebf theo quy \u0111\u1ecbnh c\u1ee7a ph\u00e1p lu\u1eadt", "e": null}, {"q": "N\u1ed9i dung c\u01a1 b\u1ea3n nh\u1ea5t m\u00e0 nh\u1edd \u0111\u00f3 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i t\u1eeb kh\u00f4ng t\u01b0\u1edfng tr\u1edf th\u00e0nh khoa h\u1ecdc?", "a": "Ph\u00e1t hi\u1ec7n ra giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 l\u1ef1c l\u01b0\u1ee3ng x\u00e3 h\u1ed9i c\u00f3 th\u1ec3 th\u1ee7 ti\u00eau CNTB, x\u00e2y d\u1ef1ng CNXH.", "e": null}, {"q": "N\u1ed9i dung c\u01a1 b\u1ea3n v\u00e0 tr\u1ef1c ti\u1ebfp \u0111\u1ec3 x\u00e2y d\u1ef1ng gia \u0111\u00ecnh \u1edf Vi\u1ec7t Nam hi\u1ec7n nay l\u00e0 g\u00ec?", "a": "X\u00e2y d\u1ef1ng gia \u0111\u00ecnh no \u1ea5m, b\u00ecnh \u0111\u1eb3ng, ti\u1ebfn b\u1ed9 v\u00e0 h\u1ea1nh ph\u00fac", "e": null}, {"q": "N\u1ed9i dung c\u1ed1t l\u00f5i c\u1ee7a c\u00f4ng t\u00e1c t\u00f4n gi\u00e1o \u1edf n\u01b0\u1edbc ta trong giai \u0111o\u1ea1n hi\u1ec7n nay l\u00e0?", "a": "L\u00e0 c\u00f4ng t\u00e1c v\u1eadn \u0111\u1ed9ng qu\u1ea7n ch\u00fang.", "e": {"p": 226, "t": "\u0110\u1ed3ng th\u1eddi, nghi\u00eam c\u1ea5m l\u1ee3i d\u1ee5ng t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o \u0111\u1ec3 ho\u1ea1t \u0111\u1ed9ng m\u00ea t\u00edn d\u1ecb \u0111oan, ho\u1ea1t \u0111\u1ed9ng tr\u00e1i ph\u00e1p lu\u1eadt v\u00e0 ch\u00ednh s\u00e1ch c\u1ee7a Nh\u00e0 n\u01b0\u1edbc, k\u00edch \u0111\u1ed9ng chia r\u1ebd nh\u00e2n d\u00e2n, chia r\u1ebd c\u00e1c d\u00e2n t\u1ed9c, g\u00e2y r\u1ed1\u00ec, x\u00e2m ph\u1ea1m an ninh qu\u1ed1c gia. - N\u1ed9i dung c\u1ed1t l\u00f5i c\u1ee7a c\u00f4ng t\u00e1c t\u00f4n gi\u00e1o l\u00e0 c\u00f4ng t\u00e1c v\u1eadn \u0111\u1ed9ng qu\u1ea7n ch\u00fang.", "a": 1}}, {"q": "N\u1ed9i dung c\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin l\u00e0?", "a": "C\u00e1c d\u00e2n t\u1ed9c ho\u00e0n to\u00e0n b\u00ecnh \u0111\u1eb3ng, c\u00e1c d\u00e2n t\u1ed9c \u0111\u01b0\u1ee3c quy\u1ec1n t\u1ef1 quy\u1ebft, li\u00ean hi\u1ec7p c\u00f4ng nh\u00e2n t\u1ea5t c\u1ea3 c\u00e1c d\u00e2n t\u1ed9c l\u1ea1i.", "e": {"p": 203, "t": "b\u00ecnh \u0111\u1eb3ng, c\u00e1c d\u00e2n t\u1ed9c \u0111\u01b0\u1ee3c quy\u1ec1n t\u1ef1 quy\u1ebft, li\u00ean hi\u1ec7p c\u00f4ng nh\u00e2n t\u1ea5 t c\u1ea3 c\u00e1c d\u00e2n t\u1ed9c l\u1ea1i\u201d. M\u1ed9t l\u00e0, c\u00e1c d\u00e2n t\u1ed9c ho\u00e0n to\u00e0n b\u00ecnh \u0111\u1eb3ng.", "a": 1}}, {"q": "N\u1ed9i dung c\u1ee7a li\u00ean minh giai c\u1ea5p, t\u1ea7ng l\u1edbp trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH th\u1ec3 hi\u1ec7n \u1edf nh\u1eefng n\u1ed9i dung", "a": "Kinh t\u1ebf, ch\u00ednh tr\u1ecb, t\u01b0 t\u01b0\u1edfng", "e": {"p": 182, "t": "a) N\u1ed9i dung c\u1ee7a li\u00ean minh giai c\u1ea5p, t\u1ea7ng l\u1edbp trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, vi\u1ec7c t\u1ed5 ch\u1ee9c kh\u1ed1i li\u00ean minh v\u1eefng m\u1ea1nh c\u00f3 \u00fd ngh\u0129a \u0111\u1eb7c bi\u1ec7t quan tr\u1ecdng \u0111\u1ec3 th\u1ef1c hi\u1ec7n nh\u1eefng n\u1ed9i dung c\u01a1 b\u1ea3n c\u1ee7a li\u00ean minh.", "a": 1}}, {"q": "N\u1ed9i dung kinh t\u1ebf c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN d\u1ef1a tr\u00ean nguy\u00ean t\u1eafc n\u00e0o?", "a": "K\u1ebft h\u1ee3p \u0111\u00fang \u0111\u1eafn l\u1ee3i \u00edch kinh t\u1ebf c\u1ee7a c\u00f4ng nh\u00e2n, n\u00f4ng d\u00e2n v\u00e0 tr\u00ed th\u1ee9c", "e": {"p": 182, "t": "N\u1ed9i dung kinh t\u1ebf c\u1ee7a li\u00ean minh giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00f3i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 \u0111\u1ed9i ng\u0169 tr\u00ed th\u1ee9c \u1edf n\u01b0\u1edbc ta th\u1ef1c ch\u1ea5t l\u00e0 s\u1ef1 h\u1ee3p t\u00e1c gi\u1eefa h\u1ecd, \u0111\u1ed3ng th\u1eddi m\u1edf r\u1ed9ng li\u00ean k\u1ebft h\u1ee2p t\u00e1c v\u1edbi c\u00e1c l\u1ef1c l\u01b0\u1ee3ng kh\u00e1c, \u0111\u1eb7c bi\u1ec7t l\u00e0 \u0111\u1ed9i ng\u0169 doanh nh\u00e2n...", "a": 1}}, {"q": "N\u1ed9i dung n\u00e0o kh\u00f4ng ph\u00f9 h\u1ee3p v\u1edbi quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "a": "Quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc mang t\u00ednh giai c\u1ea5p n\u00f4ng d\u00e2n", "e": null}, {"q": "N\u1ed9i dung n\u00e0o l\u00e0 quan tr\u1ecdng nh\u1ea5t trong c\u00e1c n\u1ed9i dung c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c khi ti\u1ebfn h\u00e0nh x\u00e2y d\u1ef1ng CNXH\u2192", "a": "N\u1ed9i dung kinh t\u1ebf", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "N\u1ed9i dung n\u00e0o quan tr\u1ecdng nh\u1ea5t trong c\u00e1c n\u1ed9i dung Li\u00ean minh c\u00f4ng n\u00f4ng-tr\u00ed th\u1ee9c?", "a": "Kinh t\u1ebf", "e": {"p": 77, "t": "Th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf g\u1eafn li\u1ec1n v\u1edbi vi\u1ec7c ph\u00e1t huy vai tr\u00f2 c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, c\u1ee7a c\u00f4ng nghi\u1ec7p, th\u1ef1c hi\u1ec7n kh\u1ed1i li\u00ean minh c\u00f4ng - n\u00f4ng - tr\u00ed th\u1ee9c \u0111\u1ec3 t\u1ea1o ra nh\u1eefng \u0111\u1ed9ng l\u1ef1c ph\u00e1t tri\u1ec3n n\u00f4ng nghi\u1ec7p - n\u00f4ng th\u00f4n v\u00e0 n\u00f4ng d\u00e2n \u1edf n\u01b0\u1edbc ta theo h\u01b0\u1edbng ph\u00e1t tri\u1ec3n b\u1ec1n v\u1eefng, hi\u1ec7n \u0111\u1ea1i h\u00f3a, ch\u1ee7 \u0111\u1ed9ng h\u1ed9i nh\u1eadp qu\u1ed1c t\u1ebf, nh\u1ea5t l\u00e0 h\u1ed9i nh\u1eadp kinh t\u1ebf qu\u1ed1c\u2026", "a": 1}}, {"q": "N\u1ed9i dung n\u00e0o quan tr\u1ecdng nh\u1ea5t trong x\u00e2y d\u1ef1ng kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 t\u1ea7ng l\u1edbp kh\u00e1c?", "a": "Li\u00ean minh v\u1ec1 kinh t\u1ebf", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "N\u1ed9i dung n\u00e0o th\u1ec3 hi\u1ec7n s\u1ef1 k\u1ebf th\u1eeba tinh hoa c\u1ee7a h\u1ecdc thuy\u1ebft ph\u00e1p quy\u1ec1n trong nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a?", "a": "C\u00f3 ba c\u01a1 quan l\u1eadp ph\u00e1p, h\u00ecnh ph\u00e1p v\u00e0 t\u01b0 ph\u00e1p-Nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n b\u1ecb r\u00e0ng bu\u1ed9c b\u1edfi ph\u00e1p lu\u1eadt", "e": null}, {"q": "N\u1ed9i dung s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 gi\u1ea3i ph\u00f3ng giai c\u1ea5p c\u00f4ng nh\u00e2n, nh\u00e2n d\u00e2n lao \u0111\u1ed9ng v\u00e0 to\u00e0n th\u1ec3 nh\u00e2n lo\u1ea1i kh\u1ecfi s\u1ef1 \u00e1p b\u1ee9c, b\u00f3c l\u1ed9t ngh\u00e8o n\u00e0n, l\u1ea1c h\u1eadu?", "a": "T\u1ea5t c\u1ea3 c\u00e1c c\u00e2u \u0111\u1ec1u \u0111\u00fang", "e": {"p": 56, "t": "Theo ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin, s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed t\u1ed5ng qu\u00e1t c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 th\u00f4ng qua ch\u00ednh \u0111\u1ea3ng ti\u1ec1n phong, giai c\u1ea5p c\u00f4ng nh\u00e2n t\u1ed5 ch\u1ee9c, l\u00e3nh \u0111\u1ea1o nh\u00e2n d\u00e2n lao \u0111\u1ed9ng \u0111\u1ea5u tranh x\u0 \u1ea5t hi\u1ec7n khi n\u00e0o?", "a": "Khi c\u00f3 ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu, giai c\u1ea5p v\u00e0 nh\u00e0 n\u01b0\u1edbc.", "e": {"p": 125, "t": "N\u1ed9i dung tr\u00ean c\u1ee7a kh\u00e1i ni\u1ec7m d\u00e2n ch\u1ee7 v\u1ec1 c\u01a1 b\u1ea3n v\u1eabn gi\u1eef nguy\u00ean cho \u0111\u1ebfn ng\u00e0y nay. \u0110i\u1ec3m kh\u00e1c bi\u1ec7t c\u01a1 b\u1ea3n gi\u1eefa c\u00e1ch hi\u1ec3u v\u1ec1 d\u00e2n ch\u1ee7 th\u00f2i c\u1ed5 \u0111\u1ea1i v\u00e0 hi\u1ec7n nay l\u00e0 \u1edf t\u00ednh ch\u1ea5t tr\u1ef1c ti\u1ebfp c\u1ee7a m\u1ed1i quan h\u1ec7 s\u1edf h\u1eefu quy\u1ec1n l\u1ef1c c\u00f4ng c\u1ed9ng v\u00e0 c\u00e1ch hi\u1ec3u v\u1ec1 n\u1ed9i h\u00e0m c\u1ee7a kh\u00e1i ni\u1ec7m nh\u00e2n d\u00e2n.", "a": 1}}, {"q": "Ph\u1ea1m tr\u00f9 n\u00e0o \u0111\u01b0\u1ee3c coi l\u00e0 c\u01a1 b\u1ea3n nh\u1ea5t c\u1ee7a CNXH khoa h\u1ecdc?", "a": "S\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": null}, {"q": "Ph\u1ea1m tr\u00f9 n\u00e0o \u0111\u01b0\u1ee3c coi l\u00e0 Ph\u1ea1m tr\u00f9 trung t\u00e2m, nguy\u00ean l\u00fd xu\u1ea5t ph\u00e1t c\u1ee7a CNXHKH?", "a": "S\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 51, "t": "l\u00e0 ph\u1ea1m tr\u00f9 trung t\u00e2m, nguy\u00ean l\u00fd xu\u1ea5t ph\u00e1t c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc. \u0110\u00f3 c\u0169ng l\u00e0 tr\u1ecdng \u0111i\u1ec3m c\u1ee7a cu\u1ed9c \u0111\u1ea5u tranh t\u01b0 t\u01b0\u1edfng l\u00fd lu\u1eadn trong th\u00f2i \u0111\u1ea1i ng\u00e0y nay.", "a": 1}}, {"q": "Ph\u1ea1m tr\u00f9 n\u00e0o \u0111\u01b0\u1ee3c K.Marx v\u00e0 F. Engels cho r\u1eb1ng trong qu\u00e1 tr\u00ecnh th\u1ed1ng tr\u1ecb giai c\u1ea5p ch\u01b0a \u0111\u1ea7y m\u1ed9t th\u1ebf k\u1ef7, gc ts \u0111\u00e3 t\u1ea1o ra nhi\u1ec1u h\u01a1n v\u00e0 \u0111\u1ed3 s\u1ed9 h\u01a1n t\u1ea5t c\u1ea3 c\u00e1c th\u1ebf h\u1ec7 tr\u01b0\u1edbc g\u1ed9p l\u1ea1i?", "a": "LLSX", "e": {"p": 12, "t": "\u201cGiai c\u1ea5p t\u01b0 s\u1ea3n, trong qu\u00e1 tr\u00ecnh th\u1ed1ng tr\u1ecb giai c\u1ea5p ch\u01b0a \u0111\u1ea7y m\u1ed9t th\u1ebf k\u1ef7, \u0111\u00e3 t\u1ea1o ra nh\u1eefng l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t nhi\u1ec1u h\u01a1n v\u00e0 \u0111\u1ed3 s\u1ed9 h\u01a1n l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t c\u1ee7a t\u1ea5 t c\u1ea3 c\u00e1c th\u1ebf h\u1ec7 tr\u01b0\u1edbc kia g\u1ed9p l\u1ea1i\u201d1.", "a": 1}}, {"q": "Ph\u00e2n ph\u1ed1i theo lao \u0111\u1ed9ng l\u00e0 h\u00ecnh th\u1ee9c ph\u00e2n ph\u1ed1i c\u01a1 b\u1ea3n c\u1ee7a x\u00e3 h\u1ed9i n\u00e0o?", "a": "X\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "e": {"p": 111, "t": "th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 c\u00f2n nhi\u1ec1u h\u00ecnh th\u1ee9c ph\u00e2n ph\u1ed1i, ngo\u00e0i ph\u00e2n ph\u00f4i theo lao \u0111\u1ed9ng v\u1eabn l\u00e0 ch\u1ee7 \u0111\u1ea1o c\u00f2n ph\u00e2n ph\u1ed1i theo m\u1ee9c \u0111\u1ed9 \u0111\u00f3ng g\u00f3p v\u00e0 qu\u1ef9 ph\u00fac l\u1ee3i x\u00e3 h\u1ed9i; th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 v\u1eabn c\u00f2n quan h\u1ec7 b\u00f3c l\u1ed9t v\u00e0 b\u1ecb b\u00f3c l\u1ed9t, song quan h\u1ec7 b\u00f3c l\u1ed9t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a kh\u00f4ng gi\u1eef vai tr\u00f2 th\u1ed1ng tr\u1ecb.", "a": 1}}, {"q": "Ph\u00e2n qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, C. M\u00e1c v\u00e0 Ph. \u0102ngghen ch\u1ec9 r\u00f5: \u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n\u2026\u2026 ph\u1ea3i [....]\u201d", "a": "Ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c", "e": {"p": 52, "t": "\u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d1. \u0102ngghen, u00fd cho s\u1ef1 t\u1ed3n t\u1ea1i c\u1ee7a m\u1ed7i gia \u0111\u00ecnh?", "a": "H\u00f4n nh\u00e2n", "e": {"p": 239, "t": "Quan h\u1ec7 h\u00f4n nh\u00e2n l\u00e0 c\u01a1 s\u1edf, n\u1ec1n t\u1ea3ng h\u00ecnh th\u00e0nh n\u00ean c\u00e1c m\u1ed1\u00ec quan h\u1ec7 kh\u00e1c trong gia \u0111\u00ecnh, l\u00e0 c\u01a1 s\u1edf ph\u00e1p l\u00fd cho s\u1ef1 t\u1ed3n t\u1ea1i c\u1ee7a m\u1ed7i gia \u0111\u00ecnh. Quan h\u1ec7 huy\u1ebft th\u1ed1ng l\u00e0 quan h\u1ec7 gi\u1eefa nh\u1eefng ng\u01b0\u1eddi c\u00f9ng m\u1ed9t d\u00f2ng m\u00e1u, n\u1ea3y sinh t\u1eeb quan h\u1ec7 h\u00f4n nh\u00e2n."}}, {"q": "Quan h\u1ec7 gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n, nh\u00e2n d\u00e2n lao \u0111\u1ed9ng v\u1edbi t\u1ea7ng l\u1edbp t\u01b0 s\u1ea3n l\u00e0", "a": "Quan h\u1ec7 v\u1eeba h\u1ee3p t\u00e1c v\u1eeba \u0111\u1ea5u tranh", "e": {"p": 108, "t": "d) Tr\u00ean l\u0129nh v\u1ef1c x\u00e3 h\u1ed9i Do k\u1ebft c\u1ea5u c\u1ee7a n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n quy \u0111\u1ecbnh n\u00ean trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 c\u00f2n t\u1ed3n t\u1ea1i nhi\u1ec1u giai c\u1ea5p, t\u1ea7ng l\u1edbp v\u00e0 s\u1ef1 kh\u00e1c bi\u1ec7t gi\u1eefa c\u00e1c giai c\u1ea5p t\u1ea7ng l\u00f3p x\u00e3 h\u1ed9i, c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp v\u1eeba h\u1ee3p t\u00e1c, v\u1eeba \u0111\u1ea5u tranh v\u1ed1i nhau.", "a": 1}}, {"q": "Quan h\u1ec7 n\u00e0o n\u1ea3y sinh t\u1eeb quan h\u1ec7 h\u00f4n nh\u00e2n v\u00e0 l\u00e0 m\u1ed1i quan h\u1ec7 t\u1ef1 nhi\u00ean, l\u00e0 y\u1ebfu t\u1ed1 m\u1ea1nh m\u1ebd nh\u1ea5t g\u1eafn k\u1ebft c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh v\u1edbi nhau?", "a": "Huy\u1ebft th\u1ed1ng", "e": {"p": 239, "t": "Quan h\u1ec7 huy\u1ebft th\u1ed1ng l\u00e0 quan h\u1ec7 gi\u1eefa nh\u1eefng ng\u01b0\u1eddi c\u00f9ng m\u1ed9t d\u00f2ng m\u00e1u, n\u1ea3y sinh t\u1eeb quan h\u1ec7 h\u00f4n nh\u00e2n. \u0110\u00e2y l\u00e0 m\u1ed1\u00ec quan h\u1ec7 t\u1ef1 nhi\u00ean, l\u00e0 y\u1ebfu t\u1ed1 m\u1ea1nh m\u1ebd nh\u1ea5t g\u1eafn k\u1ebft c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh v\u1edbi nhau."}}, {"q": "Quan h\u1ec7 n\u00e0o sau \u0111\u00e2y kh\u00f4ng ph\u1ea3i l\u00e0 quan h\u1ec7 huy\u1ebft th\u1ed1ng trong gia \u0111\u00ecnh?", "a": "Quan h\u1ec7 gi\u1eefa v\u1ee3 v\u00e0 ch\u1ed3ng", "e": {"p": 239, "t": "Trong gia \u0111\u00ecnh, ngo\u00e0i hai m\u1ed1\u0129 quan h\u1ec7 c\u01a1 b\u1ea3n l\u00e0 quan h\u1ec7 gi\u0169a v\u1ee3 v\u00e0 ch\u1ed3ng, quan h\u1ec7 gi\u1eefa cha m\u1eb9 v\u1edbi con c\u00e1i, c\u00f2n c\u00f3 c\u00e1c m\u1ed1i quan h\u1ec7 kh\u00e1c, quan h\u1ec7 gi\u0169a \u00f4ng b\u00e0 v\u00e1i ch\u00e1u ch\u1eaft, gi\u1eefa anh ch\u1ecb em v\u1edbi nhau, gi\u1eefa c\u00f4, d\u00ec, ch\u00fa b\u00e1c v\u1edbi ch\u00e1u, V.V.."}}, {"q": "Qu\u1ed1c t\u1ebf II C\u1ed9ng s\u1ea3n \u0111\u01b0\u1ee3c th\u00e0nh l\u1eadp n\u0103m n\u00e0o?", "a": "1889", "e": null}, {"q": "Quy\u1ec1n lao \u0111\u1ed9ng th\u1ec3 hi\u1ec7n d\u00e2n ch\u1ee7 trong l\u0129nh v\u1ef1c n\u00e0o d\u01b0\u1edbi \u0111\u00e2y?", "a": "X\u00e3 h\u1ed9i", "e": {"p": 128, "t": "D\u00e2n ch\u1ee7 trong hai l\u0129nh v\u1ef1c n\u00e0y quy \u0111\u1ecbnh v\u00e0 quy\u1ebft \u0111\u1ecbnh d\u00e2n ch\u1ee7 trong x\u00e3 h\u1ed9i v\u00e0 d\u00e2n ch\u1ee7 trong \u0111\u1eddi s\u1ed1ng v\u0103n h\u00f3a - tinh th\u1ea7n, t\u01b0 t\u01b0\u1edfng. Kh\u00f4ng ch\u1ec9 th\u1ebf, d\u00e2n ch\u1ee7 trong kinh t\u1ebf v\u00e0 d\u00e2n ch\u1ee7 trong ch\u00ednh tr\u1ecb c\u00f2n th\u1ec3 hi\u1ec7n tr\u1ef1c ti\u1ebfp quy\u1ec1n con ng\u01b0\u1eddi (nh\u00e2n quy\u1ec1n) v\u00e0 quy\u1ec1n c\u00f4ng d\u00e2n (d\u00e2n quy\u1ec1n) c\u1ee7a ng\u01b0\u1eddi d\u00e2n, khi d\u00e2n th\u1ef1c s\u1ef1 l\u00e0 ch\u1ee7 th\u1ec3 x\u00e3 h\u1ed9i v\u00e0 l\u00e0m ch\u1ee7 x\u00e3 h\u1ed9i m\u1ed9t c\u00e1ch \u0111\u00edch th\u1ef1c.", "a": 1}}, {"q": "Quy\u1ec1n thi\u00eang li\u00eang c\u1ee7a c\u00e1c d\u00e2n t\u1ed9c, kh\u00f4ng ph\u00e2n bi\u1ec7t d\u00e2n t\u1ed9c l\u1edbn hay nh\u1ecf, \u1edf tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n cao hay th\u1ea5p theo c\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c c\u1ee7a CN M\u00e1c-Leenin l\u00e0", "a": "C\u00e1c d\u00e2n t\u1ed9c ho\u00e0n to\u00e0n b\u00ecnh \u0111\u1eb3ng", "e": {"p": 203, "t": "M\u1ed9t l\u00e0, c\u00e1c d\u00e2n t\u1ed9c ho\u00e0n to\u00e0n b\u00ecnh \u0111\u1eb3ng. \u0110\u00e2y l\u00e0 quy\u1ec1n thi\u00eang li\u00eang c\u1ee7a c\u00e1c d\u00e2n t\u1ed9c, kh\u00f4ng ph\u00e2n bi\u1ec7t d\u00e2n t\u1ed9c l\u1edbn hay nh\u1ecf, \u1edf tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n cao hay th\u1ea5p.", "a": 1}}, {"q": "\u201cS\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t ng\u00e0y c\u00e0ng nhi\u1ec1u, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u ng\u00e0y c\u00e0ng t\u0103ng c\u1ee7a con ng\u01b0\u1eddi v\u00e0 x\u00e3 h\u1ed9i, t\u1eeb \u0111\u00f3 t\u1ea1o ti\u1ec1n \u0111\u1ec1 v\u1eadt ch\u1ea5t \u2013 k\u1ef9 thu\u1eadt cho s\u1ef1 ra \u0111\u1eddi c\u1ee7a x\u00e3 h\u1ed9i m\u1edbi\u201d \u2013 l\u00e0 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n thu\u1ed9c n\u1ed9i dung?", "a": "Kinh t\u1ebf/ V\u0103n h\u00f3a t\u01b0 t\u01b0\u1edfng", "e": {"p": 56, "t": "L\u00e0 nh\u00e2n t\u1ed1 h\u00e0ng \u0111\u1ea7u c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t x\u00e3 h\u1ed9i h\u00f3a cao, giai c\u1ea5p c\u00f4ng nh\u00e2n c\u0169ng l\u00e0 \u0111\u1ea1i bi\u1ec3u cho quan h\u1ec7 s\u1ea3n xu\u1ea5t m\u1edbi, s\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t ng\u00e0y c\u00e0ng nhi\u1ec1u \u0111\u00e1p \u1ee9ng nhu c\u1ea7u ng\u00e0y c\u00e0ng t\u0103ng c\u1ee7a con ng\u01b0\u1eddi v\u00e0 x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "\u201cS\u1ef1 xu\u1ea5t hi\u1ec7n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a \u1edf c\u00e1c n\u01b0\u1edbc t\u01b0 b\u1ea3n c\u00f3 tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n trung b\u00ecnh v\u00e0 nh\u1eefng n\u01b0\u1edbc thu\u1ed9c \u0111\u1ecba sau khi \u0111\u01b0\u1ee3c gi\u1ea3i ph\u00f3ng do giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e3nh \u0111\u1ea1o\u201d l\u00e0 quan \u0111i\u1ec3m c\u1ee7a ai?", "a": "V.I.L\u00eanin", "e": null}, {"q": "\u201cS\u1ef1 xu\u1ea5t hi\u1ec7n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a t\u1eeb nh\u1eefng n\u01b0\u1edbc t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a ph\u00e1t tri\u1ec3n\u201d l\u00e0 quan \u0111i\u1ec3m c\u1ee7a ai?", "a": "C.M\u00e1c, Ph.\u0102ngghen", "e": null}, {"q": "So v\u1edbi c\u00e1c n\u1ec1n d\u00e2n ch\u1ee7 tr\u01b0\u1edbc \u0111\u00e2y, d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u00f3 \u0111i\u1ec3m kh\u00e1c bi\u1ec7t c\u01a1 b\u1ea3n n\u00e0o?", "a": "L\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 r\u1ed9ng r\u00e3i cho giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng.", "e": null}, {"q": "So v\u1edbi c\u00e1c n\u1ec1n d\u00e2n ch\u1ee7 tr\u01b0\u1edbc \u0111\u00e2y, d\u00e2n ch\u1ee7 XHCN c\u00f3 \u0111i\u1ec3m kh\u00e1c bi\u1ec7t c\u01a1 b\u1ea3n n\u00e0o?", "a": "L\u00e0 n\u1ec1n d\u00e2n ch\u1ee7 r\u1ed9ng r\u00e3i cho giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng", "e": null}, {"q": "So v\u1edbi giai c\u1ea5p c\u00f4ng nh\u00e2n truy\u1ec1n th\u1ed1ng \u1edf th\u1ebf k\u1ef7 XIX, th\u00ec giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n nay?", "a": "V\u1eeba c\u00f3 nh\u1eefng \u0111i\u1ec3m t\u01b0\u01a1ng \u0111\u1ed3ng, v\u1eeba c\u00f3 nh\u1eefng \u0111i\u1ec3m kh\u00e1c bi\u1ec7t, c\u00f3 nh\u1eefng bi\u1ebfn \u0111\u1ed5i m\u1edbi trong \u0111i\u1ec1u ki\u1ec7n l\u1ecbch s\u1eed m\u1edbi", "e": {"p": 64, "t": "Giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n nay So v\u1edbi giai c\u1ea5p c\u00f4ng nh\u00e2n truy\u1ec1n th\u1ed1ng \u1ecf th\u1ebf k\u1ef7 XIX th\u00ec giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n nay v\u1eeba c\u00f3 nh\u1eefng \u0111i\u1ec3m t\u01b0\u01a1ng \u0111\u1ed3ng, v\u1eeba c\u00f3 nh\u1eefng \u0111i\u1ec3m kh\u00e1c bi\u1ec7t, c\u00f3 nh\u1eefng bi\u1ebfn \u0111\u1ed5i m\u1ed5i trong \u0111i\u1ec1u ki\u1ec7n l\u1ecbch s\u1eed m\u1edbi.", "a": 1}}, {"q": "S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p g\u1eafn li\u1ec1n v\u00e0 \u0111\u01b0\u1ee3c quy \u0111\u1ecbnh b\u1edfi s\u1ef1 bi\u1ebfn \u0111\u1ed9ng c\u1ee7a c\u01a1 c\u1ea5u n\u00e0o?", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - kinh t\u1ebf", "e": {"p": 167, "t": "M\u1ed9t l\u00e0, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i g\u1eafn li\u1ec1n v\u00e0 b\u1ecb quy \u0111\u1ecbnh b\u1ed3i c\u01a1 c\u1ea5u kinh t\u1ebf c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. Trong m\u1ed9t h\u1ec7 th\u1ed1ng s\u1ea3n xu\u1ea5t nh\u1ea5t \u0111\u1ecbnh, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p th\u01b0\u1eddng xuy\u00ean bi\u1ebfn \u0111\u1ed5i do t\u00e1c \u0111\u1ed9ng c\u1ee7a nhi\u1ec1u y\u1ebfu t\u1ed1, \u0111\u1eb7c bi\u1ec7t l\u00e0 nh\u1eefng thay \u0111\u1ed5i v\u1ec1 ph\u01b0\u01a1ng th\u00fac s\u1ea3n xu\u1ea5t, v\u1ec1 c\u01a1 c\u1ea5u ng\u00e0nh ngh\u1ec1, th\u00e0nh ph\u1ea7n kinh t\u1ebf, c\u01a1 c\u1ea5u kinh t\u1ebf...", "a": 1}}, {"q": "S\u1ef1 h\u01b0ng th\u1ecbnh c\u1ee7a m\u1ed7i qu\u1ed1c gia, s\u1ef1 \u1ed5n \u0111\u1ecbnh, b\u1ec1n v\u1eefng c\u1ee7a x\u00e3 h\u1ed9i l\u00e0 \u0111i\u1ec1u ki\u1ec7n \u0111\u1ea3m b\u1ea3o v\u00e0 c\u00f3 \u00fd ngh\u0129a chi ph\u1ed1i \u0111\u1ebfn h\u1ea1nh ph\u00fac to\u00e0n di\u1ec7n, b\u1ec1n v\u1eefng c\u1ee7a gia \u0111\u00ecnh v\u00e0 c\u00e1 nh\u00e2n.Nh\u1eadn \u0111\u1ecbnh tr\u00ean l\u00e0?", "a": "\u0110\u00fang", "e": null}, {"q": "S\u1ef1 kh\u00e1c bi\u1ec7t c\u1ee7a nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n XHCN \u1edf VN so v\u1edbi c\u00e1c nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n kh\u00e1c l\u00e0 g\u00ec?", "a": "Mang b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, ph\u1ee5c v\u1ee5 l\u1ee3i \u00edch cho nh\u00e2n d\u00e2n, Nh\u00e0 n\u01b0\u1edbc l\u00e0 c\u00f4ng c\u1ee5 ch\u1ee7 y\u1ebfu \u0111\u1ec3 \u0110\u1ea3ng CS VN \u0111\u1ecbnh h\u01b0\u1edbng \u0111i l\u00ean CNXH.", "e": {"p": 157, "t": "Nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam mang b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, ph\u1ee5c v\u1ee5 l\u1ee3i \u00edch cho nh\u00e2n d\u00e2n; nh\u00e0 n\u01b0\u1edbc l\u00e0 c\u00f4ng c\u1ee5", "a": 1}}, {"q": "S\u1ef1 ki\u1ec7n l\u1ecbch s\u1eed n\u00e0o \u0111\u00e3 \u0111\u01b0a CNXH t\u1eeb l\u00fd lu\u1eadn tr\u1edf th\u00e0nh hi\u1ec7n th\u1ef1c?", "a": "C\u00e1ch m\u1ea1ng th\u00e1ng M\u01b0\u1eddi Nga", "e": {"p": 25, "t": "a) Th\u00f2i k\u1ef3 tr\u01b0\u1edbc C\u00e1ch m\u1ea1ng Th\u00e1ng M\u01b0\u1eddi Nga Tr\u00ean c\u01a1 s\u1edf ph\u00e2n t\u00edch v\u00e0 t\u1ed5ng k\u1ebft m\u1ed9t c\u00e1ch nghi\u00eam t\u00fac c\u00e1c s\u1ef1 ki\u1ec7n l\u1ecbch s\u1eed di\u1ec5n ra trong \u0111\u1eddi s\u00f4ng kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ee7a th\u1eddi k\u1ef3 tr\u01b0\u1edbc C\u00e1ch m\u1ea1ng Th\u00e1ng M\u01b0\u1eddi, V.I.", "a": 1}}, {"q": "S\u1ef1 ki\u1ec7n n\u00e0o \u0111\u00e1nh d\u1ea5u s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1eeb ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc th\u00e0nh ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i hi\u1ec7n th\u1ef1c?", "a": "T\u00e1c ph\u1ea9m Tuy\u00ean ng\u00f4n \u0110\u1ea3ng c\u1ed9ng s\u1ea3n \u0111\u01b0\u1ee3c xu\u1ea5t b\u1ea3n \u0111\u1ea7u ti\u00ean, 1848", "e": {"p": 19, "t": "c) Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n \u0111\u00e1nh d\u1ea5u s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc \u0110\u01b0\u1ee3c s\u1ef1 \u1ee7y nhi\u1ec7m c\u1ee7a nh\u0169ng ng\u01b0\u1eddi c\u1ed9ng s\u1ea3n v\u00e0 c\u00f4ng nh\u00e2n qu\u1ed1c t\u1ebf, th\u00e1ng 2 n\u0103m 1848, t\u00e1c ph\u1ea9m Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n do c. \u0102ngghen so\u1ea1n u00e0y ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc\u201d?", "a": "T\u01b0 B\u1ea3n", "e": {"p": 11, "t": "\u201ct\u00e1c ph\u1ea9m ch\u1ee7 y\u1ebfu v\u00e0 c\u01a1 b\u1ea3n \u1ea5y tr\u00ecnh b\u00e0y ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc... nh\u1eefng y\u1ebfu t\u1ed1 t\u1eeb \u0111\u00f3 n\u1ea3y sinh ra ch\u1ebf \u0111\u1ed9 t\u01b0\u01a1ng lai\u201d1.", "a": 1}}, {"q": "T\u00e1c ph\u1ea9m n\u00e0o \u0111\u00e3 n\u00eau v\u00e0 ph\u00e2n t\u00edch m\u1ed9t c\u00e1ch c\u00f3 h\u1ec7 th\u1ed1ng l\u1ecbch s\u1eed v\u00e0 logic ho\u00e0n ch\u1ec9nh v\u1ec1 nh\u1eefng v\u1ea5n \u0111\u1ec1 c\u01a1 b\u1ea3n nh\u1ea5t, \u0111\u1ea7y \u0111\u1ee7, s\u00fac t\u00edch v\u00e0 ch\u1eb7t ch\u1ebd nh\u1ea5t nh\u1eefng lu\u1eadn \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc?", "a": "Tuy\u00ean ng\u00f4n \u0110\u1ea3ng c\u1ed9ng s\u1ea3n", "e": {"p": 20, "t": "Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n \u0111\u00e3 n\u00eau v\u00e0 ph\u00e2n t\u00edch m\u1ed9t c\u00e1ch c\u00f3 h\u1ec7 th\u1ed1ng l\u1ecbch s\u1eed v\u00e0 l\u00f4g\u00edc ho\u00e0n ch\u1ec9nh v\u1ec1 nh\u1eefng v\u1ea5n \u0111\u1ec1 c\u01a1 b\u1ea3n nh\u1ea5t, \u0111\u1ea7y \u0111\u1ee7, s\u00fac t\u00edch v\u00e0 ch\u1eb7t ch\u1ebd nh\u1ea5t th\u00e2u t\u00f3m h\u1ea7u nh\u01b0 to\u00e0n b\u1ed9 nh\u1eefng lu\u1eadn \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc;"}}, {"q": "T\u00e1c ph\u1ea9m n\u00e0o \u0111\u01b0\u1ee3c xem l\u00e0 kinh \u0111i\u1ec3n ch\u1ee7 y\u1ebfu, \u0111\u00e1nh d\u1ea5u s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc?", "a": "Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n", "e": {"p": 19, "t": "c) Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n \u0111\u00e1nh d\u1ea5u s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc \u0110\u01b0\u1ee3c s\u1ef1 \u1ee7y nhi\u1ec7m c\u1ee7a nh\u0169ng ng\
