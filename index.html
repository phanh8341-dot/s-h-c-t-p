<!doctype html>
<html lang="vi"><head><meta charset="utf-8">

<title>Sổ học tập – CNXH khoa học</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7ff;--card:#fff;--ink:#14213d;--mu:#5d6b8a;--ln:#d8e0f2;--ac:#2563eb;--ok:#15803d;--no:#b91c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1226;--card:#171c36;--ink:#eef1ff;--mu:#a0a9cc;--ln:#2a3157;--ac:#7da2ff;--ok:#5ccf8b;--no:#f08080}}
:root[data-theme="dark"]{--bg:#0e1226;--card:#171c36;--ink:#eef1ff;--mu:#a0a9cc;--ln:#2a3157;--ac:#7da2ff;--ok:#5ccf8b;--no:#f08080}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Be Vietnam Pro',system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.br{font-weight:700;font-size:18px;margin-right:auto}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
nav button{border:0;background:none;color:var(--mu);font:inherit;padding:6px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{max-width:860px;margin:0 auto;padding:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mu,.mt{color:var(--mu);font-size:14px}.mt{display:flex;justify-content:space-between}
.b{border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;cursor:pointer}
.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
a.b{text-decoration:none;display:inline-block}
input,select,textarea{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
textarea{width:100%;min-height:70px;margin-top:8px}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.o.ok{border-color:var(--ok);background:rgba(21,128,61,.15)}.o.no{border-color:var(--no);background:rgba(185,28,28,.15)}
.q{font-weight:500;margin-bottom:8px;border-radius:6px;padding:2px 4px}
.hl1{background:#fde68a;color:#1a1a1a}.hl2{background:#bbf7d0;color:#1a1a1a}.hl3{background:#fecaca;color:#1a1a1a}
.bar{height:6px;background:var(--ln);border-radius:4px;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.fb{margin:8px 0;padding:10px;border-radius:10px;background:var(--bg)}.ok{color:var(--ok)}.no{color:var(--no)}
.nt{font-size:14px;color:var(--mu);margin-top:6px}.big{font-size:40px;font-weight:700}
.li{padding:8px 0;border-top:1px solid var(--ln)}.li .a{color:var(--ok);font-size:14px}
h1.x{}.doc h1{font-size:1.2rem;color:var(--ac);border-bottom:2px solid var(--ac);padding-bottom:4px}.doc h2{font-size:1.05rem}.doc h3{font-size:1rem;color:var(--ac)}
.doc .en{color:#0d7a5f;font-size:.92em}.doc .en-box{background:rgba(13,122,95,.12);border-radius:8px;padding:8px 10px;margin:8px 0}
.doc .fr{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;margin:6px 0}.doc .fn{font-size:13px;color:var(--mu)}.doc .tw{overflow-x:auto}
.doc table{border-collapse:collapse}.doc td,.doc th{border:1px solid var(--ln);padding:4px 8px}.doc math{font-size:1.1em}.doc math[display=block]{display:block;overflow-x:auto}
.ng{position:relative;display:flex;flex-wrap:wrap;gap:6px;max-height:128px;overflow-y:auto;padding:2px}
.nb{width:38px;height:38px;border:1.5px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:0}
.nb.nd{background:rgba(21,128,61,.2);border-color:var(--ok);color:var(--ok)}
.nb.nw{background:rgba(185,28,28,.18);border-color:var(--no);color:var(--no)}
.nb.ns{background:rgba(217,119,6,.2);border-color:#d97706}
.nb.nu{outline:3px solid var(--ac);outline-offset:1px;border-color:var(--ac);font-weight:700}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mu);margin-top:10px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid var(--ln);vertical-align:-1px;margin-right:4px}
.lg i.nd{background:rgba(21,128,61,.3);border-color:var(--ok)}.lg i.nw{background:rgba(185,28,28,.3);border-color:var(--no)}.lg i.ns{background:rgba(217,119,6,.35);border-color:#d97706}
.b:disabled{opacity:.45;cursor:default}
#tt{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#101a3a;color:#fff;padding:8px 16px;border-radius:10px;display:none;z-index:9}
</style></head><body>

<script type="application/json" id="d">[{"id": "cnxh1", "name": "CNXH khoa h\u1ecdc \u2013 B\u1ed9 1", "mcq": [{"q": "Trong ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, m\u00e2u thu\u1eabn v\u1ec1 m\u1eb7t kinh t\u1ebf \u0111\u00e3 bi\u1ec3u hi\u1ec7n ra th\u00e0nh m\u00e2u thu\u1eabn ch\u00ednh tr\u1ecb gi\u1eefa:", "o": ["Giai c\u1ea5p t\u01b0 s\u1ea3n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n", "Giai c\u1ea5p t\u01b0 s\u1ea3n v\u1edbi giai c\u1ea5p \u0111\u1ec3u t\u01b0 s\u1ea3n", "Giai c\u1ea5p t\u01b0 s\u1ea3n v\u1edbi giai c\u1ea5p c\u00f4ng nh\u00e2n", "Giai c\u1ea5p t\u01b0 s\u1ea3n v\u1edbi giai c\u1ea5p \u0111\u1ecba ch\u1ee7"], "a": 2, "e": {"p": 90, "t": "b) \u0110i\u1ec1u ki\u1ec7n ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i M\u00e2u thu\u1eabn gi\u1eefa t\u00ednh ch\u1ea5t x\u00e3 h\u1ed9i h\u00f3a c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u1ed1\u00ec v\u1edbi t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t tr\u1edf th\u00e0nh m\u00e2u thu\u1eabn kinh t\u1ebf c\u01a1 b\u1ea3n c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, bi\u1ec3u hi\u1ec7n v\u1ec1 m\u1eb7t x\u00e3 h\u1ed9i l\u00e0 m\u00e2u thu\u1eabn gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n l\u1ed7i th\u1eddi.", "a": 1}}, {"q": "Ph\u00e1t ki\u1ebfn n\u00e0o c\u1ee7a C. M\u00e1c v\u00e0 \u0102ngghen l\u00e0 s\u1ef1 kh\u1eb3ng \u0111\u1ecbnh v\u1ec1 m\u1eb7t kinh t\u1ebf s\u1ef1 di\u1ec7t vong kh\u00f4ng tr\u00e1nh kh\u1ecfi c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 s\u1ef1 ra \u0111\u1eddi t\u1ea5t y\u1ebfu c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i?", "o": ["H\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0", "Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed", "H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "T\u1ec9nh hai m\u1eb7t c\u1ee7a lao \u0111\u1ed9ng s\u1ea3n xu\u1ea5t h\u00e0ng h\u00f3a"], "a": 0, "e": {"p": 18, "t": "\u00c0ngghen \u0111i s\u00e2u nghi\u00ean c\u1ee9u n\u1ec1n s\u1ea3n xu\u1ea5t c\u00f4ng nghi\u1ec7p v\u00e0 n\u1ec1n kinh t\u1ebf t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u00e3 vi\u1ebft b\u1ed9 T\u01b0 b\u1ea3n, m\u00e0 gi\u00e1 tr\u1ecb c\u1ed1t l\u00f5i l\u00e0 \u201cH\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0\u201d - ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i th\u1ee9 hai c\u1ee7a c. \u0102ngghen l\u00e0 s\u1ef1 kh\u1eb3ng \u0111\u1ecbnh v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf s\u1ef1 di\u1ec7t vong kh\u00f4ng"}}, {"q": "-Ph\u00e2n t\u00edch nh\u1eefng t\u01b0 li\u1ec7u th\u1ef1c ti\u1ec5n c\u1ee7a l\u1ecbch s\u1eed \u0111\u1ec3 r\u00fat ra nh\u1eefng nh\u1eadn \u0111\u1ecbnh, nh\u1eefrog kh\u00e1i qu\u00e1t v\u1ec1 l\u00fd lu\u1eadn c\u00f3 k\u1ebft c\u1ea5u ch\u1eb7t ch\u1ebd, khoa h\u1ecdc\u201d l\u00e0 n\u1ed9i dung c\u1ee7a ph\u01b0\u01a1ng ph\u00e1p nghi\u00ean c\u1ee9u n\u00e0o trong m\u00f4n Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc?", "o": ["Ph\u01b0\u01a1ng ph\u00e1p so s\u00e1nh", "Ph\u01b0\u01a1ng ph\u00e1p kh\u1ea3o s\u00e1t v\u00e0 ph\u00e2n t\u00edch ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "Ph\u01b0\u01a1ng ph\u00e1p k\u1ebft h\u1ee3p l\u1ecbch s\u1eed v\u00e0 logic", "Ph\u01b0\u01a1ng ph\u00e1p \u0111i\u1ec1u tra x\u00e3 h\u1ed9i h\u1ecdc"], "a": 2, "e": {"p": 42, "t": "Ph\u1ea3i tr\u00ean c\u01a1 s\u1edf nh\u1eefng t\u01b0 li\u1ec7u th\u1ef1c ti\u1ec5n c\u1ee7a c\u00e1c s\u1ef1 th\u1eadt l\u1ecbch s\u1eed m\u00e0 ph\u00e2n t\u00edch \u0111\u1ec3 r\u00fat ra nh\u1eefng nh\u1eadn \u0111\u1ecbnh, nh\u1eefng kh\u00e1i qu\u00e1t v\u1ec1 l\u00fd lu\u1eadn c\u00f3 k\u1ebft c\u1ea5u ch\u1eb7t ch\u1ebd, khoa h\u1ecdc - t\u1ee9c l\u00e0 r\u00fat ra \u0111\u01b0\u1ee3c l\u00f4g\u00edc c\u1ee7a l\u1ecbch s\u1eed, kh\u00f4ng d\u1eebng l\u1ea1i \u1edf s\u1ef1 li\u1ec7t k\u00ea s\u1ef1 th\u1eadt l\u1ecbch s\u1eed.", "a": 1}}, {"q": "Ph\u00e1t ki\u1ebfn n\u00e0o c\u1ee7a C. M\u00e1c v\u00e0 \u0102ngghen \u0111\u00e3 kh\u1eafc ph\u1ee5c m\u1ed9t c\u00e1ch tri\u1ec7t \u0111\u1ec3 nh\u1eefng h\u1ea1n ch\u1ebf c\u00f3 t\u00ednh l\u1ecbch s\u1eed c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u2013 kh\u00f4ng t\u01b0\u1edfng?", "o": ["Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed", "H\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0", "H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "T\u1ec9nh hai m\u1eb7t c\u1ee7a lao \u0111\u1ed9ng s\u1ea3n xu\u1ea5t h\u00e0ng h\u00f3a"], "a": 2, "e": {"p": 19, "t": "V\u1ed1i ph\u00e1t ki\u1ebfn th\u1ee9 ba, nh\u1eefng h\u1ea1n ch\u1ebf c\u00f3 t\u00ednh l\u1ecbch s\u1eed c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng - ph\u00ea ph\u00e1n \u0111\u00e3 \u0111\u01b0\u1ee3c kh\u1eafc ph\u1ee5c m\u1ed9t c\u00e1ch tri\u1ec7t \u0111\u1ec3;"}}, {"q": "Ba ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i c\u1ee7a C. M\u00e1c v\u00e0 Ph. Angghen l\u00e0:", "o": ["Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed, H\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0 v\u00e0 H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "Ch\u1ee7 ngh\u0129a duy v\u1eadt bi\u1ec7n ch\u1ee9ng. H\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb - lao \u0111\u1ed9ng v\u00e0 H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed, H\u1ecdc thuy\u1ebft v\u1ec1 ch\u1ee7 ngh\u0129a \u0111\u1ebf qu\u1ed1c \u2013 giai \u0111o\u1ea1n t\u1ed9t c\u00f9ng c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 H\u1ecdc thuy\u1ebft v\u1ec1 s\u1eed m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng \u0645\u0642\u062f\u0644\u0645", "Ch\u1ee7 ngh\u0129a duy v\u1eadt bi\u1ec7n ch\u1ee9ng, H\u1ecdc thuy\u1ebft v\u1ec1 ch\u1ee7 ngh\u0129a \u0111\u1ebf qu\u1ed1c \u2013 giai \u0111o\u1ea1n t\u1ed9t a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p"], "a": 0, "e": {"p": 19, "t": "- H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Tr\u00ean c\u01a1 s\u1edf hai ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i l\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 h\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0, c. \u0102ngghen \u0111\u00e3 c\u00f3 ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i th\u1ee9 ba - ph\u00e1t hi\u1ec7n ra s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p c\u00f3 s\u1ee9 m\u1ec7nh th\u1ee7 ti\u00eau ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng\u2026", "a": 1}}, {"q": "S\u1ef1 ki\u1ec7n n\u00e0o \u0111\u00e1nh d\u1ea5u s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1eeb ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc th\u00e0nh ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i hi\u1ec7n th\u1ef1c?", "o": ["T\u00e1c ph\u1ea9m Tuy\u00ean ng\u00f4n \u0110\u1ea3ng c\u1ed9ng s\u1ea3n \u0111\u01b0\u1ee3c xu\u1ea5t b\u1ea3n l\u1ea7n \u0111\u1ea7u ti\u00ean, 1848", "S\u1ef1 ra \u0111\u1eddi c\u1ee7a Nh\u00e0 n\u01b0\u1edbc X\u00f4 Vi\u1ebft, 1917", "H\u1ed9i Li\u00ean hi\u1ec7p c\u00f4ng nh\u00e2n qu\u1ed1c t\u1ebf (Qu\u1ed1c t\u1ebf 1) \u0111\u01b0\u1ee3c th\u00e0nh l\u1eadp, 1864", "S\u1ef1 th\u00e0nh l\u1eadp c\u1ee7a Qu\u1ed1c t\u1ebf C\u1ed9ng s\u1ea3n III, 1919"], "a": 1, "e": {"p": 25, "t": "L\u00eanin l\u00e0 x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1 u1ec7n d\u00e2n ch\u1ee7, c\u00f4ng b\u1eb1ng, b\u00ecnh \u0111\u1eb3ng\u2026", "a": 1}}, {"q": "T\u1eadp trung x\u00e2y d\u1ef1ng h\u1ec7 gi\u00e1 tr\u1ecb m\u1edbi Lao \u0111\u1ed9ng, c\u00f4ng b\u1eb1ng, d\u00e2n ch\u1ee7, b\u00ecnh \u0111\u1eb3ng v\u00e0 t\u1ef1 do - l\u00e0 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n thu\u1ed9c n\u1ed9i dung:", "o": ["Qu\u1ed1c ph\u00f2ng, an ninh", "Kinh t\u1ebf", "Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "V\u0103n h\u00f3a, t\u01b0 t\u01b0\u1edfng"], "a": 2, "e": {"p": 58, "t": "Th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a m\u00ecnh, giai c\u1ea5p c\u00f4ng nh\u00e2n trong ti\u1ebfn tr\u00ecnh c\u00e1ch m\u1ea1ng c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i c\u0169 v\u00e0 x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i m\u1ed1i tr\u00ean l\u0129nh v\u1ef1c v\u0103n h\u00f3a, t\u01b0 t\u01b0\u1edfng c\u1ea7n ph\u1ea3i t\u1eadp trung x\u00e2y d\u1ef1ng h\u1ec7 gi\u00e1 tr\u1ecb m\u1edbi: b\u00ecnh \u0111\u1eb3ng v\u00e0 t\u1ef1 do.", "a": 1}}, {"q": "Giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua con \u0111\u01b0\u1eddng n\u00e0o \u0111\u1ec3 gi\u1ea3i ph\u00f3ng m\u00ecnhv\u00e0 gi\u1ea3i ph\u00f3ng nh\u00e2n d\u00e2n lao \u0111\u1ed9ng.", "o": ["B\u00e0i c\u00f4ng", "\u0110\u1ea5u tranh ngh\u1ecb vi\u1ec7n", "Bi\u1ec3u t\u00ecnh", "C\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a"], "a": 3, "e": null}, {"q": "\u0110i\u1ec1u ki\u1ec7n kh\u00e1ch quan quy \u0111\u1ecbnh s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0:", "o": ["\u0111\u1ea3ng cs l\u00e3nh \u0111\u1ea1o", "\u0110\u1ecba v\u1ecb kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 \u0111\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "B\u1ea3n th\u00e2n giai c\u1ea5p c\u00f4ng nh\u00e2n ph\u00e1t tr\u1ec3n v\u1ec1 s\u1ed1 l\u01b0\u1ee3ng v\u00e0 ch\u1ea5t l\u01b0\u1ee3ng", "Giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 \u0111\u1ed3ng minh t\u1ef1 nhi\u00ean l\u00e0 giai c\u1ea5p n\u00f4ng d\u00e2n"], "a": 1, "e": {"p": 59, "t": "\u0110i\u1ec1u ki\u1ec7n kh\u00e1ch quan quy \u0111\u1ecbnh s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n bao g\u1ed3m: Th\u1ee9 nh\u1ea5t, do \u0111\u1ecba v\u1ecb kinh t\u1ebf c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n."}}, {"q": "Nh\u00e2n t\u1ed1 ch\u1ee7 quan ti\u00ean quy\u1ebft \u0111\u1ec3 giai c\u1ea5p c\u00f4ng nh\u00e2n th\u1ef1c hi\u1ec7n th\u00e0nh c\u00f4ng s\u1eed m\u1ec7nh l\u1ecbch s\u1eed l\u00e0", "o": ["\u0111\u1ea3ng C\u1ed9ng s\u1ea3n L\u0129nh \u0111\u1ea1o", "\u0110\u1ecba v\u1ecb kinh t\u1ebf - x\u00e3 h\u1ed9i quy \u0111\u1ecbnh", "\u0110\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i quy \u0111\u1ecbnh", "Giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 \u0111\u1ed3ng minh t\u1ef1 nhi\u00ean l\u00e0 giai c\u1ea5p n\u00f4ng d\u00e2n"], "a": 0, "e": {"p": 62, "t": "- \u0110\u1ea3ng C\u1ed9ng s\u1ea3n l\u00e0 nh\u00e2n t\u1ed1 ch\u1ee7 quan quan tr\u1ecdng nh\u1ea5t \u0111\u1ec3 giai c\u1ea5p c\u00f4ng nh\u00e2n th\u1ef1c hi\u1ec7n th\u1eafng l\u1ee3i s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a m\u00ecnh. \u0110\u1ea3ng C\u1ed9ng s\u1ea3n - \u0111\u1ed9i ti\u00ean phong c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n ra \u0111\u1eddi v\u00e0 \u0111\u1ea3m nh\u1eadn vai tr\u00f2 l\u00e3nh \u0111\u1ea1o cu\u1ed9c c\u00e1ch m\u1ea1ng", "a": 1}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang \u0111i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng: \"Giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 m\u1ed9t t\u1eadp \u0111o\u00e0n x\u00e3 h\u1ed9i \u1ed5n \u0111\u1ecbnh, h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n c\u00f9ng v\u1edbi qu\u00e1 tr\u00ecnh c\u1ee7a n\u1ec1n c\u00f4ng nghi\u1ec7p hi\u1ec7n \u0111\u1ea1i, v\u1edbi nh\u1ecbp \u0111\u1ed9 ph\u00e1t tri\u1ec3n c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t c\u00f3 t\u00ednh ch\u1ea5t [....] ng\u00e0y c\u00e0ng cao\"", "o": ["B\u1ea7n c\u00f9ng h\u00f3a, chuy\u00ean m\u00f4n h\u00f3a", "T\u01b0 nh\u00e2n h\u00f3a, tr\u00ed th\u1ee9 ba", "Qu\u1ed1c h\u1eefu h\u00f3a, tri th\u1ee9c h\u00f3a", "X\u00e3 h\u1ed9i h\u00f3a, tr\u00ed tu\u1ec7 h\u00f3a"], "a": 3, "e": null}, {"q": "\u0110\u1ed1i di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n. c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0", "o": ["T\u1ef1 do ph\u00e2n ph\u1ed1i s\u1ea3n ph\u1ea9m l\u00e0m ra", "T\u1ef1 do s\u1eed d\u1ee5ng m\u00e1y m\u00f3c thi\u1ebft b\u1ecb", "T\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng", "T\u1ef1 do ph\u00e2n b\u1ed1 l\u1ee3i \u00edch kinh t\u1ebf"], "a": 2, "e": {"p": 53, "t": "\u0110\u1ed1\u00ec di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n, c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0 t\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng.", "a": 1}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang \u0111i\u1ec1n v\u00e0o ch\u1ed7 tr\u1ed1ng. \u201cT\u1ea5t c\u1ea3 c\u00e1c giai c\u1ea5p kh\u00e1c \u0111\u1ec1u xuy t\u00e0n v\u00e0 ti\u00eau vong c\u00f9ng v\u1edbi s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, c\u00f2n giai c\u1ea5p v\u00f4 s\u1ea3n l\u1ea1i l\u00e0|\u2014c\u1ee7a b\u1ea3n th\u00e2n n\u1eeda \u0111\u1ea1i c\u00f4ng nghi\u1ec7p\" (C.M\u00e1c & Ph.Angghen, 1848);", "o": ["Ch\u00f9 the", "S\u1ea3n ph\u1ea9m", "L\u1ef1c l\u01b0\u1ee3ng", "S\u1ef1 ph\u00e1t tri\u1ec3n"], "a": 1, "e": {"p": 52, "t": "\u201cc\u00e1c giai c\u1ea5p kh\u00e1c \u0111\u1ec1u suy t\u00e0n v\u00e0 ti\u00eau vong c\u00f9ng v\u1edbi s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, c\u00f2n giai c\u1ea5p v\u00f4 s\u1ea3n l\u1ea1i l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a b\u1ea3n th\u00e2n n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p\u201d2 v\u00e0 \u201cc\u00f4ng nh\u00e2n c\u0169ng l\u00e0 m\u1ed9t ph\u00e1t minh c\u1ee7a th\u1eddi \u0111\u1ea1i m\u1ed1i, gi\u1ed1ng nh\u01b0 m\u00e1y m\u00f3c v\u1eady...", "a": 1}}, {"q": "\"Giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng kh\u00f4ng c\u00f3 s\u1edf h\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i, ph\u1ea3i b\u00e1n s\u1ee9c lao \u0111\u1ed9ng cho nh\u00e0 t\u01b0 b\u1ea3n v\u00e0 b\u1ecb ch\u1ee7 t\u01b0 b\u1ea3n b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0\". \u0110\u00e2y l\u00e0 n\u1ed9i dung thu\u1ed9c ph\u01b0\u01a1ng di\u1ec7n n\u00e0o trong bai ph\u01b0\u01a1ng di\u1ec7n x\u00e1c \u0111\u1ecbnh giai c\u1ea5p c\u00f4ng nh\u00e2n", "o": ["Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "Kinh t\u1ebf - x\u00e3 h\u1ed9i", "V\u0103n h\u00f3a x\u00e3 h\u1ed9i", "C\u01a1 c\u1ea5u x\u00e3 b\u1ed9i \u2013 giai c\u1ea5p"], "a": 0, "e": {"p": 53, "t": "H\u1ecd ph\u1ea3i b\u00e1n s\u1ee9c lao \u0111\u1ed9ng cho nh\u00e0 t\u01b0 b\u1ea3n v\u00e0 b\u1ecb ch\u1ee7 t\u01b0 b\u1ea3n b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0. \u0110\u1ed1\u00ec di\u1ec7n v\u1edbi nh\u00e0 t\u01b0 b\u1ea3n, c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng t\u1ef1 do, v\u1edbi ngh\u0129a l\u00e0 t\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a m\u00ecnh \u0111\u1ec3 ki\u1ebfm s\u1ed1ng.", "a": 1}}, {"q": "M\u00f4 t\u1ea3 qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, C. M\u00e1c v\u00e0 Ph. \u0102ngghen ch\u1ec9 r\u00f5: \u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ...", "o": ["Ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c", "Thu\u00ea t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t c\u1ee7a giai c\u1ea5p t\u01b0 s\u1ea3n", "Th\u1ee5c \u0111\u1ea5t \u0111ai c\u1ee7a \u0111\u1ecba ch\u1ee7", "\u0110\u00f3ng g\u00f3p t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t"], "a": 0, "e": {"p": 52, "t": "\u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d1. \u0102ngghen, c\u00f4ng nh\u00e2n c\u00f4ng nghi\u1ec7p c\u00f4ng x\u01b0\u1ecfng l\u00e0 b\u1ed9 ph\u1eadn ti\u00eau bi\u1ec3u cho giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i.", "a": 1}}, {"q": "\u201cS\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t ng\u00e0y c\u00e0ng nhi\u1ec1u, \u0111\u00e1p \u1ee9ng nhu c\u1ea7u ng\u00e0y c\u00e0ng t\u1ea3ng c\u1ee7a con ng\u01b0\u1eddi v\u00e0 x\u00e3 h\u1ed9i, t\u1eeb \u0111\u00f3 t\u1ea1o ti\u1ec1n \u0111\u1ec1 v\u1eadt ch\u1ea5t \u2013 k\u1ef9 thu\u1eadt cho s\u1ef1 ra \u0111\u1eddi c\u1ee7a x\u00e3 h\u1ed9i m\u1edbi \u2014 l\u00e0 s\u1eed m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n thu\u1ed9c n\u1ed9i dung:", "o": ["Kinh t\u1ebf", "Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "Qu\u1ed1c ph\u00f2ng an ninh", "V\u0103n h\u00f3a, t\u01b0 t\u01b0\u1edfng"], "a": 0, "e": {"p": 56, "t": "L\u00e0 nh\u00e2n t\u1ed1 h\u00e0ng \u0111\u1ea7u c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t x\u00e3 h\u1ed9i h\u00f3a cao, giai c\u1ea5p c\u00f4ng nh\u00e2n c\u0169ng l\u00e0 \u0111\u1ea1i bi\u1ec3u cho quan h\u1ec7 s\u1ea3n xu\u1ea5t m\u1edbi, s\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t ng\u00e0y c\u00e0ng nhi\u1ec1u \u0111\u00e1p \u1ee9ng nhu c\u1ea7u ng\u00e0y c\u00e0ng t\u0103ng c\u1ee7a con ng\u01b0\u1eddi v\u00e0 x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "D\u1ef1a v\u00e0o y\u1ebfu t\u1ed1 n\u00e0o m\u00e0 ghi c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng t\u00ednh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p\u201d", "o": ["T\u1ef1 do ph\u00e2n ph\u1ed1i s\u1ea3n ph\u1ea9m l\u00e0m ra", "B\u1ea3n th\u00e2n h\u1ecd t\u1ef1 c\u00f3", "T\u1ef1 do b\u00e1n s\u1ee9c lao \u0111\u1ed9ng", "N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn"], "a": 3, "e": {"p": 55, "t": "- N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn \u0111\u00e3 r\u00e8n luy\u1ec7n cho giai c\u1ea5p c\u00f4ng nh\u00e2n nh\u1eefng ph\u1ea9m ch\u1ea5t \u0111\u1eb7c bi\u1ec7t v\u1ec1 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng, tinh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p. \u0110\u00f3 l\u00e0 m\u1ed9t giai c\u1ea5p c\u00e1ch m\u1ea1ng v\u00e0 c\u00f3 tinh th\u1ea7n c\u00e1ch m\u1ea1ng tri\u1ec7t \u0111\u1ec3.", "a": 1}}, {"q": "Theo C. M\u00e1c v\u00e0 Ph.\u0102ngghen, hai ph\u01b0\u01a1ng di\u1ec7n c\u01a1 b\u1ea3n x\u00e1c \u0111\u1ecbnh giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0:", "o": ["Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u00e0 V\u0103n h\u00f3a - x\u00e3 h\u1ed9i", "Kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 V\u0103n h\u00f3a \u2013 x\u00e3 h\u1ed9i", "Kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u00e0 C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p"], "a": 2, "e": null}, {"q": "\u201cGiai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 nh\u1eefng ng\u01b0\u1eddi tr\u1ef1c ti\u1ebfp ho\u1eb7c gi\u00e1n ti\u1ebfp v\u1eadn h\u00e0nh c\u00e1c c\u00f4ng c\u1ee5 s\u1ea3n xu\u1ea5t c\u00f3 t\u00ednh ch\u1ea5t c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng hi\u1ec7n \u0111\u1ea1i v\u00e0 x\u00e3 h\u1ed9i h\u00f3a cao\u201d. \u0110\u00e2y l\u00e0 n\u1ed9i dung thu\u1ed9c ph\u01b0\u01a1ng di\u1ec7n n\u00e0o trong hai ph\u01b0\u01a1ng di\u1ec7n x\u00e1c \u0111\u t thu\u1ed9c \u0111\u1ecbatri\u1ec3n th\u00e0nh ch\u1ee7 ngh\u0129a", "T\u00edch l\u0169y nguy\u00ean th\u1ee7y c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n"], "a": 2, "e": {"p": 201, "t": "Xu h\u01b0\u1edbng th\u1ee9 hai, c\u1ea5c d\u00e2n t\u1ed9c trong t\u1eebng qu\u1ed1c gia, th\u1eadm ch\u00ed c\u00e1c d\u00e2n t\u1ed9c \u1edf nhi\u1ec1u qu\u1ed1c gia mu\u00f4n li\u00ean hi\u1ec7p l\u1ea1i v\u1edbi nhau. Xu h\u01b0\u1edbng n\u00e0y n\u1ed5i l\u00ean trong giai \u0111o\u1ea1n ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n \u0111\u00e3 ph\u00e1t tri\u1ec3n th\u00e0nh ch\u1ee7 ngh\u0129a \u0111\u1ebf qu\u1ed1c \u0111i b\u00f3c l\u1ed9t thu\u1ed9c \u0111\u1ecba;", "a": 1}}], "qa": [{"q": "Ai l\u00e0 ng\u01b0\u1eddi cho r\u1eb1ng: m\u1eb7c d\u00f9 trong giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n, c\u01a1 quan \u0111\u1eb7c bi\u1ec7t, b\u1ed9 m\u00e1y tr\u1ea5n \u00e1p \u0111\u1eb7c bi\u1ec7t l\u00e0 nh\u00e0 n\u01b0\u1edbc v\u1eabn c\u00f2n c\u1ea7n thi\u1ebft, nh\u01b0ng n\u00f3 \u0111\u00e3 l\u00e0 nh\u00e0 n\u01b0\u1edbc qu\u00e1 \u0111\u1ed9, m\u00e0 kh\u00f4ng c\u00f2n nh\u00e0 n\u01b0\u1edbc theo nguy\u00ean ngh\u0129a c\u1ee7a n\u00f3 n\u1eefa?", "a": "V.I.L\u00eanin", "e": {"p": 145, "t": "giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n, \u201cC\u01a1 quan \u0111\u1eb7c bi\u1ec7t, b\u1ed9 m\u00e1y tr\u1ea5n \u00e1p \u0111\u1eb7c bi\u1ec7t l\u00e0 \u201cnh\u00e0 n\u01b0\u1edbc\u201d v\u1eabn c\u00f2n c\u1ea7n thi\u1ebft, nh\u01b0ng n\u00f3 \u0111\u00e3 l\u00e0 nh\u00e0 n\u01b0\u1edbc qu\u00e1 \u0111\u1ed9, m\u00e0 kh\u00f4ng c\u00f2n l\u00e0 nh\u00e0 n\u01b0\u1edbc theo \u0111\u00fang ngh\u0129a c\u1ee7a n\u00f3 n\u1eefa\u201d1. V.L L\u00eanin cho r\u1eb1ng, giai c\u1ea5p v\u00f4 s\u1ea3n sau khi gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n, x\u00e1c l\u1eadp \u0111\u1ecba v\u1ecb th\u1ed1ng tr\u1ecb cho \u0111\u1ea1i \u0111a s\u1ed1 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng, th\u00ec v\u1ea5n \u0111\u1ec1 quan tr\u1ecdng kh\u00f4ng ch\u1ec9 l\u00e0 tr\u1ea5n \u00e1p l\u1ea1i s\u1ef1\u2026", "a": 1}}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u00e3 \u0111\u01b0a ra ch\u1ee7 tr\u01b0\u01a1ng thi\u1ebft l\u1eadp n\u1ec1n \"Chuy\u00ean ch\u00ednh c\u00e1ch m\u1ea1ng c\u1ee7a nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng\"?", "a": "Gr\u1eafcc\u01a1 Bab\u1edbp", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u00e3 n\u00eau ra \"Tuy\u00ean ng\u00f4n c\u1ee7a nh\u1eefng ng\u01b0\u1eddi b\u00ecnh d\u00e2n\"?", "a": "Gr\u1eafcc\u01a1 Bab\u1edbp", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u1eb7t n\u1ec1n m\u00f3ng cho l\u00fd lu\u1eadn li\u00ean minh c\u00f4ng- n\u00f4ng", "a": "C.M\u00e1c v\u00e0 Ph.\u0102ngghen", "e": {"p": 172, "t": "\u00c0ngghen \u0111\u00e3 n\u00eau ra nhi\u1ec1u l\u00fd lu\u1eadn n\u1ec1n t\u1ea3ng \u0111\u1ecbnh h\u01b0\u1edbng cho cu\u1ed9c \u0111\u1ea5u tranh c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111i \u0111\u1ebfn th\u1eafng l\u1ee3i, trong \u0111\u00f3 l\u00fd lu\u1eadn v\u1ec1 li\u00ean minh c\u00f4ng, n\u00f4ng v\u00e0 c\u00e1c t\u1ea7ng l\u1ed1p lao \u0111\u1ed9ng kh\u00e1c \u0111\u00e3 \u0111\u01b0\u1ee3c c\u00e1c \u00f4ng kh\u00e1i qu\u00e1t th\u00e0nh v\u1ea5n \u0111\u1ec1 mang t\u00ednh nguy\u00ean t\u1eafc.", "a": 1}}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u1eb7t v\u1ea5n \u0111\u1ec1 \u0111\u1ea5u tranh cho ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u1edbi t\u00ednh c\u00e1ch l\u00e0 m\u1ed9t phong tr\u00e0o th\u1ef1c ti\u1ec5n (Phong tr\u00e0o hi\u1ec7n th\u1ef1c)", "a": "Gr\u1eafcc\u01a1 Bab\u1edbp", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi n\u00eau ra lu\u1eadn \u0111i\u1ec3m: Trong n\u1ec1n kinh t\u1ebf t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \"s\u1ef1 ngh\u00e8o kh\u1ed5 \u0111\u01b0\u1ee3c sinh ra t\u1eeb ch\u00ednh s\u1ef1 th\u1eeba th\u00e3i\".", "a": "S\u00e1cl\u01a1 Phuri\u00ea", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi n\u00eau ra quan \u0111i\u1ec3m: \"D\u00e2n vi qu\u00fd, x\u00e3 t\u1eafc th\u1ee9 chi, qu\u00e2n vi khinh\" (D\u00e2n l\u00e0 tr\u1ecdng h\u01a1n c\u1ea3, x\u00e3 t\u1eafc \u0111\u1ee9ng \u0111\u1eb1ng sau, vua c\u00f2n nh\u1eb9 h\u01a1n\"?", "a": "M\u1ea1nh T\u1eed", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng- ph\u00ea ph\u00e1n", "a": ". C\u1ea3 3 t\u00e1c gi\u1ea3", "e": {"p": 16, "t": "Ch\u00ednh v\u00ec nh\u1eefng h\u1ea1n ch\u1ebf \u1ea5y, m\u00e0 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng ph\u00ea ph\u00e1n ch\u1ec9 d\u1eebng l\u1ea1i \u1edf m\u1ee9c \u0111\u1ed9 m\u1ed9t h\u1ecdc thuy\u1ebft x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a kh\u00f4ng t\u01b0\u1edfng - ph\u00ea ph\u00e1n. Song v\u01b0\u1ee3t l\u00ean t\u1ea5 t c\u1ea3, nh\u1eefng gi\u00e1 tr\u1ecb khoa h\u1ecdc, c\u1ed1ng hi\u1ebfn c\u1ee7a c\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng \u0111\u00e3 t\u1ea1o ra ti\u1ec1n \u0111\u1ec1 t\u01b0 t\u01b0\u1edfng - l\u00fd lu\u1eadn, \u0111\u1ec3 c.", "a": 1}}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi vi\u1ebft t\u00e1c ph\u1ea9m \"Kh\u00f4ng t\u01b0\u1edfng\" (Ut\u00f4pi)?", "a": "T\u00f4m\u00e1t Mor\u01a1", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u01b0a ra kh\u1ea9u hi\u1ec7u: V\u00f4 s\u1ea3n t\u1ea5t c\u1ea3 c\u00e1c n\u01b0\u1edbc v\u00e0 c\u00e1c d\u00e2n t\u1ed9c b\u1ecb \u00e1p b\u1ee9c, \u0111o\u00e0n k\u1ebft l\u1ea1i!", "a": "V.I.L\u00eanin", "e": {"p": 102, "t": "\u0110\u00f3 c\u0169ng l\u00e0 c\u01a1 s\u1edf \u0111\u1ec3 Ng\u01b0\u1eddi \u0111\u01b0a ra kh\u1ea9u hi\u1ec7u: \u201cV\u00f4 s\u1ea3n t\u1ea5t c\u1ea3 c\u00e1c n\u01b0\u1edbc v\u00e0 c\u00e1c d\u00e2n t\u1ed9c b\u1ecb \u00e1p b\u1ee9c, \u0111o\u00e0n k\u1ebft l\u1ea1i!\u201d3.", "a": 1}}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u01b0\u1ee3c Ph.\u0102ngghen nh\u1eadn x\u00e9t \"M\u1ecdi phong tr\u00e0o x\u00e3 h\u1ed9i, m\u1ecdi th\u00e0nh t\u1ef1u th\u1ef1c s\u1ef1 \u0111\u00e3 di\u1ec5n ra \u1edf Anh v\u00ec l\u1ee3i \u00edch c\u1ee7a c\u00f4ng nh\u00e2n \u0111\u1ec1u g\u1eafn v\u1edbi t\u00ean tu\u1ed5i c\u1ee7a \u00f4ng\" \u00f4ng l\u00e0 ai?", "a": "\u00d4oen", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u01b0\u1ee3c Ph.\u0102ngghen nh\u1eadn x\u00e9t l\u00e0 \"c\u00f3 t\u1ea7m m\u1eaft r\u1ed9ng thi\u00ean t\u00e0i\"?", "a": "Phurie", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u01b0\u1ee3c Ph.\u0102ngghen \u0111\u00e1nh gi\u00e1 l\u00e0 \"n\u1eafm ph\u00e9p bi\u1ec7n ch\u1ee9ng m\u1ed9t c\u00e1ch c\u0169ng t\u00e0i t\u00ecnh nh\u01b0 H\u00eaghen l\u00e0 ng\u01b0\u1eddi \u0111\u01b0\u01a1ng th\u1eddi v\u1edbi \u00f4ng?", "a": "Phuri\u00ea", "e": null}, {"q": "Ai trong s\u1ed1 nh\u1eefng ng\u01b0\u1eddi sau \u0111\u00e2y \u0111\u01b0\u1ee3c C\u00e1c M\u00e1c coi l\u00e0 nh\u00e0 t\u01b0 t\u01b0\u1edfng v\u0129 \u0111\u1ea1i nh\u1ea5t th\u1eddi c\u1ed5 \u0111\u1ea1i?", "a": "Aristote", "e": null}, {"q": "Ai \u0111\u00e3 cho r\u1eb1ng: \u201cQuan h\u1ec7 th\u1ee9 ba tham d\u1ef1 ngay t\u1eeb \u0111\u1ea7u v\u00e0o qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n l\u1ecbch s\u1eed: h\u00e0ng ng\u00e0y t\u00e1i t\u1ea1o ra \u0111\u1eddi s\u1ed1ng c\u1ee7a b\u1ea3n th\u00e2n m\u00ecnh, con ng\u01b0\u1eddi b\u1eaft \u0111\u1ea7u t\u1ea1o ra nh\u1eefng ng\u01b0\u1eddi kh\u00e1c, sinh s\u00f4i, n\u1ea3y n\u1edf - \u0111\u00f3 l\u00e0 quan h\u1ec7 gi\u1eefa ch\u1ed1ng v\u00e0 v\u1ee3, cha m\u1eb9 v\u00e0 con c\u00e1i, \u0111\u00f3 l\u00e0 gia \u0111\u00ecnh\u201d?", "a": "C. M\u00e1c v\u00e0 Ph. \u0102ngghen.", "e": {"p": 239, "t": "h\u1eb1ng ng\u00e0y t\u00e1i t\u1ea1o ra \u0111\u1eddi s\u1ed1ng c\u1ee7a b\u1ea3n th\u00e2n m\u00ecnh, con ng\u01b0\u1eddi b\u1eaft \u0111\u1ea7u t\u1ea1o ra nh\u1eefng ng\u01b0\u1eddi kh\u00e1c, sinh s\u00f4i n\u1ea9y n\u1edf - \u0111\u00f3 l\u00e0 quan h\u1ec7 gi\u1eefa ch\u1ed3ng v\u00e0 v\u1ee3, cha m\u1eb9 v\u00e0 con c\u00e1i, \u0111\u00f3 l\u00e0 gia \u0111\u00ecnh\u201d1.", "a": 1}}, {"q": "Ai \u0111\u00e3 d\u1ef1 b\u00e1o s\u1ef1 xu\u1ea5t hi\u1ec7n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf- x\u00e3 h\u1ed9i CSCN \u1edf c\u00e1c n\u01b0\u1edbc t\u01b0 b\u1ea3n c\u00f3 tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n trung b\u00ecnh v\u00e0 nh\u1eefng n\u01b0\u1edbc thu\u1ed9c \u0111\u1ecba sau khi \u0111\u01b0\u1ee3c gi\u1ea3i ph\u00f3ng do giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e3nh \u0111\u1ea1o", "a": "V.I.L\u00eanin", "e": null}, {"q": "Ai \u0111\u00e3 d\u1ef1 b\u00e1o s\u1ef1 xu\u1ea5t hi\u1ec7n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf- x\u00e3 h\u1ed9i CSCN t\u1eeb nh\u1eefng n\u01b0\u1edbc t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a ph\u00e1t tri\u1ec3n", "a": "C.M\u00e1c v\u00e0 Ph.\u0102ngghen", "e": null}, {"q": "Ai \u0111\u00e3 n\u00eau ra t\u01b0 t\u01b0\u1edfng: tr\u00ecnh \u0111\u1ed9 gi\u1ea3i ph\u00f3ng x\u00e3 h\u1ed9i \u0111\u01b0\u1ee3c \u0111o b\u1eb1ng tr\u00ecnh \u0111\u1ed9 gi\u1ea3i ph\u00f3ng ph\u1ee5 n\u1eef?", "a": "S\u00e1cl\u01a1 Phuri\u00ea", "e": null}, {"q": "Ai \u0111\u00e3 vi\u1ebft t\u00e1c ph\u1ea9m \"Nh\u1eefng di ch\u00fac c\u1ee7a t\u00f4i\"?", "a": "Gi\u0103ng M\u00eali\u00ea", "e": null}, {"q": "Ai \u0111\u00e3 \u0111\u01b0a ra nh\u1eadn x\u00e9t: \u201cCh\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng kh\u00f4ng th\u1ec3 v\u1ea1ch ra \u0111\u01b0\u1ee3c l\u1ed1i tho\u00e1t th\u1ef1c s\u1ef1\u201d?", "a": "V.L\u00eanin", "e": {"p": 15, "t": "L\u00eanin \u0111\u00e3 nh\u1eadn x\u00e9t: Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng kh\u00f4ng th\u1ec3 v\u1ea1ch ra \u0111\u01b0\u1ee3c l\u1ed1i tho\u00e1t th\u1ef1c s\u1ef1.", "a": 1}}, {"q": "Ai \u0111\u00e3 \u0111\u01b0a ra quan ni\u1ec7m \"CNXH l\u00e0 s\u1ef1 ph\u1ea3n kh\u00e1ng v\u00e0 \u0111\u1ea5u tranh ch\u1ed1ng s\u1ef1 b\u00f3c l\u1ed9t ng\u01b0\u1eddi lao \u0111\u1ed9ng, m\u1ed9t cu\u1ed9c \u0111\u1ea5u tranh nh\u1eb1m ho\u00e0n to\u00e0n xo\u00e1 b\u1ecf s\u1ef1 b\u00f3c l\u1ed9t\"", "a": "V.I.L\u00eanin", "e": null}, {"q": "Ai \u0111\u01b0a ra nh\u1eadn \u0111\u1ecbnh \u201c\u2026nhi\u1ec1u gia \u0111\u00ecnh c\u1ed9ng l\u1ea1i m\u1edbi th\u00e0nh x\u00e3 h\u1ed9i, x\u00e3 h\u1ed9i t\u1ed1t th\u00ec gia \u0111\u00ecnh c\u00e0ng t\u1ed1t, gia \u0111\u00ecnh t\u1ed1t th\u00ec x\u00e3 h\u1ed9i m\u1edbi t\u1ed1t. H\u1ea1t nh\u00e2n c\u1ee7a x\u00e3 h\u1ed9i ch\u00ednh l\u00e0 gia \u0111\u00ecnh\u201d ?", "a": "H\u1ed3 Ch\u00ed Minh", "e": {"p": 241, "t": "nhi\u1ec1u gia \u0111\u00ecnh c\u1ed9ng l\u1ea1i m\u1edbi th\u00e0nh x\u00e3 h\u1ed9i, x\u00e3 h\u1ed9i t\u1ed1t th\u00ec gia \u0111\u00ecnh c\u00e0ng t\u1ed1t, gia \u0111\u00ecnh t\u1ed1t th\u00ec x\u00e3 h\u1ed9i m\u1ed1i t\u1ed1t. H \u1ea1t nh\u00e2n c\u1ee7a x\u00e3 h\u1ed9i l\u00e0 gia \u0111\u00ecnh\u201d2.", "a": 1}}, {"q": "Ai \u0111\u01b0\u1ee3c coi l\u00e0 ng\u01b0\u1eddi m\u1edf \u0111\u1ea7u c\u00e1c tr\u00e0o l\u01b0u x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a v\u00e0 c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a th\u1eddi c\u1eadn \u0111\u1ea1i", "a": "?T\u00f4m\u00e1t Mor\u01a1", "e": null}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u1ea7u ti\u00ean CNXH khoa h\u1ecdc tr\u1edf th\u00e0nh hi\u1ec7n th\u1ef1c sinh \u0111\u1ed9ng", "a": "L\u00ea Nin B", "e": null}, {"q": "Ba \u0111\u1ea1i bi\u1ec3u c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng ph\u00ea ph\u00e1n \u2013 ti\u1ec1n \u0111\u1ec1 t\u01b0 t\u01b0\u1edfng l\u00fd lu\u1eadn c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc l\u00e0", "a": "Saint Simon (1760 - 1825), Charles Fourier (1772 - 1837) v\u00e0 Robert Owen (1771 - 1858)", "e": {"p": 14, "t": "ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng ph\u00ea ph\u00e1n m\u00e0 \u0111\u1ea1i bi\u1ec3u l\u00e0 Xanh Xim\u00f4ng (1760 - 1825), s. Phuri\u00ea (1772 - 1837) v\u00e0 R.", "a": 1}}, {"q": "Ba \u0111\u1ed9t ph\u00e1 chi\u1ebfn l\u01b0\u1ee3c \u0111\u01b0\u1ee3c Ngh\u1ecb quy\u1ebft \u0110\u1ea1i h\u1ed9i XIII n\u0103m 2021 c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam x\u00e1c \u0111\u1ecbnh l\u00e0", "a": "Ho\u00e0n thi\u1ec7n \u0111\u1ed3ng b\u1ed9 th\u1ec3 ch\u1ebf ph\u00e1t tri\u1ec3n; ph\u00e1t tri\u1ec3n ngu\u1ed3n nh\u00e2n l\u1ef1c; x\u00e2y d\u1ef1ng h\u1ec7 th\u1ed1ng k\u1ebft c\u1ea5u h\u1ea1 t\u1ea7ng \u0111\u1ed3ng b\u1ed9, hi\u1ec7n \u0111\u1ea1i", "e": null}, {"q": "Ba ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i c\u1ee7a C. M\u00e1c v\u00e0 Ph. \u0102ngghen l\u00e0", "a": "Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed, H\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0 v\u00e0 H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 19, "t": "- H\u1ecdc thuy\u1ebft v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Tr\u00ean c\u01a1 s\u1edf hai ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i l\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed v\u00e0 h\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0, c. \u0102ngghen \u0111\u00e3 c\u00f3 ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i th\u1ee9 ba - ph\u00e1t hi\u1ec7n ra s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed to\u00e0n th\u1ebf gi\u1edbi c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p c\u00f3 s\u1ee9 m\u1ec7nh th\u1ee7 ti\u00eau ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng\u2026", "a": 1}}, {"q": "B\u1ea3n ch\u1ea5t b\u00f3c l\u1ed9t c\u1ee7a CNTB l\u00e0 do", "a": "Ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a", "e": {"p": 12, "t": "\u0110\u00e2y ch\u00ednh l\u00e0 nguy\u00ean nh\u00e2n l\u00e0m xu\u1ea5t hi\u1ec7n m\u00e2u thu\u1eabn ng\u00e0y c\u00e0ng quy\u1ebft li\u1ec7t gi\u1eefa l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t mang t\u00ednh ch\u1ea5t x\u00e3 h\u1ed9i v\u1edbi quan h\u1ec7 s\u1ea3n xu\u1ea5t d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t. C\u00f9ng v\u1edbi qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n c\u1ee7a n\u1ec1n \u0111\u1ea1i c\u00f4ng nghi\u1ec7p, s\u1ef1 ra \u0111\u1eddi hai giai c\u1ea5p c\u00f3 l\u1ee3i \u00edch c\u01a1 b\u1ea3n \u0111\u1ed1i l\u1eadp nhau:", "a": 1}}, {"q": "B\u1ea3n ch\u1ea5t ch\u00ednh tr\u1ecb c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a th\u1ec3 hi\u1ec7n nh\u01b0 th\u1ebf n\u00e0o?", "a": "L\u00e0 s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua \u0111\u1ea3ng c\u1ee7a n\u00f3 \u0111\u1ed1i v\u1edbi to\u00e0n x\u00e3 h\u1ed9i, \u0111\u1ec3 th\u1ef1c hi\u1ec7n quy\u1ec1n l\u1ef1c v\u00e0 l\u1ee3i \u00edch c\u1ee7a to\u00e0n th\u1ec3 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng, trong \u0111\u00f3 c\u00f3 giai c\u1ea5p c\u00f4ng nh\u00e2n.", "e": {"p": 135, "t": "B\u1ea3n ch\u1ea5t ch\u00ednh tr\u1ecb c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 s\u1ef1 l\u00e3nh \u0111\u1ea1o ch\u00ednh tr\u1ecb c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n th\u00f4ng qua \u0111\u1ea3ng c\u1ee7a n\u00f3 \u0111\u1ed1i v\u1ed1i to\u00e0n x\u00e3 h\u1ed9i, nh\u01b0ng kh\u00f4ng ph\u1ea3i ch\u1ec9 \u0111\u1ec3 th\u1ef1c hi\u1ec7n quy\u1ec1n l\u1ef1c v\u00e0 l\u1ee3i \u00edch ri\u00eang cho giai c\u1ea5p c\u00f4ng nh\u00e2n, m\u00e0 ch\u1ee7 y\u1ebfu l\u00e0 \u0111\u1ec3 th\u1ef1c hi\u1ec7n quy\u1ec1n l\u1ef1c v\u00e0 l\u1ee3i \u00edch c\u1ee7a to\u00e0n th\u1ec3 nh\u00e2n d\u00e2n, trong \u0111\u00f3 c\u00f3 giai c\u1ea5p c\u00f4ng nh\u00e2n.", "a": 1}}, {"q": "B\u1ea3n ch\u1ea5t c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u0111\u01b0\u1ee3c quy \u0111\u1ecbnh b\u1edfi", "a": "Ch\u1ebf \u0111\u1ed9 s\u1edf h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t", "e": {"p": 143, "t": "V\u1ec1 kinh t\u1ebf, b\u1ea3n ch\u1ea5t c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a ch\u1ecbu s\u1ef1 quy \u0111\u1ecbnh c\u1ee7a c\u01a1 s\u1ecf kinh t\u00ea c\u1ee7a x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, \u0111\u00f3 l\u00e0 ch\u1ebf \u0111\u1ed9 s\u1ecf h\u1eefu x\u00e3 h\u1ed9i v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu, do \u0111\u00f3, kh\u00f4ng c\u00f2n t\u1ed3n t\u1ea1i quan h\u1ec7 s\u1ea3n xu\u1ea5t b\u00f3c l\u1ed9t.", "a": 1}}, {"q": "B\u1ea3n ch\u1ea5t c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 g\u00ec?", "a": "Mang b\u1ea3n ch\u1ea5t c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, t\u00ednh nh\u00e2n d\u00e2n r\u1ed9ng r\u00e3i v\u00e0 t\u00ednh d\u00e2n t\u1ed9c s\u00e2u s\u1eafc.", "e": {"p": 137, "t": "X\u00e9t v\u1ec1 b\u1ea3n ch\u1ea5t ch\u00ednh tr\u1ecb, d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a v\u1eeba c\u00f3 b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, v\u1eeba c\u00f3 t\u00ednh nh\u00e2n d\u00e2n r\u1ed9ng r\u00e3i, t\u00ednh d\u00e2n t\u1ed9c s\u00e2u s\u1eafc. Do v\u1eady, n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a kh\u00e1c v\u1ec1 ch\u1ea5t so v\u00f3i n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n \u1edf b\u1ea3n ch\u1ea5t giai c\u1ea5p (giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 giai c\u1ea5p t\u01b0 s\u1ea3n);", "a": 1}}, {"q": "B\u1ea3n ch\u1ea5t giai c\u1ea5p c\u1ee7a nh\u00e0 n\u01b0\u1edbc l\u00e0?", "a": "Quy\u1ec1n l\u1ef1c cai tr\u1ecb c\u1ee7a giai c\u1ea5p th\u1ed1ng tr\u1ecb trong b\u1ed9 m\u00e1y nh\u00e0 n\u01b0\u1edbc", "e": {"p": 57, "t": "Giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f9ng v\u1edbi nh\u00e2n d\u00e2n lao \u0111\u1ed9ng, d\u01b0\u1edbi s\u1ef1 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n, ti\u1ebfn h\u00e0nh c\u00e1ch m\u1ea1ng ch\u00ednh tr\u1ecb \u0111\u1ec3 l\u1eadt \u0111\u1ed5 quy\u1ec1n th\u1ed1ng tr\u1ecb c\u1ee7a giai c\u1ea5p th\u00f4ng tr\u1ecb, x\u00f3a b\u1ecf ch\u1ebf \u0111\u1ed9 b\u00f3c l\u1ed9t, \u00e1p b\u1ee9c, gi\u00e0nh quy\u1ec1n l\u1ef1c v\u1ec1 tay giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng.", "a": 1}}, {"q": "B\u1ea3n ch\u1ea5t kinh t\u1ebf c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a d\u1ef1a tr\u00ean c\u01a1 s\u1edf n\u00e0o?", "a": "Ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu v\u00e0 th\u1ef1c hi\u1ec7n ch\u1ebf \u0111\u1ed9 ph\u00e2n ph\u1ed1i l\u1ee3i \u00edch theo k\u1ebft qu\u1ea3 lao \u0111\u1ed9ng l\u00e0 ch\u1ee7 y\u1ebfu", "e": {"p": 138, "t": "Kh\u00e1c v\u1edbi n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n, b\u1ea3n ch\u1ea5t kinh t\u1ebf c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 th\u1ef1c hi\u1ec7n ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu v\u00e0 th\u1ef1c hi\u1ec7n ch\u1ebf \u0111\u1ed9 ph\u00e2n ph\u1ed5i l\u1ee3i \u00edch theo k\u1ebft qu\u1ea3 lao \u0111\u1ed9ng l\u00e0 ch\u1ee7 y\u1ebfu. B\u1ea3n ch\u1ea5t t\u01b0 t\u01b0\u1edfng - v\u0103n h\u00f3a - x\u00e3 h\u1ed9i:", "a": 1}}, {"q": "Bi\u1ec3u hi\u1ec7n v\u1ec1 m\u1eb7t x\u00e3 h\u1ed9i m\u00e2u thu\u1eabn gi\u1eefa t\u00ednh ch\u1ea5t x\u00e3 h\u1ed9i c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u1ed1i v\u1edbi t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t l\u00e0?", "a": "M\u00e2u thu\u1eabn gi\u1eefa giai c\u1ea5p t\u01b0 s\u1ea3n l\u1ed7i th\u1eddi v\u1edbi giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i", "e": {"p": 90, "t": "b) \u0110i\u1ec1u ki\u1ec7n ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i M\u00e2u thu\u1eabn gi\u1eefa t\u00ednh ch\u1ea5t x\u00e3 h\u1ed9i h\u00f3a c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u1ed1\u00ec v\u1edbi t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t tr\u1edf th\u00e0nh m\u00e2u thu\u1eabn kinh t\u1ebf c\u01a1 b\u1ea3n c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, bi\u1ec3u hi\u1ec7n v\u1ec1 m\u1eb7t x\u00e3 h\u1ed9i l\u00e0 m\u00e2u thu\u1eabn gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n l\u1ed7i th\u1eddi.", "a": 1}}, {"q": "B\u1ed9 m\u00e1y Nh\u00e0 n\u01b0\u1edbc ph\u00e1p quy\u1ec1n x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c v\u00e0 ho\u1ea1t \u0111\u1ed9ng theo nguy\u00ean t\u1eafc", "a": ": T\u1eadp trung d\u00e2n ch\u1ee7", "e": {"p": 157, "t": "Th\u1ee9 s\u00e1u, t\u1ed5 ch\u1ee9c v\u00e0 ho\u1ea1t \u0111\u1ed9ng c\u1ee7a b\u1ed9 m\u00e1y nh\u00e0 n\u01b0\u1ed5c theo nguy\u00ean t\u1eafc t\u1eadp trung d\u00e2n ch\u1ee7, c\u00f3 s\u1ef1 ph\u00e2n c\u00f4ng, ph\u00e2n c\u1ea5p, ph\u1ed1i h\u1ee3p v\u00e0 ki\u1ec3m so\u00e1t l\u1eabn nhau, nh\u01b0ng b\u1ea3o \u0111\u1ea3m quy\u1ec1n l\u1ef1c l\u00e0 th\u1ed1ng nh\u1ea5t v\u00e0 s\u1ef1 ch\u1ec9 \u0111\u1ea1o th\u1ed1ng nh\u1ea5t c\u1ee7a Trung \u01b0\u01a1ng.", "a": 1}}, {"q": "B\u1ed9 ph\u1eadn th\u1ec3 hi\u1ec7n t\u1eadp trung nh\u1ea5t t\u00ednh ch\u00ednh tr\u1ecb - th\u1ef1c ti\u1ec5n sinh \u0111\u1ed9ng c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c", "a": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc.", "e": null}, {"q": "B\u1ea3n ch\u1ea5t d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n th\u00f4ng qua c\u00e1c h\u00ecnh th\u1ee9c n\u00e0o ?", "a": "H\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp v\u00e0 d\u00e2n ch\u1ee7 tr\u1ef1c ti\u1ebfp", "e": {"p": 152, "t": "B\u1ea3n ch\u1ea5t d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n th\u00f4ng qua c\u00e1c h\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp v\u00e0 d\u00e2n ch\u1ee7 tr\u1ef1c ti\u1ebfp. H\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp l\u00e0 h\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 \u0111\u1ea1i di\u1ec7n, \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n do nh\u00e2n d\u00e2n \u201c\u1ee7y quy\u1ec1n\u201d, giao quy\u1ec1n l\u1ef1c c\u1ee7a m\u00ecnh cho t\u1ed5 ch\u1ee9c m\u00e0 nh\u00e2n d\u00e2n tr\u1ef1c ti\u1ebfp b\u1ea7u ra.", "a": 1}}, {"q": "Bi\u1ec7n ph\u00e1p n\u00e0o l\u00e0 kh\u00f4ng \u0111\u00fang \u0111\u1ec3 ph\u00e1t tri\u1ec3n kinh t\u1ebf trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a?", "a": "D\u1ef1a tr\u00ean m\u1ed9t h\u00ecnh th\u1ee9c ph\u00e2n ph\u1ed1i l\u00e0 ph\u00e2n ph\u1ed1i theo lao \u0111\u1ed9ng. B\u1ed9 ph\u1eadn th\u1ec3 hi\u1ec7n t\u1eadp trung nh\u1ea5t t\u00ednh ch\u00ednh tr\u1ecb - th\u1ef1c ti\u1ec5n sinh \u0111\u1ed9ng c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c: Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc.", "e": null}, {"q": "B\u1ed1n nguy c\u01a1 \u0111\u1ed1i v\u1edbi s\u1ef1 nghi\u1ec7p \u0110\u1ed5i m\u1edbi \u0111\u1ea5t n\u01b0\u1edbc m\u00e0 H\u1ed9i ngh\u1ecb \u0111\u1ea1i bi\u1ec3u to\u00e0n qu\u1ed1c gi\u1eefa nhi\u1ec7m k\u1ef3 (Kh\u00f3a VII- 1994) c\u1ee7a \u0110\u1ea3ng \u0111\u00e3 x\u00e1c \u0111\u1ecbnh l\u00e0 g\u00ec?", "a": "T\u1ee5t h\u1eadu xa h\u01a1n v\u1ec1 kinh t\u1ebf so v\u1edbi c\u00e1c n\u01b0\u1edbc, ch\u1ec7ch h\u01b0\u1edbng XHCN, tham nh\u1eefng v\u00e0 \u201cdi\u1ec5n bi\u1ebfn h\u00f2a b\u00ecnh\u201d.", "e": null}, {"q": "C.M\u00e1c kh\u1eb3ng \u0111\u1ecbnh: \u201c...trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d l\u00e0 mu\u1ed1n \u0111\u1ec1 c\u1eadp \u0111\u1ebfn giai c\u1ea5p n\u00e0o?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i", "e": {"p": 52, "t": "\u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d1. \u0102ngghen, c\u00f4ng nh\u00e2n c\u00f4ng nghi\u1ec7p c\u00f4ng x\u01b0\u1ecfng l\u00e0 b\u1ed9 ph\u1eadn ti\u00eau bi\u1ec3u cho giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i.", "a": 1}}, {"q": "C.M\u00e1c m\u1ea5t ng\u00e0y", "a": "14.3.1883", "e": null}, {"q": "C.M\u00e1c sinh n\u0103m bao nhi\u00eau?", "a": "1818", "e": null}, {"q": "C.M\u00e1c sinh ng\u00e0y", "a": "5.5.1818", "e": {"p": 16, "t": "\u0102ngghen Nh\u1eefng \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 nh\u0169ng ti\u1ec1n \u0111\u1ec1 khoa h\u1ecdc t\u1ef1 nhi\u00ean v\u00e0 t\u01b0 t\u01b0\u1edfng l\u00fd lu\u1eadn l\u00e0 \u0111i\u1ec1u ki\u1ec7n c\u1ea7n cho m\u1ed9t h\u1ecdc thuy\u1ebft ra \u0111\u1eddi, song \u0111i\u1ec1u ki\u1ec7n \u0111\u1ee7 \u0111\u1ec3 h\u1ecdc thuy\u1ebft khoa h\u1ecdc, c\u00e1ch m\u1ea1ng v\u00e0 s\u00e1ng t\u1ea1o ra \u0111\u1eddi ch\u00ednh l\u00e0 vai tr\u00f2 c\u1ee7a c. M\u00e1c (1818 - 1883) v\u00e0 Ph.", "a": 1}}, {"q": "C.M\u00e1c v\u00e0 Ph.\u0102ngghen coi s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1eeb h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i th\u1ea5p l\u00ean h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i cao l\u00e0", "a": "M\u1ed9t qu\u00e1 tr\u00ecnh l\u1ecbch s\u1eed - t\u1ef1 nhi\u00ean", "e": null}, {"q": "C.M\u00e1c v\u00e0 Ph.\u0102ngghen \u0111\u00e3 lu\u1eadn gi\u1ea3i m\u1ed9t c\u00e1ch khoa h\u1ecdc v\u00e0 c\u00e1ch m\u1ea1ng v\u1ec1 vai tr\u00f2 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n trong t\u00e1c ph\u1ea9m n\u00e0o?", "a": "Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n.", "e": null}, {"q": "C\u00e1c d\u00e2n t\u1ed9c thi\u1ec3u s\u1ed1 \u1edf Vi\u1ec7t Nam th\u01b0\u1eddng ph\u00e2n b\u1ed5 \u1edf nh\u1eefng v\u1ecb tr\u00ed n\u00e0o tr\u00ean \u0111\u1ea5t n\u01b0\u1edbc?", "a": "\u1edf c\u00e1c v\u00f9ng bi\u00ean gi\u1edbi, h\u1ea3i \u0111\u1ea3o, v\u00f9ng s\u00e2u v\u00f9ng xa c\u1ee7a \u0111\u1ea5t n\u01b0\u1edbc", "e": {"p": 206, "t": "M\u1eb7c d\u00f9 ch\u1ec9 chi\u1ebfm 14,3% d\u00e2n s\u1ed1, nh\u01b0ng 53 d\u00e2n t\u1ed9c thi\u1ec3\u1ee5 s\u1ed1 Vi\u1ec7t Nam l\u1ea1i c\u01b0 tr\u00fa tr\u00ean 3/4 di\u1ec7n t\u00edch l\u00e3nh th\u1ed5 v\u00e0 \u1edf nh\u1eefng \u0111\u1ecba b\u00e0n tr\u1ecdng y\u1ebfu c\u1ee7a qu\u1ed1c gia c\u1ea3 v\u1ec1 kinh t\u1ebf, an ninh, qu\u1ed1c ph\u00f2ng, m\u00f4i tr\u01b0\u1eddng sinh th\u00e1i - \u0111\u00f3 l\u00e0 v\u00f9ng bi\u00ean gi\u00f3i, h\u1ea3i \u0111\u1ea3o, v\u00f9ng s\u00e2u, v\u00f9ng xa c\u1ee7a \u0111\u1ea5t n\u01b0\u1edbc.", "a": 1}}, {"q": "C\u00e1c h\u00ecnh th\u1ee9c c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi t\u1eeb th\u1ea5p \u0111\u1ebfn cao m\u00e0 lo\u00e0i ng\u01b0\u1eddi \u0111\u00e3 tr\u00e3i qua l\u00e0", "a": "Th\u1ecb t\u1ed9c, b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c v\u00e0 d\u00e2n t\u1ed9c", "e": {"p": 195, "t": "Kh\u00e1i ni\u1ec7m, \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n c\u1ee7a d\u00e2n t\u1ed9c Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin, d\u00e2n t\u1ed9c l\u00e0 qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n l\u00e2u d\u00e0i c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi, tr\u1ea3i qua c\u00e1c h\u00ecnh th\u1ee9c c\u1ed9ng \u0111\u1ed3ng t\u1eeb th\u1ea5p \u0111\u1ebfn cao, bao g\u1ed3m: th\u1ecb t\u1ed9c, b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c, d\u00e2n t\u1ed9c.", "a": 1}}, {"q": "C\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a tr\u01b0\u1edbc M\u00e1c v\u1edbi h\u1ea1n ch\u1ebf c\u01a1 b\u1ea3n l\u00e0 g\u00ec?", "a": "Kh\u00f4ng th\u1ec3 ph\u00e1t hi\u1ec7n ra \u0111\u01b0\u1ee3c l\u1ef1c l\u01b0\u1ee3ng x\u00e3 h\u1ed9i ti\u00ean phong th\u1ef1c hi\u1ec7n cu\u1ed9c chuy\u1ec3n bi\u1ebfn c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i.", "e": {"p": 15, "t": "kh\u00f4ng ph\u00e1t hi\u1ec7n ra l\u1ef1c l\u01b0\u1ee3ng x\u00e3 h\u1ed9i ti\u00ean phong c\u00f3 th\u1ec3 th\u1ef1c hi\u1ec7n cu\u1ed9c chuy\u1ec3n bi\u1ebfn c\u00e1ch m\u1ea1ng t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n l\u00e0 giai c\u1ea5p c\u00f4ng nh\u00e2n;", "a": 1}}, {"q": "C\u00e1c nh\u1eadn \u0111\u1ecbnh sau \u0111\u00e2y, nh\u1eadn \u0111\u1ecbnh n\u00e0o \u0111\u00fang v\u1ec1 t\u00ednh t\u1ea5t y\u1ebfu c\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH?", "a": "Xu\u1ea5t ph\u00e1t t\u1eeb m\u1ed1i li\u00ean h\u1ec7 t\u1ef1 nhi\u00ean, g\u1eafn b\u00f3 v\u00e0 s\u1ef1 th\u1ed1ng nh\u1ea5t v\u1ec1 l\u1ee3i \u00edch c\u1ee7a c\u00e1c giai c\u1ea5p,t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i \u0111\u00f3 quy \u0111\u1ecbnh", "e": null}, {"q": "C\u00e1c th\u1ebf l\u1ef1c th\u00f9 \u0111\u1ecbch s\u1eed d\u1ee5ng chi\u1ebfn l\u01b0\u1ee3c \u201cdi\u1ec5n bi\u1ebfn h\u00f2a b\u00ecnh\u201d ch\u1ed1ng ph\u00e1 s\u1ef1 nghi\u1ec7p x\u00e2y d\u1ef1ng T\u1ed5 qu\u1ed1c x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u1ee7a nh\u00e2n d\u00e2n ta tr\u00ean ph\u01b0\u01a1ng di\u1ec7n n\u00e0o?", "a": "C\u1ea3 a, b v\u00e0 c \u0111\u1ec1u \u0111\u00fang", "e": null}, {"q": "C\u00e1ch s\u1eafp x\u1ebfp n\u00e0o sau \u0111\u00e2y \u0111\u00fang v\u1ec1 s\u1ef1 xu\u1ea5t hi\u1ec7n c\u1ee7a c\u00e1c t\u1ed9c ng\u01b0\u1eddi trong l\u1ecbch s\u1eed?", "a": "Th\u1ecb t\u1ed9c, b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c, d\u00e2n t\u1ed9c", "e": {"p": 198, "t": "Theo ngh\u0129a h\u1eb9p, d\u00e2n t\u1ed9c (Ethnie) l\u00e0 kh\u00e1i ni\u1ec7m d\u00f9ng \u0111\u1ec3 ch\u1ec9 m\u1ed9t c\u1ed9ng \u0111\u1ed3ng t\u1ed9c ng\u01b0\u1eddi \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh trong l\u1ecbch s\u1eed, c\u00f3 m\u1ed1\u0129 li\u00ean h\u1ec7 ch\u1eb7t ch\u1ebd v\u00e0 b\u1ec1n v\u1eef u00e0 n\u01b0\u1edbc ki\u1ec3u m\u1edbi mang b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, \u0111\u1ea1i bi\u1ec3u cho l\u1ee3i \u00edch, quy\u1ec1n l\u1ef1c v\u00e0 \u00fd ch\u00ed c\u1ee7a nh\u00e2n d\u00e2n lao \u0111\u1ed9ng.", "a": 1}}, {"q": "Ch\u1ec9 ra \u0111\u1eb7c \u0111i\u1ec3m ch\u00ednh tr\u1ecb c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb CNTB l\u00ean CNXH", "a": "C\u00f2n t\u1ed3n t\u1ea1i giai c\u1ea5p v\u00e0 c\u00f2n \u0111\u1ea5u tranh giai c\u1ea5p, do \u0111\u00f3 c\u00f2n nh\u00e0 n\u01b0\u1edbc", "e": null}, {"q": "Ch\u1ec9 ra \u0111\u1eb7c \u0111i\u1ec3m kinh t\u1ebf c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb CNTB l\u00ean CNXH", "a": "T\u1ed3n t\u1ea1i m\u1ed9t n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n", "e": {"p": 106, "t": "a) Tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, t\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1\u00ec l\u1eadp. \u0110\u1ec1 c\u1eadp t\u1edbi \u0111\u1eb7c tr\u01b0ng n\u00e0y, V.I.", "a": 1}}, {"q": "Ch\u1ec9 ra \u0111\u1eb7c tr\u01b0ng n\u00e0o ch\u01b0a ph\u1ea3i l\u00e0 \u0111\u1eb7c tr\u01b0ng c\u1ee7a x\u00e3 h\u1ed9i XHCN", "a": "Th\u1ef1c hi\u1ec7n nguy\u00ean t\u1eafc ph\u00e2n ph\u1ed1i theo nhu c\u1ea7u", "e": {"p": 108, "t": "B\u1edfi v\u1eady, th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n x\u00e3 h\u1ed9i, l\u00e0 th\u1eddi k\u1ef3 \u0111\u1ea5u tranh giai c\u1ea5p ch\u00f4ng \u00e1p b\u1ee9c, b\u1ea5t c\u00f4ng, x\u00f3a b\u1ecf t\u1ec7 n\u1ea1n x\u00e3 h\u1ed9i v\u00e0 nh\u1eefng t\u00e0n d\u01b0 c\u1ee7a x\u00e3 h\u1ed9i c\u0169 \u0111\u1ec3 l\u1ea1i, thi\u1ebft i\u1ec7u s\u1ea3n xu\u1ea5t c\u1ee7a b\u1ea3n th\u00e2n, n\u00ean bu\u1ed9c ph\u1ea3i b\u00e1n s\u1ee9c lao \u0111\u1ed9ng c\u1ee7a\u2026", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang nh\u1ea5t. \u00dd th\u1ee9c h\u1ec7 ti\u00ean ti\u1ebfn c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0", "a": "Ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin", "e": {"p": 58, "t": "X\u00e2y d\u1ef1ng v\u00e0 c\u1ee7ng c\u1ed1 \u00fd th\u1ee9c h\u1ec7 ti\u00ean ti\u1ebfn c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, \u0111\u00f3 l\u00e0 ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin, \u0111\u1ea5u tranh \u0111\u1ec3 kh\u1eafc ph\u1ee5c \u00fd th\u1ee9c h\u1ec7 t\u01b0 s\u1ea3n v\u00e0 c\u00e1c t\u00e0n d\u01b0 c\u00f2n s\u00f3t l\u1ea1i c\u1ee7a c\u00e1c h\u1ec7 t\u01b0 t\u01b0\u1edfng c\u0169.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang nh\u1ea5t: Ph\u01b0\u01a1ng h\u01b0\u1edbng x\u00e2y d\u1ef1ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam hi\u1ec7n nay l\u00e0?", "a": "T\u1ea5t c\u1ea3 c\u00e1c \u0111\u00e1p \u00e1n \u0111\u1ec1u \u0111\u00fang", "e": {"p": 79, "t": "Ph\u01b0\u01a1ng h\u01b0\u1edbng v\u00e0 m\u1ed9t s\u1ed1 gi\u1ea3i ph\u00e1p ch\u1ee7 y\u1ebfu \u0111\u1ec3 x\u00e2y d\u1ef1ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam hi\u1ec7n nay a) Ph\u01b0\u01a1ng h\u01b0\u1edbng x\u00e2y d\u1ef1ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam hi\u1ec7n nay \u0110\u1ea1i h\u1ed9i l\u1ea7n th\u1ee9 X c\u1ee7a \u0110\u1ea3ng \u0111\u00e3 x\u00e1c \u0111\u1ecbnh ph\u01b0\u01a1ng h\u01b0\u1edbng x\u00e2y d\u1ef1ng giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam trong qu\u00e1 tr\u00ecnh \u0111\u1ea9y m\u1ea1nh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u00f3a \u0111\u1ea5t n\u01b0\u1edbc theo \u0111\u1ecbnh h\u01b0\u1edbng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0:", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang nh\u1ea5t: V\u1ea5n \u0111\u1ec1 n\u1ed5i b\u1eadt nh\u1ea5t v\u1ec1 n\u1ed9i dung s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam khi th\u1ef1c hi\u1ec7n n\u1ed9i dung Kinh t\u1ebf l\u00e0?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n ph\u00e1t huy vai tr\u00f2 v\u00e0 tr\u00e1ch nhi\u1ec7m l\u1ef1c l\u01b0\u1ee3ng \u0111i \u0111\u1ea7u trong s\u1ef1 nghi\u1ec7p \u0111\u1ea9y m\u1ea1nh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u00f3a \u0111\u1ea5t n\u01b0\u1edbc", "e": {"p": 76, "t": "Giai c\u1ea5p c\u00f4ng nh\u00e2n ph\u00e1t huy vai tr\u00f2 v\u00e0 tr\u00e1ch nhi\u1ec7m c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng \u0111i \u0111\u1ea7u trong s\u1ef1 nghi\u1ec7p \u0111\u1ea9y m\u1ea1nh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u00f3a \u0111\u1ea5t n\u01b0\u1edbc - \u0111\u00e2y l\u00e0 v\u1ea5n \u0111\u1ec1 n\u1ed5i b\u1eadt nh\u1ea5t \u0111\u00f4\u0129 v\u1edbi vi\u1ec7c th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n Vi\u1ec7t Nam hi\u1ec7n nay.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang nh\u1ea5t: X\u00f3a b\u1ecf ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t l\u00e0?", "a": "X\u00f3a b\u1ecf t\u00ecnh tr\u1ea1ng th\u1ed1ng tr\u1ecb c\u1ee7a \u0111\u00e0n \u00f4ng trong gia \u0111\u00ecnh, s\u1ef1 b\u1ea5t b\u00ecnh \u0111\u1eb3ng gi\u1eefa nam v\u00e0 n\u1eef, gi\u1eefa v\u1ee3 v\u00e0 ch\u1ed3ng, s\u1ef1 n\u00f4 d\u1ecbch \u0111\u1ed1i v\u1edbi ph\u1ee5 n\u1eef", "e": {"p": 250, "t": "X\u00f3a b\u1ecf ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t l\u00e0 x\u00f3a b\u1ecf ngu\u1ed3n g\u1ed1c g\u00e2y n\u00ean t\u00ecnh tr\u1ea1ng th\u1ed1ng tr\u1ecb c\u1ee7a ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng trong gia \u0111\u00ecnh, s\u1ef1 b\u1ea5t b\u00ecnh \u0111\u1eb3ng gi\u1eefa nam v\u00e0 n\u1eef, gi\u1eefa v\u1ee3 v\u00e0 ch\u1ed3ng, s\u1ef1 n\u00f4 d\u1ecbch \u0111\u1ed1\u0129 v\u1edbi ph\u1ee5 n\u1eef. B\u1edfi v\u00ec s\u1ef1 th\u1ed1ng tr\u1ecb c\u1ee7a ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng trong gia \u0111\u00ecnh l\u00e0 k\u1ebft qu\u1ea3 s\u1ef1 th\u1ed1ng tr\u1ecb c\u1ee7a h\u1ecd v\u1ec1 kinh t\u1ebf, s\u1ef1 th\u1ed1ng tr\u1ecb \u0111\u00f3 t\u1ef1 n\u00f3 s\u1ebd ti\u00eau tan khi s\u1ef1 th\u1ed1ng tr\u1ecb v\u1ec1 kinh t\u1ebf c\u1ee7a \u0111\u00e0n \u00f4ng kh\u00f4ng\u2026", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang trong c\u00e1c \u0111\u00e1p \u00e1n sau", "a": "\u0110\u00e2u l\u00e0 ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i v\u00e0 C. M\u00e1c v\u00e0", "e": null}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0110\u00daNG v\u1ec1 \u0111\u1eb7c tr\u01b0ng c\u1ee7a x\u00e3 h\u1ed9i XHCN m\u00e0 nh\u00e2n d\u00e2n x\u00e2y d\u1ef1ng?", "a": "C\u00e1c d\u00e2n t\u1ed9c trong c\u1ed9ng \u0111\u1ed3ng Vi\u1ec7t Nam b\u00ecnh \u0111\u1eb3ng, \u0111o\u00e0n k\u1ebft, t\u00f4n tr\u1ecdng v\u00e0 gi\u00fap nhau c\u00f9ng ph\u00e1t tri\u1ec3n", "e": {"p": 113, "t": "- Con ng\u01b0\u1eddi c\u00f3 cu\u1ed9c s\u1ed1ng \u1ea5m no, t\u1ef1 do, h\u1ea1nh ph\u00fac, c\u00f3 \u0111i\u00eau ki\u1ec7n ph\u00e1t tri\u1ec3n to\u00e0n di\u1ec7n. - C\u00e1c d\u00e2n t\u1ed9c trong c\u1ed9ng \u0111\u1ed3ng Vi\u1ec7t Nam b\u00ecnh \u0111\u1eb3ng, \u0111o\u00e0n k\u1ebft, t\u00f4n tr\u1ecdng v\u00e0 gi\u00fap nhau c\u00f9ng ph\u00e1t tri\u1ec3n.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang: C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p l\u00e0?", "a": "L\u00e0 h\u1ec7 th\u1ed1ng c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i t\u1ed3n t\u1ea1i kh\u00e1ch quan trong m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i nh\u1ea5t \u0111\u1ecbnh, th\u00f4ng qua nh\u1eefng m\u1ed1i quan h\u1ec7 v\u1ec1 s\u1edf h\u1eefu, v\u1ec1 t\u1ed5 ch\u1ee9c qu\u1ea3n l\u00fd qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t, v\u1ec1 \u0111\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i\u2026 gi\u1eefa c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp \u0111\u00f3", "e": {"p": 165, "t": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p l\u00e0 h\u1ec7 th\u1ed1ng c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i t\u1ed3n t\u1ea1i kh\u00e1ch quan trong m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i nh\u1ea5t \u0111\u1ecbnh, th\u00f4ng qua nh\u0169ng m\u00f4\u00ec quan h\u1ec7 v\u1ec1 s\u1ecf h\u0169u t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, v\u1ec1 t\u1ed5 ch\u1ee9c qu\u1ea3n l\u00fd qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t, v\u1ec1 \u0111\u1ecba v\u1ecb ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i...", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang: C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i l\u00e0?", "a": "L\u00e0 nh\u1eefng c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi c\u00f9ng to\u00e0n b\u1ed9 nh\u1eefng m\u1ed1i quan h\u1ec7 x\u00e3 h\u1ed9i do s\u1ef1 t\u00e1c \u0111\u1ed9ng l\u1eabn nhau c\u1ee7a c\u00e1c c\u1ed9ng \u0111\u1ed3ng \u1ea5y t\u1ea1o n\u00ean", "e": {"p": 165, "t": "Kh\u00e1i ni\u1ec7m v\u00e0 v\u1ecb tr\u00ed c\u1ee7a c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i a) Kh\u00e1i ni\u1ec7m c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i v\u00e0 c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i l\u00e0 nh\u1eefng c\u1ed9ng \u0111\u1ed3ng ng\u01b0\u1eddi c\u00f9ng to\u00e0n b\u1ed9 nh\u1eefng m\u1ed1i quan h\u1ec7 x\u00e3 h\u1ed9i do s\u1ef1 t\u00e1c \u0111\u1ed9ng l\u1eabn nhau c\u1ee7a c\u00e1c c\u1ed9ng \u0111\u1ed3ng \u1ea5y t\u1ea1o n\u00ean.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang: D\u00e2n ch\u1ee7 tr\u1ef1c ti\u1ebfp l\u00e0?", "a": "\u0110\u01b0\u1ee3c b\u00e0n b\u1ea1c v\u1ec1 nh\u1eefng c\u00f4ng vi\u1ec7c c\u1ee7a nh\u00e0 n\u01b0\u1edbc", "e": {"p": 152, "t": "H\u00ecnh th\u1ee9c \u0111\u00f3 th\u1ec3 hi\u1ec7n \u1edf c\u00e1c quy\u1ec1n \u0111\u01b0\u1ee3c th\u00f4ng tin v\u1ec1 ho\u1ea1t \u0111\u1ed9ng c\u1ee7a nh\u00e0 n\u01b0\u1edbc, \u0111\u01b0\u1ee3c b\u00e0n b\u1ea1c v\u1ec1 c\u00f4ng vi\u1ec7c c\u1ee7a nh\u00e0 n\u01b0\u1edbc v\u00e0 c\u1ed9ng \u0111\u1ed3ng d\u00e2n c\u01b0; \u0111\u01b0\u1ee3c b\u00e0n \u0111\u1ebfn nh\u1eefng quy\u1ebft \u0111\u1ecbnh v\u1ec1 d\u00e2n ch\u1ee7 c\u01a1 s\u1edf, nh\u00e2n d\u00e2n ki\u1ec3m tra, gi\u00e1m s\u00e1t ho\u1ea1t \u0111\u1ed9ng c\u1ee7a c\u01a1 quan nh\u00e0 n\u01b0\u1edbc t\u1eeb Trung \u01b0\u01a1ng cho \u0111\u1ebfn c\u01a1 s\u1ecf.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang: \u0110\u1ed5i m\u1edbi h\u1ec7 th\u1ed1ng ch\u00ednh tr\u1ecb \u1edf n\u01b0\u1edbc ta hi\u1ec7n nay l\u00e0?", "a": "\u0110\u1ed5i m\u1edbi n\u1ed9i dung, ph\u01b0\u01a1ng th\u1ee9c ho\u1ea1t \u0111\u1ed9ng, t\u1ed5 ch\u1ee9c c\u00e1n b\u1ed9 v\u00e0 quan h\u1ec7 gi\u1eefa c\u00e1c t\u1ed5 ch\u1ee9c", "e": null}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang: D\u01b0\u1edbi g\u00f3c \u0111\u1ed9 ch\u00ednh tr\u1ecb -x\u00e3 h\u1ed9i. M\u00f4n ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc t\u1eadp trung nghi\u00ean c\u1ee9u?", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p", "e": {"p": 165, "t": "D\u01b0\u1edbi g\u00f3c \u0111\u1ed9 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i, m\u00f4n Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc t\u1eadp trung nghi\u00ean c\u1ee9u c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p v\u00ec \u0111\u00f3 l\u00e0 m\u1ed9t trong nh\u1eefng c\u01a1 s\u1edf \u0111\u1ec3 nghi\u00ean c\u1ee9u v\u1ea5n \u0111\u1ec1 li\u00ean minh giai c\u1ea5p, t\u1ea7ng l\u1ed1p trong m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i nh\u1ea5t \u0111\u1ecbnh.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang: Quan h\u1ec7 h\u00f4n nh\u00e2n l\u00e0...h\u00ecnh th\u00e0nh n\u00ean c\u00e1c m\u1ed1i quan h\u1ec7 kh\u00e1c trong gia \u0111\u00ecnh?", "a": "C\u01a1 s\u1edf, n\u1ec1n t\u1ea3ng", "e": {"p": 239, "t": "Quan h\u1ec7 h\u00f4n nh\u00e2n l\u00e0 c\u01a1 s\u1edf, n\u1ec1n t\u1ea3ng h\u00ecnh th\u00e0nh n\u00ean c\u00e1c m\u1ed1\u00ec quan h\u1ec7 kh\u00e1c trong gia \u0111\u00ecnh, l\u00e0 c\u01a1 s\u1edf ph\u00e1p l\u00fd cho s\u1ef1 t\u1ed3n t\u1ea1i c\u1ee7a m\u1ed7i gia \u0111\u00ecnh. Quan h\u1ec7 huy\u1ebft th\u1ed1ng l\u00e0 quan h\u1ec7 gi\u1eefa nh\u1eefng ng\u01b0\u1eddi c\u00f9ng m\u1ed9t d\u00f2ng m\u00e1u, n\u1ea3y sinh t\u1eeb quan h\u1ec7 h\u00f4n nh\u00e2n.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang: Vai tr\u00f2 c\u1ee7a giai c\u1ea5p n\u00f4ng d\u00e2n trong c\u01a1 c\u1ea5u - x\u00e3 h\u1ed9i giai c\u1ea5p \u1edf Vi\u1ec7t Nam?", "a": "L\u00e0 l\u1ef1c l\u01b0\u1ee3ng quan tr\u1ecdng \u0111\u1ec3 ph\u00e1t tri\u1ec3n kinh t\u1ebf - x\u00e3 h\u1ed9i b\u1ec1n v\u1eefng. ph\u00e1t huy b\u1ea3n s\u1eafc v\u0103n h\u00f3a d\u00e2n t\u1ed9c v\u00e0 gi\u1eef g\u00ecn m\u00f4i tr\u01b0\u1eddng sinh th\u00e1i", "e": {"p": 179, "t": "gi\u1eef g\u00ecn, ph\u00e1t huy b\u1ea3n s\u1eafc v\u0103n h\u00f3a d\u00e2n t\u1ed9c v\u00e0 b\u1ea3o v\u1ec7 m\u00f4i tr\u01b0\u1eddng sinh th\u00e1i; l\u00e0 ch\u1ee7 th\u1ec3 c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n, x\u00e2y d\u1ef1ng n\u00f4ng th\u00f4n m\u1edbi g\u1eafn v\u1edbi x\u00e2y d\u1ef1ng c\u00e1c c\u01a1 s\u1edf c\u00f4ng nghi\u1ec7p, d\u1ecbch v\u1ee5 v\u00e0 ph\u00e1t tri\u1ec3n \u0111\u00f4 th\u1ecb theo quy ho\u1ea1ch;", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang", "a": "D\u00e2n t\u1ed9c l\u00e0 m\u1ed9t b\u1ed9 ph\u1eadn c\u1ee7a qu\u1ed1c gia & D\u00e2n t\u1ed9c l\u00e0 to\u00e0n b\u1ed9 nh\u00e2n d\u00e2n c\u1ee7a qu\u1ed1c gia \u0111\u00f3.", "e": null}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n KH\u00d4NG \u0111\u00fang: Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0?", "a": "L\u00e0 m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i t\u1ed1t \u0111\u1eb9p, giai \u0111o\u1ea1n sau c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a", "e": {"p": 86, "t": "4) L\u00e0 m\u1ed9t ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i t\u1ed1t \u0111\u1eb9p, giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a. Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a C\u00e1c nh\u00e0 s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc c.", "a": 1}}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n SAI trong c\u00e1c \u0111\u00e1p \u00e1n: H\u1ea1n ch\u1ebf c\u01a1 b\u1ea3n c\u1ee7a CNXH kh\u00f4ng t\u01b0\u1edfng tr\u01b0\u1edbc C. M\u00e1c l\u00e0", "a": "Ch\u01b0a \u0111\u01b0a ra \u0111\u01b0\u1ee3c nh\u1eefng lu\u1eadn \u0111i\u1ec3m c\u00f3 gi\u00e1 tr\u1ecb v\u1ec1 x\u00e3 h\u1ed9i trong t\u01b0\u01a1ng lai", "e": null}, {"q": "Ch\u1ecdn \u0111\u00e1p \u00e1n sai", "a": "T\u00f4n tr\u1ecdng quy\u1ec1n t\u1ef1 do t\u00edn ng\u01b0\u1ee1ng l\u00e0 t\u00f4n tr\u1ecdng v\u00e0 ch\u1ea5p nh\u1eadn gi\u00e1o l\u00fd c\u1ee7a t\u1ea5t c\u1ea3 c\u00e1c t\u00f4n gi\u00e1o", "e": null}, {"q": "Ch\u1ecdn nh\u1eefng t\u00e1c gi\u1ea3 n\u00e0o \u0111\u00fang v\u1edbi t\u00e1c ph\u1ea9m c\u1ee7a h\u1ecd?", "a": "Gi\u1eafcc\u01a1 Bab\u1edbp:Tuy\u00ean ng\u00f4n c\u1ee7a nh\u1eefng ng\u01b0\u1eddi b\u00ecnh d\u00e2n", "e": null}, {"q": "Ch\u1ecdn ph\u01b0\u01a1ng \u00e1n \u0111\u00fang nh\u1ea5t: N\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u00f3 s\u1ee9c \u0111\u1ed9ng vi\u00ean ... trong s\u1ef1 nghi\u1ec7p x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i m\u1edbi?", "a": "Nh\u00e2n d\u00e2n", "e": {"p": 139, "t": "N\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a ra s\u1ee9c \u0111\u1ed9ng vi\u00ean, thu h\u00fat m\u1ecdi ti\u1ec1m n\u0103ng s\u00e1ng t\u1ea1o, t\u00ednh t\u00edch c\u1ef1c x\u00e3 h\u1ed9i c\u1ee7a nh\u00e2n d\u00e2n trong s\u1ef1 nghi\u1ec7p x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i m\u1ed1i.", "a": 1}}, {"q": "Ch\u1ecdn ph\u01b0\u01a1ng \u00e1n \u0111\u00fang nh\u1ea5t: Theo ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, trong ch\u1ebf \u01
