\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a. Xem \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam:", "a": 1}}, {"q": "T\u1ea1i sao khi gi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1t\u00f4n gi\u00e1o ph\u1ea3i c\u00f3 quan \u0111i\u1ec3m l\u1ecbch s\u1eed?", "o": ["V\u00ec t\u00f4n gi\u00e1o c\u00f3 tri\u1ebft l\u00fd ri\u00eang c\u1ee7a m\u00ecnh", "V\u00ec m\u1ed7i th\u1eddi k\u1ef3l\u1ecbch s\u1eedkh\u00e1c nhau, vai tr\u00f2, t\u00e1c \u0111\u1ed9ng c\u1ee7a t\u1eebng t\u00f4n gi\u00e1o \u0111\u1ed1i v\u1edbi \u0111\u1eddi s\u1ed1ng x\u00e3 h\u1ed9i kh\u00f4ng gi\u1ed1ng nhau", "C\u1ea3 hai \u00fd: vai tr\u00f2, t\u00e1c \u0111\u1ed9ng c\u1ee7a t\u00f4n gi\u00e1o kh\u00e1c nhau theo t\u1eebng th\u1eddi k\u1ef3 v\u00e0 t\u00f4n gi\u00e1o ra \u0111\u1eddi, t\u1ed3n t\u1ea1i, bi\u1ebfn \u0111\u1ed5i trong giai \u0111o\u1ea1n l\u1ecbch s\u1eed nh\u1ea5t \u0111\u1ecbnh", "V\u00ec t\u00f4n gi\u00e1o ra \u0111\u1eddi, t\u1ed3n t\u1ea1i v\u00e0 bi\u1ebfn \u0111\u1ed5i trong m\u1ed9t giai \u0111o\u1ea1n l\u1ecbch s\u1eednh\u1ea5t \u0111\u1ecbnh"], "a": 2, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 221, "t": "- Quan \u0111i\u1ec3m l\u1ecbch s\u1eed c\u1ee5 th\u1ec3 trong gi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1 t\u00edn ng\u01b0\u1ee1ng, t\u00f4n gi\u00e1o. T\u00f4n gi\u00e1o kh\u00f4ng ph\u1ea3i l\u00e0 m\u1ed9t hi\u1ec7n t\u01b0\u1ee3ng x\u00e3 h\u1ed9i b\u1ea5t bi\u1ebfn, ng\u01b0\u1ee3c l\u1ea1i n\u00f3 lu\u00f4n lu\u00f4n v\u1eadn \u0111\u1ed9ng v\u00e0 bi\u1ebfn \u0111\u1ed5i kh\u00f4ng ng\u1eebng tu\u1ef3 thu\u1ed9c v\u00e0o nh\u1eefng \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i - l\u1ecbch s\u1eed c\u1ee5 th\u1ec3.", "a": 1}}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang nh\u1ea5t v\u1ec1s\u1ee9m\u1ec7nh l\u1ecbch s\u1eedc\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n:", "o": ["Ti\u1ebfn l\u00ean x\u00e2y d\u1ef1ng ch\u1ee7ngh\u0129a x\u00e3 h\u1ed9i", "X\u00f3a b\u1ecf\u00e1p b\u1ee9c, b\u00f3c l\u1ed9t trong ch\u1ebf\u0111\u1ed9t\u01b0 b\u1ea3n ch\u1ee7ngh\u0129a, x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ebf \u0111\u1ed9x\u00e3 h\u1ed9i ch\u1ee7ngh\u0129a", "\u0110\u1ea5u tranh x\u00f3a b\u1ecfch\u1ebf\u0111\u1ed9\u00e1p b\u1ee9c b\u00f3c l\u1ed9t", "\u0110\u1ea5u tranh x\u00f3a b\u1ecfch\u1ebf\u0111\u1ed9t\u01b0 b\u1ea3n ch\u1ee7ngh\u0129a"], "a": 1, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 56, "t": "Theo ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin, s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed t\u1ed5ng qu\u00e1t c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 th\u00f4ng qua ch\u00ednh \u0111\u1ea3ng ti\u1ec1n phong, giai c\u1ea5p c\u00f4ng nh\u00e2n t\u1ed5 ch\u1ee9c, l\u00e3nh \u0111\u1ea1o nh\u00e2n d\u00e2n lao \u0111\u1ed9ng \u0111\u1ea5u tranh x\u00f3a b\u1ecf c\u00e1c ch\u1ebf \u0111\u1ed9 ng\u01b0\u1eddi b\u00f3c l\u1ed9t ng\u01b0\u1eddi, x\u00f3a b\u1ecf ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, gi\u1ea3i ph\u00f3ng giai c\u1ea5p c\u00f4ng nh\u00e2n, nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u1ecfi m\u1ecdi s\u1ef1 \u00e1p b\u1ee9c, b\u00f3c l\u1ed9t, ngh\u00e8o n\u00e0n, l\u1ea1c h\u1eadu, x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a v\u0103n\u2026", "a": 1}}, {"q": "T\u00e1c ph\u1ea9m n\u00e0o \u0111\u00e1nh d\u1ea5u s\u1ef1ch\u00edn mu\u1ed3i t\u01b0 t\u01b0\u1edfng x\u00e3 h\u1ed9i ch\u1ee7ngh\u0129a c\u1ee7a M\u00e1c v\u00e0 \u0102ngghen?", "o": ["H\u1ec7t\u01b0 t\u01b0\u1edfng \u0110\u1ee9c (1845) A. Gia \u0111\u00ecnh th\u1ea7n th\u00e1nh (1845)", "Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n (1848)", "Kh\u00f4ng c\u00f3 ph\u01b0\u01a1ng \u00e1n N\u00e0o \u0111\u00fang"], "a": 1, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 19, "t": "\u0111\u1ed3ng th\u1eddi \u0111\u00e3 lu\u1eadn ch\u1ee9ng v\u00e0 kh\u1eb3ng \u0111\u1ecbnh v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i s\u1ef1 di\u1ec7t vong kh\u00f4ng tr\u00e1nh kh\u1ecfi c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 s\u1ef1 th\u1eafng l\u1ee3i t\u1ea5t y\u1ebfu c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. c) Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n \u0111\u00e1nh d\u1ea5u s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc \u0110\u01b0\u1ee3c s\u1ef1 \u1ee7y nhi\u1ec7m c\u1ee7a nh\u0169ng ng\u01b0\u1eddi c\u1ed9ng s\u1ea3n v\u00e0 c\u00f4ng nh\u00e2n qu\u1ed1c t\u1ebf, th\u00e1ng 2 n\u0103m 1848, t\u00e1c ph\u1ea9m Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n do c. \u0102ngghen so\u1ea1n th\u1ea3o \u0111\u01b0\u1ee3c c\u00f4ng b\u00f4\" tr\u01b0\u1edbc to\u00e0n th\u1ebf gi\u1edbi."}}, {"q": "Quan h\u1ec7n\u00e0o n\u1ea3y sinh quan h\u1ec7h\u00f4n nh\u00e2n v\u00e0 l\u00e0 m\u1ed1i quan h\u1ec7t\u1ef1nhi\u00ean, l\u00e0 y\u1ebfu t\u1ed1m\u1ea1nh m\u1ebdg\u1eafn k\u1ebft c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh?", "o": ["Nu\u00f4i d\u01b0\u1ee1ng", "H\u00f4n nh\u00e2n", "Huy\u1ebft th\u1ed1ng", "C\u1ea3B v\u00e0 C"], "a": 2, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 239, "t": "Quan h\u1ec7 huy\u1ebft th\u1ed1ng l\u00e0 quan h\u1ec7 gi\u1eefa nh\u1eefng ng\u01b0\u1eddi c\u00f9ng m\u1ed9t d\u00f2ng m\u00e1u, n\u1ea3y sinh t\u1eeb quan h\u1ec7 h\u00f4n nh\u00e2n. \u0110\u00e2y l\u00e0 m\u1ed1\u00ec quan h\u1ec7 t\u1ef1 nhi\u00ean, l\u00e0 y\u1ebfu t\u1ed1 m\u1ea1nh m\u1ebd nh\u1ea5t g\u1eafn k\u1ebft c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh v\u1edbi nhau.", "a": 1}}, {"q": "\u0110i\u1ec1n t\u1eebv\u00e0o ch\u1ed7tr\u1ed1ng: Nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7ngh\u0129a v\u1eeba c\u00f3 b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, v\u1eeba c\u00f3 tinh th\u1ea7n nh\u00e2n d\u00e2n r\u1ed9ng r\u00e3i v\u00e0 t\u00ecnh \u2026. (b\u1ecbc\u1eaft kh th\u1ea5y h\u1ebft)", "o": ["D\u00e2n t\u1ed9c", "Nh\u00e2n \u0111\u1ea1o", "C\u1ed9ng \u0111\u1ed3ng", "Giai c\u1ea5p"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 137, "t": "X\u00e9t v\u1ec1 b\u1ea3n ch\u1ea5t ch\u00ednh tr\u1ecb, d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a v\u1eeba c\u00f3 b\u1ea3n ch\u1ea5t giai c\u1ea5p c\u00f4ng nh\u00e2n, v\u1eeba c\u00f3 t\u00ednh nh\u00e2n d\u00e2n r\u1ed9ng r\u00e3i, t\u00ednh d\u00e2n t\u1ed9c s\u00e2u s\u1eafc.", "a": 1}}, {"q": "Quan h\u1ec7n\u00e0o sau \u0111\u00e2y kh\u00f4ng ph\u1ea3i quan h\u1ec7huy\u1ebft th\u1ed1ng trong gia \u0111\u00ecnh?", "o": ["Quan h\u1ec7gi\u1eefa anh ch\u1ecbem trong gia \u0111\u00ecnh", "Quan h\u1ec7gi\u1eefa \u00f4ng b\u00e0 v\u00e0 ch\u00e1u", "Quan h\u1ec7gi\u1eefa cha m\u1eb9v\u00e0 con c\u00e1i", "Quan h\u1ec7gi\u1eefa v\u1ee3v\u00e0 ch\u1ed3ng"], "a": 3, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "N\u1ec1n d\u00e2n ch\u1ee7XHCN mang b\u1ea3n ch\u1ea5t c\u1ee7a giai c\u1ea5p n\u00e0o?", "o": ["Giai c\u1ea5p c\u00f4ng nh\u00e2n", "Giai c\u1ea5p chi\u1ebfm \u0111a s\u1ed1", "Giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 giai c\u1ea5p n\u00f4ng nh\u00e2n", "Giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 qu\u1ea7n ch\u00fang nh\u00e2n d\u00e2n lao \u0111\u1ed9ng"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 137, "t": "Do v\u1eady, n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a kh\u00e1c v\u1ec1 ch\u1ea5t so v\u00f3i n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n \u1edf b\u1ea3n ch\u1ea5t giai c\u1ea5p (giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 giai c\u1ea5p t\u01b0 s\u1ea3n); \u1edf c\u01a1 ch\u1ebf nh\u1ea5t nguy\u00ean v\u00e0 c\u01a1 ch\u1ebf \u0111a nguy\u00ean;", "a": 1}}, {"q": "H\u1ea1n ch\u1ebfc\u01a1 b\u1ea3n c\u1ee7a c\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng XHCN kh\u00f4ng t\u01b0\u1edfng l\u00e0:", "o": ["Kh\u00f4ng ch\u1ee7tr\u01b0\u01a1ng x\u00f3a b\u1ecfch\u1ebf\u0111\u1ed9t\u01b0 h\u1eefu v\u1ec1t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t", "Mong mu\u1ed1n th\u1ef1c hi\u1ec7n ch\u1ebf\u0111\u1ed9b\u00ecnh qu\u00e2n trong ph\u00e2n ph\u1ed1i", "Kh\u00f4ng th\u1ec3ph\u00e1t hi\u1ec7n ra l\u1ef1c l\u01b0\u1ee3ng ti\u00ean phong th\u1ef1c hi\u1ec7n c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i", "Kh\u00f4ng ch\u1ee7tr\u01b0\u01a1ng x\u00f3a b\u1ecfch\u1ebf\u0111\u1ed9\u00e1p b\u1ee9c b\u00f3c l\u1ed9t"], "a": 2, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "T\u01b0 t\u01b0\u1edfng x\u00e3 h\u1ed9i ch\u1ee7ngh\u0129a b\u1eaft \u0111\u1ea7u h\u00ecnh th\u00e0nh \u1edfch\u1ebf\u0111\u1ed9x\u00e3 h\u1ed9i n\u00e0o?", "o": ["Ch\u1ebf\u0111\u1ed9chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7", "Ch\u1ebf\u0111\u1ed9t\u01b0 b\u1ea3n ch\u1ee7ngh\u0129a", "Ch\u1ebf\u0111\u1ed9c\u00f4ng x\u00e3 nguy\u00ean th\u1ee7y E. Ch\u1ebf\u0111\u1ed9phong ki\u1ebfn"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "Ch\u1ecdn \u00fd \u0111\u00fang \u0111i\u1ec1n v\u00e0o ch\u1ed7tr\u1ed1ng: \u201c[......] l\u00e0 s\u1ea3n ph\u1ea9m c\u1ee7a s\u1ef1k\u1ebft h\u1ee3p ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n trong cu\u1ed9c \u0111\u1ea5u tranh th\u1ef1c hi\u1ec7n s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eedc\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n\u201d", "o": ["\u0110\u1ea3ng C\u1ed9ng s\u1ea3n", "Giai c\u1ea5p t\u01b0 s\u1ea3n", "Giai c\u1ea5p c\u00f4ng nh\u00e2n", "\u0110\u1ea3ng ch\u00ednh tr\u1ecb"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 65, "t": "L \u00fd lu\u1eadn v\u1ec1 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n trong ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u1eabn mang gi\u00e1 tr\u1ecb khoa h\u1ecdc v\u00e0 c\u00e1ch m\u1ea1ng, v\u1eabn c\u00f3 \u00fd ngh\u0129a th\u1ef1c ti\u1ec5n to l\u1edbn, ch\u1ec9 \u0111\u1ea1o cu\u1ed9c \u0111\u1ea5u tranh c\u00e1ch m\u1ea1ng hi\u1ec7n nay c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, phong tr\u00e0o c\u00f4ng nh\u00e2n v\u00e0 qu\u1ea7n ch\u00fang lao \u0111\u1ed9ng, ch\u00f4ng ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 l\u1ef1a ch\u1ecdn con \u0111\u01b0\u1eddng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a trong s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a th\u1ebf gi\u1edbi ng\u00e0y nay.", "a": 1}}, {"q": "Ki\u1ec3u nh\u00e0 n\u01b0\u1edbc n\u00e0o sau \u0111\u00e2y \u0111\u01b0\u1ee3c L\u00eanin g\u1ecdi l\u00e0 nh\u00e0 n\u01b0\u1edbc \u201cN\u1eeda nh\u00e0 n\u01b0\u1edbc\u201d?", "o": ["Nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7ngh\u0129a", "Nh\u00e0 n\u01b0\u1edbc ch\u1ee7n\u00f4", "Nh\u00e0 n\u01b0\u1edbc t\u01b0 s\u1ea3n", "Nh\u00e0 n\u01b0\u1edbc phong ki\u1ebfn"], "a": 0, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "Xu th\u1ebfchung c\u1ee7a c\u00e1c qu\u1ed1c gia - d\u00e2n t\u1ed9c trong th\u1ebfgi\u1edbi ng\u00e0y nay l\u00e0 g\u00ec?", "o": ["Ly khai", "H\u00f2a b\u00ecnh, h\u1ee3p t\u00e1c, ph\u00e1t tri\u1ec3n", "Chi\u1ebfn tranh s\u1eafc t\u1ed9c, t\u00f4n gi\u00e1o", "Xung \u0111\u1ed9t v\u0169 trang"], "a": 1, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 65, "t": "Quan h\u1ec7 s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u1edbi ch\u1ebf \u0111\u1ed9 s\u1edf h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a s\u1ea3n sinh ra t\u00ecnh tr\u1ea1ng b\u00f3c l\u1ed9t n\u00e0y v\u1eabn t\u1ed3n t\u1ea1i. Th\u1ef1c t\u1ebf \u0111\u00f3 cho th\u1ea5y, xung \u0111\u1ed9t v\u1ec1 l\u1ee3i \u00edch c\u01a1 b\u1ea3n gi\u1eefa giai c\u1ea5p t\u01b0 s\u1ea3n v\u00e0 giai c\u1ea5p c\u00f4ng nh\u00e2n (gi\u1eefa t\u01b0 b\u1ea3n v\u00e0 lao \u0111\u1ed9ng) v\u1eabn t\u1ed3n t\u1ea1i, v\u1eabn l\u00e0 nguy\u00ean nh\u00e2n c\u01a1 b\u1ea3n, s\u00e2u xa c\u1ee7a \u0111\u1ea5u tranh giai c\u1ea5p trong x\u00e3 h\u1ed9i hi\u1ec7n \u0111\u1ea1i ng\u00e0y nay. Phong tr\u00e0o c\u1ed9ng s\u1ea3n v\u00e0 c\u00f4ng nh\u00e2n \u1edf nhi\u1ec1u n\u01b0\u1edbc v\u1eabn lu\u00f4n l\u00e0 l\u1ef1c l\u01b0\u1ee3ng \u0111i \u0111\u1ea7u trong c\u00e1c c\u2026"}}, {"q": "Theo M\u00e1c v\u00e0 Ph.\u0102ngghen, c\u00f3 hai ti\u00eau ch\u00ed c\u01a1 b\u1ea3n x\u00e1c \u0111\u1ecbnh giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u00f3 l\u00e0:", "o": ["V\u1ec1ph\u01b0\u01a1ng th\u1ee9c lao \u0111\u1ed9ng, ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t v\u00e0 v\u1ecbtr\u00ed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n trong quan h\u1ec7s\u1ea3n xu\u1ea5t x\u00e3 h\u1ed9i.", "V\u1ec1ph\u01b0\u01a1ng th\u1ee9c lao \u0111\u1ed9ng, ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t v\u00e0 v\u1ecbtr\u00ed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n trong quan h\u1ec7s\u1ea3n xu\u1ea5t.", "V\u1ec1ph\u01b0\u01a1ng th\u1ee9c lao \u0111\u1ed9ng, ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t v\u00e0 v\u1ecbtr\u00ed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n trong quan h\u1ec7s\u1ea3n xu\u1ea5t x\u00e3 h\u1ed9i ch\u1ee7ngh\u0129a.", "V\u1ec1ph\u01b0\u01a1ng th\u1ee9c lao \u0111\u1ed9ng, ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t v\u00e0 v\u1ecbtr\u00ed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n trong quan h\u1ec7s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n ch\u1ee7ngh\u0129a."], "a": 3, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "Ph\u1ea1m tr\u00f9 c\u01a1 b\u1ea3n nh\u1ea5t c\u1ee7a CNXH khoa h\u1ecdc l\u00e0:", "o": ["Giai c\u1ea5p c\u00f4ng nh\u00e2n", "Chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n", "S\u1ee9m\u1ec7nh l\u1ecbch s\u1eedc\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n", "X\u00e3 h\u1ed9i ch\u1ee7ngh\u0129a"], "a": 2, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 51, "t": "l\u00e0 ph\u1ea1m tr\u00f9 trung t\u00e2m, nguy\u00ean l\u00fd xu\u1ea5t ph\u00e1t c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc. \u0110\u00f3 c\u0169ng l\u00e0 tr\u1ecdng \u0111i\u1ec3m c\u1ee7a cu\u1ed9c \u0111\u1ea5u tranh t\u01b0 t\u01b0\u1edfng l\u00fd lu\u1eadn trong th\u00f2i \u0111\u1ea1i ng\u00e0y nay.", "a": 1}}, {"q": "Ai l\u00e0 ng\u01b0\u1eddi \u0111\u1ea7u ti\u00ean \u0111\u01b0a CNXH khoa h\u1ecdc tr\u1edfth\u00e0nh th\u1ef1c ti\u1ec5n sinh \u0111\u1ed9ng?", "o": ["H\u1ed3Ch\u00ed Minh", "Ph.\u0102ng ghen", "C\u00e1c M\u00e1c", "V.I.L\u00eanin"], "a": 3, "s": "\u00d4n Ki\u1ec3m Tra", "e": null}, {"q": "H\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7qu\u00e2n s\u1ef1xu\u1ea5t hi\u1ec7n trong x\u00e3 h\u1ed9i n\u00e0o?", "o": ["Chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7", "Phong ki\u1ebfn", "C\u00f4ng x\u00e3 nguy\u00ean th\u1ee7y", "T\u01b0 b\u1ea3n ch\u1ee7ngh\u0129a"], "a": 2, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 215, "t": "Th\u00fa hai, ngu\u1ed3n g\u1ed1c c\u1ee7a t\u00f4n gi\u00e1o. - Ngu\u1ed3n g\u1ed1c t\u1ef1 nhi\u00ean, kinh t\u1ebf - x\u00e3 h\u1ed9i: Trong x\u00e3 h\u1ed9i c\u00f4ng x\u00e3 nguy\u00ean th\u1ee7y, do l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t ch\u01b0a ph\u00e1t tri\u1ec3n, tr\u01b0\u1edbc thi\u00ean nhi\u00ean h\u00f9ng v\u0129 t\u00e1c \u0111\u1ed9ng v\u00e0 chi ph\u00f4i khi\u1ebfn cho con ng\u01b0\u1eddi c\u1ea3m th\u1ea5y y\u1ebfu \u0111u\u00f4i v\u00e0 b\u1ea5t l\u1ef1c, kh\u00f4ng gi\u1ea3i th\u00edch \u0111\u01b0\u1ee3c, n\u00ean con ng\u01b0\u00f2i \u0111\u00e3 g\u00e1n cho t\u1ef1 nhi\u00ean nh\u1eefng s\u1ee9c m\u1ea1nh, quy\u1ec1n l\u1ef1c th\u1ea7n b\u00ed."}}, {"q": "\u0110\u1eb7c \u0111i\u1ec3m kinh t\u1ebfc\u1ee7a th\u1eddi k\u1ef3qu\u00e1 \u0111\u1ed9t\u1eebCNTB l\u00ean CNXH l\u00e0:", "o": ["T\u1ed3n t\u1ea1i m\u1ed9t n\u1ec1n kinh t\u1ebfch\u1ec9c\u00f3 c\u00e1c th\u00e0nh ph\u1ea7n kinh t\u1ebfCNXH", "T\u1ed3n t\u1ea1i m\u1ed9t ch\u1ebf\u0111\u1ed9s\u1edfh\u1eefu t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t d\u01b0\u1edbi 2 h\u00ecnh th\u1ee9c to\u00e0n d\u00e2n v\u00e0 t\u1eadp th\u1ec3", "N\u1ec1n kinh t\u1ebfch\u1ec9c\u00f3 2 th\u00e0nh ph\u1ea7n: kinh t\u1ebfnh\u00e0 n\u01b0\u1edbc v\u00e0 kinh t\u1ebft\u1eadp th\u1ec3", "T\u1ed3n t\u1ea1i m\u1ed9t n\u1ec1n kinh t\u1ebfnhi\u1ec1u th\u00e0nh ph\u1ea7n"], "a": 3, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 106, "t": "\u0110\u00f3 l\u00e0 th\u1eddi k\u1ef3 l\u00e2u d\u00e0i, gian kh\u1ed5 b\u1eaft \u0111\u1ea7u t\u1eeb khi giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n \u0111\u1ebfn khi x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. C\u00f3 th\u1ec3 kh\u00e1i qu\u00e1t nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m c\u01a1 b\u1ea3n c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i nh\u01b0 sau: a) Tr\u00ean l\u0129nh v\u1ef1c kinh t\u1ebf Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, t\u1ea5t y\u1ebfu t\u1ed3n t\u1ea1i n\u1ec1n kinh t\u1ebf nhi\u1ec1u th\u00e0nh ph\u1ea7n, trong \u0111\u00f3 c\u00f3 th\u00e0nh ph\u1ea7n \u0111\u1ed1\u00ec l\u1eadp."}}, {"q": "C\u0103n c\u1ee9v\u00e0o t\u00ednh ch\u1ea5t quy\u1ec1n l\u1ef1c, Nh\u00e0 n\u01b0\u1edbc s\u1ebdc\u00f3 nh\u1eefng ch\u1ee9c n\u0103ng n\u00e0o?", "o": ["Ch\u1ee9c n\u0103ng kinh t\u1ebf, ch\u00ednh tr\u1ecb, v\u0103n h\u00f3a, x\u00e3 h\u1ed9i", "Ch\u1ee9c n\u0103ng \u0111\u1ed1i n\u1ed9i v\u00e0 \u0111\u1ed1i ngo\u1ea1i", "Ch\u1ee9c n\u0103ng giai c\u1ea5p v\u00e0 ch\u1ee9c n\u0103ng x\u00e3 h\u1ed9i", "Ch\u1ee9c n\u0103ng kinh t\u1ebf- x\u00e3 h\u1ed9i"], "a": 2, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 144, "t": "C\u0103n c\u1ee9 v\u00e0o l\u0129nh v\u1ef1c t\u00e1c \u0111\u1ed9ng c\u1ee7a quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1ed1c, ch\u1ee9c n\u0103ng c\u1ee7a nh\u00e0 n\u01b0\u1ed1c \u0111\u01b0\u1ee3c chia th\u00e0nh ch\u1ee9c n\u0103ng ch\u00ednh tr\u1ecb, kinh t\u00ea' v\u0103n h\u00f3a, x\u00e3 h\u1ed9i,... C\u0103n c\u1ee9 v\u00e0o t\u00ednh ch\u1ea5t c\u1ee7a quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc, ch\u1ee9c n\u0103ng c\u1ee7a nh\u00e0 n\u01b0\u1edbc \u0111\u01b0\u1ee3c chia th\u00e0nh ch\u1ee9c n\u0103ng giai c\u1ea5p (tr\u1ea5n \u00e1p) v\u00e0 ch\u1ee9c n\u0103ng x\u00e3 h\u1ed9i (t\u1ed5 ch\u00fac v\u00e0 x\u00e2y d\u1ef1ng). Xu\u1ea5t ph\u00e1t t\u1eeb b\u1ea3n ch\u1ea5t c\u1ee7a nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, vi\u1ec7c th\u1ef1c hi\u1ec7n c\u00e1c ch\u1ee9c n\u0103ng c\u1ee7a nh\u00e0 n\u01b0\u1edbc c\u0169ng c\u00f3 s\u1ef1 kh\u00e1c bi\u1ec7t so v\u1edbi c\u00e1c nh\u00e0 n\u2026"}}, {"q": "N\u1ed9i dung kinh t\u1ebfc\u1ee7a li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp lao \u0111\u1ed9ng kh\u00e1c trong c\u00e1ch m\u1ea1ng XHCN d\u1ef1a tr\u00ean nguy\u00ean t\u1eafc n\u00e0o?", "o": ["Gi\u1ea3i quy\u1ebft l\u1ee3i \u00edch nhu c\u1ea7u kinh t\u1ebfc\u1ee7a giai c\u1ea5p n\u00f4ng d\u00e2n", "Gi\u1ea3i quy\u1ebft l\u1ee3i \u00edch nhu c\u1ea7u kinh t\u1ebfc\u1ee7a giai c\u1ea5p c\u00f4ng d\u00e2n", "Gi\u1ea3i quy\u1ebft l\u1ee3i \u00edch nhu c\u1ea7u kinh t\u1ebfc\u1ee7a t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c", "K\u1ebft h\u1ee3p \u0111\u00fang \u0111\u1eafn l\u1ee3i \u00edch kinh t\u1ebfc\u1ee7a c\u00f4ng nh\u00e2n, n\u00f4ng d\u00e2n v\u00e0 tr\u00ed th\u1ee9c"], "a": 3, "s": "\u00d4n Ki\u1ec3m Tra", "e": {"p": 182, "t": "ch\u00ednh tr\u1ecb \u0111\u00e3 chuy\u1ec3n tr\u1ecdng t\u00e2m sang ch\u00ednh tr\u1ecb trong l\u0129nh v\u1ef1c kinh t\u1ebf, \u0111\u1ea5u tranh giai c\u1ea5p mang nh\u1eefng n\u1ed9i dung v\u00e0 h\u00ecnh th\u1ee9c m\u1edbi. N\u1ed9i dung n\u00e0y c\u1ea7n th\u1ef1c hi\u1ec7n nh\u1eb1m th\u1ecfa m\u00e3n c\u00e1c nhu c\u1ea7u, l\u1ee3i \u00edch kinh t\u00ea thi\u1ebft th\u00e2n c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n, \u0111\u1ed9i ng\u0169 tr\u00ed th\u1ee9c v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp kh\u00e1c trong x\u00e3 h\u1ed9i, nh\u1eb1m t\u1ea1o c\u01a1 s\u1ecf v\u1eadt ch\u1ea5t - k\u1ef9 thu\u1eadt c\u1ea7n thi\u1ebft cho ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. N\u1ed9i dung kinh t\u1ebf c\u1ee7a li\u00ean minh giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00f3i giai c\u1ea5\u2026"}}, {"q": "C\u00e1c M\u00e1c v\u00e0 Ph.\u0102ngghen \u0111\u00e3 lu\u1eadn gi\u1ea3i m\u1ed9t c\u00e1ch khoa h\u1ecdc v\u00e0 c\u00e1ch m\u1ea1ng v\u1ec1vai tr\u00f2 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng S\u1ea3n trong t\u00e1c ph\u1ea9m n\u00e0o?", "o": ["Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n", "H\u1ec7t\u01b0 t\u
