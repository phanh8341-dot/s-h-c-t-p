0e1t tri\u1ec3n nh\u1ea5t \u0111\u1ecbnh, \u1edf nh\u1eefng th\u1eddi k\u1ef3 l\u1ecbch s\u1eed kh\u00e1c nhau, vai tr\u00f2, t\u00e1c \u0111\u1ed9ng c\u1ee7a t\u1eebng t\u00f4n gi\u00e1o \u0111\u00f4i v\u1edbi \u0111\u00f2i s\u1ed1ng x\u00e3 h\u1ed9i kh\u00f4ng gi\u1ed1ng nhau. Quan \u0111i\u1ec3m, th\u00e1i \u0111\u1ed9 c\u1ee7a c\u00e1c gi\u00e1o h\u1ed9i, gi\u00e1o s\u0129, gi\u00e1o d\u00e2n v\u1ec1 nh\u1eefng l\u0129nh v\u1ef1c c\u1ee7a \u0111\u1eddi s\u1ed1ng x\u00e3 h\u1ed9i lu\u00f4n c\u00f3 s\u1ef1 kh\u00e1c bi\u1ec7t."}}, {"q": "T\u1eadp trung x\u00e2y d\u1ef1ng h\u1ec7 gi\u00e1 tr\u1ecb m\u1edbi: lao \u0111\u1ed9ng, c\u00f4ng b\u1eb1ng, d\u00e2n ch\u1ee7, b\u00ecnh \u0111\u1eb3ng v\u00e0 t\u1ef1 do - l\u00e0 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n thu\u1ed9c n\u1ed9i dung?", "a": "Qu\u1ed1c ph\u00f2ng, an ninh", "e": null}, {"q": "Th\u1ebf n\u00e0o l\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam?", "a": "L\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, nh\u01b0ng ti\u1ebfp thu, k\u1ebf th\u1eeba v\u1ec1 khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7, \u0111\u1ec3 ph\u00e1t tri\u1ec3n nhanh l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t.", "e": {"p": 110, "t": "Con \u0111\u01b0\u1eddng \u0111i l\u00ean c\u1ee7a n\u01b0\u1edbc ta l\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, t\u1ee9c l\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, nh\u01b0ng ti\u1ebfp thu, k\u1ebf th\u1eeba nh\u1eefng th\u00e0nh t\u1ef1u m\u00e0 nh\u00e2n lo\u1ea1i \u0111\u00e3 \u0111\u1ea1t \u0111\u01b0\u1ee3c d\u01b0\u1edbi ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u0111\u1eb7c bi\u1ec7t v\u1ec1 khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7, \u0111\u1ec3 ph\u00e1t tri\u1ec3n nhanh l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n\u2026", "a": 1}}, {"q": "Th\u00eam c\u1ee5m t\u1eeb th\u00edch h\u1ee3p v\u00e0o ch\u1ed7 tr\u1ed1ng c\u1ee7a c\u00e2u sau \u0111\u1ec3 \u0111\u01b0\u1ee3c c\u00e2u \u0111\u00fang: \u201c Trong ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, v\u1edbi n\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p ng\u00e0y c\u00e0ng ph\u00e1t tri\u1ec3n th\u00ec l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t h\u00e0ng \u0111\u1ea7u c\u1ee7a to\u00e0n nh\u00e2n lo\u1ea1i l\u00e0", "a": "\u2026\u2026. C\u00f4ng nh\u00e2n, l\u00e0 ng\u01b0\u1eddi lao \u0111\u1ed9ng", "e": null}, {"q": "Th\u00eam c\u1ee5m t\u1eeb th\u00edch h\u1ee3p v\u00e0o ch\u1ed7 tr\u1ed1ng sau \u0111\u1ec3 \u0111\u01b0\u1ee3c c\u00e2u ho\u00e0n ch\u1ec9nh: \u201c v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i: M\u1ee5c ti\u00eau cao nh\u1ea5t c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0\u2026(1).. tr\u00ean c\u01a1 s\u1edf \u0111i\u1ec1u ki\u1ec7n kinh t\u1ebf - x\u00e3 h\u1ed9i ph\u00e1t tri\u1ec3n, m\u00e0 x\u00e9t \u0111\u1ebfn c\u00f9ng l\u00e0 tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n cao c\u1ee7a ..(2)...\u201d \u2192", "a": "(1) Gi\u1ea3i ph\u00f3ng con ng\u01b0\u1eddi; (2) l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t", "e": null}, {"q": "Th\u00eam c\u1ee5m t\u1eeb th\u00edch h\u1ee3p v\u00e0o ch\u1ed7 tr\u1ed1ng c\u1ee7a c\u00e2u sau \u0111\u1ec3 \u0111\u01b0\u1ee3c lu\u1eadn \u0111i\u1ec3m \u0111\u00fang: \u201c D\u00e2n ch\u1ee7 v\u1eeba l\u00e0..(1).. v\u1eeba l\u00e0..(2)..c\u1ee7a c\u00f4ng cu\u1ed9c x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u2014>", "a": "(1) M\u1ee5c ti\u00eau ; (2) \u0110\u1ed9ng l\u1ef1c", "e": null}, {"q": "Th\u00eam c\u1ee5m t\u1eeb th\u00edch h\u1ee3p v\u00e0o ch\u1ed7 tr\u1ed1ng c\u1ee7a c\u00e2u sau \u0111\u1ec3 ho\u00e0n th\u00e0nh lu\u1eadn \u0111i\u1ec3m c\u1ee7a V. I.L\u00eanin \u201c \u0110i\u1ec3m ch\u1ee7 y\u1ebfu trong h\u1ecdc thuy\u1ebft c\u1ee7a M\u00e1c l\u00e0 \u1edf ch\u1ed7 n\u00f3 l\u00e0m s\u00e1ng r\u00f5 vai tr\u00f2 l\u1ecbch s\u1eed th\u1ebf gi\u1edbi c\u1ee7a\u2026. l\u00e0 ng\u01b0\u1eddi x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i\u201d \u2192", "a": "Giai c\u1ea5p n\u00f4ng d\u00e2n", "e": null}, {"q": "Theo C.Ma\u0301c va\u0300 Ph.\u0102ngghen, hai ph\u01b0\u01a1ng ti\u1ec7n c\u01a1 b\u1ea3n x\u00e1c \u0111\u1ecbnh giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 ?", "a": "Kinh t\u1ebf - x\u00e3 h\u1ed9i v\u00e0 Ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "e": null}, {"q": "Theo C.Ma\u0301c va\u0300 Ph.\u0102ngghen, hai ph\u01b0\u01a1ng di\u1ec7n c\u01a1 b\u1ea3n x\u00e1c \u0111\u1ecbnh giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 ?", "a": "Ch\u00ednh tr\u1ecb- x\u00e3 h\u1ed9i v\u00e0 C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p", "e": null}, {"q": "Theo C\u00e1c M\u00e1c, nh\u1eefng ng\u01b0\u1eddi v\u00f4 s\u1ea3n c\u00f3 th\u1ec3 h\u00e0nh \u0111\u1ed9ng v\u1edbi t\u01b0 c\u00e1ch l\u00e0 m\u1ed9t giai c\u1ea5p khi n\u00e0o?", "a": "Khi \u0111\u1ea1t t\u1edbi s\u1ef1 gi\u00e1c \u0111\u1ed9 v\u1ec1 \u0111\u1ecba v\u1ecb l\u1ecbch s\u1eed c\u1ee7a kh\u1ea3 n\u0103ng h\u00e0nh \u0111\u1ed9ng ch\u00ednh tr\u1ecb \u0111\u1ec3 t\u1eebng b\u01b0\u1edbc \u0111\u1ea1t m\u1ee5c ti\u00eau c\u00e1ch m\u1ea1ng", "e": null}, {"q": "Theo c\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng Hy L\u1ea1p c\u1ed5 \u0111\u1ea1i, ph\u1ea1m tr\u00f9 d\u00e2n ch\u1ee7 - \u201cdemoskratos\u201d \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0", "a": "Nh\u00e2n d\u00e2n cai tr\u1ecb", "e": {"p": 125, "t": "C\u00e1c nh\u00e0 t\u01b0 t\u01b0\u1edfng Hy L\u1ea1p c\u1ed5 \u0111\u1ea1i \u0111\u00e3 d\u00f9ng c\u1ee5m t\u1eeb \u201cdemoskratos\u201d \u0111\u1ec3 n\u00f3i \u0111\u1ebfn d\u00e2n ch\u1ee7, trong \u0111\u00f3 \u201cdemos\u201d l\u00e0 nh\u00e2n d\u00e2n (danh t\u1eeb) v\u00e0 \u201ckratos\u201d l\u00e0 cai tr\u1ecb (\u0111\u1ed9ng t\u1eeb). Theo \u0111\u00f3, d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0 nh\u00e2n d\u00e2n cai tr\u1ecb, sau n\u00e0y \u0111\u01b0\u1ee3c c\u00e1c nh\u00e0 ch\u00ednh tr\u1ecb g\u1ecdi gi\u1ea3n l\u01b0\u1ee3c l\u00e0 quy\u1ec1n l\u1ef1c c\u1ee7a nh\u00e2n d\u00e2n, hay quy\u1ec1n l\u1ef1c thu\u1ed9c v\u1ec1 nh\u00e2n d\u00e2n.", "a": 1}}, {"q": "Theo F. Engels, hai ph\u00e1t ki\u1ebfn v\u0129 \u0111\u1ea1i n\u00e0o \u0111\u00e3 \u0111\u01b0a CNXH tr\u1edf th\u00e0nh m\u1ed9t khoa h\u1ecdc?", "a": "H\u1ecdc thuy\u1ebft gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0 v\u00e0 Ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed", "e": {"p": 18, "t": "\u0102ngghen l\u00e0 s\u1ef1 kh\u1eb3ng \u0111\u1ecbnh v\u1ec1 m\u1eb7t tri\u1ebft h\u1ecdc s\u1ef1 s\u1ee5p \u0111\u1ed5 c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 s\u1ef1 th\u1eafng l\u1ee3i c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u0111\u1ec1u t\u1ea5t y\u1ebfu nh\u01b0 nhau. - H\u1ecdc thuy\u1ebft v\u1ec1 gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0 T\u1eeb vi\u1ec7c ph\u00e1t hi\u1ec7n ra ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed, c.", "a": 1}}, {"q": "Theo K. Marx v\u00e0 F. Engels, ch\u1ec9 c\u00f3 hai ti\u00eau ch\u00ed c\u01a1 b\u1ea3n n\u00f3i l\u00ean th\u1ebf, l\u00e0 ng\u01b0\u1eddi c\u00f4ng nh\u00e2n \u0111\u00f3 l\u00e0", "a": "V\u1ec1 ph\u01b0\u01a1ng th\u1ee9c lao \u0111\u1ed9ng, ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t v\u00e0 v\u1ecb tr\u00ed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n trong quan h\u1ec7 s\u1ea3n xu\u1ea5t XHCN", "e": null}, {"q": "Theo K. Marx v\u00e0 F. Engels, \u0111i\u1ec3m gi\u1ed1ng nhau gi\u1eefa hai giai \u0111o\u1ea1n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i CSCN l\u00e0", "a": "C\u00f9ng d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 TLSX; kh\u00f4ng t\u1ed3n t\u1ea1i nh\u00e0 n\u01b0\u1edbc; Kh\u00f4ng c\u00f2n \u0111\u1ea5u tranh giai c\u1ea5p", "e": null}, {"q": "Theo K. Marx, nh\u1eefng ng\u01b0\u1eddi v\u00f4 s\u1ea3n c\u00f3 th\u1ec3 h\u00e0nh \u0111\u1ed9ng v\u1edbi t\u01b0 c\u00e1ch l\u00e0 m\u1ed9t giai c\u1ea5p khi n\u00e0o?", "a": "Khi \u0111\u1ea1t t\u1edbi s\u1ef1 gi\u00e1c \u0111\u1ed9 v\u1ec1 \u0111\u1ecba v\u1ecb l\u1ecbch s\u1eed c\u1ee7a kh\u1ea3 n\u0103ng h\u00e0nh \u0111\u1ed9ng ch\u00ednh tr\u1ecb \u0111\u1ec3 t\u1eebng b\u01b0\u1edbc \u0111\u1ea1t m\u1ee5c ti\u00eau c\u00e1ch m\u1ea1ng", "e": null}, {"q": "Theo V.I.L\u00eanin, h\u1ec7 th\u1ed1ng chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n \u1edf n\u01b0\u1edbc Nga bao g\u1ed3m", "a": "\u0110\u1ea3ng Bonsevich l\u00e3nh \u0111\u1ea1o, nh\u00e0 n\u01b0\u1edbc X\u00f4 vi\u1ebft qu\u1ea3n l\u00fd v\u00e0 t\u1ed5 ch\u1ee9c c\u00f4ng \u0111o\u00e0n", "e": {"p": 27, "t": "L\u00eanin l\u00e0 ng\u01b0\u1eddi \u0111\u1ea7u ti\u00ean n\u00f3i \u0111\u1ebfn ph\u1ea1m tr\u00f9 h\u1ec7 th\u1ed1ng chuy\u00ean ch\u00ednh v\u00f4 s\u1ea3n, bao g\u1ed3m h\u1ec7 th\u1ed1ng c\u1ee7a \u0110\u1ea3ng B\u00f4ns\u00eav\u00edch l\u00e3nh \u0111\u1ea1o, Nh\u00e0 n\u01b0\u1edbc X\u00f4vi\u1ebft qu\u1ea3n l\u00fd v\u00e0 t\u1ed5 ch\u1ee9c c\u00f4ng \u0111o\u00e0n;", "a": 1}}, {"q": "Theo L\u00eanin, \u0111\u1ec3 d\u1ea7n d\u1ea7n c\u1ea3i ti\u1ebfn ch\u1ebf \u0111\u1ed9 s\u1edf h\u1eefu c\u1ee7a c\u00e1c nh\u00e0 t\u01b0 b\u1ea3n h\u1ea1ng trung v\u00e0 h\u1ea1ng nh\u1ecf th\u00e0nh s\u1edf h\u1eefu c\u00f4ng c\u1ed9ng, c\u1ea7n ph\u1ea3i s\u1eed d\u1ee5ng r\u1ed9ng r\u00e3i h\u00ecnh th\u1ee9c kinh t\u1ebf n\u00e0o? ->", "a": "T\u01b0 b\u1ea3n nh\u00e0 n\u01b0\u1edbc", "e": {"p": 29, "t": "B\u00ean c\u1ea1nh \u0111\u00f3 l\u00e0 vi\u1ec7c s\u1eed d\u1ee5ng r\u1ed9ng r\u00e3i h\u00ecnh th\u1ee9c ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n nh\u00e0 n\u01b0\u1edbc \u0111\u1ec3 d\u1ea7n d\u1ea7n c\u1ea3i ti\u1ebfn ch\u1ebf \u0111\u1ed9 s\u1edf h\u1eefu c\u1ee7a c\u00e1c nh\u00e0 t\u01b0 b\u1ea3n h\u1ea1ng trung v\u00e0 h\u1ea1ng nh\u1ecf th\u00e0nh s\u1edf h\u1eefu c\u00f4ng c\u1ed9ng.", "a": 1}}, {"q": "Theo L\u00eanin, h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a c\u00f3 nh\u1eefng th\u1eddi k\u1ef3 n\u00e0o?", "a": "Qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n", "e": {"p": 87, "t": "\u0102ngghen cho r\u1eb1ng, h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a ph\u00e1t tri\u1ec3n t\u1eeb th\u1ea5p l\u00ean cao qua hai giai \u0111o\u1ea1n, giai \u0111o\u1ea1n th\u1ea5p v\u00e0 giai \u0111o\u1ea1n cao; gi\u1eefa x\u00e3 h\u1ed9i t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u00e0 x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a l\u00e0 th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n."}}, {"q": "Theo L\u00eanin, khi gi\u1ea3i quy\u1ebft quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft ph\u1ea3i l\u01b0u \u00fd v\u1ea5n \u0111\u1ec1 g\u00ec?", "a": "Ph\u1ea3i c\u00f3 quan \u0111i\u1ec3m l\u1ecbch s\u1eed c\u1ee5 th\u1ec3", "e": null}, {"q": "Theo L\u00eanin, quy lu\u1eadt h\u00ecnh th\u00e0nh v\u00e0 ph\u00e1t tri\u1ec3n \u0110\u1ea3ng C\u1ed9ng s\u1ea3n c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0", "a": "Ch\u1ee7 ngh\u0129a M\u00e1c- L\u00eanin k\u1ebft h\u1ee3p v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n", "e": {"p": 63, "t": "\u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam ra \u0111\u1eddi l\u00e0 k\u1ebft qu\u1ea3 c\u1ee7a s\u1ef1 k\u1ebft h\u1ee3p gi\u1eefa ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n v\u00e0 phong tr\u00e0o y\u00eau n\u01b0\u1edbc c\u1ee7a d\u00e2n t\u1ed9c.", "a": 1}}, {"q": "Theo M\u00e1c - \u0102ngghen, \u0111i\u1ec3m gi\u1ed1ng nhau gi\u1eefa c\u00e1c giai \u0111o\u1ea1n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a l\u00e0?", "a": "\u0110\u1ec1u d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t", "e": {"p": 95, "t": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i c\u00f3 n\u1ec1n kinh t\u1ebf ph\u00e1t tri\u1ec3n cao, v\u1ed1i l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i, quan h\u1ec7 s\u1ea3n xu\u1ea5t d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u0169u v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c, qu\u1ea3n l\u00fd c\u00f3 hi\u1ec7u qu\u1ea3, n\u0103ng su\u1ea5t lao \u0111\u1ed9ng cao v\u00e0 ph\u00e2n ph\u1ed1i ch\u1ee7 y\u1ebfu theo lao \u0111\u1ed9ng.", "a": 1}}, {"q": "Theo M\u00e1c- Angghen, \u0111i\u1ec3m gi\u1ed1ng nhau gi\u1eefa c\u00e1c giai \u0111o\u1ea1n c\u1ee7a h\u00ecnh th\u00e1i kinh t\u1ebf- x\u00e3 h\u1ed9i CSCN l\u00e0", "a": "C\u00f9ng d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t", "e": {"p": 95, "t": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i c\u00f3 n\u1ec1n kinh t\u1ebf ph\u00e1t tri\u1ec3n cao, v\u1ed1i l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t hi\u1ec7n \u0111\u1ea1i, quan h\u1ec7 s\u1ea3n xu\u1ea5t d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u0169u v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c, qu\u1ea3n l\u00fd c\u00f3 hi\u1ec7u qu\u1ea3, n\u0103ng su\u1ea5t lao \u0111\u1ed9ng cao v\u00e0 ph\u00e2n ph\u1ed1i ch\u1ee7 y\u1ebfu theo lao \u0111\u1ed9ng.", "a": 1}}, {"q": "Theo Ngh\u1ecb quy\u1ebft \u0110\u1ea1i h\u1ed9i \u0111\u1ea1i bi\u1ec3u to\u00e0n qu\u1ed1c l\u1ea7n th\u1ee9 XIII c\u1ee7a \u0110\u1ea3ng, \u0111\u1ec3 th\u1ef1c h\u00e0nh v\u00e0 ph\u00e1t huy r\u1ed9ng r\u00e3i quy\u1ec1n l\u00e0m ch\u1ee7 c\u1ee7a nh\u00e2n d\u00e2n v\u00e0 vai tr\u00f2 ch\u1ee7 th\u1ec3 c\u1ee7a nh\u00e2n d\u00e2n, c\u1ea7n th\u1ef1c hi\u1ec7n hi\u1ec7u qu\u1ea3 ph\u01b0\u01a1ng ch\u00e2m n\u00e0o?", "a": "D\u00e2n bi\u1ebft, d\u00e2n b\u00e0n, d\u00e2n l\u00e0m, d\u00e2n ki\u1ec3m tra, d\u00e2n gi\u00e1m s\u00e1t, d\u00e2n th\u1ee5 h\u01b0\u1edfng", "e": null}, {"q": "Theo ngh\u0129a chung nh\u1ea5t d\u00e2n ch\u1ee7 l\u00e0 g\u00ec?", "a": "L\u00e0 quy\u1ec1n l\u1ef1c thu\u1ed9c v\u1ec1 nh\u00e2n d\u00e2n", "e": {"p": 125, "t": "Th\u00fa nh\u1ea5t, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n quy\u1ec1n l\u1ef1c, d\u00e2n ch\u1ee7 l\u00e0 quy\u1ec1n l\u1ef1c thu\u1ed9c v\u1ec1 nh\u00e2n d\u00e2n, nh\u00e2n d\u00e2n l\u00e0 ch\u1ee7 nh\u00e2n c\u1ee7a nh\u00e0 n\u01b0\u1edbc. D\u00e2n ch\u1ee7 l\u00e0 quy\u1ec1n l\u1ee3i c\u1ee7a nh\u00e2n d\u00e2n - quy\u1ec1n d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u theo ngh\u0129a r\u1ed9ng.", "a": 1}}, {"q": "Theo ngh\u0129a r\u1ed9ng, ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0", "a": "Ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, lu\u1eadn gi\u1ea3i t\u1eeb c\u00e1c gi\u00e1c \u0111\u1ed9 tri\u1ebft h\u1ecdc, kinh t\u1ebf h\u1ecdc ch\u00ednh tr\u1ecb v\u00e0 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u1ec1 s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1ea5t y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n", "e": {"p": 11, "t": "M\u00e1c - L\u00eanin, lu\u1eadn gi\u1ea3i t\u1eeb c\u00e1c gi\u00e1c \u0111\u1ed9 tri\u1ebft h\u1ecdc, kinh t\u1ebf h\u1ecdc ch\u00ednh tr\u1ecb v\u00e0 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i v\u1ec1 s\u1ef1 chuy\u1ec3n bi\u1ebfn t\u1ea5t y\u1ebfu c\u1ee7a x\u00e3 h\u1ed9i lo\u00e0i ng\u01b0\u1eddi t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n. L\u00eanin \u0111\u00e3 \u0111\u00e1nh gi\u00e1 kh\u00e1i qu\u00e1t b\u1ed9 T\u01b0 b\u1ea3n:", "a": 1}}, {"q": "Theo ngh\u0129a r\u1ed9ng, d\u00e2n t\u1ed9c l\u00e0?", "a": "Qu\u1ed1c gia", "e": {"p": 196, "t": "V\u00ed d\u1ee5, d\u00e2n t\u1ed9c \u1ea4n \u0110\u1ed9, d\u00e2n t\u1ed9c Trung Hoa, d\u00e2n t\u1ed9c Vi\u1ec7t Nam, V.V.. Theo ngh\u0129a r\u1ed9ng, d\u00e2n t\u1ed9c c\u00f3 m\u1ed9t s\u1ed1 \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n sau:", "a": 1}}, {"q": "Theo Ph. \u0102ngghen,\u201d Ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a t\u1ea1o ra m\u1ed9t l\u1ef1c l\u01b0\u1ee3ng b\u1ecb bu\u1ed9c ph\u1ea3i ho\u00e0n th\u00e0nh cu\u1ed9c c\u00e1ch m\u1ea1ng \u1ea5y, n\u1ebfu kh\u00f4ng th\u00ec s\u1ebd b\u1ecb di\u1ec7t vong\u201d. L\u1ef1c l\u01b0\u1ee3ng \u0111\u00f3 l\u00e0 l\u1ef1c l\u01b0\u1ee3ng n\u00e0o?", "a": "Giai c\u1ea5p v\u00f4 s\u1ea3n hi\u1ec7n \u0111\u1ea1i", "e": null}, {"q": "Theo Ph. \u0102ngghen, c\u01a1 s\u1edf n\u00e0o l\u00e0m cho h\u00f4n nh\u00e2n \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n d\u1ef1a tr\u00ean c\u01a1 s\u1edf t\u00ecnh y\u00eau ch\u1ee9 kh\u00f4ng ph\u1ea3i v\u00ec l\u00fd do kinh t\u1ebf, \u0111\u1ecba v\u1ecb x\u00e3 h\u1ed9i hay m\u1ed9t s\u1ef1 t\u00ednh to\u00e1n n\u00e0o kh\u00e1c?", "a": "T\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t chuy\u1ec3n th\u00e0nh t\u00e0i s\u1ea3n chung", "e": {"p": 250, "t": "X\u00f3a b\u1ecf ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t c\u0169ng l\u00e0 c\u01a1 s\u1edf l\u00e0m cho h\u00f4n nh\u00e2n \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n d\u1ef1a tr\u00ean c\u01a1 s\u1edf t\u00ecnh y\u00eau ch\u1ee9 kh\u00f4ng ph\u1ea3i v\u00ec l\u00fd do kinh t\u1ebf, \u0111\u1ecba v\u1ecb x\u00e3 h\u1ed9i hay m\u1ed9t s\u1ef1 t\u00ednh to\u00e1n n\u00e0o kh\u00e1c. To\u00e0n t\u1eadp, S\u0111d, t.42, tr.464.", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a c\u00e1c nh\u00e0 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc, c\u00f3 th\u1ec3 kh\u00e1i qu\u00e1t m\u1ea5y \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i?", "a": "6", "e": {"p": 92, "t": "\u0102ngghen v\u00e0 nh\u1eefng quan \u0111i\u1ec3m c\u1ee7a V.I. L\u00eanin v\u1ec1 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1ed5c Nga X\u00f4vi\u1ebft, c\u00f3 th\u1ec3 kh\u00e1i qu\u00e1t nh\u1eefng \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i nh\u01b0 sau:", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, c\u01a1 s\u1edf \u0111\u1ec3 th\u1ef1c hi\u1ec7n quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft v\u00e0 x\u00e2y d\u1ef1ng m\u1ed1i quan h\u1ec7 h\u1eefu ngh\u1ecb, h\u1ee3p t\u00e1c gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c l\u00e0?", "a": "Quy\u1ec1n b\u00ecnh \u0111\u1eb3ng gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c", "e": {"p": 203, "t": "Quy\u1ec1n b\u00ecnh \u0111\u1eb3ng gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c l\u00e0 c\u01a1 s\u1edf \u0111\u1ec3 th\u1ef1c hi\u1ec7n quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft v\u00e0 x\u00e2y d\u1ef1ng m\u1ed1i quan h\u1ec7 h\u1eefu ngh\u1ecb, h\u1ee3p t\u00e1c gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c. Hai l\u00e0, c\u00e1c d\u00e2n t\u1ed9c \u0111\u01b0\u1ee3c quy\u1ec1n t\u1ef1 quy\u1ebft.", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, d\u00e2n ch\u1ee7 trong ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i bao qu\u00e1t c\u00e1c m\u1eb7t c\u1ee7a \u0111\u1eddi s\u1ed1ng x\u00e3 h\u1ed9i, trong \u0111\u00f3 d\u00e2n ch\u1ee7 tr\u00ean l\u0129nh v\u1ef1c n\u00e0o l\u00e0 c\u01a1 s\u1edf", "a": "? X\u00e3 h\u1ed9i", "e": null}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, nguy\u00ean nh\u00e2n quy\u1ebft \u0111\u1ecbnh s\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c l\u00e0?", "a": "S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t", "e": {"p": 195, "t": "th\u1ecb t\u1ed9c, b\u1ed9 l\u1ea1c, b\u1ed9 t\u1ed9c, d\u00e2n t\u1ed9c. S\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ch\u00ednh l\u00e0 nguy\u00ean nh\u00e2n quy\u1ebft \u0111\u1ecbnh s\u1ef1 bi\u1ebfn \u0111\u1ed5i c\u1ee7a c\u1ed9ng \u0111\u1ed3ng d\u00e2n t\u1ed9c.", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, trong c\u00e1c x\u00e3 h\u1ed9i d\u1ef1a tr\u00ean ch\u1ebf \u0111\u1ed9 t\u01b0 h\u1eefu, ch\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng th\u1ef1c ch\u1ea5t ch\u1ec9 \u0111\u1ed1i v\u1edbi ng\u01b0\u1eddi ph\u1ee5 n\u1eef, v\u00ec", "a": "Ch\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng sinh ra t\u1eeb s\u1ef1 t\u1eadp trung nhi\u1ec1u c\u1ee7a c\u1ea3i v\u00e0o tay m\u1ed9t ng\u01b0\u1eddi - ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng, v\u00e0 nguy\u1ec7n v\u1ecdng chuy\u1ec3n c\u1ee7a c\u1ea3i \u1ea5y l\u1ea1i cho con c\u00e1i c\u1ee7a ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng \u1ea5y", "e": {"p": 254, "t": "\u201cCh\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng sinh ra t\u1eeb s\u1ef1 t\u1eadp trung nhi\u1ec1u c\u1ee7a c\u1ea3i v\u00e0o tay m\u1ed9t ng\u01b0\u1eddi, - v\u00e0o tay ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng - v\u00e0 t\u1eeb nguy\u1ec7n v\u1ecdng chuy\u1ec3n c\u1ee7a c\u1ea3i \u1ea5y l\u1ea1i cho con c\u00e1i c\u1ee7a ng\u01b0\u1eddi \u0111\u00e0n \u00f4ng \u1ea5y, ch\u1ee9 kh\u00f4ng ph\u1ea3i c\u1ee7a ng\u01b0\u1eddi n\u00e0o kh\u00e1c. V\u00ec th\u1ebf, c\u1ea7n ph\u1ea3i c\u00f3 ch\u1ebf \u0111\u1ed9 m\u1ed9t v\u1ee3 m\u1ed9t ch\u1ed3ng v\u1ec1 ph\u00eda ng\u01b0\u1eddi v\u1ee2, ch\u1ee9 kh\u00f4ng ph\u1ea3i v\u1ec1 ph\u00eda ng\u01b0\u1eddi ch\u1ed3ng\u201d2.", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n quy\u1ec1n l\u1ef1c, d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0", "a": "Quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc thu\u1ed9c s\u1edf h\u1eefu c\u1ee7a nh\u00e2n d\u00e2n, c\u1ee7a x\u00e3 h\u1ed9i", "e": {"p": 125, "t": "D\u00e2n ch\u1ee7 l\u00e0 quy\u1ec1n l\u1ee3i c\u1ee7a nh\u00e2n d\u00e2n - quy\u1ec1n d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u theo ngh\u0129a r\u1ed9ng. Quy\u1ec1n l\u1ee3i c\u0103n b\u1ea3n nh\u1ea5t c\u1ee7a nh\u00e2n d\u00e2n ch\u00ednh l\u00e0 quy\u1ec1n l\u1ef1c nh\u00e0 n\u01b0\u1edbc thu\u1ed9c s\u1edf h\u1eefu c\u1ee7a nh\u00e2n d\u00e2n, c\u1ee7a x\u00e3 h\u1ed9i;", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin x\u00e9t tr\u00ean ph\u01b0\u01a1ng di\u1ec7n ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i v\u00e0 trong l\u0129nh v\u1ef1c ch\u00ednh tr\u1ecb, d\u00e2n ch\u1ee7 l\u00e0", "a": "M\u1ed9t h\u00ecnh th\u1ee9c hay h\u00ecnh th\u00e1i nh\u00e0 n\u01b0\u1edbc, l\u00e0 ch\u00ednh th\u1ec3 d\u00e2n ch\u1ee7 hay ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7", "e": {"p": 126, "t": "Th\u00fa hai, tr\u00ean ph\u01b0\u01a1ng di\u1ec7n ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i v\u00e0 trong l\u0129nh v\u1ef1c ch\u00ednh tr\u1ecb, d\u00e2n ch\u1ee7 l\u00e0 m\u1ed9t h\u00ecnh th\u1ee9c hay h\u00ecnh th\u00e1i nh\u00e0 n\u01b0\u1ed5c, l\u00e0 ch\u00ednh th\u1ec3 d\u00e2n ch\u1ee7 hay ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7.", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c \u2013 L\u00eanin, v\u1edbi c\u00e1ch ti\u1ebfp c\u1eadn d\u00e2n ch\u1ee7 l\u00e0 m\u1ed9t h\u00ecnh th\u1ee9c hay h\u00ecnh th\u00e1i nh\u00e0 n\u01b0\u1edbc, d\u00e2n ch\u1ee7 \u0111\u01b0\u1ee3c hi\u1ec3u l\u00e0", "a": "Ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7", "e": null}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c- L\u00eanin, lu\u1eadn \u0111i\u1ec3m n\u00e0o sau \u0111\u00e2y n\u00f3i v\u1ec1 b\u1ea3n ch\u1ea5t c\u1ee7a giai c\u1ea5p t\u01b0 s\u1ea3n?", "a": "Giai c\u1ea5p t\u01b0 s\u1ea3n b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0", "e": null}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a C. M\u00e1c v\u00e0 Ph. \u0102ngghen h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a tr\u1ea3i qua c\u00e1c giai \u0111o\u1ea1n", "a": "Giai \u0111o\u1ea1n th\u1ea5p v\u00e0 giai \u0111o\u1ea1n cao", "e": {"p": 87, "t": "\u0102ngghen cho r\u1eb1ng, h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a ph\u00e1t tri\u1ec3n t\u1eeb th\u1ea5p l\u00ean cao qua hai giai \u0111o\u1ea1n, giai \u0111o\u1ea1n th\u1ea5p v\u00e0 giai \u0111o\u1ea1n cao; gi\u1eefa x\u00e3 h\u1ed9i t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u00e0 x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a l\u00e0 th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n.", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m c\u1ee7a Ph. \u0102ngghen ( trong t\u00e1c ph\u1ea9m ch\u1ed1ng Duyrinh), ch\u1ee7 ngh\u0129a M\u00e1c bao g\u1ed3m c\u00e1c b\u1ed9 ph\u1eadn qu\u1ea3n l\u00fd lu\u1eadn n\u00e0o?", "a": "Tri\u1ebft h\u1ecdc, Kinh t\u1ebf ch\u00ednh tr\u1ecb h\u1ecdc, Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc", "e": {"p": 11, "t": "Trong t\u00e1c ph\u1ea9m Ch\u1ed1ng \u0110uyrinh, Ph. \u00c1ngghen \u0111\u00e3 vi\u1ebft ba ph\u1ea7n:", "a": 1}}, {"q": "Theo quan \u0111i\u1ec3m M\u00e1c x\u00edt, nh\u00e0 n\u01b0\u1edbc h\u00ecnh th\u00e0nh khi v\u00e0 ch\u1ec9 khi", "a": "H\u00ecnh th\u00e0nh giai c\u1ea5p v\u00e0 \u0111\u1ea5u tranh giai c\u1ea5p", "e": {"p": 125, "t": "T\u1eeb vi\u1ec7c nghi\u00ean c\u1ee9u c\u00e1c ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 trong l\u1ecbch s\u1eed v\u00e0 th\u1ef1c ti\u1ec5n l\u00e3nh \u0111\u1ea1o c\u00e1ch m\u1ea1ng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, c\u00e1c nh\u00e0 s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin cho r\u1eb1ng, d\u00e2n ch\u1ee7 l\u00e0 s\u1ea3n ph\u1ea9m v\u00e0 l\u00e0 th\u00e0nh qu\u1ea3 c\u1ee7a qu\u00e1 tr\u00ecnh \u0111\u1ea5u tranh giai c\u1ea5p cho nh\u1eefng gi\u00e1 tr\u1ecb ti\u1ebfn b\u1ed9 c\u1ee7a nh\u00e2n lo\u1ea1i, l\u00e0 m\u1ed9t h\u00ecnh th\u1ee9c t\u1ed5 ch\u1ee9c nh\u00e0 n\u01b0\u1edbc c\u1ee7a giai c\u1ea5p c\u1ea7m quy\u1ec1n, l\u00e0 m\u1ed9t trong nh\u1eefng nguy\u00ean t\u1eafc ho\u1ea1t \u0111\u1ed9ng c\u1ee7a c\u00e1c t\u1ed5 ch\u1ee9c\u2026", "a": 1}}, {"q": "Theo quy \u0111\u1ecbnh c\u1ee7a giai c\u1ea5p c\u1ea7m quy\u1ec1n trong n\u1ec1n d\u00e2n ch\u1ee7 ch\u1ee7 n\u00f4 \u201c nh\u00e2n d\u00e2n\u201d l\u00e0", "a": "Ch\u1ee7 n\u00f4, tang l\u1eef, th\u01b0\u01a1ng gia v\u00e0 m\u1ed9t s\u1ed1 tri th\u1ee9c t\u00edn \u0111\u1ed3", "e": {"p": 130, "t": "Tuy nhi\u00ean, \u201cD\u00e2n l\u00e0 ai?\u201d, theo quy \u0111\u1ecbnh c\u1ee7a giai c\u1ea5p c\u1ea7m quy\u1ec3n ch\u1ec9 g\u1ed3m giai c\u1ea5p ch\u1ee7 n\u00f4 v\u00e0 ph\u1ea7n n\u00e0o thu\u1ed9c v\u1ec1 c\u00e1c c\u00f4ng d\u00e2n t\u1ef1 do (t\u0103ng l\u1eef, th\u01b0\u01a1ng gia v\u00e0 m\u1ed9t s\u1ed1 tr\u00ed th\u1ee9c). \u0110a s\u1ed1 c\u00f2n l\u1ea1i kh\u00f4ng ph\u1ea3i l\u00e0 \u201cd\u00e2n\u201d m\u00e0 l\u00e0 \u201cn\u00f4 l\u1ec7\u201d.", "a": 1}}, {"q": "Theo V.I. L\u00eanin \u201c c\u1ea7n ph\u1ea3i c\u00f3 th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 kh\u00e1 l\u00e2u d\u00e0i t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i\u201d \u0111\u1ed1i v\u1edbi nh\u1eefng n\u01b0\u1edbc", "a": "Ch\u01b0a tr\u1ea3i qua ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n ph\u00e1t tri\u1ec3n", "e": {"p": 88, "t": "Th\u1ee9 nh\u1ea5t, \u0111\u1ed1\u0129 v\u1edbi c\u00e1c n\u01b0\u1edbc ch\u01b0a tr\u1ea3i qua ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n ph\u00e1t tri\u1ec3n, c\u1ea7n thi\u1ebft ph\u1ea3i c\u00f3 th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 kh\u00e1 l\u00e2u d\u00e0i t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i - nh\u1eefng c\u01a1n \u0111au \u0111\u1ebb k\u00e9o d\u00e0i3;", "a": 1}}, {"q": "Theo V.I. L\u00eanin, ch\u00ednh \u0110\u1ea3ng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh t\u1eeb s\u1ef1 k\u1ebft h\u1ee3p gi\u1eefa: y\u00eau n\u01b0\u1edbc, C. Ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n v\u00e0 phong tr\u00e0o y\u00eau n\u01b0\u1edbc", "a": "Ch\u1ee7 ngh\u0129a M\u00e1c-L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n", "e": {"p": 63, "t": "\u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam ra \u0111\u1eddi l\u00e0 k\u1ebft qu\u1ea3 c\u1ee7a s\u1ef1 k\u1ebft h\u1ee3p gi\u1eefa ch\u1ee7 ngh\u0129a M\u00e1c - L\u00eanin v\u1edbi phong tr\u00e0o c\u00f4ng nh\u00e2n v\u00e0 phong tr\u00e0o y\u00eau n\u01b0\u1edbc c\u1ee7a d\u00e2n t\u1ed9c. \u0110\u00e2y l\u00e0 ph\u00e1t tri\u1ec3n r\u1ea5 t s\u00e1ng t\u1ea1o v\u00e0 quan tr\u1ecdng c\u1ee7a H\u1ed3 Ch\u00ed Minh.", "a": 1}}, {"q": "Theo V.I. L\u00eanin, trong n\u1ec1n s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i ch\u1ec9 c\u00f3 th\u1ec3 s\u1ed1ng v\u1edbi \u0111i\u1ec1u ki\u1ec7n l\u00e0 ki\u1ebfm \u0111\u01b0\u1ee3c vi\u1ec7c l\u00e0m, v\u00e0 ch\u1ec9 ki\u1ebfm \u0111\u01b0\u1ee3c vi\u1ec7c l\u00e0m, n\u1ebfu lao \u0111\u1ed9ng c\u1ee7a h\u1ecd", "a": "L\u00e0m t\u0103ng th\u00eam t\u01b0 b\u1ea3n", "e": null}, {"q": "Th\u1eddi \u0111\u1ea1i m\u1edbi (th\u1eddi \u0111\u1ea1i ng\u00e0y nay) \u0111\u01b0\u1ee3c m\u1edf \u0111\u1ea7u b\u1eb1ng", "a": "Th\u1eafng l\u1ee3i c\u1ee7a C\u00e1ch m\u1ea1ng Th\u00e1ng M\u01b0\u1eddi Nga n\u0103m 1917", "e": null}, {"q": "Th\u1eddi gian n\u00e0o \u0111\u00e1nh d\u1ea5u s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc?", "a": "Ng\u00e0y 24 th\u00e1ng 2 n\u0103m 1848.", "e": {"p": 19, "t": "c) Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n \u0111\u00e1nh d\u1ea5u s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc \u0110\u01b0\u1ee3c s\u1ef1 \u1ee7y nhi\u1ec7m c\u1ee7a nh\u0169ng ng\u01b0\u1eddi c\u1ed9ng s\u1ea3n v\u00e0 c\u00f4ng nh\u00e2n qu\u1ed1c t\u1ebf, th\u00e1ng 2 n\u0103m 1848, t\u00e1c ph\u1ea9m Tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n do c. \u0102ngghen so\u1ea1n th\u1ea3o \u0111\u01b0\u1ee3c c\u00f4ng b\u00f4\" tr\u01b0\u1edbc to\u00e0n th\u1ebf gi\u1edbi.", "a": 1}}, {"q": "Th\u1eddi k\u00ec ph\u00e1t tri\u1ec3n m\u1edbi - \u0111\u1ea9y m\u1ea1nh c\u00f4ng nghi\u1ec7p ho\u00e1, hi\u1ec7n \u0111\u1ea1i ho\u00e1 \u0111\u1ea5t n\u01b0\u1edbc\u201d \u0111\u01b0\u1ee3c \u0110\u1ea3ng ta n\u00eau ra \u1edf \u0110\u1ea1i h\u1ed9i n\u00e0o?", "a": "\u0110\u1ea1i h\u1ed9i VIII", "e": {"p": 116, "t": "M\u1ed9t l\u00e0, \u0111\u1ea9y m\u1ea1nh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u00f3a \u0111\u1ea5t n\u01b0\u1edbc g\u1eafn v\u1ed1i ph\u00e1t tri\u1ec3n kinh t\u1ebf tri th\u1ee9c, b\u1ea3o v\u1ec7 t\u00e0i nguy\u00ean, m\u00f4i tr\u01b0\u1eddng. Hai l\u00e0, ph\u00e1t tri\u1ec3n n\u1ec1n kinh t\u1ebf th\u1ecb tr\u01b0\u1eddng \u0111\u1ecbnh h\u01b0\u1edbng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a.", "a": 1}}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf tr\u00ean ph\u1ea1m vi c\u1ea3 n\u01b0\u1edbc ta b\u1eaft \u0111\u1ea7u t\u1eeb khi n\u00e0o?", "a": "1975", "e": null}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam l\u00e0 b\u01b0\u1edbc qu\u00e1 \u0111\u1ed9?", "a": "Gi\u00e1n ti\u1ebfp, b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a ti\u1ebfn l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i", "e": {"p": 108, "t": "\u0110\u1eb7c \u0111i\u1ec3m qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam l\u00e0 b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a Vi\u1ec7t Nam ti\u1ebfn l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i trong \u0111i\u1ec1u ki\u1ec7n v\u1eeba thu\u1eadn l\u1ee3i v\u1eeba kh\u00f3 kh\u0103n \u0111an xen, v\u1edbi nh\u1eefng \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n:", "a": 1}}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i tr\u00ean ph\u1ea1m vi c\u1ea3 n\u01b0\u1edbc ta b\u1eaft \u0111\u1ea7u t\u1eeb khi n\u00e0o?", "a": "4/1975", "e": null}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH di\u1ec5n ra cu\u1ed9c \u0111\u1ea5u tranh gay g\u1eaft gi\u1eefa", "a": "M\u1ed9t b\u00ean l\u00e0 giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng v\u1eeba gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n nh\u00e0 n\u01b0\u1edbc v\u1edbi m\u1ed9t b\u00ean l\u00e0 giai c\u1ea5p b\u00f3c l\u1ed9t v\u00e0 c\u00e1c th\u1ebf l\u1ef1c ph\u1ea3n \u0111\u1ed9ng m\u1edbi b\u1ecb \u0111\u00e1nh \u0111\u1ed5", "e": null}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH l\u00e0 th\u1eddi k\u1ef3 b\u1eaft \u0111\u1ea7u t\u1eeb khi n\u00e0o? -->", "a": "B\u1eaft \u0111\u1ea7u t\u1eeb khi giai c\u1ea5p c\u00f4ng nh\u00e2n gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n cho \u0111\u1ebfn khi \u0111\u00e3 t\u1ea1o ra nh\u1eefng \u0111i\u1ec1u ki\u1ec7n, ti\u1ec1n \u0111\u1ec1 c\u1ea7n thi\u1ebft cho CNXH", "e": {"p": 106, "t": "\u0110\u00f3 l\u00e0 th\u1eddi k\u1ef3 l\u00e2u d\u00e0i, gian kh\u1ed5 b\u1eaft \u0111\u1ea7u t\u1eeb khi giai c\u1ea5p c\u00f4ng nh\u00e2n v\u00e0 nh\u00e2n d\u00e2n lao \u0111\u1ed9ng gi\u00e0nh \u0111\u01b0\u1ee3c ch\u00ednh quy\u1ec1n \u0111\u1ebfn khi x\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i. C\u00f3 th\u1ec3 kh\u00e1i qu\u00e1t nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m c\u01a1 b\u1ea3n c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i nh\u01b0 sau:", "a": 1}}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH l\u00e0", "a": "L\u00e0 th\u1eddi k\u1ef3 c\u00e1ch m\u1ea1ng l\u00e2u d\u00e0i, kh\u00f3 kh\u0103n v\u00e0 ph\u1ee9c t\u1ea1p \u0111i t\u1eeb x\u00e3 h\u1ed9i c\u0169 sang x\u00e3 h\u1ed9i m\u1edbi", "e": null}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 CNXH \u1edf mi\u1ec1n B\u1eafc n\u01b0\u1edbc ta b\u1eaft \u0111\u1ea7u t\u1eeb khi n\u00e0o?", "a": "1954", "e": null}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 CNXH \u1edf mi\u1ec1n Nam n\u01b0\u1edbc ta b\u1eaft \u0111\u1ea7u t\u1eeb khi n\u00e0o?", "a": "1975", "e": null}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH \u1edf n\u01b0\u1edbc ta c\u00f3 nh\u1eefng nhi\u1ec7m v\u1ee5 kinh t\u1ebf c\u01a1 b\u1ea3n n\u00e0o?", "a": "C\u1ea3 A,B,C Ph\u00e1t tri\u1ec3n LLSX th\u1ef1c hi\u1ec7n CNH-H\u0110H \u0111\u1ea5t n\u01b0\u1edbc; X\u00e2y d\u1ef1ng QHSX m\u1edbi theo \u0111\u1ecbnh h\u01b0\u1edbng XHCN; M\u1edf r\u1ed9ng v\u00e0 n\u00e2ng cao hi\u1ec7u qu\u1ea3 kinh t\u1ebf \u0111\u1ed1i ngo\u1ea1i", "e": null}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH \u1edf Vi\u1ec7t Nam l\u00e0 b\u01b0\u1edbc qu\u00e1 \u0111\u1ed9", "a": "Qu\u00e1 \u0111\u1ed9 gi\u00e1n ti\u1ebfp, b\u1ecf qua ch\u1ebf \u0111\u1ed9 CNTB ti\u1ebfn l\u00ean CNXH", "e": null}, {"q": "Th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 \u1edf Vi\u1ec7t Nam \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n theo h\u00ecnh th\u1ee9c qu\u00e1 \u0111\u1ed9 n\u00e0o?", "a": "Qu\u00e1 \u0111\u1ed9 gi\u00e1n ti\u1ebfp", "e": {"p": 152, "t": "B\u1ea3n ch\u1ea5t d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u1edf Vi\u1ec7t Nam \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n th\u00f4ng qua c\u00e1c h\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp v\u00e0 d\u00e2n ch\u1ee7 tr\u1ef1c ti\u1ebfp. H\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 gi\u00e1n ti\u1ebfp l\u00e0 h\u00ecnh th\u1ee9c d\u00e2n ch\u1ee7 \u0111\u1ea1i di\u1ec7n, \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n do nh\u00e2n d\u00e2n \u201c\u1ee7y quy\u1ec1n\u201d, giao quy\u1ec1n l\u1ef1c c\u1ee7a m\u00ecnh cho t\u1ed5 ch\u1ee9c m\u00e0 nh\u00e2n d\u00e2n tr\u1ef1c ti\u1ebfp b\u1ea7u ra.", "a": 1}}, {"q": "Th\u1ef1c ch\u1ea5t c\u1ee7a quan h\u1ec7 li\u00ean minh c\u00f4ng \u2013 n\u00f4ng \u2013 tri th\u1ee9c l\u00e0", "a": "Quan h\u1ec7 ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i", "e": null}, {"q": "Th\u1ef1c ch\u1ea5t c\u1ee7a th\u1eddi k\u00ec qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 g\u00ec?", "a": "T\u1ea5t c\u1ea3 c\u00e1c c\u00e2u \u0111\u1ec1u \u0111\u00fang", "e": {"p": 106, "t": "\u0110\u1eb7c \u0111i\u1ec3m c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i Th\u1ef1c ch\u1ea5t c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00e0 th\u00f2i k\u1ef3 c\u1ea3i bi\u1ebfn c\u00e1ch m\u1ea1ng t\u1eeb x\u00e3 h\u1ed9i ti\u1ec1n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u00e0 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a sang x\u00e3 h\u1ed9i x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a. X\u00e3 h\u1ed9i c\u1ee7a th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00e0 x\u00e3 h\u1ed9i c\u00f3 s\u1ef1 \u0111an xen c\u1ee7a nhi\u1ec1u t\u00e0n d\u01b0 v\u1ec1 m\u1ecdi ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf, \u0111\u1ea1o \u0111\u1ee9c, tinh th\u1ea7n c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n v\u00e0 nh\u1eefng y\u1ebfu t\u1ed1 m\u1edbi mang t\u00ednh\u2026", "a": 1}}, {"q": "Th\u1ef1c hi\u1ec7n ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t ch\u1ee7 y\u1ebfu v\u00e0 th\u1ef1c hi\u1ec7n ch\u1ebf \u0111\u1ed9 ph\u00e2n ph\u1ed1i l\u1ee3i \u00edch theo k\u1ebft qu\u1ea3 lao \u0111\u1ed9ng l\u00e0 ch\u1ee7 y\u1ebfu. \u0110\u00e2y l\u00e0 b\u1ea3n ch\u1ea5t kinh t\u1ebf c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 n\u00e0o?", "a": "D\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "e": {"p": 138, "t": "Kh\u00e1c v\u1edbi n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n, b\u1ea3n ch\u1ea5t kinh t\u1ebf c\u1ee7a n\u1ec1n d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 th\u1ef1c hi\u1ec7n ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\ 1ea5t ti\u00ean ti\u1ebfn", "e": {"p": 55, "t": "Do \u0111\u00f3, giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 \u0111\u1ea1i bi\u1ec3u cho l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn, cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn, quy\u1ebft \u0111\u1ecbnh s\u1ef1 t\u1ed3n t\u1ea1i v\u00e0 ph\u00e1t tri\u1ec3n c\u1ee7a x\u00e3 h\u1ed9i hi\u1ec7n \u0111\u1ea1i. - N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn \u0111\u00e3 r\u00e8n luy\u1ec7n cho giai c\u1ea5p c\u00f4ng nh\u00e2n nh\u1eefng ph\u1ea9m ch\u1ea5t \u0111\u1eb7c bi\u1ec7t v\u1ec1 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng, tinh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p.", "a": 1}}, {"q": "T\u00ednh t\u1ed5 ch\u1ee9c k\u1ef7 lu\u1eadt c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 do", "a": "K\u1ef7 lu\u1eadt lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p t\u1ea1o n\u00ean", "e": {"p": 55, "t": "- N\u1ec1n s\u1ea3n xu\u1ea5t \u0111\u1ea1i c\u00f4ng nghi\u1ec7p v\u00e0 ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t ti\u00ean ti\u1ebfn \u0111\u00e3 r\u00e8n luy\u1ec7n cho giai c\u1ea5p c\u00f4ng nh\u00e2n nh\u1eefng ph\u1ea9m ch\u1ea5t \u0111\u1eb7c bi\u1ec7t v\u1ec1 t\u00ednh t\u1ed5 ch\u1ee9c, k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng, tinh th\u1ea7n h\u1ee3p t\u00e1c v\u00e0 t\u00e2m l\u00fd lao \u0111\u1ed9ng c\u00f4ng nghi\u1ec7p. \u0110\u00f3 l\u00e0 m\u1ed9t giai c\u1ea5p c\u00e1ch m\u1ea1ng v\u00e0 c\u00f3 tinh th\u1ea7n c\u00e1ch m\u1ea1ng tri\u1ec7t \u0111\u1ec3.", "a": 1}}, {"q": "T\u00f4n gi\u00e1o c\u00f3 m\u1ea5y t\u00ednh ch\u1ea5t? l\u00e0 nh\u1eefng t\u00ednh ch\u1ea5t n\u00e0o?", "a": "3 t\u00ednh ch\u1ea5t, g\u1ed3m: t\u00ednh l\u1ecbch s\u1eed, t\u00ednh qu\u1ea7n ch\u00fang v\u00e0 t\u00ednh ch\u00ednh tr\u1ecb.", "e": null}, {"q": "T\u00f4n gi\u00e1o c\u00f3 nh\u1eefng ch\u1ee9c n\u0103ng n\u00e0o?", "a": "\u0110\u1ec1n b\u00f9 h\u01b0 \u1ea3o, th\u1ebf gi\u1edbi quan, \u0111i\u1ec1u ch\u1ec9nh h\u00e0nh vi, giao ti\u1ebfp, li\u00ean k\u1ebft c\u1ed9ng \u0111\u1ed3ng", "e": null}, {"q": "T\u00f4n gi\u00e1o c\u00f3 nh\u1eefng t\u00ednh ch\u1ea5t n\u00e0o?", "a": "T\u00ednh l\u1ecbch s\u1eed, t\u00ednh qu\u1ea7n ch\u00fang v\u00e0 t\u00ednh ch\u00ednh tr\u1ecb", "e": null}, {"q": "T\u00f4n gi\u00e1o c\u00f3 s\u1ed1 l\u01b0\u1ee3ng t\u00edn \u0111\u1ed3 r\u1ea5t \u0111\u00f4ng \u0111\u1ea3o (g\u1ea7n \u00be d\u00e2n s\u1ed1 th\u1ebf gi\u1edbi) v\u00e0 c\u00f2n l\u00e0 n\u01a1i sinh ho\u1ea1t v\u0103n h\u00f3a, tinh th\u1ea7n c\u1ee7a m\u1ed9t b\u1ed9 ph\u1eadn qu\u1ea7n ch\u00fang nh\u00e2n d\u00e2n \u2013 \u0111\u1eb7c \u0111i\u1ec3m n\u00e0y th\u1ec3 hi\u1ec7n t\u00ednh ch\u1ea5t n\u00e0o c\u1ee7a t\u00f4n gi\u00e1o?", "a": "T\u00ednh qu\u1ea7n ch\u00fang", "e": {"p": 217, "t": "T\u00ednh qu\u1ea7n ch\u00fang c\u1ee7a t\u00f4n gi\u00e1o kh\u00f4ng ch\u1ec9 bi\u1ec3u hi\u1ec7n \u1ecf s\u1ed1 l\u01b0\u1ee3ng t\u00edn \u0111\u1ed3 r\u1ea5t \u0111\u00f4ng \u0111\u1ea3o (g\u1ea7n 3/4 d\u00e2n s\u00f4\" th\u1ebf gi\u1edbi); m\u00e0 c\u00f2n th\u1ec3 hi\u1ec7n \u1edf ch\u1ed7, c\u00e1c t\u00f4n gi\u00e1o l\u00e0 n\u01a1i sinh ho\u1ea1t v\u0103n h\u00f3a, tinh th\u1ea7n c\u1ee7a m\u1ed9t b\u1ed9 ph\u1eadn qu\u1ea7n ch\u00fang nh\u00e2n d\u00e2n."}}, {"q": "T\u00f4n gi\u00e1o h\u00ecnh th\u00e0nh l\u00e0 do?", "a": "T\u1ea5t c\u1ea3 c\u00e1c c\u00e2u \u0111\u1ec1u \u0111\u00fang(Do t\u00e2m l\u00fd, t\u00ecnh c\u1ea3m,Trong x\u00e3 h\u1ed9i c\u00f3 \u00e1p b\u1ee9c b\u00f3c l\u1ed9t,Tr\u00ecnh \u0111\u1ed9 nh\u1eadn th\u1ee9c)", "e": null}, {"q": "Trong 12 nhi\u1ec7m v\u1ee5 c\u01a1 b\u1ea3n \u0111\u01b0\u1ee3c \u0111\u1ec1 ra t\u1ea1i \u0110\u1ea1i h\u1ed9i XII c\u1ee7a \u0110\u1ea3ng C\u1ed9ng S\u1ea3n Vi\u1ec7t Nam (2016), nhi\u1ec7m v\u1ee5 v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n v\u0103n h\u00f3a \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh l\u00e0", "a": "X\u00e2y d\u1ef1ng n\u1ec1n v\u0103n h\u00f3a Vi\u1ec7t Nam ti\u00ean ti\u1ebfn, \u0111\u1eadm \u0111\u00e0 b\u1ea3n s\u1eafc d\u00e2n t\u1ed9c, con ng\u01b0\u1eddi Vi\u1ec7t Nam ph\u00e1t tri\u1ec3n to\u00e0n di\u1ec7n \u0111\u00e1p \u1ee9ng y\u00eau c\u1ea7u ph\u00e1t tri\u1ec3n b\u1ec1n v\u1eefng \u0111\u1ea5t n\u01b0\u1edbc v\u00e0 b\u1ea3o v\u1ec7 v\u1eefng ch\u1eafc t\u1ed5 qu\u1ed1c x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a", "e": null}, {"q": "Trong 12 nhi\u1ec7m v\u1ee5 c\u01a1 b\u1ea3n \u0111\u01b0\u1ee3c \u0111\u1ec1 ra t\u1ea1i \u0110\u1ea1i h\u1ed9i XII c\u1ee7a \u0110CSVN (2016), nhi\u1ec7m v\u1ee5 v\u1ec1 ph\u01b0\u01a1ng di\u1ec7n kinh t\u1ebf \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh l\u00e0\u201d?", "a": "T\u1ea5t c\u1ea3 c\u00e1c \u0111\u00e1p \u00e1n tr\u00ean", "e": null}, {"q": "Trong c\u00e1c h\u00ecnh th\u1ee9c gia \u0111\u00ecnh th\u1eddi nguy\u00ean th\u1ee7y, x\u00e1c \u0111\u1ecbnh d\u00f2ng d\u00f5i ch\u1ee7 y\u1ebfu d\u1ef1a v\u00e0o huy\u1ebft th\u1ed1ng c\u1ee7a ai?", "a": "Ng\u01b0\u1eddi m\u1eb9", "e": null}, {"q": "Trong c\u00e1c n\u1ed9i dung sau \u0111\u00e2y, n\u1ed9i dung n\u00e0o kh\u00f4ng thu\u1ed9c C\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c c\u1ee7a ch\u1ee7 ngh\u0129a M\u00e1c- L\u00eanin", "a": "C\u00e1c d\u00e2n t\u1ed9c c\u00f3 quy\u1ec1n t\u1ef1 do", "e": null}, {"q": "Trong c\u00e1c n\u1ed9i dung c\u1ee7a quy\u1ec1n d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft th\u00ec d\u00e2n n\u1ed9i dung n\u00e0o \u0111\u01b0\u1ee3c coi l\u00e0 c\u01a1 b\u1ea3n nh\u1ea5t, ti\u00ean quy\u1ebft nh\u1ea5t?", "a": "T\u1ef1 Quy\u1ebft v\u1ec1 ch\u00ednh tr\u1ecb", "e": null}, {"q": "Trong c\u00e1c xu h\u01b0\u1edbng bi\u1ebfn \u0111\u1ed5i c\u1ee7a c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p sau, xu h\u01b0\u1edbng n\u00e0o l\u00e0 xu h\u01b0\u1edbng quy\u1ebft \u0111\u1ecbnh nh\u1ea5t", "a": "X\u00edch l\u1ea1i g\u1ea7n nhau gi\u1eefa c\u00e1c giai c\u1ea5p v\u00e0 t\u1ea7ng l\u1edbp x\u00e3 h\u1ed9i v\u1ec1 m\u1ed1i quan h\u1ec7 v\u1edbi t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t", "e": {"p": 171, "t": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p bi\u1ebfn \u0111\u1ed5i v\u00e0 ph\u00e1t tri\u1ec3n trong m\u1ed1i quan h\u1ec7 v\u1eeba c\u00f3 m\u00e2u thu\u1eabn, \u0111\u1ea5u tranh, v\u1eeba c\u00f3 m\u1ed1i quan h\u1ec7 li\u00ean minh v\u1ed1i nhau, x\u00edch l\u1ea1i g\u1ea7n nhau gi\u1eefa c\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1ed5p c\u01a1 b\u1ea3n trong x\u00e3 h\u1ed9i, \u0111\u1eb7c bi\u1ec7t l\u00e0 gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c.", "a": 1}}, {"q": "Trong ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a th\u00ec bao nhi\u00eau quy\u1ec1n l\u1ef1c \u0111\u1ec1u l\u00e0 c\u1ee7a d\u00e2n, bao nhi\u00eau s\u1ee9c m\u1ea1nh \u0111\u1ec1u \u1edf n\u01a1i d\u00e2n, bao nhi\u00eau l\u1ee3i \u00edch \u0111\u1ec1u l\u00e0 v\u00ec d\u00e2n?", "a": "H\u1ed3 Ch\u00ed Minh", "e": {"p": 136, "t": "Trong ch\u00ea \u0111\u1ed9 d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a th\u00ec bao nhi\u00eau quy\u1ec1n l\u1ef1c \u0111\u1ec1u l\u00e0 c\u1ee7a d\u00e2n, bao nhi\u00eau s\u1ee9c m\u1ea1nh \u0111\u1ec1u \u1edf n\u01a1i d\u00e2n, bao nhi\u00eau l\u1ee3i \u00edch \u0111\u1ec1u l\u00e0 v\u00ec d\u00e2n... Ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a, nh\u00e0 n\u01b0\u1edbc x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a do \u0111\u00f3 v\u1ec1 th\u1ef1c ch\u1ea5t l\u00e0 c\u1ee7a nh\u00e2n d\u00e2n, do nh\u00e2n d\u00e2n v\u00e0 v\u00ec nh\u00e2n d\u00e2n.", "a": 1}}, {"q": "Trong ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u201ckh\u00f4ng c\u00f3 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, ph\u1ea3i b\u00e1n s\u1ee9c lao \u0111\u1ed9ng v\u00e0 b\u1ecb b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0\u201d l\u00e0 \u0111\u1eb7c tr\u01b0ng c\u01a1 b\u1ea3n \u0111\u1ec3 ph\u00e2n bi\u1ec7t giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1edbi?", "a": "Giai c\u1ea5p t\u01b0 s\u1ea3n", "e": {"p": 54, "t": "H\u1ecd l\u00e0 ng\u01b0\u1eddi l\u00e0m thu\u00ea do kh\u00f4ng c\u00f3 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, bu\u1ed9c ph\u1ea3i b\u00e1n s\u00fac lao \u0111\u1ed9ng \u0111\u1ec3 s\u00f4ng v\u00e0 b\u1ecb giai c\u1ea5p t\u01b0 s\u1ea3n b\u00f3c l\u1ed9t gi\u00e1 tr\u1ecb th\u1eb7ng d\u01b0; v\u00ec v\u1eady l\u1ee3i \u00edch c\u01a1 b\u1ea3n c\u1ee7a h\u1ecd \u0111\u1ed1i l\u1eadp v\u1edbi l\u1ee3i \u00edch c\u01a1 b\u1ea3n c\u1ee7a giai c\u1ea5p t\u01b0 s\u1ea3n.", "a": 1}}, {"q": "Trong chi\u1ebfn l\u01b0\u1ee3c ph\u00e1t tri\u1ec3n gia \u0111\u00ecnh Vi\u1ec7t Nam \u0111\u1ebfn n\u0103m 2020 t\u1ea7m nh\u00ecn 2030, m\u1ee5c ti\u00eau chung trong x\u00e2y d\u1ef1ng v\u00e0 ph\u00e1t tri\u1ec3n gia \u0111\u00ecnh Vi\u1ec7t Nam l\u00e0", "a": "X\u00e2y d\u1ef1ng gia \u0111\u00ecnh \u1ea5m no, ti\u1ebfn b\u1ed9 th\u1ef1c s\u1ef1 l\u00e0 t\u1ed5 \u1ea5m c\u1ee7a m\u1ed7i ng\u01b0\u1eddi, l\u00e0 t\u1ebf b\u00e0o l\u00e0nh m\u1ea1nh c\u1ee7a x\u00e3 h\u1ed9i", "e": null}, {"q": "Trong ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, giai c\u1ea5p c\u00f4ng nh\u00e2n c\u00f3 c\u00e1c \u0111\u1eb7c tr\u01b0ng tr\u00ean bao nhi\u00eau ph\u01b0\u01a1ng di\u1ec7n c\u01a1 b\u1ea3n?", "a": "2", "e": null}, {"q": "Trong ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, giai c\u1ea5p duy nh\u1ea5t kh\u00f4ng c\u00f3 l\u1ee3i \u00edch ri\u00eang v\u1edbi ch\u1ee7 ngh\u0129a t\u01b0 h\u1eefu l\u00e0?", "a": "V\u00f4 s\u1ea3n", "e": {"p": 56, "t": "Ch\u1ec9 c\u00f3 giai c\u1ea5p c\u00f4ng nh\u00e2n l\u00e0 giai c\u1ea5p duy nh\u1ea5t kh\u00f4ng c\u00f3 l\u1ee3i \u00edch ri\u00eang v\u1edbi 1. To\u00e0n t\u1eadp, S\u0111d, t.", "a": 1}}, {"q": "Trong ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, m\u00e2u thu\u1eabn v\u1ec1 m\u1eb7t kinh t\u1ebf \u0111\u00e3 bi\u1ec3u hi\u1ec7n ra th\u00e0nh m\u00e2u thu\u1eabn ch\u00ednh tr\u1ecb gi\u1eefa", "a": "Giai c\u1ea5p t\u01b0 s\u1ea3n v\u1edbi giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 90, "t": "b) \u0110i\u1ec1u ki\u1ec7n ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i M\u00e2u thu\u1eabn gi\u1eefa t\u00ednh ch\u1ea5t x\u00e3 h\u1ed9i h\u00f3a c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu t\u01b0 nh\u00e2n t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u1ed1\u00ec v\u1edbi t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t tr\u1edf th\u00e0nh m\u00e2u thu\u1eabn kinh t\u1ebf c\u01a1 b\u1ea3n c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n, bi\u1ec3u hi\u1ec7n v\u1ec1 m\u1eb7t x\u00e3 h\u1ed9i l\u00e0 m\u00e2u thu\u1eabn gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i v\u1edbi giai c\u1ea5p t\u01b0 s\u1ea3n l\u1ed7i th\u1eddi.", "a": 1}}, {"q": "Trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i, lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u n\u00e0o l\u00e0 c\u01a1 b\u1ea3n v\u00e0 c\u00f3 v\u1ecb tr\u00ed quy\u1ebft \u0111\u1ecbnh, chi ph\u1ed1i c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00e1c?", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i-giai c\u1ea5p", "e": {"p": 166, "t": "Song v\u1ecb tr\u00ed, vai tr\u00f2 c\u1ee7a c\u00e1c lo\u1ea1i c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00f4ng ngang nhau, trong \u0111\u00f3, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p c\u00f3 v\u1ecb tr\u00ed quan tr\u1ecdng h\u00e0ng \u0111\u1ea7u, chi ph\u1ed1i c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00e1c v\u00ec nh\u1eefng l\u00fd do c\u01a1 b\u1ea3n sau: - C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p li\u00ean quan \u0111\u1ebfn c\u00e1c \u0111\u1ea3ng ph\u00e1i ch\u00ednh tr\u1ecb v\u00e0 nh\u00e0 n\u01b0\u1edbc;", "a": 1}}, {"q": "Trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p \u1edf th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 t\u1eeb ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, giai c\u1ea5p n\u00e0o l\u00e0 l\u1ef1c l\u01b0\u1ee3ng ti\u00eau bi\u1ec3u cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t m\u1edbi gi\u1eef vai tr\u00f2 ch\u1ee7 \u0111\u1ea1o, ti\u00ean phong trong qu\u00e1 tr\u00ecnh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u00f3a \u0111\u1ea5t n\u01b0\u1edbc?", "a": "C\u00f4ng nh\u00e2n", "e": {"p": 171, "t": "Trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p \u1ea5y, giai c\u1ea5p c\u00f4ng nh\u00e2n, l\u1ef1c l\u01b0\u1ee3ng ti\u00eau bi\u1ec3u cho ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t m\u1ed1i gi\u1eef vai tr\u00f2 ch\u1ee7 \u0111\u1ea1o, ti\u00ean phong trong qu\u00e1 tr\u00ecnh c\u00f4ng nghi\u1ec7p h\u00f3a, hi\u1ec7n \u0111\u1ea1i h\u00f3a \u0111\u1ea5t n\u01b0\u1edbc, c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i c\u0169, x\u00e2y d\u1ef1ng x\u00e3 h\u1ed9i m\u1ed1i."}}, {"q": "Trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ...?", "a": "Ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c", "e": {"p": 52, "t": "\u201cTrong c\u00f4ng tr\u01b0\u1eddng th\u1ee7 c\u00f4ng v\u00e0 trong ngh\u1ec1 th\u1ee7 c\u00f4ng, ng\u01b0\u1eddi c\u00f4ng nh\u00e2n s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 c\u1ee7a m\u00ecnh, c\u00f2n trong c\u00f4ng x\u01b0\u1edfng th\u00ec ng\u01b0\u1eddi c\u00f4ng nh\u00e2n ph\u1ea3i ph\u1ee5c v\u1ee5 m\u00e1y m\u00f3c\u201d1. \u0102ngghen, c\u00f4ng nh\u00e2n c\u00f4ng nghi\u1ec7p c\u00f4ng x\u01b0\u1ecfng l\u00e0 b\u1ed9 ph\u1eadn ti\u00eau bi\u1ec3u cho giai c\u1ea5p c\u00f4ng nh\u00e2n hi\u1ec7n \u0111\u1ea1i.", "a": 1}}, {"q": "Trong cu\u1ed9c c\u00e1ch m\u1ea1ng XHCN, giai c\u1ea5p n\u00e0o l\u00e3nh \u0111\u1ea1o?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n", "e": {"p": 55, "t": "N\u1ed9i dung s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n N\u1ed9i dung s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n ch\u00ednh l\u00e0 nh\u1eefng nhi\u1ec7m v\u1ee5 m\u00e0 giai c\u1ea5p c\u00f4ng nh\u00e2n c\u1ea7n ph\u1ea3i th\u1ef1c hi\u1ec7n v\u1ed1i t\u01b0 c\u00e1ch l\u00e0 giai c\u1ea5p ti\u00ean phong, l\u00e0 l\u1ef1c l\u01b0\u1ee3ng \u0111i \u0111\u1ea7u trong cu\u1ed9c c\u00e1ch m\u1ea1ng x\u00e1c l\u1eadp h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a.", "a": 1}}, {"q": "Trong cu\u1ed1n s\u00e1ch \u201cM\u1ed9t s\u1ed1 v\u1ea5n \u0111\u1ec1 l\u00fd lu\u1eadn v\u00e0 th\u1ef1c ti\u1ec5n v\u1ec1 ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i v\u00e0 con \u0111\u01b0\u1eddng \u0111i l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam\u201d, T\u1ed5ng B\u00ed th\u01b0 Nguy\u1ec5n Ph\u00fa Tr\u1ecdng kh\u1eb3ng \u0111\u1ecbnh: \u0111\u01b0\u1eddng l\u1ed1i c\u01a1 b\u1ea3n, xuy\u00ean su\u1ed1t c\u1ee7a c\u00e1ch m\u1ea1ng Vi\u1ec7t Nam v\u00e0 c\u0169ng l\u00e0 \u0111i\u1ec3m c\u1ed1t y\u1ebfu trong di s\u1ea3n t\u01b0 t\u01b0\u1edfng c\u1ee7a Ch\u1ee7 t\u1ecbch H\u1ed3 Ch\u00ed Minh l\u00e0", "a": "\u0110\u1ed9c l\u1eadp d\u00e2n t\u1ed9c g\u1eafn li\u1ec1n v\u1edbi ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i", "e": null}, {"q": "Trong c\u01b0\u01a1ng l\u0129nh d\u00e2n t\u1ed9c, quy\u1ec1n t\u1ef1 quy\u1ebft c\u1ee7a c\u00e1c d\u00e2n t\u1ed9c c\u00f3 \u00fd ngh\u0129a l\u00e0?", "a": "C\u00e1c d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft \u0111\u1ecbnh v\u1eadn m\u1ec7nh d\u00e2n t\u1ed9c m\u00ecnh, quy\u1ec1n t\u1ef1 l\u1ef1a ch\u1ecdn ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb v\u00e0 con \u0111\u01b0\u1eddng ph\u00e1t tri\u1ec3n c\u1ee7a d\u00e2n t\u1ed9c m\u00ecnh", "e": {"p": 203, "t": "\u0110\u00f3 l\u00e0 quy\u1ec1n c\u1ee7a c\u00e1c d\u00e2n t\u1ed9c t\u1ef1 quy\u1ebft \u0111\u1ecbnh l\u1ea5y v\u1eadn m\u1ec7nh c\u1ee7a d\u00e2n t\u1ed9c m\u00ecnh, quy\u1ec1n t\u1ef1 l\u1ef1a ch\u1ecdn ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb v\u00e0 con \u0111\u01b0\u1eddng ph\u00e1t tri\u1ec3n c\u1ee7a d\u00e2n t\u1ed9c m\u00ecnh. Quy\u1ec1n t\u1ef1 quy\u1ebft d\u00e2n t\u1ed9c bao g\u1ed3m quy\u1ec1n t\u00e1ch ra th\u00e0nh l\u1eadp m\u1ed9t qu\u1ed1c gia d\u00e2n t\u1ed9c \u0111\u1ed9c l\u1eadp, \u0111\u1ed3ng th\u1eddi c\u00f3 quy\u1ec1n t\u1ef1 nguy\u1ec7n li\u00ean hi\u1ec7p v\u1edbi d\u00e2n t\u1ed9c kh\u00e1c tr\u00ean c\u01a1 s\u1edf b\u00ecnh \u0111\u1eb3ng.", "a": 1}}, {"q": "Trong \u0111i\u1ec1u ki\u1ec7n m\u1edbi c\u1ee7a \u0111\u1eddi s\u1ed1ng ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i th\u1ebf gi\u1edbi \u0111\u1ea7u th\u1ebf k\u1ef7 XX, \u0111\u1ed3ng th\u1eddi t\u1eeb th\u1ef1c ti\u1ec5n c\u1ee7a c\u00f4ng cu\u1ed9c x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc Nga X\u00f4 - Vi\u1ebft, V.I.L\u00eanin \u0111\u00e3 cho r\u1eb1ng, m\u1ee5c \u0111\u00edch cao nh\u1ea5t, cu\u1ed1i c\u00f9ng c\u1ee7a nh\u1eefng c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 th\u1ef1c hi\u1ec7n nguy\u00ean t\u1eafc", "a": "L\u00e0m theo n\u0103ng l\u1ef1c, h\u01b0\u1edfng theo nhu c\u1ea7u", "e": {"p": 93, "t": "Lenin, trong \u0111i\u1ec1u ki\u1ec7n m\u1ed1i c\u1ee7a \u0111\u1eddi s\u1ed1ng ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i th\u1ebf gi\u1edbi \u0111\u1ea7u th\u1ebf k\u1ef7 XX, \u0111\u1ed3ng th\u00f2i t\u1eeb th\u1ef1c ti\u1ec5n c\u1ee7a c\u00f4ng cu\u1ed9c x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1ed3 n\u01b0\u1edbc Nga X\u00f4vi\u1ebft \u0111\u00e3 cho r\u1eb1ng, m\u1ee5c \u0111\u00edch cao nh\u1ea5t, cu\u1ed1\u0129 c\u00f9ng c\u1ee7a nh\u1eefng c\u1ea3i t\u1ea1o x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a l\u00e0 th\u1ef1c hi\u1ec7n nguy\u00ean t\u1eafc:", "a": 1}}, {"q": "Trong giai \u0111o\u1ea1n \u0111\u1ea7u c\u1ee7a ch\u1ee7 ngh\u0129a c\u1ed9ng s\u1ea3n c\u00f9ng v\u1edbi vi\u1ec7c t\u1eebng b\u01b0\u1edbc x\u00e1c l\u1eadp ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, \u0111\u1ec3 n\u00e2ng cao n\u0103ng su\u1ea5t lao \u0111\u1ed9ng c\u1ea7n ph\u1ea3i l\u00e0m g\u00ec?", "a": "T\u1ed5 ch\u1ee9c lao theo m\u1ed9t tr\u00ecnh \u0111\u1ed9 cao h\u01a1n, t\u1ed5 ch\u1ee9c ch\u1eb7t ch\u1ebd v\u00e0 k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng nghi\u00eam", "e": {"p": 96, "t": "C\u00f9ng v\u1edbi vi\u1ec7c t\u1eebng b\u01b0\u1edbc x\u00e1c l\u1eadp ch\u1ebf \u0111\u1ed9 c\u00f4ng h\u1eefu v\u1ec1 t\u01b0 li\u1ec7u s\u1ea3n xu\u1ea5t, \u0111\u1ec3 n\u00e2ng cao n\u0103ng su\u1ea5t lao \u0111\u1ed9ng c\u1ea7n ph\u1ea3i t\u1ed5 ch\u1ee9c lao \u0111\u1ed9ng theo m\u1ed9t tr\u00ecnh \u0111\u1ed9 cao h\u01a1n, t\u1ed5 ch\u1ee9c ch\u1eb7t ch\u1ebd v\u00e0 k\u1ef7 lu\u1eadt lao \u0111\u1ed9ng nghi\u00eam, ngh\u0129a l\u00e0 ph\u1ea3i t\u1ea1o ra quan h\u1ec7 s\u1ea3n xu\u1ea5t ti\u1ebfn b\u1ed9, th\u00edch \u1ee9ng v\u1edbi tr\u00ecnh \u0111\u1ed9 ph\u00e1t tri\u1ec3n c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t.", "a": 1}}, {"q": "Trong gia \u0111\u00ecnh Vi\u1ec7t Nam hi\u1ec7n nay, ng\u01b0\u1eddi ch\u1ee7 gia \u0111\u00ecnh \u0111\u01b0\u1ee3c quan ni\u1ec7m l\u00e0", "a": "Ng\u01b0\u1eddi c\u00f3 nh\u1eefng ph\u1ea9m ch\u1ea5t, n\u0103ng l\u1ef1c v\u00e0 \u0111\u00f3ng g\u00f3p v\u01b0\u1ee3t tr\u1ed9i, \u0111\u01b0\u1ee3c c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh coi tr\u1ecdng", "e": {"p": 264, "t": "Ng\u01b0\u1eddi ch\u1ee7 gia \u0111\u00ecnh \u0111\u01b0\u1ee3c quan ni\u1ec7m l\u00e0 ng\u01b0\u1eddi c\u00f3 nh\u1eefng ph\u1ea9m ch\u1ea5t, n\u0103ng l\u1ef1c v\u00e0 \u0111\u00f3ng g\u00f3p v\u01b0\u1ee3t tr\u1ed9i, \u0111\u01b0\u1ee3c c\u00e1c th\u00e0nh vi\u00ean trong gia \u0111\u00ecnh coi tr\u1ecdng.", "a": 1}}, {"q": "Trong khoa h\u1ecdc t\u1ef1 nhi\u00ean nh\u1eefng ph\u00e1t minh v\u1ea1ch th\u1eddi \u0111\u1ea1i trong v\u1eadt l\u00fd v\u00e0 sinh h\u1ecdc n\u00e0o \u0111\u00e3 l\u00e0m ti\u1ec1n \u0111\u1ec1 khoa h\u1ecdc cho s\u1ef1 ra \u0111\u1eddi c\u1ee7a Ch\u1ee7 ngh\u0129a duy v\u1eadt bi\u1ec7n ch\u1ee9ng v\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed?", "a": "T\u1ea5t c\u1ea3 \u0111\u1ec1u \u0111\u00fang: H\u1ecdc thuy\u1ebft ti\u1ebfn h\u00f3a; \u0110\u1ecbnh lu\u1eadt b\u1ea3o to\u00e0n v\u00e0 chuy\u1ec3n h\u00f3a n\u0103ng l\u01b0\u1ee3ng; H\u1ecdc thuy\u1ebft t\u1ebf b\u00e0o", "e": {"p": 14, "t": "H\u1ecdc thuy\u1ebft ti\u1ebfn h\u00f3a-, \u0110\u1ecbnh lu\u1eadt b\u1ea3o to\u00e0n v\u00e0 chuy\u1ec3n h\u00f3a n\u0103ng l\u01b0\u1ee3ng, H\u1ecdc thuy\u1ebft t\u1ebf b\u00e0o1. Nh\u1eefng ph\u00e1t minh n\u00e0y l\u00e0 ti\u1ec1n \u0111\u1ec1 khoa h\u1ecdc cho s\u1ef1 ra \u0111\u1eddi c\u1ee7a ch\u1ee7 ngh\u0129a duy v\u1eadt bi\u1ec7n ch\u1ee9ng v\u00e0 ch\u1ee7 ngh\u0129a duy v\u1eadt l\u1ecbch s\u1eed, c\u01a1 s\u1edf ph\u01b0\u01a1ng ph\u00e1p lu\u1eadn cho c\u00e1c nh\u00e0 s\u00e1ng l\u1eadp ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc nghi\u00ean c\u1ee9u nh\u0169ng v\u1ea5n \u0111\u1ec1 l\u00fd lu\u1eadn ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i \u0111\u01b0\u01a1ng th\u1eddi.", "a": 1}}, {"q": "Trong khi th\u1ef1c hi\u1ec7n ch\u1ee9c n\u0103ng kinh t\u1ebf v\u00e0 t\u1ed5 ch\u1ee9c ti\u00eau d\u00f9ng, \u0111\u1eb7c th\u00f9 c\u1ee7a gia \u0111\u00ecnh m\u00e0 c\u00e1c \u0111\u01a1n v\u1ecb kinh t\u1ebf kh\u00e1c kh\u00f4ng c\u00f3 \u0111\u01b0\u1ee3c l\u00e0", "a": "Gia \u0111\u00ecnh l\u00e0 \u0111\u01a1n v\u1ecb duy nh\u1ea5t tham gia v\u00e0o qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra s\u1ee9c lao \u0111\u1ed9ng cho x\u00e3 h\u1ed9i", "e": {"p": 247, "t": "Tuy nhi\u00ean, \u0111\u1eb7c th\u00f9 c\u1ee7a gia \u0111\u00ecnh m\u00e0 c\u00e1c \u0111\u01a1n v\u1ecb kinh t\u1ebf kh\u00e1c kh\u00f4ng c\u00f3 \u0111\u01b0\u1ee3c l\u00e0 \u1ecf ch\u1ed7, gia \u0111\u00ecnh l\u00e0 \u0111\u01a1n v\u1ecb duy nh\u1ea5t tham gia v\u00e0o qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra s\u1ee9c lao \u0111\u1ed9ng cho x\u00e3 h\u1ed9i. Gia \u0111\u00ecnh kh\u00f4ng ch\u1ec9 tham gia tr\u1ef1c ti\u1ebfp v\u00e0o s\u1ea3n xu\u1ea5t v\u00e0 t\u00e1i s\u1ea3n xu\u1ea5t ra c\u1ee7a c\u1ea3i v\u1eadt ch\u1ea5t v\u00e0 s\u1ee9c lao \u0111\u1ed9ng, m\u00e0 c\u00f2n l\u00e0 m\u1ed9t \u0111\u01a1n v\u1ecb ti\u00eau d\u00f9ng trong x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "Trong l\u1ecbch s\u1eed lo\u00e0i ng\u01b0\u1eddi \u0111\u00e3 t\u1eebng xu\u1ea5t hi\u1ec7n c\u00e1c ch\u1ebf \u0111\u1ed9 d\u00e2n ch\u1ee7 n\u00e0o sau \u0111\u00e2y?", "a": "Ch\u1ee7 n\u00f4, t\u01b0 s\u1ea3n, v\u00f4 s\u1ea3n.", "e": null}, {"q": "Trong m\u1ed9t gia \u0111\u00ecnh, c\u00f3 th\u1ec3 s\u1ed1ng chung trong m\u1ed9t kh\u00f4ng gian, nh\u01b0ng l\u1ea1i c\u00f3 th\u1ec3 bao g\u1ed3m nhi\u1ec1u h\u1ed9 gia \u0111\u00ecnh. Nh\u1eadn \u0111\u1ecbnh tr\u00ean l\u00e0", "a": "\u0110\u00fang", "e": null}, {"q": "Trong m\u1ed9t qu\u1ed1c gia c\u00f3 nhi\u1ec1u d\u00e2n t\u1ed9c c\u1ea7n thi\u1ebft n\u00ean?", "a": "B\u1ea3o t\u1ed3n gi\u00e1 tr\u1ecb v\u0103n h\u00f3a c\u1ee7a t\u1ea5t c\u1ea3 c\u00e1c d\u00e2n t\u1ed9c, t\u1ea1o ra s\u1ef1 th\u1ed1ng nh\u1ea5t trong \u0111a d\u1ea1ng b\u1ea3n s\u1eafc v\u0103n h\u00f3a c\u00e1c d\u00e2n t\u1ed9c.", "e": null}, {"q": "Trong m\u1ed9t qu\u1ed1c gia \u0111a t\u1ed9c ng\u01b0\u1eddi th\u00ec v\u1ea5n \u0111\u1ec1 g\u00ec c\u1ea7n gi\u1ea3i quy\u1ebft \u0111\u01b0\u1ee3c coi l\u00e0 c\u00f3 \u00fd ngh\u0129a c\u01a1 b\u1ea3n nh\u1ea5t \u0111\u1ec3 th\u1ef1c hi\u1ec7n quy\u1ec1n b\u00ecnh \u0111\u1eb3ng gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c?", "a": "X\u00f3a b\u1ecf d\u1ea7n s\u1ef1 ch\u00eanh l\u1ec7ch v\u1ec1 m\u1ecdi m\u1eb7t gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c do l\u1ecbch s\u1eed \u0111\u1ec3 l\u1ea1i", "e": null}, {"q": "Trong qu\u00e1 tr\u00ecnh x\u00e2y d\u1ef1ng ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i, li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c d\u01b0\u1edbi g\u00f3c \u0111\u1ed9 n\u00e0o gi\u1eef vai tr\u00f2 quy\u1ebft \u0111\u1ecbnh?", "a": "Kinh t\u1ebf", "e": {"p": 174, "t": "N\u1ebfu th\u1ef1c hi\u1ec7n t\u1ed1t kh\u1ed1i li\u00ean minh gi\u1eefa giai c\u1ea5p c\u00f4ng nh\u00e2n v\u1ed1i giai c\u1ea5p n\u00f4ng d\u00e2n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c, trong \u0111\u00f3 tr\u01b0\u1edbc h\u1ebft l\u00e0 v\u1edbi tr\u00ed th\u1ee9c th\u00ec kh\u00f4ng nh\u1eefng x\u00e2y d\u1ef1ng \u0111\u01b0\u1ee3c c\u01a1 s\u1ed3 kinh t\u1ebf v\u1eefng m\u1ea1nh m\u00e0 ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a c\u0169ng ng\u00e0y c\u00e0ng \u0111\u01b0\u1ee3c c\u1ee7ng c\u1ed1 v\u1eefng ch\u1eafc.", "a": 1}}, {"q": "Trong t\u00e1c ph\u1ea9m n\u00e0o C. M\u00e1c v\u00e0 Ph. \u0102ngghen \u0111\u00e3 th\u1eb3ng th\u1eafn th\u1eeba nh\u1eadn sai l\u1ea7m v\u1ec1 d\u1ef1 b\u00e1o kh\u1ea3 n\u0103ng n\u1ed5 ra nh\u1eefng cu\u1ed9c c\u00e1ch m\u1ea1ng v\u00f4 s\u1ea3n \u1edf Ch\u00e2u \u00c2u?", "a": "Trong l\u1eddi n\u00f3i \u0111\u1ea7u vi\u1ebft cho t\u00e1c ph\u1ea9m \u201c \u0110\u1ea5u tranh giai c\u1ea5p \u1edf Ph\u00e1p t\u1eeb 1848-1850\u201d", "e": {"p": 24, "t": "\u0102ngghen \u0111\u00e3 th\u1eb3ng th\u1eafn th\u1eeba nh\u1eadn sai l\u1ea7m v\u1ec3 d\u1ef1 b\u00e1o kh\u1ea3 n\u0103ng n\u1ed5 ra c\u1ee7a nh\u1eefng cu\u1ed9c c\u00e1ch m\u1ea1ng v\u00f4 s\u1ea3n \u1ecf ch\u00e2u \u00c2u, v\u00ec l\u1ebd \u201cL\u1ecbch s\u1eed \u0111\u00e3 ch\u1ec9 r\u00f5 r\u1eb1ng tr\u1ea1ng th\u00e1i ph\u00e1t tri\u1ec3n kinh t\u1ebf tr\u00ean l\u1ee5c \u0111\u1ecba l\u00fac b\u1ea5y gi\u1edd c\u00f2n r\u1ea5t l\u00e2u m\u1edbi ch\u00edn mu\u1ed3i \u0111\u1ec3 x\u00f3a b\u1ecf ph\u01b0\u01a1ng th\u1ee9c s\u1ea3n xu\u1ea5t t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a\u201d1.", "a": 1}}, {"q": "Trong t\u00e1c ph\u1ea9m n\u00e0o Ph. \u0102ngghen \u0111\u00e3 kh\u00e1i qu\u00e1t nhi\u1ec7m v\u1ee5 c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc v\u1ec1 th\u1ef1c hi\u1ec7n s\u1ef1 nghi\u1ec7p gi\u1ea3i ph\u00f3ng th\u1ebf gi\u1edbi, s\u1ef1 th\u1ec3 hi\u1ec7n v\u1ec1 m\u1eb7t l\u00fd lu\u1eadn c\u1ee7a phong tr\u00e0o c\u00f4ng nh\u00e2n?", "a": "Ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i t\u1eeb kh\u00f4ng t\u01b0\u1edfng \u0111\u1ebfn khoa h\u1ecdc", "e": {"p": 41, "t": "\u0102ngghen \u0111\u00e3 kh\u00e1i qu\u00e1t nhi\u1ec7m v\u1ee5 c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i khoa h\u1ecdc: \u201cTh\u1ef1c hi\u1ec7n s\u1ef1 nghi\u1ec7p gi\u1ea3i ph\u00f3ng th\u1ebf gi\u1edbi \u1ea5y, - \u0111\u00f3 l\u00e0 s\u1ee9 m\u1ec7nh l\u1ecbch s\u1eed c\u1ee7a giai c\u1ea5p v\u00f4 s\u1ea3n hi\u1ec7n \u0111\u1ea1i.", "a": 1}}, {"q": "Trong t\u00e1c ph\u1ea9m n\u00e0o Ph. \u0102ngghen \u0111\u00e3 lu\u1eadn ch\u1ee9ng s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i kh\u00f4ng t\u01b0\u1edfng \u0111\u1ebfn khoa h\u1ecdc v\u00e0 \u0111\u00e1nh gi\u00e1 c\u00f4ng lao c\u1ee7a c\u00e1c nh\u00e0 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a kh\u00f4ng t\u01b0\u1edfng Anh, Ph\u00e1p? ->", "a": "Ch\u1ed1ng \u0110uyrinh", "e": {"p": 23, "t": "\u0102ngghen \u0111\u00e3 lu\u1eadn ch\u1ee9ng s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i t\u1eeb kh\u00f4ng t\u01b0\u1ecfng \u0111\u1ebfn khoa h\u1ecdc v\u00e0 \u0111\u00e1nh gi\u00e1 c\u00f4ng lao c\u1ee7a c\u00e1c nh\u00e0 x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a kh\u00f4ng t\u01b0\u1edfng Anh, Ph\u00e1p. L\u00eanin, trong t\u00e1c ph\u1ea9m L\u00e0m g\u00ec?", "a": 1}}, {"q": "Trong t\u00e1c ph\u1ea9m n\u00e0o V.I.L\u00eanin \u0111\u00e3 nh\u1eadn x\u00e9t v\u1ec1 s\u1ef1 ti\u00ean \u0111o\u00e1n thi\u00ean t\u00e0i c\u1ee7a Xanhxim\u00f4ng, Phuri\u00ea v\u00e0 \u00d4-oen v\u1ec1 r\u1ea5t nhi\u1ec1u ch\u00e2n l\u00fd m\u00e0 ng\u00e0y nay ch\u00fang ta \u0111ang ch\u1ee9ng minh s\u1ef1 \u0111\u00fang \u0111\u1eafn c\u1ee7a ch\u00fang m\u1ed9t c\u00e1ch khoa h\u1ecdc? \u2014>", "a": "L\u00e0m g\u00ec ?", "e": {"p": 23, "t": "\u201cCh\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i l\u00fd lu\u1eadn \u0110\u1ee9c s\u1ebd kh\u00f4ng bao gi\u1edd qu\u00ean r\u1eb1ng n\u00f3 d\u1ef1a v\u00e0o Xanh Xim\u00f4ng, Phuri\u00ea v\u00e0 \u00d4oen l\u00e0 ba nh\u00e0 t\u01b0 t\u01b0\u1edfng d\u00f9 h\u1ecdc thuy\u1ebft c\u1ee7a ba \u00f4ng c\u00f3 t\u00ednh ch\u1ea5t \u1ea3o t\u01b0\u1ecfng v\u00e0 kh\u00f4ng t\u01b0\u1ecfng, \u0111\u00e3 \u0111\u01b0\u1ee3c li\u1ec7t v\u00e0o h\u00e0ng nh\u1eefng nh\u00e0 t\u01b0 t\u01b0\u1ed3ng v\u0129 \u0111\u1ea1i nh\u1ea5t c\u1ee7a t\u1ea5 t c\u1ea3 c\u00e1c th\u00f2i \u0111\u1ea1i v\u00e0 \u0111\u00e3 d\u1ef1 ki\u1ebfn m\u1ed9t c\u00e1ch t\u00e0i t\u00ecnh \u0111\u01b0\u1ee3c r\u1ea5 t nhi\u1ec1u ch\u00e2n l\u00fd m\u00e0 ng\u00e0y nay ch\u00fang ta \u0111em khoa h\u1ecdc ra ch\u1ee9ng minh \u0111\u1ec1u th\u1ea5y l\u00e0 \u0111\u00fang\u201d1.", "a": 1}}, {"q": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p g\u1ed3m c\u00f3 nh\u1eefng giai c\u1ea5p, t\u1ea7ng l\u1edbp c\u01a1 b\u1ea3n n\u00e0o?", "a": "Giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n, \u0111\u1ed9i ng\u0169 doanh nh\u00e2n, \u0111\u1ed9i ng\u0169 tr\u00ed th\u1ee9c", "e": {"p": 165, "t": "C\u00e1c giai c\u1ea5p, t\u1ea7ng l\u1ed1p x\u00e3 h\u1ed9i v\u00e0 c\u00e1c nh\u00f3m x\u00e3 h\u1ed9i c\u01a1 b\u1ea3n trong c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p c\u1ee7a th\u00f2i k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i bao g\u1ed3m: giai c\u1ea5p c\u00f4ng nh\u00e2n, giai c\u1ea5p n\u00f4ng d\u00e2n, t\u1ea7ng l\u1edbp tr\u00ed th\u1ee9c, t\u1ea7ng l\u1ed1p doanh nh\u00e2n, t\u1ea7ng"}}, {"q": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam, giai c\u1ea5p, t\u1ea7ng l\u1edbp n\u00e0o l\u00e0 ch\u1ee7 th\u1ec3 c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n, x\u00e2y d\u1ef1ng n\u00f4ng th\u00f4n m\u1edbi g\u1eafn v\u1edbi x\u00e2y d\u1ef1ng c\u00e1c c\u01a1 s\u1edf c\u00f4ng nghi\u1ec7p, d\u1ecbch v\u1ee5 v\u00e0 ph\u00e1t tri\u1ec3n \u0111\u00f4 th\u1ecb?", "a": "Giai c\u1ea5p n\u00f4ng d\u00e2n", "e": {"p": 179, "t": "l\u00e0 ch\u1ee7 th\u1ec3 c\u1ee7a qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n, x\u00e2y d\u1ef1ng n\u00f4ng th\u00f4n m\u1edbi g\u1eafn v\u1edbi x\u00e2y d\u1ef1ng c\u00e1c c\u01a1 s\u1edf c\u00f4ng nghi\u1ec7p, d\u1ecbch v\u1ee5 v\u00e0 ph\u00e1t tri\u1ec3n \u0111\u00f4 th\u1ecb theo quy ho\u1ea1ch; ph\u00e1t tri\u1ec3n to\u00e0n di\u1ec7n, hi\u1ec7n \u0111\u1ea1i h\u00f3a n\u00f4ng nghi\u1ec7p...1."}}, {"q": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam, giai c\u1ea5p, t\u1ea7ng l\u1edbp n\u00e0o l\u00e0 tr\u1ee5 c\u1ed9t c\u1ee7a n\u01b0\u1edbc nh\u00e0, ch\u1ee7 nh\u00e2n t\u01b0\u01a1ng lai c\u1ee7a \u0111\u1ea5t n\u01b0\u1edbc, l\u00e0 l\u1ef1c l\u01b0\u1ee3ng xung k\u00edch trong x\u00e2y d\u1ef1ng v\u00e0 b\u1ea3o v\u1ec7 t\u1ed5 qu\u1ed1c \u2192", "a": "Thanh ni\u00ean", "e": null}, {"q": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf n\u01b0\u1edbc ta, m\u00e2u thu\u1eabn v\u1ec1 l\u1ee3i \u00edch gi\u1eefa nh\u1eefng ng\u01b0\u1eddi lao \u0111\u1ed9ng l\u00e0m thu\u00ea v\u1edbi t\u1ea7ng l\u1edbp t\u01b0 s\u1ea3n l\u00e0", "a": "M\u00e2u thu\u1eabn kh\u00f4ng \u0111\u1ed1i kh\u00e1ng", "e": null}, {"q": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam, n\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh giai c\u1ea5p, t\u1ea7ng l\u1edbp th\u1ec3 hi\u1ec7n th\u00f4ng qua vi\u1ec7c?", "a": "Gi\u1eef v\u1eefng l\u1eadp tr\u01b0\u1eddng ch\u00ednh tr\u1ecb - t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, \u0111\u1ed3ng th\u1eddi gi\u1eef v\u1eefng vai tr\u00f2 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam \u0111\u1ed1i v\u1edbi kh\u1ed1i li\u00ean minh v\u00e0 \u0111\u1ed1i v\u1edbi to\u00e0n x\u00e3 h\u1ed9i", "e": {"p": 184, "t": "\u1edf n\u01b0\u1edbc ta, n\u1ed9i dung ch\u00ednh tr\u1ecb c\u1ee7a li\u00ean minh th\u1ec3 hi\u1ec7n \u1ecf vi\u1ec7c gi\u1eef v\u1eefng l\u1eadp tr\u01b0\u1eddng ch\u00ednh tr\u1ecb - t\u01b0 t\u01b0\u1edfng c\u1ee7a giai c\u1ea5p c\u00f4ng nh\u00e2n, \u0111\u1ed3ng th\u1eddi gi\u1eef v\u1eefng vai tr\u00f2 l\u00e3nh \u0111\u1ea1o c\u1ee7a \u0110\u1ea3ng C\u1ed9ng s\u1ea3n Vi\u1ec7t Nam \u0111\u1ed1i v\u1edbi kh\u00f4i li\u00ean minh v\u00e0 \u0111\u1ed1\u0129 v\u1edbi to\u00e0n x\u00e3 h\u1ed9i \u0111\u1ec3 x\u00e2y d\u1ef1ng v\u00e0 b\u1ea3o v\u1ec7 v\u1eefng ch\u1eafc ch\u1ebf \u0111\u1ed9 ch\u00ednh tr\u1ecb, gi\u1eef v\u1eefng \u0111\u1ed9c l\u1eadp d\u00e2n t\u1ed9c v\u00e0 \u0111\u1ecbnh h\u01b0\u1edbng \u0111i l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i.", "a": 1}}, {"q": "Trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean CNXH, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i \u2013 giai c\u1ea5p bao g\u1ed3m c\u00e1c giai c\u1ea5p,t\u1ea7ng l\u1edbp sau?", "a": "C\u00f4ng nh\u00e2n, n\u00f4ng d\u00e2n, tr\u00ed th\u1ee9c, t\u01b0 s\u1ea3n, ti\u1ec3u t\u01b0 s\u1ea3n v\u00e0 c\u00e1c t\u1ea7ng l\u1edbp nh\u00e2n d\u00e2n lao \u0111\u1ed9ng kh\u00e1c", "e": null}, {"q": "Trong tuy\u00ean ng\u00f4n c\u1ee7a \u0110\u1ea3ng c\u1ed9ng s\u1ea3n, C. M\u00e1c v\u00e0 Ph. \u0102ngghen kh\u1eb3ng \u0111\u1ecbnh c\u01a1 s\u1edf ch\u00ednh tr\u1ecb - x\u00e3 h\u1ed9i c\u1ee7a \u0110\u1ea3ng c\u1ed9ng s\u1ea3n l\u00e0", "a": ": Giai c\u1ea5p n\u00f4ng d\u00e2n", "e": null}, {"q": "Trong V\u0103n ki\u1ec7n \u0110\u1ea1i h\u1ed9i IX, \u0110\u1ea3ng ta x\u00e1c \u0111\u1ecbnh ph\u1ea3i ti\u1ebfp thu v\u00e0 k\u1ebf th\u1eeba nh\u1eefng g\u00ec c\u1ee7a ch\u1ee7 ngh\u0129a t\u01b0 b\u1ea3n trong th\u1eddi k\u1ef3 qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i \u1edf Vi\u1ec7t Nam?", "a": "Ti\u1ebfp thu, k\u1ebf th\u1eeba nh\u1eefng th\u00e0nh t\u1ef1u m\u00e0 nh\u00e2n lo\u1ea1i \u0111\u00e3 \u0111\u1ea1t \u0111\u01b0\u1ee3c d\u01b0\u1edbi ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u0111\u1eb7c bi\u1ec7t v\u1ec1 khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7, \u0111\u1ec3 ph\u00e1t tri\u1ec3n nhanh l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t, x\u00e2y d\u1ef1ng n\u1ec1n kinh t\u1ebf hi\u1ec7n \u0111\u1ea1i.", "e": {"p": 110, "t": "Con \u0111\u01b0\u1eddng \u0111i l\u00ean c\u1ee7a n\u01b0\u1edbc ta l\u00e0 s\u1ef1 ph\u00e1t tri\u1ec3n qu\u00e1 \u0111\u1ed9 l\u00ean ch\u1ee7 ngh\u0129a x\u00e3 h\u1ed9i b\u1ecf qua ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, t\u1ee9c l\u00e0 b\u1ecf qua vi\u1ec7c x\u00e1c l\u1eadp v\u1ecb tr\u00ed th\u1ed1ng tr\u1ecb c\u1ee7a quan h\u1ec7 s\u1ea3n xu\u1ea5t v\u00e0 ki\u1ebfn tr\u00fac th\u01b0\u1ee3ng t\u1ea7ng t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, nh\u01b0ng ti\u1ebfp thu, k\u1ebf th\u1eeba nh\u1eefng th\u00e0nh t\u1ef1u m\u00e0 nh\u00e2n lo\u1ea1i \u0111\u00e3 \u0111\u1ea1t \u0111\u01b0\u1ee3c d\u01b0\u1edbi ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a, \u0111\u1eb7c bi\u1ec7t v\u1ec1 khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7, \u0111\u1ec3 ph\u00e1t tri\u1ec3n nhanh l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n\u2026", "a": 1}}, {"q": "Trong x\u00e3 h\u1ed9i c\u00f3 giai c\u1ea5p, c\u01a1 c\u1ea5u n\u00e0o c\u00f3 v\u1ecb tr\u00ed quy\u1ebft \u0111\u1ecbnh nh\u1ea5t, chi ph\u1ed1i c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00e1c?", "a": "C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p", "e": {"p": 166, "t": "Song v\u1ecb tr\u00ed, vai tr\u00f2 c\u1ee7a c\u00e1c lo\u1ea1i c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00f4ng ngang nhau, trong \u0111\u00f3, c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p c\u00f3 v\u1ecb tr\u00ed quan tr\u1ecdng h\u00e0ng \u0111\u1ea7u, chi ph\u1ed1i c\u00e1c lo\u1ea1i h\u00ecnh c\u01a1 c\u1ea5u x\u00e3 h\u1ed9i kh\u00e1c v\u00ec nh\u1eefng l\u00fd do c\u01a1 b\u1ea3n sau: - C\u01a1 c\u1ea5u x\u00e3 h\u1ed9i - giai c\u1ea5p li\u00ean quan \u0111\u1ebfn c\u00e1c \u0111\u1ea3ng ph\u00e1i ch\u00ednh tr\u1ecb v\u00e0 nh\u00e0 n\u01b0\u1edbc;", "a": 1}}, {"q": "T\u01b0 t\u01b0\u1edfng v\u1ec1 \"Giang s\u01a1n ng\u00e0n n\u0103m c\u1ee7a Ch\u00faa\" xu\u1ea5t hi\u1ec7n \u1edf", "a": "Th\u1eddi c\u1ed5 \u0111\u1ea1i", "e": {"p": 201, "t": "do s\u1ef1 ph\u00e1t tri\u1ec3n c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng s\u1ea3n xu\u1ea5t, c\u1ee7a khoa h\u1ecdc v\u00e0 c\u00f4ng ngh\u1ec7, c\u1ee7a giao l\u01b0u kinh t\u1ebf v\u00e0 v\u0103n h\u00f3a trong x\u00e3 h\u1ed9i t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a \u0111\u00e3 l\u00e0m xu\u1ea5t hi\u1ec7n nhu c\u1ea7u x\u00f3a b\u1ecf h\u00e0ng r\u00e0o ng\u0103n c\u00e1ch gi\u1eefa c\u00e1c d\u00e2n t\u1ed9c, th\u00fac \u0111\u1ea9y c\u00e1c d\u00e2n t\u1ed9c x\u00edch l\u1ea1i g\u1ea7n nhau.", "a": 1}}, {"q": "T\u01b0 t\u01b0\u1edfng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a b\u1eaft \u0111\u1ea7u xu\u1ea5t hi\u1ec7n \u1edf h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i n\u00e0o?", "a": "Chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7", "e": {"p": 103, "t": "C\u1ed9ng s\u1ea3n nguy\u00ean th\u1ee7y, chi\u1ebfm h\u1eefu n\u1ed3 l\u1ec7, phong ki\u1ebfn, t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a v\u00e0 c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a. So v\u1edbi c\u00e1c h\u00ecnh th\u00e1i kinh t\u00ea - x\u00e3 h\u1ed9i \u0111\u00e3 xu\u1ea5t hi\u1ec7n trong l\u1ecbch s\u1eed, h\u00ecnh th\u00e1i kinh t\u1ebf - x\u00e3 h\u1ed9i c\u1ed9ng s\u1ea3n ch\u1ee7 ngh\u0129a c\u00f3 s\u1ef1 kh\u00e1c bi\u1ec7t v\u1ec1 ch\u1ea5t, trong \u0111\u00f3 kh\u00f4ng c\u00f3 giai c\u1ea5p \u0111\u1ed1i kh\u00e1ng, con ng\u01b0\u1eddi t\u1eebng b\u01b0\u1edbc tr\u1edf th\u00e0nh ng\u01b0\u1eddi t\u1ef1 do..."}}, {"q": "T\u01b0 t\u01b0\u1edfng x\u00e3 h\u1ed9i ch\u1ee7 ngh\u0129a \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh g\u1eafn li\u1ec1n v\u1edbi ch\u1ebf \u0111\u1ed9 x\u00e3 h\u1ed9i n\u00e0o?", "a": "Ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7.", "e": {"p": 131, "t": "N\u1ec1n d\u00e2n ch\u1ee7 ch\u1ee7 n\u00f4, g\u1eafn v\u1edbi ch\u1ebf \u0111\u1ed9 chi\u1ebfm h\u1eefu n\u00f4 l\u1ec7; n\u1ec1n d\u00e2n ch\u1ee7 t\u01b0 s\u1ea3n, g\u1eafn v\u1edbi ch\u1ebf \u0111\u1ed9 t\u01b0 b\u1ea3n ch\u1ee7 ngh\u0129a;", "a": 1}}, {"q": "T\u01b0 t\u01b0\u1edfng x\u00e3 h\
